# Traefik STATIC config for the worker's platform_origin.
#
# Why this exists: elitea-worker-python refuses a plaintext platform origin —
# config.py:187 rejects any scheme but https — and elitea-main has no TLS
# listener for its ordinary /api/v2 + /llm surface (its three mTLS listeners
# serve the private control/output/content protocols, not the product API). The
# hybrid deployment solves this with the `elitea-gateway` Traefik edge; this is
# the standalone equivalent, scoped to one consumer.
#
# It is NOT the stack's public edge. It has no published host port, lives only
# on the compose network, and is separate from the `traefik` service that fronts
# the browser — whose config files are shared with docker-compose.e2e-standalone
# .yml and must not grow a TLS entrypoint for this.
#
# Port 443 rather than 8443 so platform_origin stays a bare origin
# (`https://elitea-platform-edge`). A port would work — the worker's validator
# allows one — but every URL the SDK builds from that base would carry it.
entryPoints:
  platform:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/dynamic.yml

log:
  level: INFO

accessLog: {}
