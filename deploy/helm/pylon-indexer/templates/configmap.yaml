apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pylon-indexer.fullname" . }}-config
  labels:
    {{- include "pylon-indexer.labels" . | nindent 4 }}
data:
  # Whole .Values.env map (same reasoning as deploy/helm/elitea-main): an
  # operator must be able to set a Pylon env var this chart never anticipated.
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
