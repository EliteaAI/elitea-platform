{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.gatewayApi }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      {{- if .Values.ingress.gateway.namespace }}
      namespace: {{ .Values.ingress.gateway.namespace }}
      {{- end }}
      {{- if .Values.ingress.gateway.sectionName }}
      sectionName: {{ .Values.ingress.gateway.sectionName }}
      {{- end }}
  {{- with .Values.ingress.hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.ingress.pathType }}
            value: {{ .Values.ingress.path }}
      # Remove client-supplied identity headers before the request reaches
      # elitea-main (#326). tryTrustedProxyHeaders in
      # internal/api/middleware/auth.go accepts X-Auth-Type + X-Auth-Id as a
      # finished identity from any source inside the configured
      # trusted_proxy_cidrs — which in a cluster is the pod network the Gateway
      # itself sits on — so a client that can set the header picks its own user.
      # RequestHeaderModifier acts on the REQUEST going in; it does not affect
      # headers an authenticating edge adds afterwards.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              {{- range .Values.ingress.stripIdentityHeaders }}
              - {{ . | quote }}
              {{- end }}
      backendRefs:
        - name: {{ include "elitea-main.fullname" . }}
          port: {{ .Values.service.port }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "elitea-main.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
{{- end }}
