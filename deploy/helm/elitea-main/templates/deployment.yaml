apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "elitea-main.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "elitea-main.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elitea-main.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: elitea-main
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.runtime.enabled }}
            # The runtime plane's three listeners (issue #382). The agent
            # worker dials all three, so they must be reachable on the Service
            # as well as declared here.
            - name: runtime-control
              containerPort: {{ include "elitea-main.runtimePort" .Values.runtime.listeners.controlAddress }}
              protocol: TCP
            - name: runtime-output
              containerPort: {{ include "elitea-main.runtimePort" .Values.runtime.listeners.outputAddress }}
              protocol: TCP
            - name: runtime-content
              containerPort: {{ include "elitea-main.runtimePort" .Values.runtime.listeners.contentAddress }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "elitea-main.fullname" . }}-config
          env:
            {{- range $name, $ref := .Values.secrets }}
            # Sensitive vars from Kubernetes Secrets (never plaintext in the
            # ConfigMap above) — S17, mirrors elitea-llm-gateway's deployment.yaml.
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
                  optional: {{ $ref.optional | default false }}
            {{- end }}
            {{- if .Values.fileConfig.authConfig.enabled }}
            # ELITEA_AUTH_CONFIG_FILE has no entry in the ConfigMap above (it
            # is unset by default); this sets it. Env entries win over
            # envFrom on name clash, same mechanism BRAND_PACK_PATH below
            # relies on to override its ConfigMap default.
            - name: ELITEA_AUTH_CONFIG_FILE
              value: {{ .Values.fileConfig.authConfig.mountPath }}
            {{- end }}
            {{- if .Values.fileConfig.brandPack.enabled }}
            - name: BRAND_PACK_PATH
              value: {{ .Values.fileConfig.brandPack.mountPath }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp (Go's os.CreateTemp
            # default dir, crypto/tls session cache, etc.) even though this
            # binary has no application-level temp-file writes today.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.fileConfig.authConfig.enabled }}
            - name: auth-config
              mountPath: {{ .Values.fileConfig.authConfig.mountPath }}
              subPath: {{ .Values.fileConfig.authConfig.key }}
              readOnly: true
            {{- end }}
            {{- if .Values.fileConfig.brandPack.enabled }}
            # BRAND_PACK_PATH is "one pack file per deployment" (branding
            # package doc), read with os.ReadFile — a subPath mount, same as
            # auth-config above, not a whole-ConfigMap directory mount.
            - name: brand-pack
              mountPath: {{ .Values.fileConfig.brandPack.mountPath }}
              subPath: {{ .Values.fileConfig.brandPack.key }}
              readOnly: true
            {{- end }}
            {{- if .Values.runtime.enabled }}
            # The runtime material (issue #382): signing key, verification
            # keyring, Redis password, Redis CA and the three server keypairs.
            # A WHOLE-DIRECTORY mount, deliberately — not the per-file subPath
            # mounts used above. internal/security/securefile also rejects any
            # path whose final component is a symlink, and the file names are
            # fixed by deploy/scripts/gen-runtime-certs.sh, so the source must
            # present all of them under one directory. Read the runtime.material
            # comment in values.yaml for which volume sources actually work.
            - name: runtime-material
              mountPath: {{ .Values.runtime.material.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.runtime.enabled }}
        - name: runtime-material
          {{- toYaml .Values.runtime.material.volume | nindent 10 }}
        {{- end }}
        {{- if .Values.fileConfig.authConfig.enabled }}
        - name: auth-config
          configMap:
            name: {{ required "fileConfig.authConfig.configMapName is required when fileConfig.authConfig.enabled=true" .Values.fileConfig.authConfig.configMapName }}
        {{- end }}
        {{- if .Values.fileConfig.brandPack.enabled }}
        - name: brand-pack
          configMap:
            name: {{ required "fileConfig.brandPack.configMapName is required when fileConfig.brandPack.enabled=true" .Values.fileConfig.brandPack.configMapName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
