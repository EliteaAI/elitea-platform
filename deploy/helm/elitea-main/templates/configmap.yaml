apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-main.fullname" . }}-config
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
data:
  # Render the WHOLE .Values.env map (mirrors deploy/helm/elitea-llm-gateway's
  # deployment.yaml `range`), instead of a fixed key list. A fixed list meant an
  # operator could not set any env var the chart author had not anticipated, so
  # code paths gated on such a var (e.g. the §2.6 SELF_REFERENTIAL_CREDENTIAL
  # guard, which reads ELITEA_SELF_LLM_ORIGINS / DEPLOYMENT_URL) were silently
  # inert in every Helm deployment. Every key previously rendered here is still
  # rendered — they are the defaults in values.yaml's `env` map.
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
