{{/*
The authentication configuration document (issue #444).

internal/authcomposition/material.go opens five files, and their paths come
from this document. While the document lived only in a ConfigMap that the
operator provisioned, the chart could not read those paths, so it rendered no
volume for the five files and a Kubernetes install of the runtime plane could
not start from the chart alone.

With fileConfig.authConfig.document set, the document is a chart value. The
chart renders it here, and templates/_helpers.tpl checks the five paths while
it renders.

The document holds file REFERENCES, never secret values —
internal/authcomposition/config.go says so in the Config comment — so a
ConfigMap is the right object for it. The five files it points at arrive in a
Secret; read fileConfig.authConfig.material in values.yaml.

JSON, not YAML. JSON is the subset of YAML that the loader accepts, the
default key name is auth-config.json, and JSON quotes every scalar. That last
point matters: redis.key_prefix must end with ':', and an unquoted YAML scalar
that ends with ':' is a nested mapping key rather than a string.
*/}}
{{- if and .Values.fileConfig.authConfig.enabled .Values.fileConfig.authConfig.document }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-main.authConfigMapName" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
data:
  {{ .Values.fileConfig.authConfig.key }}: |-
    {{- .Values.fileConfig.authConfig.document | toPrettyJson | nindent 4 }}
{{- end }}
