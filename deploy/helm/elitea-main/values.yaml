# PROTOTYPE VALUES ONLY. This chart does not yet define NetworkPolicy,
# split database principals, or production secret delivery. An opt-in
# Ingress/HTTPRoute exists (ingress.enabled) but ships with no TLS secret
# or hostname configured — see ingress.tls / ingress.hosts below.
#
# CAPABILITY FLAGS (issue #382). cmd/elitea-main gates whole capabilities on
# environment variables, and this file sets every one of them. It did not
# before, so the same image served the pylon-free configuration on compose and
# served none of it on Kubernetes. Read the "Capability flags" block in the env
# map below, and the runtime: block further down.
#
# These defaults are for a DEFAULT install, which has no production
# authentication, so most capabilities ship off. values-standalone.yaml is the
# values file whose capability set matches the standalone compose stack.
# Prerequisites are checked while the chart renders, so a wrong combination
# fails `helm template` rather than the pod.
replicaCount: 2

# Pull secrets for a registry that needs credentials. ghcr.io/eliteaai/elitea-main
# is a PRIVATE package today — an anonymous pull is refused, unlike
# elitea-web's — so a cluster without an entry here cannot start this service
# at all: both the Deployment and the migration hook Job stop at
# ImagePullBackOff. A Kubernetes pull secret has no effect until something
# references it, and nothing in this chart did.
#
#   imagePullSecrets:
#     - name: ghcr-pull
imagePullSecrets: []

image:
  repository: ghcr.io/eliteaai/elitea-main
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Legacy-parity hardening (issue #241): the shipped image is already a
# distroless nonroot build, so runAsNonRoot/readOnlyRootFilesystem cost
# nothing here — no application-level temp-file writes were found (grepped
# for os.CreateTemp/os.TempDir); the container still gets a writable /tmp
# emptyDir (templates/deployment.yaml) for anything the Go runtime itself
# wants there.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Opt-in external reachability (issue #241; legacy parity with
# legacy/deploy/charts/charts/pylon's templates/httproute.yaml). Both the
# standard Ingress and the Gateway API HTTPRoute path are OFF by default —
# this chart cannot know your ingress controller / Gateway, hostnames, or
# TLS secret names. Set ingress.gatewayApi: true to render an HTTPRoute
# instead of a networking.k8s.io/v1 Ingress; the two are mutually exclusive.
ingress:
  enabled: false
  gatewayApi: false
  className: ""
  annotations: {}
  path: /
  pathType: Prefix
  hosts: []
  # TLS termination for the standard Ingress path only — ignored when
  # gatewayApi: true (HTTPRoute TLS termination is the Gateway's own concern).
  tls: []
    # - secretName: elitea-main-tls
    #   hosts:
    #     - dev.elitea.ai
  # Client-supplied identity headers stripped on the way in (#326). elitea-main
  # treats X-Auth-Type + X-Auth-Id from a trusted-proxy source address as a
  # finished identity, and in a cluster the whole pod network is typically
  # inside trusted_proxy_cidrs — so anything reaching the Service with these
  # headers set by the CALLER is an impersonation. Emptying this list re-opens
  # that; extend it, do not shorten it.
  #
  # APPLIES TO THE HTTPRoute PATH ONLY (ingress.gatewayApi: true), where it
  # renders a RequestHeaderModifier filter. A networking.k8s.io/v1 Ingress has
  # no portable header-removal field, so on that path the strip MUST be
  # configured on the ingress controller itself (ingress-nginx:
  # `more_clear_input_headers` in a configuration-snippet, which many clusters
  # disallow) or by fronting elitea-main with a Gateway. Do not assume the
  # plain-Ingress path is covered by this chart.
  stripIdentityHeaders:
    - X-Auth-Type
    - X-Auth-Id
    - X-Auth-User-Id
    - X-Auth-Reference
    - X-Auth-Avatar
    - X-Auth-Avatar-State
    - X-Auth-Session-Id
    - X-Auth-Session-Name
    - X-Auth-Session-Endpoint
    - X-Elitea-Identity-Signature
    - X-Elitea-Project-Id
    - X-Elitea-User-Id
    - X-Elitea-Tenant-Id
  # Only consulted when gatewayApi: true — the pre-existing Gateway this
  # HTTPRoute attaches to (not created by this chart).
  gateway:
    name: ""
    namespace: ""
    sectionName: ""

# Optional file-based config mounts (issue #241), OFF by default. The chart
# does not build these ConfigMaps for you — point configMapName at a
# ConfigMap you provision out-of-band (kubectl create configmap / kustomize /
# a GitOps overlay) and the chart wires the volume + volumeMount + env var
# pointing at the mounted path. See internal/api/router.go (BRAND_PACK_PATH)
# and cmd/elitea-main/main.go:1119 (ELITEA_AUTH_CONFIG_FILE).
fileConfig:
  authConfig:
    enabled: false

    # THE AUTHENTICATION CONFIGURATION ITSELF (issue #444).
    #
    # internal/authcomposition/material.go opens FIVE files, and their paths
    # come from this document. Before issue #444 the document was always
    # external — the chart knew a ConfigMap name and nothing more — so the
    # chart could not know the five paths, rendered no volume for them, and
    # every Kubernetes install of the runtime plane had to place the files by
    # some other method.
    #
    # Put the document here and the chart:
    #   * renders the ConfigMap for you;
    #   * checks that all five paths sit in material.mountPath below, while it
    #     renders, and names the offending path when one does not;
    #   * mounts the material where the service opens it.
    #
    # Leave it empty and set configMapName instead to keep the document
    # outside the chart. The chart then cannot see the five paths, and
    # cmd/elitea-auth-material is the only gate: it reads the same document in
    # the init container and stops the pod when the paths and the mount
    # disagree.
    #
    # Set exactly one of document and configMapName.
    #
    # Read internal/authcomposition/config.go for the schema, and
    # deploy/runtime/auth.form.yml for a complete example with comments.
    document: {}

    configMapName: ""
    key: auth-config.json
    mountPath: /etc/elitea/auth-config.json

    # The five files that the document names: the Auth Redis password, the
    # Auth Redis CA, the browser-attempt key, the PAT signing key and the Form
    # users JSON.
    #
    # THE KEY NAMES ARE THE OPERATOR'S. Unlike the runtime material, the chart
    # does not fix them: each name is the last component of a path in the
    # document above. The Secret must carry one key for each of those names.
    material:
      # Where the service reads the five files. Every path in the document must
      # sit in this directory, because one volume mount serves one directory.
      #
      # It must differ from runtime.material.mountPath. Each install container
      # removes anything in its own directory that its own Secret does not
      # carry, so one shared directory would make the two delete each other's
      # files.
      mountPath: /run/elitea-auth

      # A Kubernetes Secret whose keys are the five file names, for example:
      #
      #   kubectl create secret generic elitea-main-auth-material \
      #     --from-file=redis-auth-password --from-file=auth-redis-ca.crt ...
      #
      # The chart cannot mount that Secret straight at mountPath.
      # internal/security/securefile refuses a path that resolves through a
      # symlink and requires owner-only bits on private material, and a Secret
      # volume gives neither: mounted whole it is a symlink farm, and mounted
      # per file with subPath its files belong to root while this pod runs as
      # nonroot. So the chart adds an init container, exactly as issue #404
      # does for the runtime material. It runs the same image and the same
      # user, copies each key into a memory-backed emptyDir at mode 0600, and
      # reads every file back through securefile before it exits. A missing key
      # stops the pod there, with a message.
      secretName: ""

      # The mode the kubelet gives each key of that Secret. The init container
      # has to read them, and the kubelet owns them as root, so without a pod
      # fsGroup the read bit for other users is the only one that reaches this
      # pod's user. It applies inside this pod's own mount namespace only, and
      # the copies that the service reads are owner-only. Set
      # podSecurityContext.fsGroup and lower this to 0440 to tighten it.
      secretDefaultMode: 0444

      # The bound on the emptyDir that holds the copies.
      sizeLimit: 8Mi

      # An alternative source, for a deployment whose material is ALREADY real,
      # owner-owned files at mountPath — a CSI secret driver, for example. It
      # takes a Kubernetes volume specification without its `name`; the chart
      # adds the name and mounts it read-only. Mutually exclusive with
      # secretName, and no init container renders with it.
      volume: {}
  # The mTLS client material for the /llm hop (issue #463 left this half
  # done: it moved LLM_GATEWAY_CLIENT_CERT / _KEY / LLM_GATEWAY_CA_FILE from
  # secretKeyRef entries to file paths, and no volume ever served those paths).
  #
  # Nothing here goes through internal/security/securefile —
  # internal/llmproxy/proxy.go calls tls.LoadX509KeyPair and os.ReadFile
  # directly — so a plain Secret volume is enough and no init container copy is
  # needed. That is the whole difference from runtime.material.
  #
  # `secretName` is the usual shape: a cert-manager Certificate issued INTO
  # THIS namespace produces a Secret with tls.crt / tls.key / ca.crt, which are
  # the default keys below. Point env.LLM_GATEWAY_CLIENT_CERT and its two
  # siblings at mountPath/<key>.
  #
  # `volume` is the alternative for material that already exists as files (a
  # CSI secret driver, for example) and is mutually exclusive with secretName.
  llmGatewayClientMaterial:
    enabled: false
    secretName: ""
    mountPath: /run/elitea-llm-gateway
    # 0444, for the same reason runtime.material and the authentication
    # material default to it: the kubelet owns these files as root, this pod
    # runs as nonroot, and podSecurityContext sets no fsGroup — so the
    # other-read bit is the only one that reaches the user that must read them.
    #
    # This shipped as 0440 and could not work: elitea-main reached
    # "production runtime enabled" and then died with
    #   compose llm gateway proxy: llmproxy: build mTLS transport:
    #   load client cert: open /run/elitea-llm-gateway/tls.crt: permission denied
    # on the first cluster that mounted it.
    #
    # Set podSecurityContext.fsGroup and lower this to 0440 to tighten it,
    # exactly as the two blocks above document.
    defaultMode: 0444
    volume: {}
  brandPack:
    enabled: false
    configMapName: ""
    # BRAND_PACK_PATH is one pack file per deployment (branding package doc,
    # internal/api/v2/branding/pack.go's LoadPack does os.ReadFile) — mounted
    # via subPath, like authConfig above, not a whole-ConfigMap directory.
    key: brand-pack.json
    mountPath: /etc/elitea/brand-pack.json

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Arbitrary env vars for the elitea-main container. The whole map is rendered
# into the ConfigMap (templates/configmap.yaml) and consumed via envFrom, so
# adding a key here is all that is needed to set a new env var.
env:
  DATABASE_URL: ""

  # Production keeps the provider-neutral Go object-store capability enabled
  # and therefore fail-closed on missing storage configuration. Mixed Centry
  # deployments explicitly set this to "false" while the current artifacts
  # plugin remains authoritative.
  ELITEA_ARTIFACTS_ENABLED: "true"

  # --- Capability flags (issue #382) -----------------------------------------
  # cmd/elitea-main gates whole capabilities on these names. Each one makes the
  # composition root build a dependency, and the router registers a route group
  # only when that dependency exists. Before issue #382 this chart set none of
  # them, so a Kubernetes install served none of those route groups while the
  # same image on compose served all of them.
  #
  # They ship "false" here, not "true". Two reasons, and both are about the
  # DEFAULT install:
  #   1. Most of them need production authentication, which this chart builds
  #      only from fileConfig.authConfig (off by default). Shipping "true" with
  #      authentication off would turn a working default install into a
  #      CrashLoopBackOff.
  #   2. An operator must choose a public project id and a Redis endpoint. The
  #      chart cannot guess either.
  #
  # Read values-standalone.yaml for the values file that turns the set on. The
  # chart checks every prerequisite at `helm template` time, so a wrong
  # combination fails on the terminal, not in a restarting pod.

  # The Configurations plane: eight configuration and model-catalogue routes,
  # and the dependency that agent dispatch and index ingest both compose
  # through. NEEDS production authentication.
  ELITEA_CONFIGURATIONS_ENABLED: "false"

  # A SECOND set of three configuration WRITE routes. Needs
  # ELITEA_CONFIGURATIONS_ENABLED and runtime.enabled; this file has neither.
  #
  # The reason recorded here before — "demands the LiteLLM lifecycle facade" —
  # is stale (#460). The lifecycle takes no LLM transport now. The flag stays
  # off for two reasons that are true: the chart refuses it without the two
  # prerequisites above, and it is not what makes a saved credential usable.
  # The routes it composes WIN the path from the compatibility routes that
  # every install serves — see
  # TestConfigurationWriteRouteWinnerDependsOnTheMutationComposition — and they
  # take a different request shape from the one apps/elitea-web sends. Turning
  # this on is a cutover with its own web-client work.
  ELITEA_CONFIGURATIONS_MUTATION_ENABLED: "false"

  # The project-information route. NEEDS production authentication.
  #
  # With this off, the project-information path falls through to the prototype
  # handler, which never counts teammates and always reports a null icon. The
  # project screen reads exactly those two fields, so it shows zero teammates
  # and no project icon — at 200, which is why nothing looked broken.
  ELITEA_PROJECT_INFO_ENABLED: "false"

  # The project whose configurations are PUBLIC and merge into every other
  # project's option lookups. Read only when ELITEA_CONFIGURATIONS_ENABLED is
  # on, and it must name a project that EXISTS: the model catalogue lists that
  # project's configurations and propagates the failure, so a missing id fails
  # every agent turn rather than yielding an empty public set.
  #
  # Set the SAME value in deploy/helm/elitea-llm-gateway/values.yaml, where the
  # key has the same name. The gateway reads the public project to serve the
  # shared models the operator publishes (issue #316). The two services must
  # name one project, or the gateway serves a different model set from the one
  # the UI offers. Empty on BOTH sides leaves shared models unreachable: the
  # picker offers them and the request then finds no credential.
  ELITEA_AI_PROJECT_ID: ""

  # Whether a project may define its own LLM credentials.
  #
  # STATED, never empty. This ConfigMap renders every key in this map, so an
  # empty value here does not mean "unset" — the variable reaches the container
  # PRESENT and empty. cmd/elitea-main/configurations_config.go:101 tests
  # presence and then accepts only "true" or "false", so the empty value this
  # chart used to ship stopped elitea-main at boot with
  # "ELITEA_ALLOW_PROJECT_OWN_LLMS must be true or false" — and only once
  # ELITEA_CONFIGURATIONS_ENABLED was on, which is why a default install never
  # saw it and the first configured install died on it.
  #
  # "true" is the binary's own default (configurations_config.go:100), so this
  # states the existing behaviour rather than changing it.
  #
  # Do NOT set ELITEA_LITELLM_ALLOW_PROJECT_OWN_LLMS: that is the old name, and
  # cmd/elitea-main refuses to start when it is present, because silently
  # ignoring it would fail open.
  ELITEA_ALLOW_PROJECT_OWN_LLMS: "true"

  # Path to the secret-vault master key. Empty means the vault key column holds
  # the Fernet key itself; set means that column holds the key WRAPPED under
  # this master key. The two readings are incompatible, so a deployment whose
  # vault rows are unwrapped must leave this empty or every credential read
  # fails, several layers away from anything that names a vault.
  ELITEA_VAULT_MASTER_KEY_FILE: ""

  # --- Capabilities deliberately left DARK -----------------------------------
  # These two are exposed so the chart states them, and they must stay "false".
  # Their routes answer a shape that the published contract and the generated
  # client both reject, so turning either on breaks the web client. Issues #394
  # and #395 track the contract work that must land FIRST. Change these only
  # together with the contract and the regenerated client.
  ELITEA_INDEX_TYPES_ENABLED: "false"
  ELITEA_APPLICATION_SKILLS_ENABLED: "false"

  # --- Project event stream (#152) -------------------------------------------
  # Transport for GET /api/v2/events/prompt_lib/{projectID}. The router has a
  # two-arm fallback and BOTH arms were unassigned in this chart, so the route
  # was never registered and answered 404 — indistinguishable from a typo.
  #
  # Host:port of the general-purpose Redis, e.g. "elitea-redis-master:6379".
  # This is NOT the runtime plane's Redis: that one is separate, mutually
  # authenticated, and configured under runtime.redis below.
  REDIS_URL: ""
  REDIS_USERNAME: ""

  # --- Admin console ---------------------------------------------------------
  # Directory the admin single-page application is served from. The published
  # image bakes this path and ships the bundle at it, so the value here matches
  # the image and the standalone compose stack.
  #
  # CAUTION: an EMPTY value turns the admin console off, because the
  # composition root builds the admin configuration only for a non-empty path —
  # and this ConfigMap entry OVERRIDES the image's own setting. So clearing
  # this key is a switch, not a no-op. Set it to "/nonexistent" when you deploy
  # the `hybrid` image variant, which ships no admin bundle.
  ADMIN_UI_STATIC_DIR: "/data/admin_ui/static/dist"

  # --- circular-routing guard #1, upsert time (spec §2.6) --------------------
  # Comma-separated list of the platform's OWN /llm origins, e.g.
  #   "https://dev.elitea.ai/llm/v1,http://elitea-main:8080/llm/v1"
  # A credential whose api_base resolves to one of these is rejected at save
  # time with SELF_REFERENTIAL_CREDENTIAL (the gateway's Account-side check is
  # the request-time backstop).
  # IMPORTANT: when BOTH this and DEPLOYMENT_URL below are empty, the resolved
  # self-origin list is empty and guard #1 is INERT — every credential passes
  # the check. elitea-main logs a one-time WARN at first use in that case.
  ELITEA_SELF_LLM_ORIGINS: ""

  # Public base URL of this deployment (e.g. "https://dev.elitea.ai"). When set,
  # it is additionally treated as a self origin with "/llm" appended, so the
  # common single-domain deployment is guarded with no extra configuration.
  # Empty here leaves that convenience path off; see the note above — with
  # ELITEA_SELF_LLM_ORIGINS also empty, §2.6 guard #1 is inert.
  DEPLOYMENT_URL: ""

  # --- OIDC email policy ------------------------------------------------------
  # Set "true" to REFUSE one class of OIDC login. The login joins an existing
  # account by email. The identity provider does not state
  # `"email_verified": true`.
  #
  # The knob applies to ONE path: a provider subject with no link here that asks
  # to adopt an account by its address (internal/api/v2/auth/oidc.go,
  # joinAccountByEmail). A subject that already owns an account is never held to
  # it, because the subject decides that account.
  #
  # Empty (the default) leaves the rule OFF, and that matches the code default.
  # Many identity providers omit the claim, so "true" stops a working login on
  # those. An explicit `"email_verified": false` is refused whatever this says.
  # Turn it on when your provider always sends the claim.
  OIDC_REQUIRE_EMAIL_VERIFIED: ""

  # Filesystem path to a custom brand pack directory (internal/api/router.go);
  # empty serves the built-in default brand pack. Discovered unwired while
  # empirically verifying S17's env-drift gate — not itself a storage
  # variable, but the same one-line fix as everything else in this map, and
  # left unfixed it would have made the freshly-wired gate immediately red
  # for an unrelated pre-existing reason.
  BRAND_PACK_PATH: ""

  # --- Object storage (S17; ADR-0016) -----------------------------------------
  # STORAGE_BACKEND has no code default — ConfigFromEnv fails closed with no
  # object store configured until this is explicitly one of "s3"/"azure"/"gcs".
  # Never leave this empty in a real deployment; it is empty here only because
  # the chart cannot know which backend an environment uses.
  STORAGE_BACKEND: ""
  # Physical bucket/container name. Required by ConfigFromEnv for every backend.
  STORAGE_CONTAINER: ""
  # Optional key prefix under which every object this deployment writes is
  # scoped (multi-environment sharing of one bucket/container).
  STORAGE_KEY_PREFIX: ""
  # S3-only. Leave S3_ENDPOINT_URL empty for real AWS S3; set it for an
  # S3-compatible endpoint (RustFS, MinIO, etc.). S3_ACCESS_KEY/S3_SECRET_KEY
  # are NOT here — see the secrets: block below.
  S3_ENDPOINT_URL: ""
  S3_REGION: ""
  S3_FORCE_PATH_STYLE: ""
  # Azure-only. AZURE_STORAGE_KEY is NOT here — see the secrets: block below;
  # leaving it unset (empty string, the Secret's `optional: true`) makes the
  # backend use workload identity via serviceAccount.annotations instead of a
  # static shared key.
  AZURE_STORAGE_ACCOUNT: ""
  AZURE_STORAGE_ENDPOINT: ""
  # GCS-only. Leave empty for real GCS with workload identity (the normal
  # production path — GOOGLE_APPLICATION_CREDENTIALS is deliberately not
  # wired here; see env-drift-allowlist.txt). Set for an emulator endpoint.
  GCS_ENDPOINT: ""
  # Per-object upload size cap (bytes). Empty means "no override" — the
  # handler falls back to its own default (S12).
  ARTIFACT_MAX_OBJECT_BYTES: ""
  # Chat attachment bucket retention, in days (S20a). Empty means "no
  # override" — the handler falls back to its own default (365 days).
  ARTIFACT_ATTACHMENT_RETENTION_DAYS: ""

  # --- LLM gateway proxy (BF0.9c; issue #463) ---------------------------------
  # URL of the elitea-llm-gateway service. Empty composes no GatewayProxy, and
  # the /llm path then answers 503 llm_gateway_not_configured.
  #
  # WHY THERE IS NO DEFAULT VALUE HERE, and why that is not the old defect.
  #
  # The old defect was that an empty value made /llm answer 404, which is the
  # same answer a misspelt path gets. That is fixed in the CODE, not here:
  # internal/api/router.go now registers the path and answers 503 with the code
  # llm_gateway_not_configured and the name of this variable. So the empty
  # value is now a stated posture instead of a silent one.
  #
  # A default URL cannot be correct, and would be worse than the empty value:
  #   1. internal/llmproxy/proxy.go ALWAYS builds an mTLS transport. With no
  #      readable client certificate, tls.LoadX509KeyPair fails, llmproxy.New
  #      returns an error, and cmd/elitea-main turns that into a FATAL boot
  #      error. A default URL with no certificates is a crash loop, not a
  #      working /llm path.
  #   2. The certificates arrive through
  #      fileConfig.llmGatewayClientMaterial above, which mounts a Secret at
  #      the directory these three paths live in. That Secret must exist in
  #      THIS namespace: the gateway chart's cert-manager Certificate issues
  #      one into `elitea-gateway`, and a Secret is namespace-scoped, so a
  #      split-namespace install needs the second Certificate or the
  #      replication described in the "Cross-namespace Secrets" section of
  #      deploy/README.md.
  # So the chart refuses the half-configured combination instead: set this URL
  # and the three file paths below together, or set none of them.
  # elitea-main.validateLLMGateway in _helpers.tpl performs that check at
  # `helm template` time, so the terminal that ran the command shows the reason.
  #
  # Cross-namespace: this must be an FQDN when the gateway is in another
  # namespace, e.g.
  #   https://elitea-llm-gateway-svc.elitea-gateway.svc.cluster.local:8083
  LLM_GATEWAY_URL: ""

  # The mTLS material for the hop above. These three are FILE PATHS, not the
  # certificate text: internal/llmproxy/proxy.go passes them to
  # tls.LoadX509KeyPair and os.ReadFile.
  #
  # They were previously declared in the `secrets:` block as secretKeyRef
  # entries. That shape cannot work: a secretKeyRef sets the variable to the
  # CONTENT of the Secret key, so the process then tried to open a file whose
  # name was a PEM block. Mount the material as a volume and put the paths
  # here.
  LLM_GATEWAY_CLIENT_CERT: ""
  LLM_GATEWAY_CLIENT_KEY: ""
  LLM_GATEWAY_CA_FILE: ""

  # --- Tracing / observability (issue #250) -----------------------------------
  # OTLP/HTTP collector base URL. Read by both libs/go/observability (elitea-main's
  # own span export) and internal/api/v2/tracing's otlp proxy target — one var
  # controls both paths. Empty defers to the OTLP exporter's own env handling
  # (effectively localhost, i.e. no-op in a cluster) and to tracing's own
  # "http://otel-collector:4318" default, which only resolves if a service by
  # that name exists in this namespace (see the otel-collector chart/values).
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # Standard OTel SDK kill switch (https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/).
  # Set to "true" to disable span export and make the tracing ingest routes
  # answer "disabled" instead of forwarding — e.g. an environment with no
  # collector deployed at all.
  OTEL_SDK_DISABLED: ""

# secrets: sensitive env vars sourced from Kubernetes Secrets (rendered as
# valueFrom.secretKeyRef in deployment.yaml), NOT plaintext in the env map
# above — mirrors deploy/helm/elitea-llm-gateway's values.yaml `secrets:`
# block. Each entry maps the ENV VAR NAME the binary reads -> the Secret
# name + key. `optional: true` lets the pod start when the Secret or key is
# absent — correct here because only one storage backend is active per
# STORAGE_BACKEND value, so e.g. AZURE_STORAGE_KEY is simply irrelevant
# when STORAGE_BACKEND=s3, and S3/Azure can each run credential-less via
# workload identity (serviceAccount.annotations) instead of a static key.
#
# CAUTION (found by adversarial review, S17): "credential-less" here does
# NOT mean "fails until configured" — it means the Go backend falls through
# to the cloud SDK's own ambient-credential chain (AWS's LoadDefaultConfig /
# Azure's NewDefaultAzureCredential / GCP's Application Default Credentials;
# see internal/infra/storage/{s3,azure,gcs}/backend.go). On a cluster whose
# NODES already carry some IAM role/managed identity with storage access
# (common when nodes also run logging/monitoring DaemonSets), an operator
# who forgets BOTH the Secret above AND serviceAccount.annotations gets a
# pod that starts, passes objectStoreReadinessProbe, and silently runs
# under whatever ambient node identity it happened to inherit — not the
# clear startup failure an operator would expect and could quickly
# diagnose. Set exactly one of (this Secret) or (serviceAccount.annotations)
# per backend deliberately; do not rely on "it started, so it must be
# configured right."
#
# Provision the referenced Secret out-of-band (kubectl create secret /
# external-secrets operator / sealed-secrets), e.g.:
#   kubectl create secret generic elitea-main-storage-secrets \
#     --from-literal=s3-access-key=... --from-literal=s3-secret-key=... \
#     --from-literal=azure-storage-key=...
secrets:
  S3_ACCESS_KEY:
    secretName: elitea-main-storage-secrets
    key: s3-access-key
    optional: true
  S3_SECRET_KEY:
    secretName: elitea-main-storage-secrets
    key: s3-secret-key
    optional: true
  AZURE_STORAGE_KEY:
    secretName: elitea-main-storage-secrets
    key: azure-storage-key
    optional: true
  # Issue #11: the gateway now REFUSES TO START without this secret, and it must
  # hold the SAME value on both sides — the edge signs the X-Elitea-* identity
  # headers the gateway verifies. Leaving the edge unsigned while the gateway
  # verifies makes every /llm request fail verification, so this side is
  # non-optional too. Provision before install/upgrade.
  GATEWAY_IDENTITY_SECRET:
    secretName: elitea-main-llm-gateway-secrets
    key: gateway-identity-secret
    optional: false
  # LLM_GATEWAY_CLIENT_CERT, LLM_GATEWAY_CLIENT_KEY and LLM_GATEWAY_CA_FILE were
  # here as secretKeyRef entries. They are removed (issue #463), because that
  # shape cannot work: internal/llmproxy/proxy.go reads all three as FILE PATHS,
  # and a secretKeyRef sets the variable to the CONTENT of the Secret key. The
  # pod then tried to open a file whose name was a PEM block. They are now plain
  # path entries in the `env:` map above; mount the material as a volume.
  # Password for the general-purpose Redis named by env.REDIS_URL above — the
  # project event stream's transport (issue #382). Optional, because a Redis
  # with no authentication needs no password and the pod must still start.
  REDIS_PASSWORD:
    secretName: elitea-main-redis-secrets
    key: redis-password
    optional: true

# --- Runtime plane (issue #382) ----------------------------------------------
# Agent execution, the execution-events stream, index ingest, index scheduling
# and configuration validation. This is the biggest capability the chart left
# dark, and it is the one that decides whether a Kubernetes install can run
# without pylon at all.
#
# ALL-OR-NOTHING. internal/runtimecomposition/config.go builds this
# configuration with a `required()` helper: every name must be present and
# non-empty, or the process exits at boot. It also REFUSES a setting whose
# dispatch plane is not explicitly enabled. So there is no "turn on half of
# it". The chart checks the whole set at `helm template` time and names the
# missing field, so a partial values file fails on the terminal.
#
# PREREQUISITE: production authentication. cmd/elitea-main refuses to compose
# the runtime without a principal validator and a forwarded-identity verifier,
# and this chart builds both only from fileConfig.authConfig. Set
# fileConfig.authConfig.enabled=true as well.
#
# WHAT STILL BLOCKS A KUBERNETES INSTALL — read this before you set
# enabled: true. The runtime reads its keys, passwords and certificates through
# internal/security/securefile, which applies three rules:
#   1. The path must be canonical and its final component must NOT be a
#      symlink.
#   2. Private material (command-signing-key.pem, redis-producer-password and
#      the three server .key files) must carry OWNER BITS ONLY — at most 0600.
#   3. The file must be readable by the process owner.
# A plain Kubernetes `secret:` volume breaks rule 1: it is a symlink farm, so
# every path resolves through a ..data/ symlink and securefile refuses it. A
# per-file `subPath` mount fixes rule 1 and then breaks rules 2 and 3 together:
# the file is owned by root, this pod runs as nonroot, and the only modes that
# let a nonroot process read a root-owned file (0440 with fsGroup, or 0444)
# carry group or other bits that rule 2 rejects.
#
# So the runtime plane needs a material source that writes REAL files owned by
# the pod's own user with mode 0600 — a CSI driver or a sidecar that
# materialises them into an emptyDir. That mechanism is issue #382's declared
# out-of-scope ("secret delivery"), so the chart does not choose one for you:
# runtime.material.volume takes the volume specification and the chart wires
# every file path under runtime.material.mountPath.
#
# deploy/scripts/gen-runtime-certs.sh mints the material and its FILE NAMES are
# the contract — the chart derives every path from them, so whatever supplies
# the volume must present exactly these names:
#   runtime-ca.crt                 command-signing-key.pem
#   control-server.crt             command-signing-keyring.json
#   control-server.key             redis-producer-password
#   output-server.crt              content-server.crt
#   output-server.key              content-server.key
runtime:
  enabled: false

  # The base plane: configuration validation. Always required when enabled.
  # The stream name must differ from every dispatch stream below.
  commandStream: ""
  maxOutstanding: 64
  streamMaxEntries: 1024

  # The four agent turn routes — the chat send path.
  agentExecutionDispatch:
    enabled: false
    commandStream: ""
    consumerGroup: ""
    streamMaxEntries: 1024
    # An https ORIGIN, with no path, query or fragment. elitea-main calls
    # itself on it for the next-input-suggestion policy. Cleartext fails that
    # one call and degrades a suggestion; it does not break the send path.
    currentMainBaseUrl: ""

  # Index start, index cancel and index metadata. NEEDS
  # env.ELITEA_CONFIGURATIONS_ENABLED="true": the handlers compose through the
  # Configurations dependency, and the embedding binding resolves from the same
  # configuration rows.
  #
  # Giving this the SAME commandStream AND the SAME consumerGroup as
  # agentExecutionDispatch is supported, and it is what the standalone compose
  # stack does: one worker then serves both capabilities, because the worker
  # dispatches on the command's capability id rather than on its stream. Doing
  # that costs no second worker, no second consumer group and no extra Redis
  # ACL grant. Sharing the stream with a DIFFERENT group is refused.
  indexIngestDispatch:
    enabled: false
    commandStream: ""
    consumerGroup: ""
    streamMaxEntries: 1024

  # The index schedule write and delete routes. NEEDS indexIngestDispatch.
  indexScheduling:
    enabled: false
    # Lowercase letters, digits, dot, underscore and hyphen; it must start with
    # a letter or a digit.
    instanceId: ""

  # The runtime's OWN Redis — mutually authenticated, and separate from the
  # general-purpose Redis in env.REDIS_URL above.
  redis:
    # Must be a rediss:// URL that carries an ACL USERNAME and NO password, and
    # it must select database zero explicitly, e.g.
    #   "rediss://producer@elitea-runtime-redis:6380/0"
    # The password comes from the redis-producer-password file in the material
    # volume, never from the URL.
    url: ""
    poolSize: 8

  # Must equal the key id inside command-signing-keyring.json. The composition
  # cross-checks the two and refuses to start on a mismatch.
  signingKeyId: ""

  # Three listeners, three DISTINCT addresses. The agent worker dials all three
  # on this Service, so the server certificates must carry the Service name.
  # The chart opens the ports on the container and the Service when the runtime
  # is enabled.
  listeners:
    controlAddress: ":9443"
    outputAddress: ":9444"
    contentAddress: ":9445"

  # Where the runtime keys, passwords and certificates come from, and where the
  # service reads them.
  #
  # THE KEY NAMES ARE THE CONTRACT. The chart derives every ELITEA_RUNTIME_*
  # file path from mountPath plus one of these names, and they are the names
  # deploy/scripts/gen-runtime-certs.sh writes:
  #
  #   runtime-ca.crt                the trust root: the Redis CA, and the
  #                                 client CA of all three listeners
  #   command-signing-key.pem       Ed25519 PKCS#8, signs dispatch envelopes
  #   command-signing-keyring.json  its public half, keyed by signingKeyId
  #   redis-producer-password       the runtime Redis ACL password
  #   control-server.crt / .key     the control listener keypair
  #   output-server.crt / .key      the output listener keypair
  #   content-server.crt / .key     the content listener keypair
  #
  # The server certificates must carry the Service name, because the agent
  # worker dials all three listeners on this Service.
  material:
    mountPath: /run/elitea-runtime

    # A Kubernetes Secret whose keys are the names above. This is the supported
    # source, and it is how every other secret in this platform arrives:
    #
    #   kubectl create secret generic elitea-runtime-material \
    #     --from-file=runtime-ca.crt --from-file=command-signing-key.pem ...
    #
    # The chart cannot mount that Secret straight at mountPath.
    # internal/security/securefile refuses a path that resolves through a
    # symlink and requires owner-only bits on private material, and a Secret
    # volume gives neither: mounted whole it is a symlink farm, and mounted per
    # file with subPath its files belong to root while this pod runs as
    # nonroot. So the chart adds an init container (issue #404). It runs the
    # same image and the same user, copies each key into a memory-backed
    # emptyDir at mode 0600, and reads every file back through securefile
    # before it exits. A missing key stops the pod there, with a message.
    secretName: ""

    # The mode the kubelet gives each key of that Secret. The init container
    # has to read them, and the kubelet owns them as root, so without a pod
    # fsGroup the read bit for other users is the only one that reaches this
    # pod's user. It applies inside this pod's own mount namespace only, and
    # the copies that the service reads are owner-only. Set
    # podSecurityContext.fsGroup and lower this to 0440 to tighten it.
    secretDefaultMode: 0444

    # The bound on the emptyDir that holds the copies. The whole material is a
    # few kilobytes; the rest is headroom for a large CA bundle.
    sizeLimit: 8Mi

    # An alternative source, for a deployment whose material is ALREADY real,
    # owner-owned files at mountPath — a CSI secret driver, for example. It
    # takes a Kubernetes volume specification without its `name`; the chart
    # adds the name and mounts it read-only. Mutually exclusive with
    # secretName, and no init container renders with it.
    #
    #   volume:
    #     csi:
    #       driver: secrets-store.csi.k8s.io
    #       readOnly: true
    #       volumeAttributes:
    #         secretProviderClass: elitea-runtime-material
    volume: {}

# Kubernetes execution path for the versioned migration corpus
# (services/elitea-main/migrations/{shared,tenant}, applied by the separate
# cmd/elitea-migrate binary already built into this chart's image) — distinct
# from the dev-only boot bootstrap (bootstrapLegacySchema /
# ELITEA_DEV_BOOTSTRAP_LEGACY_SCHEMA in cmd/elitea-main, which this does NOT
# touch or replace). Runs as a pre-install/pre-upgrade Helm hook Job so it
# completes — or the release aborts — before any Deployment pods roll; see
# templates/migrate-job.yaml for the full ordering-guarantee explanation.
#
# Native ADK session/checkpoint tables have an independent `agentstate`
# history. The existing Job intentionally does not receive that database
# credential. Production activation must add a separately credentialed
# `/elitea-migrate -agentstate` hook using `AGENTSTATE_DATABASE_URL`, and extend
# the existing agentstate cleanup/retention owner to the native lineages.
migrations:
  enabled: true
  # Empty means the namespace default ServiceAccount. The chart's own
  # ServiceAccount cannot be used here: this Job is a pre-install hook and that
  # object is created later in the release, so naming it makes a FIRST install
  # fail with "error looking up service account ... not found". Set this only
  # when the database credential comes from a bound identity (cloud IAM auth),
  # and provision that ServiceAccount outside this chart so it exists when the
  # hook runs.
  serviceAccountName: ""
  # -all-tenants mirrors deploy/centry-hybrid/pov-compose.yml's elitea-migrate
  # invocation: apply the shared history, then the tenant history for every
  # existing legacy project. Both cmd/elitea-migrate flags are idempotent —
  # already-applied migration files are skipped — so re-running on every
  # upgrade is safe.
  args:
    - -all-tenants
  image:
    # Empty means "use .Values.image.repository/.tag" (the Deployment's own
    # image) — the normal case, since cmd/elitea-migrate ships in that same
    # image. Only set these to pin the migration step to a different tag.
    repository: ""
    tag: ""
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

probes:
  startup:
    path: /startupz
    initialDelaySeconds: 2
    periodSeconds: 3
    failureThreshold: 10
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  # IRSA (eks.amazonaws.com/role-arn) or Azure Workload Identity
  # (azure.workload.identity/client-id) go here (S17) — credential-less
  # access to the object store backend, an alternative to the static keys
  # in the secrets: block above. Empty by default: static keys remain the
  # baseline until an environment opts into workload identity.
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
