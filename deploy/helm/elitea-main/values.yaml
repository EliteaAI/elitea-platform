# PROTOTYPE VALUES ONLY. This chart does not yet define NetworkPolicy,
# split database principals, or production secret delivery. An opt-in
# Ingress/HTTPRoute exists (ingress.enabled) but ships with no TLS secret
# or hostname configured — see ingress.tls / ingress.hosts below.
replicaCount: 2

image:
  repository: ghcr.io/eliteaai/elitea-main
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Legacy-parity hardening (issue #241): the shipped image is already a
# distroless nonroot build, so runAsNonRoot/readOnlyRootFilesystem cost
# nothing here — no application-level temp-file writes were found (grepped
# for os.CreateTemp/os.TempDir); the container still gets a writable /tmp
# emptyDir (templates/deployment.yaml) for anything the Go runtime itself
# wants there.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Opt-in external reachability (issue #241; legacy parity with
# legacy/deploy/charts/charts/pylon's templates/httproute.yaml). Both the
# standard Ingress and the Gateway API HTTPRoute path are OFF by default —
# this chart cannot know your ingress controller / Gateway, hostnames, or
# TLS secret names. Set ingress.gatewayApi: true to render an HTTPRoute
# instead of a networking.k8s.io/v1 Ingress; the two are mutually exclusive.
ingress:
  enabled: false
  gatewayApi: false
  className: ""
  annotations: {}
  path: /
  pathType: Prefix
  hosts: []
  # TLS termination for the standard Ingress path only — ignored when
  # gatewayApi: true (HTTPRoute TLS termination is the Gateway's own concern).
  tls: []
    # - secretName: elitea-main-tls
    #   hosts:
    #     - dev.elitea.ai
  # Client-supplied identity headers stripped on the way in (#326). elitea-main
  # treats X-Auth-Type + X-Auth-Id from a trusted-proxy source address as a
  # finished identity, and in a cluster the whole pod network is typically
  # inside trusted_proxy_cidrs — so anything reaching the Service with these
  # headers set by the CALLER is an impersonation. Emptying this list re-opens
  # that; extend it, do not shorten it.
  #
  # APPLIES TO THE HTTPRoute PATH ONLY (ingress.gatewayApi: true), where it
  # renders a RequestHeaderModifier filter. A networking.k8s.io/v1 Ingress has
  # no portable header-removal field, so on that path the strip MUST be
  # configured on the ingress controller itself (ingress-nginx:
  # `more_clear_input_headers` in a configuration-snippet, which many clusters
  # disallow) or by fronting elitea-main with a Gateway. Do not assume the
  # plain-Ingress path is covered by this chart.
  stripIdentityHeaders:
    - X-Auth-Type
    - X-Auth-Id
    - X-Auth-User-Id
    - X-Auth-Reference
    - X-Auth-Avatar
    - X-Auth-Avatar-State
    - X-Auth-Session-Id
    - X-Auth-Session-Name
    - X-Auth-Session-Endpoint
    - X-Elitea-Identity-Signature
    - X-Elitea-Project-Id
    - X-Elitea-User-Id
    - X-Elitea-Tenant-Id
  # Only consulted when gatewayApi: true — the pre-existing Gateway this
  # HTTPRoute attaches to (not created by this chart).
  gateway:
    name: ""
    namespace: ""
    sectionName: ""

# Optional file-based config mounts (issue #241), OFF by default. The chart
# does not build these ConfigMaps for you — point configMapName at a
# ConfigMap you provision out-of-band (kubectl create configmap / kustomize /
# a GitOps overlay) and the chart wires the volume + volumeMount + env var
# pointing at the mounted path. See internal/api/router.go (BRAND_PACK_PATH)
# and cmd/elitea-main/main.go:1119 (ELITEA_AUTH_CONFIG_FILE).
fileConfig:
  authConfig:
    enabled: false
    configMapName: ""
    key: auth-config.json
    mountPath: /etc/elitea/auth-config.json
  brandPack:
    enabled: false
    configMapName: ""
    # BRAND_PACK_PATH is one pack file per deployment (branding package doc,
    # internal/api/v2/branding/pack.go's LoadPack does os.ReadFile) — mounted
    # via subPath, like authConfig above, not a whole-ConfigMap directory.
    key: brand-pack.json
    mountPath: /etc/elitea/brand-pack.json

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Arbitrary env vars for the elitea-main container. The whole map is rendered
# into the ConfigMap (templates/configmap.yaml) and consumed via envFrom, so
# adding a key here is all that is needed to set a new env var.
env:
  DATABASE_URL: ""

  # Production keeps the provider-neutral Go object-store capability enabled
  # and therefore fail-closed on missing storage configuration. Mixed Centry
  # deployments explicitly set this to "false" while the current artifacts
  # plugin remains authoritative.
  ELITEA_ARTIFACTS_ENABLED: "true"

  # --- circular-routing guard #1, upsert time (spec §2.6) --------------------
  # Comma-separated list of the platform's OWN /llm origins, e.g.
  #   "https://dev.elitea.ai/llm/v1,http://elitea-main:8080/llm/v1"
  # A credential whose api_base resolves to one of these is rejected at save
  # time with SELF_REFERENTIAL_CREDENTIAL (the gateway's Account-side check is
  # the request-time backstop).
  # IMPORTANT: when BOTH this and DEPLOYMENT_URL below are empty, the resolved
  # self-origin list is empty and guard #1 is INERT — every credential passes
  # the check. elitea-main logs a one-time WARN at first use in that case.
  ELITEA_SELF_LLM_ORIGINS: ""

  # Public base URL of this deployment (e.g. "https://dev.elitea.ai"). When set,
  # it is additionally treated as a self origin with "/llm" appended, so the
  # common single-domain deployment is guarded with no extra configuration.
  # Empty here leaves that convenience path off; see the note above — with
  # ELITEA_SELF_LLM_ORIGINS also empty, §2.6 guard #1 is inert.
  DEPLOYMENT_URL: ""

  # Filesystem path to a custom brand pack directory (internal/api/router.go);
  # empty serves the built-in default brand pack. Discovered unwired while
  # empirically verifying S17's env-drift gate — not itself a storage
  # variable, but the same one-line fix as everything else in this map, and
  # left unfixed it would have made the freshly-wired gate immediately red
  # for an unrelated pre-existing reason.
  BRAND_PACK_PATH: ""

  # --- Object storage (S17; ADR-0016) -----------------------------------------
  # STORAGE_BACKEND has no code default — ConfigFromEnv fails closed with no
  # object store configured until this is explicitly one of "s3"/"azure"/"gcs".
  # Never leave this empty in a real deployment; it is empty here only because
  # the chart cannot know which backend an environment uses.
  STORAGE_BACKEND: ""
  # Physical bucket/container name. Required by ConfigFromEnv for every backend.
  STORAGE_CONTAINER: ""
  # Optional key prefix under which every object this deployment writes is
  # scoped (multi-environment sharing of one bucket/container).
  STORAGE_KEY_PREFIX: ""
  # S3-only. Leave S3_ENDPOINT_URL empty for real AWS S3; set it for an
  # S3-compatible endpoint (RustFS, MinIO, etc.). S3_ACCESS_KEY/S3_SECRET_KEY
  # are NOT here — see the secrets: block below.
  S3_ENDPOINT_URL: ""
  S3_REGION: ""
  S3_FORCE_PATH_STYLE: ""
  # Azure-only. AZURE_STORAGE_KEY is NOT here — see the secrets: block below;
  # leaving it unset (empty string, the Secret's `optional: true`) makes the
  # backend use workload identity via serviceAccount.annotations instead of a
  # static shared key.
  AZURE_STORAGE_ACCOUNT: ""
  AZURE_STORAGE_ENDPOINT: ""
  # GCS-only. Leave empty for real GCS with workload identity (the normal
  # production path — GOOGLE_APPLICATION_CREDENTIALS is deliberately not
  # wired here; see env-drift-allowlist.txt). Set for an emulator endpoint.
  GCS_ENDPOINT: ""
  # Per-object upload size cap (bytes). Empty means "no override" — the
  # handler falls back to its own default (S12).
  ARTIFACT_MAX_OBJECT_BYTES: ""
  # Chat attachment bucket retention, in days (S20a). Empty means "no
  # override" — the handler falls back to its own default (365 days).
  ARTIFACT_ATTACHMENT_RETENTION_DAYS: ""

  # --- LLM gateway proxy (BF0.9c) -----------------------------------------------
  # URL of the elitea-llm-gateway service. Empty disables GatewayProxy.
  LLM_GATEWAY_URL: ""

  # --- Tracing / observability (issue #250) -----------------------------------
  # OTLP/HTTP collector base URL. Read by both libs/go/observability (elitea-main's
  # own span export) and internal/api/v2/tracing's otlp proxy target — one var
  # controls both paths. Empty defers to the OTLP exporter's own env handling
  # (effectively localhost, i.e. no-op in a cluster) and to tracing's own
  # "http://otel-collector:4318" default, which only resolves if a service by
  # that name exists in this namespace (see the otel-collector chart/values).
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # Standard OTel SDK kill switch (https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/).
  # Set to "true" to disable span export and make the tracing ingest routes
  # answer "disabled" instead of forwarding — e.g. an environment with no
  # collector deployed at all.
  OTEL_SDK_DISABLED: ""

# secrets: sensitive env vars sourced from Kubernetes Secrets (rendered as
# valueFrom.secretKeyRef in deployment.yaml), NOT plaintext in the env map
# above — mirrors deploy/helm/elitea-llm-gateway's values.yaml `secrets:`
# block. Each entry maps the ENV VAR NAME the binary reads -> the Secret
# name + key. `optional: true` lets the pod start when the Secret or key is
# absent — correct here because only one storage backend is active per
# STORAGE_BACKEND value, so e.g. AZURE_STORAGE_KEY is simply irrelevant
# when STORAGE_BACKEND=s3, and S3/Azure can each run credential-less via
# workload identity (serviceAccount.annotations) instead of a static key.
#
# CAUTION (found by adversarial review, S17): "credential-less" here does
# NOT mean "fails until configured" — it means the Go backend falls through
# to the cloud SDK's own ambient-credential chain (AWS's LoadDefaultConfig /
# Azure's NewDefaultAzureCredential / GCP's Application Default Credentials;
# see internal/infra/storage/{s3,azure,gcs}/backend.go). On a cluster whose
# NODES already carry some IAM role/managed identity with storage access
# (common when nodes also run logging/monitoring DaemonSets), an operator
# who forgets BOTH the Secret above AND serviceAccount.annotations gets a
# pod that starts, passes objectStoreReadinessProbe, and silently runs
# under whatever ambient node identity it happened to inherit — not the
# clear startup failure an operator would expect and could quickly
# diagnose. Set exactly one of (this Secret) or (serviceAccount.annotations)
# per backend deliberately; do not rely on "it started, so it must be
# configured right."
#
# Provision the referenced Secret out-of-band (kubectl create secret /
# external-secrets operator / sealed-secrets), e.g.:
#   kubectl create secret generic elitea-main-storage-secrets \
#     --from-literal=s3-access-key=... --from-literal=s3-secret-key=... \
#     --from-literal=azure-storage-key=...
secrets:
  S3_ACCESS_KEY:
    secretName: elitea-main-storage-secrets
    key: s3-access-key
    optional: true
  S3_SECRET_KEY:
    secretName: elitea-main-storage-secrets
    key: s3-secret-key
    optional: true
  AZURE_STORAGE_KEY:
    secretName: elitea-main-storage-secrets
    key: azure-storage-key
    optional: true
  # Issue #11: the gateway now REFUSES TO START without this secret, and it must
  # hold the SAME value on both sides — the edge signs the X-Elitea-* identity
  # headers the gateway verifies. Leaving the edge unsigned while the gateway
  # verifies makes every /llm request fail verification, so this side is
  # non-optional too. Provision before install/upgrade.
  GATEWAY_IDENTITY_SECRET:
    secretName: elitea-main-llm-gateway-secrets
    key: gateway-identity-secret
    optional: false
  LLM_GATEWAY_CLIENT_CERT:
    secretName: elitea-main-llm-gateway-secrets
    key: llm-gateway-client-cert
    optional: true
  LLM_GATEWAY_CLIENT_KEY:
    secretName: elitea-main-llm-gateway-secrets
    key: llm-gateway-client-key
    optional: true
  LLM_GATEWAY_CA_FILE:
    secretName: elitea-main-llm-gateway-secrets
    key: llm-gateway-ca-file
    optional: true

# Kubernetes execution path for the versioned migration corpus
# (services/elitea-main/migrations/{shared,tenant}, applied by the separate
# cmd/elitea-migrate binary already built into this chart's image) — distinct
# from the dev-only boot bootstrap (bootstrapLegacySchema /
# ELITEA_DEV_BOOTSTRAP_LEGACY_SCHEMA in cmd/elitea-main, which this does NOT
# touch or replace). Runs as a pre-install/pre-upgrade Helm hook Job so it
# completes — or the release aborts — before any Deployment pods roll; see
# templates/migrate-job.yaml for the full ordering-guarantee explanation.
migrations:
  enabled: true
  # -all-tenants mirrors deploy/centry-hybrid/pov-compose.yml's elitea-migrate
  # invocation: apply the shared history, then the tenant history for every
  # existing legacy project. Both cmd/elitea-migrate flags are idempotent —
  # already-applied migration files are skipped — so re-running on every
  # upgrade is safe.
  args:
    - -all-tenants
  image:
    # Empty means "use .Values.image.repository/.tag" (the Deployment's own
    # image) — the normal case, since cmd/elitea-migrate ships in that same
    # image. Only set these to pin the migration step to a different tag.
    repository: ""
    tag: ""
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

probes:
  startup:
    path: /startupz
    initialDelaySeconds: 2
    periodSeconds: 3
    failureThreshold: 10
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  # IRSA (eks.amazonaws.com/role-arn) or Azure Workload Identity
  # (azure.workload.identity/client-id) go here (S17) — credential-less
  # access to the object store backend, an alternative to the static keys
  # in the secrets: block above. Empty by default: static keys remain the
  # baseline until an environment opts into workload identity.
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
