# Standalone (pylon-free) values for elitea-main — issue #382.
#
# WHAT THIS FILE IS FOR
# The chart used to set no capability flag at all. cmd/elitea-main gates whole
# capabilities on environment variables, so a Kubernetes install served none of
# those route groups while the SAME IMAGE on compose served all of them. That
# made Kubernetes unable to run the pylon-free configuration, which is the
# deployment target. This file closes the gap.
#
# The capability set here equals deploy/docker-compose.standalone-full.yml,
# which is the configuration proven to run without pylon. Read that file beside
# this one: every flag below has its reasoning written out there.
#
# HOW TO USE IT
#   helm install elitea-main deploy/helm/elitea-main \
#     -f deploy/helm/elitea-main/values-standalone.yaml \
#     --set env.DATABASE_URL=... --set env.REDIS_URL=...
#
# The chart checks every prerequisite while it renders. A missing or
# contradictory setting fails `helm template` and names the field, so you find
# it on your terminal instead of in a restarting pod.
#
# READ THIS BEFORE YOU INSTALL: THE RUNTIME MATERIAL
# The runtime plane below reads its keys, passwords and certificates through
# internal/security/securefile, which refuses a symlinked path and requires
# owner-only permissions on private material. A plain Kubernetes `secret:`
# volume satisfies neither: it is a symlink farm, and a per-file `subPath`
# mount produces root-owned files that this nonroot pod cannot read at any mode
# securefile accepts. So runtime.material.volume below names a CSI driver,
# which can write real files owned by the pod's own user at mode 0600.
#
# You must provision that SecretProviderClass yourself — issue #382 puts secret
# delivery out of scope, and the chart does not choose a mechanism for you. It
# must present these file names, which are the ones
# deploy/scripts/gen-runtime-certs.sh writes:
#
#   PRIVATE, mode 0600, owned by the pod user:
#     command-signing-key.pem  redis-producer-password
#     control-server.key       output-server.key       content-server.key
#   PUBLIC, mode 0644 or stricter:
#     runtime-ca.crt           command-signing-keyring.json
#     control-server.crt       output-server.crt       content-server.crt
#
# The three server certificates must carry the Service DNS name, because the
# agent worker dials the listeners through this chart's Service.
#
# Set runtime.enabled=false if you have no such mechanism yet. Everything above
# the runtime block still works and is the larger half of the gap: the
# Configurations plane, the project-information route, the project event stream
# and the admin console all come up without any runtime material.

# --- Production authentication -----------------------------------------------
# The prerequisite of nearly everything below. cmd/elitea-main refuses to
# compose the Configurations plane, the project-information route and the
# runtime without a principal validator and a forwarded-identity verifier, and
# this chart builds both only from an auth configuration file.
#
# Provision the ConfigMap out of band, for example from the reference file:
#   kubectl create configmap elitea-main-auth-config \
#     --from-file=auth-config.json=deploy/runtime/auth.form.yml
fileConfig:
  authConfig:
    enabled: true
    configMapName: elitea-main-auth-config

env:
  # Endpoints the chart cannot guess. Override both at install time.
  DATABASE_URL: ""
  # The general-purpose Redis that carries the project event stream. Without
  # it the events route is never registered and answers 404.
  REDIS_URL: ""

  # --- Current-compatibility plane -------------------------------------------
  # Eight configuration and model-catalogue routes, and the dependency that
  # agent dispatch and index ingest both compose through.
  ELITEA_CONFIGURATIONS_ENABLED: "true"

  # The public project, whose configurations merge into every other project's
  # option lookups. It must name a project that EXISTS: the model catalogue
  # lists that project's configurations and propagates the failure, so a
  # missing id fails every agent turn rather than yielding an empty set.
  #
  # "1" matches the compose stack's seeded project. Change it to your own
  # public project, and set the SAME value in
  # deploy/helm/elitea-llm-gateway/values.yaml, where the key has the same
  # name. The gateway reads the public project to serve shared models (issue
  # #316); the two services must name one project or the gateway serves a
  # different model set from the one the UI offers.
  ELITEA_AI_PROJECT_ID: "1"

  # The project-information route. The prototype handler that answers this path
  # while the flag is off never counts teammates and always reports a null
  # icon, and the project screen reads exactly those two fields.
  ELITEA_PROJECT_INFO_ENABLED: "true"

  # Left OFF on purpose, exactly as the compose stack leaves it: the three
  # configuration write routes need the LiteLLM lifecycle facade that the
  # Bifrost gateway replaced.
  ELITEA_CONFIGURATIONS_MUTATION_ENABLED: "false"

  # Left OFF on purpose. Their routes answer a shape the published contract and
  # the generated client both reject, so turning either on breaks the web
  # client. Issues #394 and #395 track the contract work that must land first.
  ELITEA_INDEX_TYPES_ENABLED: "false"
  ELITEA_APPLICATION_SKILLS_ENABLED: "false"

  # The gateway serves every model. Point this at the gateway Service and give
  # the pod the client certificates in the secrets: block — llmproxy always
  # builds an mTLS transport, so an empty certificate path is a fatal boot
  # error rather than a fall back to cleartext.
  LLM_GATEWAY_URL: "https://elitea-llm-gateway:8083"

  # Object storage for artifacts. Fill in for your environment.
  STORAGE_BACKEND: "s3"
  STORAGE_CONTAINER: "elitea-artifacts"

# --- Runtime plane -----------------------------------------------------------
# Agent execution, the execution-events stream, index ingest and configuration
# validation. All-or-nothing: internal/runtimecomposition/config.go requires
# this whole set at once and refuses to start on a partial one.
runtime:
  enabled: true

  # The base plane: configuration validation.
  commandStream: "commands.v1.configuration.validate.v1.validation-small.shared-credential-free.1.0"
  maxOutstanding: 64
  streamMaxEntries: 1024

  # The four agent turn routes — the chat send path.
  agentExecutionDispatch:
    enabled: true
    commandStream: "commands.v1.agent.execute.agent.shared.1.0"
    consumerGroup: "elitea-agent-worker-v1"
    streamMaxEntries: 1024
    # An https origin with no path. elitea-main calls itself on it for the
    # next-input-suggestion policy. Point it at the address that terminates TLS
    # in front of this Service.
    currentMainBaseUrl: "https://elitea-main:8080"

  # Index start, index cancel and index metadata.
  #
  # DELIBERATELY the same stream AND the same consumer group as the agent plane
  # above, exactly as the compose stack sets them. The worker dispatches on the
  # command's capability id rather than on its stream, so one worker serves
  # both capabilities: no second worker, no second consumer group, no extra
  # Redis ACL grant. Sharing the stream with a DIFFERENT group is refused.
  indexIngestDispatch:
    enabled: true
    commandStream: "commands.v1.agent.execute.agent.shared.1.0"
    consumerGroup: "elitea-agent-worker-v1"
    streamMaxEntries: 1024

  # Left OFF, as the compose stack leaves it. Turn it on to serve the index
  # schedule write and delete routes, and give it an instanceId.
  indexScheduling:
    enabled: false

  # The runtime's own mutually authenticated Redis, separate from the
  # general-purpose one in env.REDIS_URL above. The password comes from the
  # redis-producer-password file in the material volume, never from this URL.
  redis:
    url: "rediss://producer@elitea-runtime-redis:6380/0"
    poolSize: 8

  # Must equal the key id inside command-signing-keyring.json. The composition
  # cross-checks the two and refuses to start on a mismatch.
  signingKeyId: "standalone-runtime-v1"

  listeners:
    controlAddress: ":9443"
    outputAddress: ":9444"
    contentAddress: ":9445"

  material:
    mountPath: /run/elitea-runtime
    # See this file's header for what this must produce. A plain `secret:`
    # volume here renders and then fails at boot.
    volume:
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: elitea-runtime-material
