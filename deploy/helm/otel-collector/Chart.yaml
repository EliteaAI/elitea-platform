apiVersion: v2
name: otel-collector
description: >-
  OpenTelemetry collector receiving OTLP spans from elitea-main/elitea-scheduler's
  own instrumentation (libs/go/observability) and from elitea-main's tracing
  ingest routes (internal/api/v2/tracing collect/otlp proxy). debug + file
  exporters only (issue #250) — a real trace sink (Tempo, Grafana, a vendor
  backend) is a per-environment values.yaml change, not this chart's scope.
type: application
version: 0.1.0
appVersion: "0.114.0"
