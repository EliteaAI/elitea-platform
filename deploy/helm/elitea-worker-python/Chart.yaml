apiVersion: v2
name: elitea-worker-python
description: >-
  The EliteA agent worker — the NodeEvent producer that turns an admitted
  execution into streamed tokens — together with the private TLS edge it needs
  for platform_origin, and the workload-session provisioning its control-plane
  calls are authorized against. Without this chart a chat send is admitted over
  HTTP and then answers nothing: elitea-main admits and projects executions but
  has no agent-token producer of its own.
type: application
version: 0.1.0
appVersion: "0.1.0"
