{{- if .Values.worker.enabled }}
{{- if .Values.worker.autoscaling.enabled }}
{{/*
  Queue-depth autoscaling for the agent worker.

  WHY KEDA AND NOT A THIRD NATIVE HPA. The three HPAs in this chart scale on
  CPU and memory. Those are the wrong signal for this workload: an agent
  execution spends most of its life waiting on a model, so a backlog of
  thousands of unclaimed commands raises neither. The signal that matters is
  the depth of the Redis consumer group, and no native HPA can read it.

  WHY IT COULD NOT EXIST BEFORE. Every replica used to share one Redis consumer
  name, so scaling out did not divide the work — it split acknowledgements
  between processes that Redis believed were one consumer. O2a gave each pod
  its own consumer name; this is what that unblocked.

  THE GUARD BELOW IS THE POINT OF THIS FILE.

  This chart has already shipped one autoscaler that could not work: the
  gateway's HPA named a metric the gateway never published, so enabling it
  produced ScalingActive=False and pinned the deployment at minReplicas with
  nothing saying why. A ScaledObject applied to a cluster with no KEDA fails
  the same way and worse — the API rejects an unknown kind, or, if a stale CRD
  is present, the object is created and no controller ever reads it.

  `.Capabilities.APIVersions` is the cluster's OWN list of served API groups.
  Asking it turns "KEDA is not installed" from a silent no-op into a failed
  install with a message. For `helm template`, which has no cluster to ask,
  pass `--api-versions keda.sh/v1alpha1` — deploy/helm/tests/render-worker-
  autoscaling.sh does exactly that, and also checks that WITHOUT it the render
  is refused.
*/}}
{{- if not (.Capabilities.APIVersions.Has "keda.sh/v1alpha1") }}
{{- fail "worker.autoscaling.enabled=true needs KEDA, and this cluster does not serve keda.sh/v1alpha1. The worker scales on Redis consumer-group depth, which no native HorizontalPodAutoscaler can read, so there is no degraded mode to fall back to: a ScaledObject applied without KEDA is an object no controller reads. Install KEDA (https://keda.sh), or set worker.autoscaling.enabled=false and size worker.replicaCount by hand. For `helm template`, pass --api-versions keda.sh/v1alpha1." }}
{{- end }}
{{- $a := .Values.worker.autoscaling }}
{{- if lt (int $a.maxReplicas) (int $a.minReplicas) }}
{{- fail (printf "worker.autoscaling.maxReplicas (%d) is below minReplicas (%d)." (int $a.maxReplicas) (int $a.minReplicas)) }}
{{- end }}
{{- $redisURL := .Values.worker.runtime.redisUrl }}
{{- if not (or (hasPrefix "redis://" $redisURL) (hasPrefix "rediss://" $redisURL)) }}
{{- fail (printf "worker.runtime.redisUrl is %q, which is neither redis:// nor rediss://. The scaler must connect the same way the worker does, and it derives TLS from this scheme rather than from a second setting that could disagree with it." $redisURL) }}
{{- end }}
{{- $tls := hasPrefix "rediss://" $redisURL }}
{{/*
  Host and port for the scaler, taken from the SAME url the worker reads.

  A separate `worker.autoscaling.redisAddress` value would be a second place to
  write one address, and the failure when the two disagree is a scaler reading
  a queue nobody serves — which reports zero depth and therefore scales DOWN.
  Silence again, in the shape of a working deployment.
*/}}
{{- $afterScheme := last (splitList "//" $redisURL) }}
{{- $hostPort := first (splitList "/" $afterScheme) }}
{{- if contains "@" $hostPort }}
{{- $hostPort = last (splitList "@" $hostPort) }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "elitea-worker-python.fullname" . }}-redis
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    # The SAME Secret and the SAME key the worker's init container copies. A
    # separate credential here would be a second thing to rotate, and the
    # symptom of forgetting one is a scaler that cannot authenticate and
    # therefore reports no depth — which scales the fleet to minReplicas while
    # the backlog grows.
    - parameter: password
      name: {{ required "materialSecretName is required" .Values.worker.materialSecretName }}
      key: redis-worker-password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "elitea-worker-python.fullname" . }}
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "elitea-worker-python.fullname" . }}
  minReplicaCount: {{ $a.minReplicas }}
  maxReplicaCount: {{ $a.maxReplicas }}
  pollingInterval: {{ $a.pollingIntervalSeconds }}
  # A LONG cooldown, deliberately. An agent execution can run for minutes, and
  # KEDA scales down by removing pods. The worker drains on SIGTERM, but a
  # cooldown shorter than a typical execution turns every quiet moment into a
  # round of terminations that each have to wait out an in-flight turn.
  cooldownPeriod: {{ $a.cooldownSeconds }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Match the cooldown. Without this, KEDA's generated HPA uses the
          # Kubernetes default of 300s, and the cooldown above governs only the
          # scale-to-zero transition — so a value set here to protect long
          # executions would not, in fact, protect them.
          stabilizationWindowSeconds: {{ $a.cooldownSeconds }}
  triggers:
    - type: redis-streams
      metadata:
        address: {{ $hostPort | quote }}
        # Both names come from the worker's own configuration, so the scaler
        # cannot watch a different stream or group than the fleet consumes.
        stream: {{ .Values.worker.runtime.redisStream | quote }}
        consumerGroup: {{ .Values.worker.runtime.redisGroup | quote }}
        # PENDING entries, not stream length. Stream length counts everything
        # ever written, including what has been processed and acknowledged, so
        # it only ever grows and would pin the fleet at maxReplicas for ever.
        pendingEntriesCount: {{ $a.targetPendingEntries | quote }}
        enableTLS: {{ $tls | quote }}
        {{- if $tls }}
        # The runtime Redis uses a private CA. KEDA verifies against the
        # operator pod's trust store, which does not contain it, so the
        # operator must be installed with that CA mounted — see the chart
        # README. unsafeSsl is NOT set here: an autoscaler that skips
        # certificate verification is a credential handed to whatever answers
        # on that address.
        {{- end }}
      authenticationRef:
        name: {{ include "elitea-worker-python.fullname" . }}-redis
{{- end }}
{{- end }}
