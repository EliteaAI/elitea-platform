{{- if .Values.runtimeRedis.enabled }}
{{- if .Values.runtimeRedis.persistence.enabled }}
# The AOF's volume. ReadWriteOnce and one replica go together: this Deployment
# is `Recreate` for the same reason the data is single-primary — two pods
# behind one Service would split both the session store and the dispatch bus.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "elitea-runtime-redis.fullname" . }}-data
  labels:
    {{- include "elitea-runtime-redis.labels" . | nindent 4 }}
  annotations:
    # Keep the AOF when the Application is pruned: deleting the release should
    # not silently discard every live session and every queued command.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.runtimeRedis.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.runtimeRedis.persistence.size }}
{{- end }}
{{- end }}
