{{- if .Values.runtimeRedis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elitea-runtime-redis.fullname" . }}
  labels:
    {{- include "elitea-runtime-redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: rediss
      port: {{ .Values.runtimeRedis.tlsPort }}
      targetPort: rediss
      protocol: TCP
  selector:
    {{- include "elitea-runtime-redis.selectorLabels" . | nindent 4 }}
{{- end }}
