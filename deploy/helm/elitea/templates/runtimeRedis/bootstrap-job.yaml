{{- if .Values.runtimeRedis.enabled }}
{{- if .Values.runtimeRedis.bootstrap.enabled }}
# Pre-creates the dispatch streams and their consumer groups from 0-0.
# Transcribed from deploy/runtime/bootstrap-streams.sh.
#
# Runs AFTER the server exists, in both hook dialects, because the XGROUP calls
# need the ACL file and the TLS listener that come from the pod this same
# install creates. ArgoCD reads its own annotation and takes precedence where
# it is the release manager; a plain `helm install` reads Helm's. Declaring
# only one leaves the bootstrap inert in the other world, and an inert
# bootstrap means no consumer group — so the worker reads an empty stream
# forever and every turn simply never starts.
#
# The Job tolerates being started early: it retries PING over TLS for a minute
# before giving up, which is what makes a Helm post-install hook (no health
# gate, unlike Argo's PostSync) safe here.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elitea-runtime-redis.fullname" . }}-bootstrap
  labels:
    {{- include "elitea-runtime-redis.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "elitea-runtime-redis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      {{- with .Values.runtimeRedis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.runtimeRedis.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.runtimeRedis.image.repository }}:{{ .Values.runtimeRedis.image.tag }}"
          imagePullPolicy: {{ .Values.runtimeRedis.image.pullPolicy }}
          {{- with .Values.runtimeRedis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_STREAM
              value: {{ .Values.runtimeRedis.bootstrap.agentStream | quote }}
            - name: AGENT_GROUP
              value: {{ .Values.runtimeRedis.bootstrap.agentGroup | quote }}
            - name: CONFIGURATION_STREAM
              value: {{ .Values.runtimeRedis.bootstrap.configurationStream | quote }}
            - name: CONFIGURATION_GROUP
              value: {{ .Values.runtimeRedis.bootstrap.configurationGroup | quote }}
            - name: REDIS_HOST
              value: {{ include "elitea-runtime-redis.fullname" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.runtimeRedis.tlsPort | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              MATERIAL=/etc/elitea-runtime
              PASSWORD="$(cat "$MATERIAL/redis-bootstrap-password")"

              redis() {
                redis-cli --tls \
                  --cacert "$MATERIAL/runtime-ca.crt" \
                  -h "$REDIS_HOST" -p "$REDIS_PORT" \
                  --user bootstrap --pass "$PASSWORD" --no-auth-warning \
                  "$@"
              }

              attempt=0
              until redis PING >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 30 ]; then
                  echo "ERROR: runtime redis did not answer PING over TLS after 30 attempts" >&2
                  redis PING || true
                  exit 1
                fi
                sleep 2
              done

              create_group() {
                stream="$1"; group="$2"
                result="$(redis XGROUP CREATE "$stream" "$group" 0-0 MKSTREAM 2>&1 || true)"
                case "$result" in
                  OK)          echo "  created $group on $stream" ;;
                  *BUSYGROUP*) echo "  $group on $stream already exists" ;;
                  *)           echo "ERROR: XGROUP CREATE $stream $group: $result" >&2; exit 1 ;;
                esac
              }

              create_group "$AGENT_STREAM" "$AGENT_GROUP"
              create_group "$CONFIGURATION_STREAM" "$CONFIGURATION_GROUP"
              echo "runtime dispatch streams ready"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: material
              mountPath: /etc/elitea-runtime
              readOnly: true
      volumes:
        - name: material
          secret:
            secretName: {{ required "materialSecretName is required" .Values.runtimeRedis.materialSecretName }}
            defaultMode: 0440
{{- end }}
{{- end }}
