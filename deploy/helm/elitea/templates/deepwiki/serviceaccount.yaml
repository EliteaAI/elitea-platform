{{- if .Values.deepwiki.enabled }}
{{- if .Values.deepwiki.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elitea-deepwiki.serviceAccountName" . }}
  labels:
    {{- include "elitea-deepwiki.labels" . | nindent 4 }}
  {{- with .Values.deepwiki.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
