{{- if .Values.main.enabled }}
{{- if .Values.main.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elitea-main.serviceAccountName" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
  {{- with .Values.main.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
