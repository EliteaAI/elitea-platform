{{- /*
  Combinations this chart refuses to install, checked here so `helm template`
  runs every one of them on every values file.

  These are not style checks. Each names a configuration that installs cleanly,
  reports every pod Ready, and then fails silently at the first chat turn — the
  failure mode this chart was consolidated to remove. A refusal at render time
  costs an operator one message; the alternative costs them a debugging session
  against a system that looks healthy.
*/ -}}

{{- if and .Values.worker.enabled (not .Values.main.runtime.enabled) }}
{{- fail "worker.enabled=true needs main.runtime.enabled=true. The worker dials elitea-main's control, output and content listeners, and those exist only when the runtime plane is composed. Without them every chat turn is admitted over HTTP, never claimed, and durably quarantined by the worker — with nothing logged on either side. Set main.runtime.enabled=true (and its fileConfig.authConfig), or set worker.enabled=false." }}
{{- end }}

{{- if and .Values.worker.enabled (not (has .Values.worker.implementation (list "python" "rust"))) }}
{{- fail (printf "worker.implementation must be \"python\" or \"rust\", got %q. It is not a free-form label: it selects the image, the argument list and the environment, and every value other than these two would silently render the Python shape — a Rust image started with the Python argument list exits immediately with worker_serve.invalid_configuration, which reads as a crash-looping worker rather than as a typo in a values file." .Values.worker.implementation) }}
{{- end }}

{{- /*
  Guarded, and this one is easy to get wrong from a values file that predates
  the Rust worker: the log levels are only read when `implementation: rust`,
  and the worker refuses an unrecognised level at startup rather than defaulting.
  A pod that will not start because of a typo'd log level is the least
  informative failure in this chart.
*/ -}}
{{- if and .Values.worker.enabled (eq .Values.worker.implementation "rust") }}
{{- range $key := list "logLevel" "traceLevel" }}
{{- $level := index $.Values.worker $key }}
{{- if not (has $level (list "off" "error" "warn" "info" "debug" "trace")) }}
{{- fail (printf "worker.%s must be one of off, error, warn, info, debug, trace, got %q. The Rust worker validates this at startup and exits; it does not fall back to a default." $key $level) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.runtimeRedis.enabled) }}
{{- fail "worker.enabled=true needs runtimeRedis.enabled=true, unless you are pointing worker.runtime.redisUrl at a runtime Redis outside this release. The worker reads its commands from that bus and nothing else; with no bus it starts, reports Ready, and consumes nothing forever. Set runtimeRedis.enabled=true, or point worker.runtime.redisUrl elsewhere and set this guard's expectation by disabling the worker." }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.dbInit.enabled) (not .Values.dbInit.externallyManaged) }}
{{- fail "worker.enabled=true with dbInit.enabled=false needs dbInit.externallyManaged=true. templates/dbInit/job.yaml is what creates the agent-state database (dbInit.agentStateDatabase) and the vector extension the worker's LangGraph checkpointer opens; with it disabled and no evidence the database exists some other way, the release installs cleanly, every pod reports Ready, and the worker fails per-execution with \"The durable agent checkpoint store is unavailable\" — an install-green-fail-later shape identical to the ones the other guards above exist to remove. Set dbInit.enabled=true, or set dbInit.externallyManaged=true after confirming the database and extension already exist." }}
{{- end }}

{{- /*
  NOT guarded: main.runtime.enabled with worker.enabled=false.
  That combination looks like the one above but is a supported topology — an
  agent worker running outside this release, authorized against
  elitea_runtime.workload_sessions by something other than this chart's hook.
  Refusing it would block a real deployment shape to catch a mistake the
  operator has to make deliberately, and it broke this repo's own render tests,
  which exercise elitea-main's runtime configuration on its own.
*/ -}}
