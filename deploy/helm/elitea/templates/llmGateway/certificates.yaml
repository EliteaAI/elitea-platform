{{- if .Values.llmGateway.enabled }}
{{- if .Values.llmGateway.mtls.enabled }}
# mTLS material for the elitea-main -> gateway hop (design §9.1, BF0.2a).
# Issued by cert-manager from an internal (private-CA) issuer. Two certs:
#   - the gateway SERVER cert (presented by elitea-llm-gateway-svc)
#   - the edge CLIENT cert (presented by elitea-main's httputil.ReverseProxy)
# Both trust the same CA bundle so each verifies the other. The CA issuer is
# NOT created here — it is a cluster-shared prerequisite referenced by name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "elitea-llm-gateway.fullname" . }}-server
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
spec:
  # Secret the gateway mounts to present its server cert; contains tls.crt,
  # tls.key and ca.crt.
  secretName: {{ .Values.llmGateway.mtls.serverSecretName }}
  duration: {{ .Values.llmGateway.mtls.duration }}
  renewBefore: {{ .Values.llmGateway.mtls.renewBefore }}
  isCA: false
  usages:
    - server auth
  dnsNames:
    # The SAN elitea-main verifies (Config.ServerName). MUST match the internal
    # service DNS name, or the mTLS handshake fails.
    - {{ .Values.llmGateway.service.name }}
    - {{ .Values.llmGateway.service.name }}.{{ .Release.Namespace }}.svc
    - {{ .Values.llmGateway.service.name }}.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.llmGateway.mtls.issuerRef.name }}
    kind: {{ .Values.llmGateway.mtls.issuerRef.kind }}
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "elitea-llm-gateway.fullname" . }}-edge-client
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
spec:
  # Secret elitea-main mounts (ClientCertFile/ClientKeyFile/CAFile in
  # llmproxy.Config). Rendered in the gateway chart so both certs share one CA
  # issuer and rotate together; the edge Deployment references it by name.
  secretName: {{ .Values.llmGateway.mtls.clientSecretName }}
  duration: {{ .Values.llmGateway.mtls.duration }}
  renewBefore: {{ .Values.llmGateway.mtls.renewBefore }}
  isCA: false
  usages:
    - client auth
  commonName: elitea-main
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.llmGateway.mtls.issuerRef.name }}
    kind: {{ .Values.llmGateway.mtls.issuerRef.kind }}
    group: cert-manager.io
{{- end }}
{{- end }}
