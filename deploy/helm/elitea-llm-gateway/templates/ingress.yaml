{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.gatewayApi }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "elitea-llm-gateway.fullname" . }}
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      {{- if .Values.ingress.gateway.namespace }}
      namespace: {{ .Values.ingress.gateway.namespace }}
      {{- end }}
      {{- if .Values.ingress.gateway.sectionName }}
      sectionName: {{ .Values.ingress.gateway.sectionName }}
      {{- end }}
  {{- with .Values.ingress.hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.ingress.pathType }}
            value: {{ .Values.ingress.path }}
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "elitea-llm-gateway.fullname" . }}
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ $.Values.service.name }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
{{- end }}
