# scale-1 profile (design §8.1.1): a single gateway replica. HA operators
# override replicaCount and LLM_BUDGET_EXPECTED_REPLICAS to the real count.
replicaCount: 1

image:
  repository: ghcr.io/eliteaai/elitea-llm-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

# §9.5: gateway memory must be >=1Gi — provider streaming buffers plus the
# bifrost object pools inflate the process well beyond the edge's footprint.
# Legacy-parity hardening (issue #241): the shipped image is distroless
# nonroot already, so runAsNonRoot/readOnlyRootFilesystem cost nothing — no
# application-level temp-file writes were found (grepped for os.CreateTemp/
# os.TempDir/os.Create). templates/deployment.yaml adds a writable /tmp
# emptyDir regardless.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# §9.5: provider LLM streams can run up to ~120s. A short grace period truncates
# in-flight streams on every rolling deploy, so terminationGracePeriodSeconds
# MUST be >=150 and rise together with the gateway's srv.Shutdown() context
# (GATEWAY_SHUTDOWN_TIMEOUT).
# 150s of HTTP drain (GATEWAY_SHUTDOWN_TIMEOUT) PLUS headroom for the phases
# that run after it: the billing drain, the governance persist drain and the
# NATS close (see shutdownSequence). With no headroom SIGKILL lands the instant
# the HTTP drain uses its full budget, and the billing drain never executes —
# silently dropping the very spend the drain exists to preserve.
terminationGracePeriodSeconds: 180

# preStop hook (§9.5). The primary drain mechanism is the gateway's own
# SIGTERM-driven graceful shutdown (GATEWAY_SHUTDOWN_TIMEOUT, >=150s); the
# preStop hook adds a quiet window so kube-proxy/ingress endpoints deregister
# before SIGTERM, keeping new connections off a draining pod.
#
# NOTE: the runtime image is distroless/static, which has NO shell or sleep
# binary — an `exec` sleep would fail. `enabled: false` by default; enable it
# only with a `command` that the deployed image can actually run (e.g. the real
# BF0.2b image bundling a sleep binary, or an httpGet variant). When disabled,
# the app's graceful shutdown alone drains in-flight streams.
preStop:
  enabled: false
  # Rendered verbatim under container.lifecycle.preStop when enabled.
  command: ["/bin/sleep", "15"]

env:
  DATABASE_URL: ""
  # §9.5: keep the SSE write deadline disabled and pools tuned. These mirror the
  # config.go defaults; set explicitly so the deployment is self-documenting.
  GATEWAY_SHUTDOWN_TIMEOUT: "150s"
  GATEWAY_INITIAL_POOL_SIZE: "100"
  GATEWAY_PROVIDER_CONCURRENCY: "50"
  GATEWAY_LOG_LEVEL: "info"
  # NATS budget-path circuit breaker (§8.5). Trip after N consecutive failures;
  # probe again after the open-duration. Mirror config.go defaults.
  LLM_BUDGET_CB_FAILURE_THRESHOLD: "3"
  LLM_BUDGET_CB_OPEN_DURATION_SEC: "10"
  # Stream-disconnect billing (issue #9, DECISIONS.md 2026-08-05). When a
  # streaming client vanishes mid-response the gateway keeps the PROVIDER
  # stream alive this long so the authoritative usage trailer can still arrive
  # and be billed; if it does not arrive nothing is billed and a
  # budget.unbilled_stream event is emitted. Clamped to 15000 in code; "0"
  # disables the mechanism (early exits then bill nothing at all).
  # The trade-off: a client that hits Stop may be billed for up to this much
  # further generation, charged to its own project credential.
  LLM_STREAM_GRACE_MS: "5000"
  # Ceiling on concurrently-detained streams; each holds a goroutine and an
  # open provider socket for up to LLM_STREAM_GRACE_MS.
  LLM_STREAM_DRAIN_MAX_INFLIGHT: "256"
  # scale-1 default; HA operators MUST override to the real replica count.
  LLM_BUDGET_EXPECTED_REPLICAS: "1"
  # NATS JetStream coordination substrate (design §8.1.1). Points at the NATS
  # client ClusterIP service provisioned by deploy/helm/nats.
  # Must match the env var name the binary reads: GATEWAY_NATS_URL (config.go).
  GATEWAY_NATS_URL: "nats://nats:4222"
  # GATEWAY_IDENTITY_SECRET (HMAC key, §5.3) and SECRETS_MASTER_KEY (Fernet vault
  # master key) are SENSITIVE — they are NOT set here as plaintext. They are wired
  # from Kubernetes Secrets via the `secrets:` block below (rendered as
  # valueFrom.secretKeyRef in deployment.yaml). Setting them here too would
  # produce duplicate env keys.
  #
  # NOTE: GATEWAY_TLS_CERT_FILE / GATEWAY_TLS_KEY_FILE / GATEWAY_TLS_CA_FILE are
  # NOT configured here. When mtls.enabled=true the chart injects these env vars
  # automatically (deployment.yaml) pointing at the mtls.mountPath volume. Keeping
  # them out of this map avoids duplicates and prevents operators from accidentally
  # supplying conflicting paths.

  # FIX 2 (MEDIUM): budget/NATS operational env vars — absent from round-1/round-2,
  # so operators couldn't configure them and they silently took code defaults.
  # Values below mirror config.go defaults (§8.5); override as needed.
  #
  # Platform-baseline NATS-failure policy (§8.5).
  # "tiered_hybrid" (default) | "fail_open" | "fail_closed".
  # A per-project gateway.project_budget.nats_fail_mode overrides this at runtime.
  LLM_BUDGET_NATS_FAIL_MODE: "tiered_hybrid"
  # How old (integer minutes) the Postgres snapshot may be before the tiered-hybrid
  # fallback degrades to 503 (NATS_DOWN_PG_STALE). Default: 5.
  LLM_BUDGET_PG_FRESHNESS_MIN: "5"
  # Absolute per-replica degraded-window overspend cap in USD (§8.5).
  # 0 = use 10 % of the project hard_limit_usd instead of a fixed cap.
  LLM_BUDGET_NATS_DEGRADED_CAP_USD: "0"
  # Continuous NATS outage ceiling (integer minutes). Once NATS has been down longer
  # than this the FSM forces closed (503) regardless of snapshot freshness. Default: 10.
  LLM_BUDGET_NATS_DEGRADED_MAX_DURATION_MIN: "10"

  # BFF.6 — circular-routing guard #1 (spec §2.6): the platform's own /llm
  # origins, comma-separated. Any credential api_base matching one of these is
  # rejected with SELF_REFERENTIAL_CREDENTIAL at request time. MUST list every
  # public and in-cluster origin that reaches the /llm surface; empty leaves
  # the request-time guard inert (the elitea-main upsert-time guard remains).
  # e.g. "https://dev.elitea.ai/llm/v1,http://elitea-main:8080/llm/v1"
  GATEWAY_SELF_LLM_ORIGINS: ""

  # Issue #13 — egress allowlist for TENANT-AUTHORED credential `api_base`
  # values. Comma-separated `host`, `host:port`, `*.domain` or `*.domain:port`.
  # An unparsable entry is FATAL at startup (a typo must not silently narrow or
  # widen the policy).
  #
  # Two modes, and there is deliberately no third:
  #   ""       (default) api_base hosts are unrestricted, and bifrost's
  #            SSRF-safe dialer stays ON for every provider — so no tenant can
  #            steer the gateway at an RFC-1918 address. Self-hosted vLLM /
  #            Ollama on a private network does NOT work in this mode.
  #   non-empty  every credential api_base must match an entry (checked BEFORE
  #            the Fernet vault decrypts its api_key, so a non-allowlisted
  #            destination never receives a resolved secret), and private
  #            destinations become reachable for the self-hosted classes only.
  #
  # Pin the port where you can. Setting this is also the only way to stop a
  # tenant shipping its own vault secrets to an arbitrary PUBLIC host as a
  # Bearer token — leaving it empty accepts that risk.
  # e.g. "vllm.ml.svc.cluster.local:8000,ollama.ml.svc.cluster.local:11434"
  GATEWAY_EGRESS_ALLOWLIST: ""

  # Issue #12 — per-(project_id, model) AMPLIFICATION BACKSTOP. Shipped as
  # "circular-routing guard #2" (spec §2.6) at a hardcoded 5 requests / 1 s /
  # 30 s lockout, but it performs NO hop detection: it counts requests. At those
  # numbers it was a 5 req/s rate limiter armed in production — a 50-VU run
  # against one tuple measured 99.96% HTTP 429.
  #
  # No rate threshold can separate a routing loop from real traffic here: both
  # are bounded by the same provider worker pool. The real anti-circular-routing
  # mechanism is hop-marker detection, tracked separately. These numbers make
  # the layer an honest backstop in the meantime.
  #
  # Threshold derivation: one replica's ceiling for a tuple is the provider
  # worker pool (GATEWAY_PROVIDER_CONCURRENCY=50) over the fastest realistic
  # call latency (~50 ms embeddings) = 1000 req/s. Above that, arrivals can
  # never be served; below it, rejecting them is pure availability loss.
  # A NEGATIVE threshold disarms the backstop entirely. Whichever mode results,
  # the gateway logs it once at startup ("LOOP BREAKER ARMED"/"DISARMED").
  LLM_LOOP_BREAKER_THRESHOLD: "1000"
  LLM_LOOP_BREAKER_WINDOW_MS: "1000"
  # Lockout after a trip. Reduced from the shipped 30 s: a 30 s lockout on a
  # false positive is a small outage for that tuple.
  LLM_LOOP_BREAKER_OPEN_SEC: "5"

# secrets: sensitive env vars sourced from Kubernetes Secrets (rendered as
# valueFrom.secretKeyRef in deployment.yaml), NOT plaintext in the env map above.
# Each entry maps the ENV VAR NAME the binary reads → the Secret name + key.
# `optional: true` lets the pod start when the Secret is absent (e.g. local/dev,
# or SECRETS_MASTER_KEY unset → vault runs in degraded single-level mode); set
# false to make the Secret mandatory in production.
#
# Provision the referenced Secret out-of-band (kubectl create secret / external-
# secrets operator / sealed-secrets), e.g.:
#   kubectl create secret generic elitea-llm-gateway-secrets \
#     --from-literal=identity-secret=... --from-literal=secrets-master-key=...
#
# BREAKING (issue #11, 2026-08-09): GATEWAY_IDENTITY_SECRET is now REQUIRED —
# `optional: false`. An empty secret disables identity verification, and the
# gateway then takes X-Elitea-Project-Id at face value to select which tenant's
# provider credentials it decrypts out of the Fernet vault. The binary refuses
# to start (FATAL) in that state, so a pod without the Secret would crash-loop;
# `optional: false` moves the failure earlier and makes it legible
# (CreateContainerConfigError naming the missing Secret key) instead.
#
# OPERATIONAL CONSEQUENCE: `helm install` with no
# `elitea-llm-gateway-secrets/identity-secret` no longer produces a running pod.
# Provision the Secret BEFORE installing/upgrading, and set the SAME value on
# elitea-main (`secrets.GATEWAY_IDENTITY_SECRET`, also non-optional) — the edge
# signs the identity headers the gateway verifies, so a mismatched or one-sided
# secret makes every /llm request fail verification.
secrets:
  GATEWAY_IDENTITY_SECRET:
    secretName: elitea-llm-gateway-secrets
    key: identity-secret
    optional: false   # issue #11 — empty secret ⇒ any caller picks any tenant's credentials
  SECRETS_MASTER_KEY:
    secretName: elitea-llm-gateway-secrets
    key: secrets-master-key
    optional: true    # unset ⇒ Fernet vault degraded single-level mode

# networkPolicy: egress containment, defence in depth for issue #13 (the
# tenant-authored api_base SSRF). The in-process control is
# GATEWAY_EGRESS_ALLOWLIST above; this is the second layer, for the case where
# that one is bypassed or a future carve-out widens it.
#
# OPT-IN, because attaching ANY egress rule to a pod denies everything not
# listed, and this chart cannot know where your Postgres, NATS and OTLP
# collector live. Enable it only after filling in `egress` below — otherwise the
# gateway loses its own dependencies. Requires a CNI that enforces
# NetworkPolicy; on one that does not, the object renders but does nothing.
networkPolicy:
  enabled: false
  # allowPublicEgress opens 0.0.0.0/0 minus every private/link-local range, so
  # cloud provider APIs work but nothing in-cluster is reachable. Set false only
  # for an install that talks exclusively to self-hosted models.
  allowPublicEgress: true
  publicEgressPorts:
    - protocol: TCP
      port: 443
  # In-cluster dependencies, rendered verbatim under spec.egress. Worked
  # example — replace the selectors and ports with your own topology, and add
  # an entry for every self-hosted model host GATEWAY_EGRESS_ALLOWLIST names:
  #
  # egress:
  #   - to:
  #       - podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: postgresql
  #     ports:
  #       - protocol: TCP
  #         port: 5432
  #   - to:
  #       - podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: nats
  #     ports:
  #       - protocol: TCP
  #         port: 4222
  #   - to:
  #       - podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: vllm
  #     ports:
  #       - protocol: TCP
  #         port: 8000
  egress: []

# elitea-llm-gateway-svc: mTLS-only ClusterIP (NOT public), port 8083 (design
# §9.1). Named explicitly so the edge/runbook references resolve.
service:
  name: elitea-llm-gateway-svc
  port: 8083
  annotations: {}

# HPA on a custom /llm SSE-connection metric (design §9.5) — CPU/memory is a poor
# signal for I/O-bound streaming. Requires the Prometheus Adapter to surface the
# metric; disable if that adapter is not installed (falls back to replicaCount).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # Pods-metric name the Prometheus Adapter must expose (concurrent /llm SSE
  # connections per pod). The gateway emits the underlying gauge in BF0.4/§10.
  sseConnectionMetric: gateway_llm_sse_active_connections
  # Scale out when average concurrent streams per pod approaches the tuned
  # provider Concurrency budget (GATEWAY_PROVIDER_CONCURRENCY=50).
  targetSSEConnectionsPerPod: "40"

# mTLS for the elitea-main -> gateway hop (design §9.1). cert-manager issues a
# server cert (this Deployment mounts it) and an edge client cert (elitea-main
# mounts it) from a shared internal CA issuer.
mtls:
  enabled: true
  serverSecretName: elitea-llm-gateway-server-tls
  clientSecretName: elitea-main-gateway-client-tls
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  issuerRef:
    # A cluster-shared internal (private-CA) issuer — NOT created by this chart.
    name: elitea-internal-ca
    kind: ClusterIssuer
  # Where the server cert secret is mounted in the gateway container. The
  # gateway serves TLS from tls.crt/tls.key and verifies client certs against
  # ca.crt (mTLS require-and-verify).
  mountPath: /etc/gateway/tls

probes:
  liveness:
    # Process liveness only (no dependency calls) — issue #242: a NATS blip
    # must not restart the pod, only /readyz should pull it out of rotation.
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Opt-in external reachability (issue #241; legacy parity), OFF by default.
# CAUTION: the gateway is mTLS-internal by design (service.yaml — "NEVER
# public", §9.1); enabling this exposes /llm outside the mTLS-only path the
# rest of this chart assumes. Only turn it on if your ingress
# controller/Gateway itself terminates and re-verifies mTLS equivalent to
# what elitea-main does today. Set ingress.gatewayApi: true to render an
# HTTPRoute instead of a networking.k8s.io/v1 Ingress; the two are mutually
# exclusive.
ingress:
  enabled: false
  gatewayApi: false
  className: ""
  annotations: {}
  path: /
  pathType: Prefix
  hosts: []
  tls: []
    # - secretName: elitea-llm-gateway-tls
    #   hosts:
    #     - gateway.dev.elitea.ai
  gateway:
    name: ""
    namespace: ""
    sectionName: ""

nodeSelector: {}
tolerations: []
affinity: {}
