# elitea-web: the SPA image (apps/elitea-web/Containerfile) — nginx serving
# pre-built static assets under /app/, with config.js written at container start
# from the VITE_* env vars below (apps/elitea-web/docker-entrypoint.sh).
#
# Stateless, so replicas are free and a rollout is safe at any time.
replicaCount: 2

image:
  # Published by .github/workflows/publish.yml (matrix entry `elitea-web`,
  # context `.`, dockerfile apps/elitea-web/Containerfile). Issue #240 was
  # filed while that entry did not exist yet; it does now, so this repository
  # is real. Pin `tag` to a release in production — `latest` plus
  # IfNotPresent means a node that already cached an older `latest` layer
  # keeps serving it.
  repository: ghcr.io/eliteaai/elitea-web
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # The container's nginx listens on 80 (apps/elitea-web/nginx/spa.conf).
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: "200m"
    memory: 128Mi

# nginx exits on SIGTERM after finishing in-flight requests; static responses
# are short.
terminationGracePeriodSeconds: 30

# Runtime SPA configuration. docker-entrypoint.sh honours EXACTLY these five
# keys and writes them into window.elitea_ui_config; anything else added here
# reaches the container's environment but is never emitted to the browser.
#
# The two dev-mode auth keys from the old elitea-ui chain are deliberately
# absent (contract C7b / defect D10): a static bearer credential must never
# land in a world-readable config.js.
env:
  # Path the SPA calls the API on. Relative, so it is resolved against the
  # origin the browser loaded the app from — i.e. this assumes an ingress or
  # gateway fronts both this Service and elitea-main on one host. If they are
  # on different origins, set an absolute URL AND arrange CORS on elitea-main.
  VITE_SERVER_URL: "/api/v2"
  # Must stay in step with the nginx location blocks in the image, which are
  # hardcoded to /app/. Changing this alone moves the SPA's router base without
  # moving what nginx serves, producing 404s on every deep link.
  VITE_BASE_URI: "/app/"
  VITE_SOCKET_SERVER: ""
  VITE_SOCKET_PATH: "/socket.io"
  VITE_PUBLIC_PROJECT_ID: ""

probes:
  # There is no /healthz in this image and no `location /` in spa.conf, so the
  # container root returns 404 — probing "/" would fail a perfectly healthy
  # pod. /app/index.html is served by the SPA-shell location block.
  liveness:
    path: /app/index.html
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /app/index.html
    periodSeconds: 10
    failureThreshold: 3

# CPU-based HPA is meaningful here (unlike the gateway's I/O-bound streaming or
# the scheduler's serialised workers): serving static assets is CPU/network
# work that scales linearly with replicas. Off by default so a cluster without
# metrics-server does not get a permanently-degraded HPA object.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
