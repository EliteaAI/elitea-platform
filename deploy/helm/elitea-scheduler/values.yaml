# elitea-scheduler — headless worker. There is no ingress and (by default) no
# Service: nothing calls in, the process polls and consumes.
#
# READ services/elitea-scheduler/RETIREMENT.md AND THIS CHART'S README BEFORE
# INSTALLING. In short: this binary carries THREE independent responsibilities
# and the two that matter are not the scheduler loop —
#   1. the legacy centry.schedule poller (NOT the owner of product schedule
#      occurrences; elitea-main's scheduling kernel is). It starts
#      UNCONDITIONALLY — there is no env flag to turn it off (main.go always
#      calls sched.Run). Which jobs it acts on is decided by DATA: the enabled
#      flag on centry.schedule rows. Installing this chart against a database
#      whose rows for a job elitea-main also registers are still enabled gives
#      you TWO CLOCKS for that job, which RETIREMENT.md forbids.
#   2. the price-catalog sync worker (PRICE_SYNC_ENABLED, off by default);
#   3. the budget write-back consumer (BUDGET_WRITEBACK_ENABLED, off by
#      default) that drains GATEWAY_BUDGET_DELTAS into
#      gateway.llm_budget_accumulators.
# (2) and (3) are the reason the image cannot simply be deleted; they have no
# relocation decision yet.

# Single replica. The poller's mutual exclusion is a Redis tick lock, so extra
# replicas are not incorrect, but they buy nothing: every tick is executed once
# regardless, and the price-sync/write-back workers are likewise
# single-consumer shaped. Scale out only with a specific measured reason.
replicaCount: 1

image:
  repository: ghcr.io/eliteaai/elitea-scheduler
  tag: "latest"
  pullPolicy: IfNotPresent

# Recreate, not RollingUpdate: two generations overlapping during a rollout
# would both hold pollers contending for the same Redis tick lock and the same
# durable NATS consumer. A few seconds of no scheduler is cheaper than that.
strategy:
  type: Recreate

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "500m"
    memory: 256Mi

# The scheduler's shutdown path cancels the run context and closes the pool;
# there are no long-lived client streams to drain, unlike the gateway.
terminationGracePeriodSeconds: 30

# Rendered into the ConfigMap and consumed via envFrom, mirroring
# deploy/helm/elitea-main. Names and defaults are
# services/elitea-scheduler/internal/config/config.go; the values below match
# deploy/docker-compose.yml's elitea-scheduler service where it sets them.
env:
  # Empty means the binary's own default (localhost) — never correct in a
  # cluster. Set this.
  DATABASE_URL: ""
  # host:port, NOT a redis:// URL — the value is passed straight to
  # goredis.Options.Addr.
  REDIS_URL: "redis:6379"
  RPC_CHANNEL: "elitea_rpc"
  # Must match .Values.healthPort below; the chart does not derive one from the
  # other so that an operator changing one and not the other fails loudly at
  # probe time rather than silently listening on the wrong port.
  HTTP_ADDR: ":8081"

  # Price-catalog sync (design §8.8). Off by default: enabling it against a
  # database without gateway.gateway_models does nothing useful.
  PRICE_SYNC_ENABLED: "false"
  PRICE_SYNC_INTERVAL: "24h"
  PRICE_SYNC_LITELLM: "true"
  PRICE_SYNC_SEED: "true"
  PRICE_SYNC_LITELLM_URL: ""

  # Budget write-back consumer (design §8.6). Requires BOTH the flag AND
  # GATEWAY_NATS_URL; with either unset the consumer never starts.
  #
  # CROSS-NAMESPACE: NATS is installed by deploy/helm/nats into the
  # `elitea-gateway` namespace (deploy/argocd/applications/nats.yaml) while this
  # chart's ArgoCD Application targets `elitea`. The short name `nats` does NOT
  # resolve across namespaces — use the FQDN below if you enable this.
  BUDGET_WRITEBACK_ENABLED: "false"
  GATEWAY_NATS_URL: ""  # e.g. nats://nats.elitea-gateway.svc.cluster.local:4222
  BUDGET_WRITEBACK_BATCH_SIZE: "500"
  BUDGET_WRITEBACK_ACK_WAIT: "30s"
  BUDGET_WRITEBACK_MAX_DELIVER: "10"

  # Tracing (issue #250): same OTLP collector endpoint and kill switch as
  # deploy/helm/elitea-main's env map — see that chart's values.yaml for the
  # full rationale. Read by libs/go/observability.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SDK_DISABLED: ""

# Sensitive vars from Kubernetes Secrets (rendered as valueFrom.secretKeyRef),
# never plaintext in the ConfigMap above — same shape as
# deploy/helm/elitea-llm-gateway and deploy/helm/elitea-main.
#
# RPC_HMAC_KEY signs the Pylon/Arbiter RPC payloads the poller publishes on
# RPC_CHANNEL. `optional: true` because the binary tolerates an empty key (it
# then publishes unsigned) — which is exactly why you should set it: an absent
# Secret does not fail, it downgrades.
#
#   kubectl create secret generic elitea-scheduler-secrets \
#     --from-literal=rpc-hmac-key=...
secrets:
  RPC_HMAC_KEY:
    secretName: elitea-scheduler-secrets
    key: rpc-hmac-key
    optional: true

# Port the in-process health server listens on (must equal the port in
# env.HTTP_ADDR above).
healthPort: 8081

# Optional ClusterIP over the health port. Off by default: kubelet probes reach
# the container directly, so a Service is only needed if something external
# (a Prometheus blackbox probe, an operator running curl) has to reach /healthz.
service:
  enabled: false
  type: ClusterIP
  port: 8081
  annotations: {}

probes:
  # /healthz PINGS THE DATABASE (internal/health/health.go) — it is a readiness
  # signal, not a liveness one. Wiring it to livenessProbe would restart this
  # pod every time Postgres hiccups, which is the trap issue #242 fixed for the
  # gateway. Liveness here is therefore a dependency-free TCP check that the
  # health server is still accepting connections.
  liveness:
    enabled: true
    periodSeconds: 20
    failureThreshold: 3
  # OFF by default, on purpose, and the reason is the sync waves rather than
  # the probe itself. With service.enabled=false nothing routes to this pod, so
  # readiness gates no traffic — but it still gates Deployment availability. A
  # Postgres outage AFTER boot (an outage at boot exits the process instead)
  # would flip /healthz to 503, take the pod NotReady, hold this wave-2
  # Application at Progressing/Degraded, and block the wave-3 elitea-web sync —
  # a frontend release stopped by a database blip in a worker nothing calls.
  # Turn this on together with service.enabled, where the probe earns its
  # keep by controlling endpoints.
  readiness:
    enabled: false
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3

# No HorizontalPodAutoscaler template in this chart, deliberately. Every unit of
# work here is serialised behind a Redis tick lock or a single durable consumer,
# so added replicas raise cost and lock contention without raising throughput —
# an HPA would be a control that cannot help. Set replicaCount by hand if a
# measured reason ever appears.

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
