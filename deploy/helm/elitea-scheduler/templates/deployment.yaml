{{- /*
  The database secret, resolved once. An explicit .Values.secrets entry always
  wins; global.postgresql fills in when there is none, so an umbrella install
  names the secret in one place instead of once per component. `merge` gives
  priority to its first argument, which is what makes the explicit entry win.
*/ -}}
{{- $secrets := .Values.secrets | default dict }}
{{- $pg := (.Values.global | default dict).postgresql | default dict }}
{{- if $pg.existingSecret }}
{{- $secrets = merge (deepCopy $secrets) (dict "DATABASE_URL" (dict "secretName" $pg.existingSecret "key" ($pg.key | default "database-url"))) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-scheduler.fullname" . }}
  labels:
    {{- include "elitea-scheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "elitea-scheduler.selectorLabels" . | nindent 6 }}
  strategy:
    # Recreate by default (values.yaml): overlapping generations would contend
    # for the same Redis tick lock and the same durable NATS consumer.
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "elitea-scheduler.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the ConfigMap changes. This container reads its
        # whole configuration through envFrom at START, so without this a
        # `helm upgrade --set env.DATABASE_URL=…` rewrites the ConfigMap,
        # leaves the Deployment spec byte-identical, replaces no pod — and the
        # running scheduler keeps polling the OLD database while helm and
        # ArgoCD both report success.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "elitea-scheduler.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: elitea-scheduler
          image: "{{ .Values.image.repository }}:{{ ((.Values.global | default dict).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # In-process health server only — this worker serves no product
            # traffic. Must match the port in env.HTTP_ADDR.
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "elitea-scheduler.fullname" . }}-config
          {{- if $secrets }}
          env:
            {{- range $name, $ref := $secrets }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
                  optional: {{ $ref.optional | default false }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            # DELIBERATELY a TCP check, not httpGet /healthz: /healthz pings
            # Postgres, so an httpGet liveness probe would restart this pod on
            # every database blip (issue #242's trap). Liveness answers only
            # "is the process still there", readiness answers "can it work".
            tcpSocket:
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
