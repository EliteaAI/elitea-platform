apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-scheduler.fullname" . }}
  labels:
    {{- include "elitea-scheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "elitea-scheduler.selectorLabels" . | nindent 6 }}
  strategy:
    # Recreate by default (values.yaml): overlapping generations would contend
    # for the same Redis tick lock and the same durable NATS consumer.
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "elitea-scheduler.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "elitea-scheduler.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: elitea-scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # In-process health server only — this worker serves no product
            # traffic. Must match the port in env.HTTP_ADDR.
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "elitea-scheduler.fullname" . }}-config
          {{- if .Values.secrets }}
          env:
            {{- range $name, $ref := .Values.secrets }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
                  optional: {{ $ref.optional | default false }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            # DELIBERATELY a TCP check, not httpGet /healthz: /healthz pings
            # Postgres, so an httpGet liveness probe would restart this pod on
            # every database blip (issue #242's trap). Liveness answers only
            # "is the process still there", readiness answers "can it work".
            tcpSocket:
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
