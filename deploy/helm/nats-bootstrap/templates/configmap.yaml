apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nats-bootstrap.fullname" . }}
  labels:
    {{- include "nats-bootstrap.labels" . | nindent 4 }}
  annotations:
    # Recreate before the Job runs; delete after so the CM tracks each release.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  bootstrap.sh: |-
{{ .Files.Get "files/bootstrap.sh" | indent 4 }}
