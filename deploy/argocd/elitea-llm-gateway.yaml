# ArgoCD Application: elitea-llm-gateway (BF0.2b). Sync-wave 0 — deploys after
# NATS (-2) and the JetStream bootstrap (-1) so the gateway's NATS client finds
# the KV buckets + stream already present. mTLS-only ClusterIP, not public.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-llm-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eliteaai/elitea-platform
    targetRevision: main
    path: deploy/helm/elitea-llm-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: elitea-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
