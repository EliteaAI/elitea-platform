# ArgoCD Application: elitea-web (static SPA behind nginx). Sync-wave 3 —
# last, per the issue's db/nats → migrations → backend → frontend ordering, so
# the API the shell immediately calls is already up.
#
# The SPA's runtime config is written at container start from the chart's
# VITE_* env vars, and VITE_SERVER_URL defaults to the RELATIVE "/api/v2" —
# which only works if one ingress/gateway fronts both this Service and
# elitea-main on a single origin. This Application installs no ingress
# (ingress/HTTPRoute is a separate issue), so until one exists the SPA is
# in-cluster only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eliteaai/elitea-platform
    targetRevision: main
    path: deploy/helm/elitea-web
  destination:
    server: https://kubernetes.default.svc
    namespace: elitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
