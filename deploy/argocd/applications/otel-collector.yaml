# ArgoCD Application: otel-collector (issue #250). Sync-wave 0 — no
# dependencies of its own (unlike elitea-main/scheduler, which read
# OTEL_EXPORTER_OTLP_ENDPOINT but degrade to dropped/no-op spans if the
# collector isn't up yet, so strict ordering isn't required — this wave keeps
# it available before anything else starts emitting).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eliteaai/elitea-platform
    targetRevision: main
    path: deploy/helm/otel-collector
  destination:
    server: https://kubernetes.default.svc
    namespace: elitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
