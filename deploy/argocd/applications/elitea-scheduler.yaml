# ArgoCD Application: elitea-scheduler (headless worker). Sync-wave 2 — after
# elitea-main (1), so the schema its jobs read has already been migrated.
#
# READ deploy/helm/elitea-scheduler/README.md AND
# services/elitea-scheduler/RETIREMENT.md BEFORE ENABLING THIS APPLICATION.
# The legacy centry.schedule poller inside this binary starts unconditionally —
# there is no env flag — and RETIREMENT.md forbids running it for a job that
# elitea-main's scheduling kernel also owns. Whether that happens is decided by
# DATA (the enabled flag on centry.schedule rows), which no manifest here can
# check. Confirm those rows before the first sync.
#
# The two responsibilities that keep this service alive — price-catalog sync and
# the budget write-back consumer — are BOTH OFF by the chart's defaults. Turn
# them on deliberately via a values file or helm.parameters; enabling the
# write-back consumer also needs GATEWAY_NATS_URL as an FQDN, since NATS lives
# in the `elitea-gateway` namespace and this workload does not:
#   nats://nats.elitea-gateway.svc.cluster.local:4222
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-scheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eliteaai/elitea-platform
    targetRevision: main
    path: deploy/helm/elitea-scheduler
  destination:
    server: https://kubernetes.default.svc
    namespace: elitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
