http:
  routers:
    # The foundation selects only the dependency-safe Go health endpoint. Each
    # product capability adds an exact higher-priority router after its own
    # parity, RBAC, browser and rollback gates pass.
    go-health:
      rule: Path(`/healthz`)
      priority: 100
      entryPoints: [websecure]
      tls: {}
      service: elitea-main

    current-platform:
      rule: PathPrefix(`/`)
      priority: 1
      entryPoints: [websecure]
      tls: {}
      service: current-main

  services:
    elitea-main:
      loadBalancer:
        servers:
          - url: http://elitea-main:8080

    current-main:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8080
