# Full mixed PoV overlay. Apply this file after Centry's current Compose,
# hybrid Auth overlay and indexing checkpoint. All paths are supplied by
# deploy/centry-hybrid/compose.sh and resolve to tracked inputs or ignored
# branch-local runtime material.
services:
  elitea-litellm:
    build:
      context: ${ELITEA_CENTRY_DIR:?set ELITEA_CENTRY_DIR}/hybrid_auth
      dockerfile: Containerfile.litellm
    image: eliteaai/elitea-litellm:pov

  pylon_main:
    volumes:
      - ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}/deploy/centry-hybrid/runtime-interface-litellm.yml:/data/configs/runtime_interface_litellm.yml:ro
    depends_on:
      elitea-litellm:
        condition: service_healthy

  pylon_indexer:
    volumes:
      - ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}/deploy/centry-hybrid/runtime-engine-litellm.yml:/data/configs/runtime_engine_litellm.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 2 http://elitea-litellm:8081/health/liveness >/dev/null
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s
    depends_on:
      elitea-litellm:
        condition: service_healthy

  elitea-main:
    build:
      context: ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}
      dockerfile: services/elitea-main/Containerfile
      target: hybrid
    image: ${ELITEA_MAIN_IMAGE:?set ELITEA_MAIN_IMAGE}
    environment:
      # The current Centry artifacts plugin remains authoritative in the
      # mixed deployment. It uses Centry's local libcloud store, which is not
      # an S3/Azure/GCS endpoint that elitea-main can safely share.
      ELITEA_ARTIFACTS_ENABLED: "false"
      ELITEA_RUNTIME_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_SCHEDULING_ENABLED: "true"
      ELITEA_RUNTIME_SCHEDULER_INSTANCE_ID: elitea-main-pov-1
      ELITEA_RUNTIME_INDEX_INGEST_COMMAND_STREAM: commands.v1.index.ingest.indexing.shared.2.0
      ELITEA_RUNTIME_INDEX_INGEST_CONSUMER_GROUP: elitea-indexer-worker-v2
      ELITEA_RUNTIME_INDEX_INGEST_STREAM_MAX_ENTRIES: "16"
      # Agent and index commands are reference-only envelopes consumed by the
      # same existing SDK worker pool. Payloads and outputs remain off Redis.
      ELITEA_RUNTIME_AGENT_EXECUTION_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_AGENT_EXECUTION_COMMAND_STREAM: commands.v1.index.ingest.indexing.shared.2.0
      ELITEA_RUNTIME_AGENT_EXECUTION_CONSUMER_GROUP: elitea-indexer-worker-v2
      ELITEA_RUNTIME_AGENT_EXECUTION_STREAM_MAX_ENTRIES: "16"
    depends_on:
      runtime-index-v2-bootstrap:
        condition: service_completed_successfully

  elitea-migrate:
    # Main is the single build owner for this shared image tag.
    build: !reset null
    image: ${ELITEA_MAIN_IMAGE:?set ELITEA_MAIN_IMAGE}
    pull_policy: never

  elitea-worker:
    # The indexer service builds the common capability image once.
    build: !reset null
    image: ${ELITEA_WORKER_IMAGE:?set ELITEA_WORKER_IMAGE}
    pull_policy: never

  elitea-indexer-worker:
    build:
      context: ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}
      dockerfile: services/elitea-worker-python/Containerfile
    image: ${ELITEA_INDEXER_WORKER_IMAGE:?set ELITEA_INDEXER_WORKER_IMAGE}
    environment:
      # PoV-only, fail-safe snapshot of the current indexer_worker admin
      # configuration. The wildcard is intentionally broader than the current
      # `artifact.delete_file` rule so metadata drift cannot bypass approval in
      # this focused HITL proof. The completed admin port must replace this with
      # an exact, versioned worker-policy snapshot.
      ELITEA_SENSITIVE_TOOLS: '{"*":["delete_file"]}'
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/indexer-runtime-v2.json:/run/elitea-runtime/indexer-runtime.json:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/agent-checkpoint-connection:/run/elitea-runtime/agent-checkpoint-connection:ro
      - runtime-indexer-worker-v2-spool:/var/lib/elitea-indexer-worker/output-spool
    depends_on:
      runtime-index-v2-bootstrap:
        condition: service_completed_successfully

  runtime_redis:
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/redis-users-v2.acl:/run/elitea-runtime/redis-users.acl:ro

  # A fresh named volume starts 0755. The runtime worker contract requires a
  # private spool root, so make the local PoV volume private before the
  # observational v1 drain check. Existing spool contents are not modified.
  runtime-index-v1-spool-bootstrap:
    profiles: [runtime]
    image: redis:8.2.4-alpine
    user: "0:0"
    entrypoint: [sh, -ec]
    command:
      - chmod 700 /spool
    restart: "no"
    volumes:
      - runtime-indexer-worker-spool:/spool

  index-v1-cutover-preflight:
    profiles: [runtime]
    build: !reset null
    image: ${ELITEA_MAIN_IMAGE:?set ELITEA_MAIN_IMAGE}
    pull_policy: never
    user: "0:0"
    entrypoint: [/index-v2-preflight]
    command:
      - --spool-root
      - /mnt/index-worker-v1/output-spool
    read_only: true
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      ELITEA_RUNTIME_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_COMMAND_STREAM: commands.v1.index.ingest.indexing.shared.1.0
      ELITEA_RUNTIME_INDEX_INGEST_CONSUMER_GROUP: elitea-indexer-worker-v1
      ELITEA_RUNTIME_REDIS_URL: rediss://health@runtime-redis:6380/0
      ELITEA_RUNTIME_REDIS_PASSWORD_FILE: /run/elitea-runtime/redis-health-password
      ELITEA_RUNTIME_REDIS_CA_FILE: /run/elitea-runtime/runtime-ca.crt
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/redis-health-password:/run/elitea-runtime/redis-health-password:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/runtime-ca.crt:/run/elitea-runtime/runtime-ca.crt:ro
      - runtime-indexer-worker-spool:/mnt/index-worker-v1/output-spool:ro
    depends_on:
      elitea-migrate:
        condition: service_completed_successfully
      runtime_redis:
        condition: service_healthy
      runtime-control-bootstrap:
        condition: service_completed_successfully
      runtime-index-v1-spool-bootstrap:
        condition: service_completed_successfully
    networks:
      - centry
      - runtime_control

  runtime-index-v2-bootstrap:
    profiles: [runtime]
    image: redis:8.2.4-alpine
    user: "0:0"
    entrypoint: [sh, -ec]
    command:
      - >-
        export REDISCLI_AUTH="$$(cat /run/elitea-runtime/redis-bootstrap-password)";
        result="$$(redis-cli --user bootstrap --tls
        --cacert /run/elitea-runtime/runtime-ca.crt
        -h runtime-redis -p 6380 XGROUP CREATE
        commands.v1.index.ingest.indexing.shared.2.0
        elitea-indexer-worker-v2 0-0 MKSTREAM 2>&1)" ||
        { case "$$result" in *BUSYGROUP*) ;; *)
        echo "runtime index v2 Redis group bootstrap failed" >&2; exit 1;; esac; };
        redis-cli --user bootstrap --tls
        --cacert /run/elitea-runtime/runtime-ca.crt
        -h runtime-redis -p 6380 XINFO GROUPS
        commands.v1.index.ingest.indexing.shared.2.0
        | grep -q elitea-indexer-worker-v2
    restart: "no"
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/runtime-ca.crt:/run/elitea-runtime/runtime-ca.crt:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/redis-bootstrap-password:/run/elitea-runtime/redis-bootstrap-password:ro
    depends_on:
      index-v1-cutover-preflight:
        condition: service_completed_successfully
    networks:
      - runtime_control

volumes:
  runtime-indexer-worker-v2-spool:
