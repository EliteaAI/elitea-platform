# Full standalone stack — the E2E standalone stack PLUS a real LLM path.
#
# Relationship to the other compose files:
#
#   docker-compose.e2e-standalone.yml  CRUD/RBAC/UX only. No LLM anywhere. The
#                                      file CI runs Playwright against.
#   THIS FILE                          the same eight services + elitea-llm-gateway
#                                      (Bifrost), wired into elitea-main's /llm.
#   centry-hybrid/                     legacy mixed deployment. Not needed here.
#
# The postgres/redis/rustfs/rustfs-bucket-init/oidc-mock blocks below are
# hand-duplicated from docker-compose.e2e-standalone.yml rather than layered
# with `-f base -f overlay`: this file's postgres also needs an explicit PGDATA
# mount and elitea-main/elitea-web need the gateway's extra env/volumes, so a
# generic overlay would still have to redeclare most of each service anyway.
# A change to shared behaviour in one of those blocks (a healthcheck workaround,
# a volume fix) belongs in BOTH files — check the other one before assuming a
# fix here is complete, and vice versa.
#
# There is no pylon, no centry, no LiteLLM in this stack. LiteLLM is superseded
# by the gateway: elitea-main only reads ELITEA_LITELLM_* under
# ELITEA_CONFIGURATIONS_ENABLED=true, which nothing here sets.
#
# ── What works ───────────────────────────────────────────────────────────────
#   Everything the E2E stack does, plus real chat completions through Bifrost at
#   POST /api/v2/../llm/v1/chat/completions (OpenAI dialect) and /llm/v1/messages
#   (Anthropic dialect), billed against a real provider key you seed.
#
# ── The runtime plane (issue #281) ───────────────────────────────────────────
#   ELITEA_RUNTIME_ENABLED=true IS set below, so the agent-execution HTTP
#   surface is live: POST /api/v2/elitea_core/messages/prompt_lib/{projectID}/
#   {conversationID} admits a run and returns {events_url}, and
#   GET /api/v2/executions/{projectID}/{executionID}/events streams it
#   (internal/api/v2/agentexecution/route.go, mounted at
#   internal/api/production_router.go:123-125).
#
#   Turning that flag on is not a one-liner. runtimecomposition/config.go takes
#   the runtime env block all-or-nothing and refuses to boot on a partial one,
#   and each piece drags in real provisioning:
#     * TLS Redis. Agent dispatch is Redis Streams, not NATS: the outbox drains
#       through internal/transport/redisdispatch/agent.go (XADD). The URL must
#       be rediss:// with an ACL username and a file-backed password, so the
#       plaintext `redis` service above cannot serve it — hence `runtime-redis`.
#     * Three mTLS listeners, not one: control gRPC :9443, output gRPC :9444,
#       content HTTPS :9445, each with its own cert/key/client-CA.
#     * An Ed25519 command-signing keypair whose public half must appear in the
#       verification keyring under ELITEA_RUNTIME_SIGNING_KEY_ID.
#     * Production auth. cmd/elitea-main/main.go:686-688 refuses to boot the
#       runtime without it, and it only exists in the ELITEA_AUTH_CONFIG_FILE
#       branch — see deploy/runtime/auth.form.yml for why that means a Form
#       provider nobody logs in through.
#     * ELITEA_CONFIGURATIONS_ENABLED=true: agent dispatch composes through
#       dependencies.CurrentConfigurations (runtimecomposition/composition.go:470),
#       which is nil unless configurations are enabled, and it fails a layer
#       deep rather than at a guard.
#     * The shared migration head applied BEFORE elitea-main starts
#       (composition.go CheckHead) — which is why db-init and elitea-migrate are
#       now compose services rather than steps inside `seed`.
#   All of it is provisioned by deploy/scripts/gen-runtime-certs.sh and installed
#   per-consumer by the runtime-material init service.
#
# ── The agent worker (issue #282) ────────────────────────────────────────────
#   elitea-worker is the NodeEvent producer — Go admits and projects executions
#   but has no agent-token producer of its own. Two things it needs are not
#   obvious:
#     * platform_origin must be an https origin (config.py:187 rejects anything
#       else) and elitea-main has no TLS listener for its /api/v2 + /llm surface,
#       so `platform-edge` terminates TLS for it with a runtime-CA certificate.
#     * the SDK verifies TLS through the OS trust store on import, which cannot
#       contain a locally minted CA — hence ELITEA_DISABLE_SYSTEM_CA plus
#       REQUESTS_CA_BUNDLE/SSL_CERT_FILE on the worker service.
#   The worker has NO env-var configuration: one JSON file, deploy/runtime/
#   worker-runtime.json, whose stream/group must match elitea-main's env below.
#
# ── The mock LLM (issue #283) ────────────────────────────────────────────────
#   `seed-llm` now defaults to an OFFLINE mock when no provider key is present,
#   so a model turn completes with no network and no billing. Two details are
#   load-bearing:
#     * the credential is seeded as type `vllm`, not `open_ai`. bifrost lifts
#       its SSRF guard only for the self-hosted classes (account.go:235), so a
#       private compose address must be one of them — an `open_ai` credential
#       pointing at llm-mock is refused by the dialer whatever the allowlist
#       says.
#     * the wire model carries the provider prefix, `vllm/E2E-MOCK-MODEL`.
#       bifrost resolves the provider from the model string alone, with an
#       EMPTY default (ParseModelString), so a bare name reaches core with no
#       provider and never gets as far as the credential.
#   With OPENAI_API_KEY (or ANTHROPIC_API_KEY) set, seed-llm behaves exactly as
#   before and the mock is not seeded — nothing can quietly answer a request the
#   operator meant to bill to a provider.
#
# ── What still does NOT work, and why ────────────────────────────────────────
#     * Toolkit-bearing agents fail regardless: the SDK resolves toolkits via
#       /api/v2/elitea_core/tools_list/{project_id}, which centry-hybrid routes
#       to PYLON — Go's equivalent is a different path and answers 501 by
#       design. Same for nested application references and the artifact toolkit.
#       A plain adhoc turn touches none of them.
#     * the web chat surface still emits chat_predict into a noop socket.io
#       client (apps/elitea-web/src/widgets/chat-box/ui/hooks/useChatBoxHandlers.ts:116)
#       instead of POSTing and subscribing to {events_url} — that port is #93.
#
# ── Ports ────────────────────────────────────────────────────────────────────
#   8084  traefik (entry point)     STANDALONE_PORT
#   8085  gateway, direct (debug)   STANDALONE_GATEWAY_PORT
#   15433 postgres                  STANDALONE_PG_PORT
#   16380 redis                     STANDALONE_REDIS_PORT
#   9400  oidc-provider-mock        FIXED — see the oidc-mock comment
#
#   The runtime plane is NOT published to the host. runtime-redis:6380 and
#   elitea-main:9443/9444/9445 are reachable only on the compose network, which
#   is where the worker (#282) runs. Publishing them would expose three mTLS
#   listeners and a command bus on the developer's LAN for no test benefit.
#
# NOTE: oidc-mock's published port must equal its container port, so it is
# pinned at 9400 and CANNOT be remapped. This stack therefore cannot run at the
# same time as docker-compose.e2e-standalone.yml. Bring one down first.
#
# ── Usage ────────────────────────────────────────────────────────────────────
#   deploy/scripts/standalone-stack.sh certs     # once — local mTLS material
#   deploy/scripts/standalone-stack.sh up
#   deploy/scripts/standalone-stack.sh seed
#   deploy/scripts/standalone-stack.sh seed-runtime   # workload session row
#   OPENAI_API_KEY=sk-... deploy/scripts/standalone-stack.sh seed-llm
#   deploy/scripts/standalone-stack.sh check
#   open http://localhost:8084/app/
#
# SKIP_MIGRATIONS is deliberately absent: no Go code reads it. Schema bootstrap
# used to be part of the seed step; it now runs as the db-init and
# elitea-migrate services below, because with the runtime enabled elitea-main
# checks the shared migration head at boot and would crash-loop until `seed`
# ran — an ordering that only works if the schema lands first.

name: elitea-standalone

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:18
    shm_size: '2g'
    environment:
      POSTGRES_USER: elitea
      POSTGRES_PASSWORD: elitea
      POSTGRES_DB: elitea
      # PGDATA is pinned, and the volume is mounted AT it rather than at the
      # parent /var/lib/postgresql. Mounting the parent leaves the image's own
      # contents visible under it, so the entrypoint reports "Database directory
      # appears to contain a database; Skipping initialization", never runs
      # initdb, and POSTGRES_USER/DB are silently never created — the first psql
      # then fails with `role "elitea" does not exist`. Measured on postgres:18,
      # whose default PGDATA (/var/lib/postgresql/18/docker) is nested deeper
      # than it was on older tags.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${STANDALONE_PG_PORT:-15433}:5432"
    volumes:
      - standalone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitea"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${STANDALONE_REDIS_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Runtime plane: material, TLS Redis, stream bootstrap (issue #281) ───────

  # Installs deploy/certs/runtime/ into three per-consumer named volumes with
  # the uid and mode each reader needs. See deploy/runtime/install-material.sh
  # for why a bind mount cannot do this job: securefile demands exactly 0600 on
  # private material, and under rootless podman a bind-mounted host file arrives
  # owned by container uid 0 — unreadable by elitea-main's nonroot uid.
  runtime-material:
    image: docker.io/library/alpine:3.20
    entrypoint: ["/bin/sh", "/opt/install-material.sh"]
    volumes:
      - ./runtime/install-material.sh:/opt/install-material.sh:ro
      - ./certs/runtime:/src:ro
      - standalone_runtime_main:/dst/main
      - standalone_runtime_redis:/dst/redis
      - standalone_runtime_worker:/dst/worker
      - standalone_runtime_edge:/dst/edge
    restart: "no"

  # The runtime dispatch bus. Separate from the plaintext `redis` above because
  # runtimecomposition/config.go accepts only rediss:// with an ACL username,
  # and dials at MinVersion TLS 1.3. Config: deploy/runtime/redis.conf.
  runtime-redis:
    image: redis:7-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./runtime/redis.conf:/etc/redis/redis.conf:ro
      - standalone_runtime_redis:/run/elitea-runtime:ro
    depends_on:
      runtime-material:
        condition: service_completed_successfully
    healthcheck:
      # `redis-cli ping` cannot work here: cleartext is off (`port 0`) and the
      # default user is disabled, so the probe must speak TLS and AUTH as a real
      # ACL user. A PONG therefore proves the cert, the ACL file and the TLS
      # listener are all good — which is exactly what dependents need to know.
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/elitea-runtime/runtime-ca.crt -h runtime-redis -p 6380 --user bootstrap --pass \"$$(cat /run/elitea-runtime/redis-bootstrap-password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Creates the dispatch streams and their consumer groups from 0-0. The worker's
  # ACL has no XGROUP on purpose, so this cannot be left to the consumer.
  runtime-bootstrap:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/opt/bootstrap-streams.sh"]
    environment:
      AGENT_STREAM: "commands.v1.agent.execute.agent.shared.1.0"
      AGENT_GROUP: "elitea-agent-worker-v1"
      CONFIGURATION_STREAM: "commands.v1.configuration.validate.v1.validation-small.shared-credential-free.1.0"
      CONFIGURATION_GROUP: "elitea-configuration-worker-v1"
    volumes:
      - ./runtime/bootstrap-streams.sh:/opt/bootstrap-streams.sh:ro
      - standalone_runtime_redis:/run/elitea-runtime:ro
    depends_on:
      runtime-redis:
        condition: service_healthy
    restart: "no"

  # ── Schema bootstrap ────────────────────────────────────────────────────────
  # Previously both steps lived inside `standalone-stack.sh seed`, which runs
  # AFTER the stack is up. With the runtime enabled elitea-main verifies the
  # shared migration head during composition, so a fresh volume made it
  # crash-loop until someone seeded it. Moving them here makes `up --wait`
  # meaningful on a fresh machine.
  db-init:
    image: postgres:18
    entrypoint: ["/bin/sh", "-c"]
    # 001_initial.sql creates the centry + p_1 schema from scratch and is not
    # idempotent, so it is skipped once its output exists. This mirrors what the
    # E2E seeder does with `|| true`, but reports a real failure on a fresh DB
    # instead of swallowing it.
    command:
      - |
        set -eu
        export PGPASSWORD=elitea
        # The worker's langgraph checkpointer opens its own DATABASE and calls
        # setup() to create its tables, so `agentstate` only has to exist. It is
        # a separate database, not a schema, because that is the connection
        # string shape the current indexer already uses (#282).
        if ! psql -h postgres -U elitea -d postgres -tAc \
             "SELECT 1 FROM pg_database WHERE datname = 'agentstate'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -h postgres -U elitea -d postgres -c "CREATE DATABASE agentstate"
        fi
        if psql -h postgres -U elitea -d elitea -tAc "SELECT to_regclass('centry.project')" | grep -q .; then
          echo "centry schema already present; skipping 001_initial.sql"
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 -h postgres -U elitea -d elitea -f /sql/001_initial.sql
    volumes:
      - ../services/elitea-main/internal/infra/db/migrations/001_initial.sql:/sql/001_initial.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  elitea-migrate:
    image: ghcr.io/eliteaai/elitea-main:standalone
    build:
      context: ..
      dockerfile: services/elitea-main/Containerfile
      target: e2e
    entrypoint: ["/elitea-migrate"]
    # -all-tenants, not bare: the shared history alone leaves every p_<id>
    # schema at whatever 001_initial.sql created, and the tenant history is
    # where the agent-execution chat tables live (#287). Without it an
    # authenticated turn fails on `relation "chat_messages_text" does not
    # exist` long before it reaches the worker.
    #
    # It enumerates projects from centry.project, so it is a no-op on a
    # database that has none yet and picks them up on the next `up`.
    command: ["-all-tenants"]
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  rustfs:
    image: docker.io/rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: elitea
      RUSTFS_SECRET_KEY: elitea-dev-secret
    volumes:
      - standalone_rustfs_data:/data
    healthcheck:
      # Neither this image nor its dependents ship curl — only wget — and wget's
      # exit code does not distinguish "reachable but 403" from "refused". Treat
      # a captured "server returned error" as reachable. Kept in sync with the
      # identical block in docker-compose.e2e-standalone.yml.
      test: ["CMD-SHELL", "out=$$(wget -q -O /dev/null http://127.0.0.1:9000/ 2>&1); [ $$? -eq 0 ] || echo \"$$out\" | grep -q 'server returned error'"]
      interval: 2s
      timeout: 3s
      retries: 15

  rustfs-bucket-init:
    image: docker.io/minio/mc:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set rustfs http://rustfs:9000 elitea elitea-dev-secret &&
        mc mb --ignore-existing rustfs/elitea-artifacts
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # ── OIDC mock ───────────────────────────────────────────────────────────────
  # The `oidc.localhost` alias makes the provider addressable by ONE URL from
  # BOTH sides, which the browser-driven login flow requires:
  #   * elitea-main resolves it through the compose network to this container;
  #   * the host browser resolves it to 127.0.0.1 (RFC 6761 maps every
  #     *.localhost name to loopback at the OS level), reaching the published
  #     port below.
  # The mock derives its issuer and every discovery endpoint from the request's
  # Host header, so whatever host elitea-main discovers it under is the host the
  # BROWSER is then redirected to. That is also why the published port must equal
  # the container port: a remapped host port would put a port in the issuer that
  # is not reachable inside the compose network.
  oidc-mock:
    image: ghcr.io/geigerzaehler/oidc-provider-mock:latest
    networks:
      default:
        aliases:
          - oidc.localhost
    ports:
      - "9400:9400"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/.well-known/openid-configuration')\""]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── Bifrost LLM gateway ─────────────────────────────────────────────────────
  # Standalone Go module (Go 1.26.4, GOWORK=off) embedding bifrost/core. Serves
  # both the OpenAI and Anthropic dialects under /llm.
  #
  # Dependencies are far lighter than the helm chart implies:
  #   NATS   — optional. Unset GATEWAY_NATS_URL disables budget enforcement with
  #            a startup warning. Enforcement needs a JetStream cluster; local
  #            functional testing does not.
  #   Redis  — not a dependency at all; the module does not import a redis client.
  #   Vault  — SECRETS_MASTER_KEY is optional as long as seeded credentials carry
  #            a literal api_key rather than a {{secret.NAME}} reference.
  #   PG     — pgxpool.New only parses the DSN, never dials, so an unreachable
  #            database degrades (empty /v1/models) rather than failing boot.
  # GATEWAY_IDENTITY_SECRET is the one hard requirement: startupIdentityCheck
  # exits 1 when it is empty and the credential Account is wired.
  elitea-llm-gateway:
    image: ghcr.io/eliteaai/elitea-llm-gateway:standalone
    # Build context is the module directory only — it must not inherit the root
    # go.work, which pins Go 1.25.8 for elitea-main/elitea-scheduler.
    build:
      context: ../services/elitea-llm-gateway
      dockerfile: Containerfile
    environment:
      GATEWAY_HTTP_ADDR: ":8083"
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      # MUST match elitea-main's value below: it keys the HMAC over the
      # X-Elitea-Project-Id / X-Elitea-User-Id / X-Elitea-Tenant-Id headers that
      # elitea-main signs and the gateway verifies.
      GATEWAY_IDENTITY_SECRET: "${GATEWAY_IDENTITY_SECRET:-standalone-dev-identity-secret}"
      # Serve TLS and require client certs. Presenting all three is what turns on
      # mutual auth; elitea-main's side is non-optional, so this is not a choice.
      GATEWAY_TLS_CERT_FILE: /run/certs/gateway-server.crt
      GATEWAY_TLS_KEY_FILE: /run/certs/gateway-server.key
      GATEWAY_TLS_CA_FILE: /run/certs/ca.crt
      # Egress policy (issue #283). Empty means "public destinations only" —
      # bifrost's SSRF-safe dialer refuses private addresses, which is what
      # stops a tenant-authored api_base steering the gateway into the cluster.
      # `llm-mock:8090` is named here because the mock is a compose-network
      # (private) address and would otherwise be refused by policy, not by
      # configuration — a connection error that reads like a broken service.
      #
      # Naming a host does TWO things (internal/config/config.go:174-192):
      # every tenant-authored api_base must now match an entry, AND
      # private-network dialing is enabled — but only for the self-hosted
      # provider classes (account.go:235 sets AllowPrivateNetwork for
      # schemas.VLLM and schemas.Ollama alone). That is why the mock is seeded
      # as a `vllm` credential: an `open_ai` one pointing here would still be
      # refused by the dialer, allowlist or not.
      #
      # Add your own entries to reach a provider on your LAN. Setting the
      # variable to the EMPTY string restores the default deny (and breaks only
      # the mock hop) — which is why the default uses `-` and not `:-`: the
      # `:-` form treats empty and unset alike, so an operator disarming the
      # allowlist would have silently got the mock allowlisted back, and a
      # negative test written against it would pass while proving nothing.
      GATEWAY_EGRESS_ALLOWLIST: "${GATEWAY_EGRESS_ALLOWLIST-llm-mock:8090}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
    volumes:
      - ./certs:/run/certs:ro
    ports:
      # Direct access for debugging with curl --cert/--key. Traffic that must
      # carry a project identity has to go through elitea-main, which is what
      # signs the identity headers.
      - "${STANDALONE_GATEWAY_PORT:-8085}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      # Not required at boot — the gateway dials an upstream per request — but
      # ordering it here means a `seed-llm` immediately after `up` cannot race a
      # mock that has not bound its port yet.
      llm-mock:
        condition: service_healthy
    # No healthcheck: the final image is distroless (no shell, no wget/curl) and
    # declares HEALTHCHECK NONE. Dependents use service_started — safe because
    # elitea-main does not dial the gateway at boot; it only loads its certs.
    restart: unless-stopped

  # ── Mock LLM upstream (issue #283) ──────────────────────────────────────────
  # Deterministic OpenAI-compatible server so E2E-MOCK-MODEL completes with no
  # provider key and no outbound network. Standard-library Python, built from
  # deploy/mock-llm; see that Containerfile for why nothing is pulled.
  #
  # It is seeded as a `vllm` credential (standalone-stack.sh seed-llm), not
  # `open_ai`: bifrost only lifts its SSRF guard for the self-hosted provider
  # classes, so a private-address upstream must be one of them. bifrost appends
  # /v1/chat/completions to the credential's api_base, which is therefore
  # http://llm-mock:8090 with no path.
  llm-mock:
    image: ghcr.io/eliteaai/elitea-mock-llm:standalone
    build:
      context: ./mock-llm
      dockerfile: Containerfile
    environment:
      MOCK_LLM_PORT: "8090"
      MOCK_LLM_MODEL: "E2E-MOCK-MODEL"
    healthcheck:
      # The image has no curl or wget — python is the only client available,
      # and it is guaranteed present because it is the runtime.
      test: ["CMD", "python3", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz').read()"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # ── Application services ────────────────────────────────────────────────────

  # OTEL collector (issue #250) — see deploy/otel-collector-config.yaml for
  # the debug/file-exporter scope-boundary rationale.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${STANDALONE_OTEL_GRPC_PORT:-14317}:4317" # OTLP gRPC
      - "${STANDALONE_OTEL_HTTP_PORT:-14318}:4318" # OTLP HTTP

  elitea-main:
    image: ghcr.io/eliteaai/elitea-main:standalone
    # `build:` present so compose builds the tag from this commit instead of
    # reaching for a registry tag that was never published (cf. issue #154).
    # Context is `..` because build contexts resolve relative to THIS file's
    # directory and the Containerfile expects the repo root.
    build:
      context: ..
      dockerfile: services/elitea-main/Containerfile
      # `e2e` builds the admin SPA from apps/elitea-web/src/entries/admin, so no
      # admin-ui submodule checkout is required.
      target: e2e
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      REDIS_URL: "redis:6379"
      SHADOW_ENABLED: "false"
      LEGACY_URL: ""
      ADMIN_UI_STATIC_DIR: "/data/admin_ui/static/dist"
      APPLICATION_SECRET_KEY: "changeme-standalone"
      OIDC_ISSUER_URL: "http://oidc.localhost:9400"
      OIDC_CLIENT_ID: "elitea-standalone-client"
      OIDC_CLIENT_SECRET: "elitea-standalone-secret"
      OIDC_REDIRECT_URI: "http://localhost:${STANDALONE_PORT:-8084}/forward-auth/auth_oidc/callback"
      COOKIE_SECURE: "false"
      # Object storage
      STORAGE_BACKEND: "s3"
      STORAGE_CONTAINER: "elitea-artifacts"
      S3_ENDPOINT_URL: "http://rustfs:9000"
      S3_ACCESS_KEY: "elitea"
      S3_SECRET_KEY: "elitea-dev-secret"
      S3_REGION: "us-east-1"
      S3_FORCE_PATH_STYLE: "true"
      # ── LLM gateway ────────────────────────────────────────────────────────
      # Setting LLM_GATEWAY_URL is what composes the proxy. It is all-or-nothing:
      # llmproxy.New always builds an mTLS transport, so the three cert vars are
      # mandatory once the URL is set — an empty path is a fatal boot error, not
      # a fallback to plaintext.
      LLM_GATEWAY_URL: "https://elitea-llm-gateway:8083"
      GATEWAY_IDENTITY_SECRET: "${GATEWAY_IDENTITY_SECRET:-standalone-dev-identity-secret}"
      LLM_GATEWAY_CLIENT_CERT: /run/certs/client.crt
      LLM_GATEWAY_CLIENT_KEY: /run/certs/client.key
      LLM_GATEWAY_CA_FILE: /run/certs/ca.crt
      # Tracing ingest (issue #250): elitea-main's own OTLP span export
      # (libs/go/observability) and internal/api/v2/tracing's otlp proxy
      # target both point at the collector above.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

      # ── Production auth (issue #281) ───────────────────────────────────────
      # Mandatory companion of ELITEA_RUNTIME_ENABLED: main.go:686-688 refuses
      # to boot the runtime without a PrincipalValidator and a
      # ForwardedIdentityVerifier, and both are assigned only in this branch.
      # The browser keeps logging in through oidc-mock — the general /api/v2
      # router still carries SessionSecret when formGraph is present
      # (main.go:933-944), so session cookies keep working. The runtime's own
      # routes deliberately do NOT accept cookies
      # (internal/api/production_runtime.go:31-37).
      ELITEA_AUTH_CONFIG_FILE: /etc/elitea/auth.form.yml

      # ── Current Configurations (issue #281) ────────────────────────────────
      # Agent dispatch composes through dependencies.CurrentConfigurations, nil
      # unless this is on. Mutation stays off: enabling it would demand the
      # LiteLLM lifecycle facade, which this stack replaced with Bifrost.
      ELITEA_CONFIGURATIONS_ENABLED: "true"
      # Matches VITE_PUBLIC_PROJECT_ID below and for the same reason: this id
      # designates the project whose configurations are treated as PUBLIC and
      # merged into every other project's option lookups. Pointing it at the
      # seeded working project (1) would make its own credentials show up twice.
      # 99 is an id no fixture creates, so the public set stays empty.
      ELITEA_AI_PROJECT_ID: "99"
      ELITEA_VAULT_MASTER_KEY_FILE: /run/elitea-runtime/vault-master-key

      # ── Runtime plane (issue #281) ─────────────────────────────────────────
      # All-or-nothing: runtimecomposition/config.go rejects a partial block,
      # and rejects settings for a dispatch plane that is not explicitly
      # enabled. Do not delete individual lines to "simplify" it.
      ELITEA_RUNTIME_ENABLED: "true"

      # Configuration-validation dispatch: the base plane, always required.
      ELITEA_RUNTIME_COMMAND_STREAM: "commands.v1.configuration.validate.v1.validation-small.shared-credential-free.1.0"
      ELITEA_RUNTIME_MAX_OUTSTANDING: "64"
      ELITEA_RUNTIME_STREAM_MAX_ENTRIES: "1024"

      # Agent-execution dispatch: the chat send path. The stream name must not
      # collide with the base plane's stream or its `:delivery-index.v1`
      # sibling — config.go:286-310 rejects overlap explicitly.
      ELITEA_RUNTIME_AGENT_EXECUTION_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_AGENT_EXECUTION_COMMAND_STREAM: "commands.v1.agent.execute.agent.shared.1.0"
      ELITEA_RUNTIME_AGENT_EXECUTION_CONSUMER_GROUP: "elitea-agent-worker-v1"
      ELITEA_RUNTIME_AGENT_EXECUTION_STREAM_MAX_ENTRIES: "1024"
      # Validated as an https origin, and used at request time for the
      # next-input-suggestion policy call elitea-main makes back to itself
      # (composition.go:483-492). elitea-main serves cleartext here, so that one
      # call fails; it degrades a suggestion, not the send path. It becomes real
      # when the stack terminates TLS in front of elitea-main.
      ELITEA_RUNTIME_CURRENT_MAIN_BASE_URL: "https://elitea-main:8080"

      # Index-ingest dispatch stays OFF: validateRuntimeComposition requires the
      # LiteLLM facade for it, and this stack has no LiteLLM. Setting any
      # ELITEA_RUNTIME_INDEX_INGEST_* here without the flag is a boot error.

      ELITEA_RUNTIME_REDIS_URL: "rediss://producer@runtime-redis:6380/0"
      ELITEA_RUNTIME_REDIS_PASSWORD_FILE: /run/elitea-runtime/redis-producer-password
      ELITEA_RUNTIME_REDIS_CA_FILE: /run/elitea-runtime/runtime-ca.crt
      ELITEA_RUNTIME_REDIS_POOL_SIZE: "8"

      # composition.go cross-checks this key id against the keyring entry and
      # refuses to start on a mismatch, so it must equal the id baked into
      # command-signing-keyring.json by gen-runtime-certs.sh.
      ELITEA_RUNTIME_SIGNING_KEY_ID: "standalone-runtime-v1"
      ELITEA_RUNTIME_SIGNING_KEY_FILE: /run/elitea-runtime/command-signing-key.pem
      ELITEA_RUNTIME_VERIFICATION_KEYRING_FILE: /run/elitea-runtime/command-signing-keyring.json

      # Three listeners, three certs. They must be distinct addresses; the
      # worker dials them as elitea-main:9443/9444/9445, which is why the certs
      # carry DNS:elitea-main.
      ELITEA_RUNTIME_CONTROL_ADDRESS: ":9443"
      ELITEA_RUNTIME_CONTROL_TLS_CERT_FILE: /run/elitea-runtime/control-server.crt
      ELITEA_RUNTIME_CONTROL_TLS_KEY_FILE: /run/elitea-runtime/control-server.key
      ELITEA_RUNTIME_CONTROL_TLS_CLIENT_CA_FILE: /run/elitea-runtime/runtime-ca.crt
      ELITEA_RUNTIME_OUTPUT_ADDRESS: ":9444"
      ELITEA_RUNTIME_OUTPUT_TLS_CERT_FILE: /run/elitea-runtime/output-server.crt
      ELITEA_RUNTIME_OUTPUT_TLS_KEY_FILE: /run/elitea-runtime/output-server.key
      ELITEA_RUNTIME_OUTPUT_TLS_CLIENT_CA_FILE: /run/elitea-runtime/runtime-ca.crt
      ELITEA_RUNTIME_CONTENT_ADDRESS: ":9445"
      ELITEA_RUNTIME_CONTENT_TLS_CERT_FILE: /run/elitea-runtime/content-server.crt
      ELITEA_RUNTIME_CONTENT_TLS_KEY_FILE: /run/elitea-runtime/content-server.key
      ELITEA_RUNTIME_CONTENT_TLS_CLIENT_CA_FILE: /run/elitea-runtime/runtime-ca.crt
    volumes:
      - ./certs:/run/certs:ro
      # Installed by runtime-material with per-file owner/mode; NOT a bind mount
      # of deploy/certs/runtime, which securefile would reject.
      - standalone_runtime_main:/run/elitea-runtime:ro
      # The auth config itself carries no secrets — only paths — and is read as
      # public material, so a plain read-only bind mount is correct here.
      - ./runtime/auth.form.yml:/etc/elitea/auth.form.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elitea-migrate:
        condition: service_completed_successfully
      runtime-redis:
        condition: service_healthy
      runtime-bootstrap:
        condition: service_completed_successfully
      oidc-mock:
        condition: service_healthy
      rustfs-bucket-init:
        condition: service_completed_successfully
      elitea-llm-gateway:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "/elitea-main", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  elitea-web:
    image: ghcr.io/eliteaai/elitea-web:standalone
    build:
      context: ..
      dockerfile: apps/elitea-web/Containerfile
    environment:
      VITE_SERVER_URL: "/api/v2"
      VITE_BASE_URI: "/app/"
      # Empty on purpose. There is no socket.io server in this stack — the Go
      # backend never implemented one (it was a legacy pylon passthrough), so the
      # app installs createNoopSocketClient. Pointing this anywhere would only
      # produce connection errors.
      VITE_SOCKET_SERVER: ""
      VITE_SOCKET_PATH: "/socket.io"
      # NOT "1". isPublicAgentsProject compares the selected project against this
      # value, and the seeded working project IS 1 — so setting both to 1 renders
      # the PUBLIC view on every agents/pipelines/skills page and makes the
      # private list unreachable. 99 is an id no fixture creates.
      VITE_PUBLIC_PROJECT_ID: "99"
    depends_on:
      elitea-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/app/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Agent execution worker (issue #282) ─────────────────────────────────────

  # TLS front for the worker's platform_origin. See deploy/runtime/
  # platform-edge.yml for why elitea-main cannot serve this itself and why this
  # is not the browser-facing `traefik` service below.
  platform-edge:
    image: traefik:v3.4
    command: ["--configfile=/etc/traefik/traefik.yml"]
    volumes:
      - ./runtime/platform-edge.yml:/etc/traefik/traefik.yml:ro
      - ./runtime/platform-edge-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - standalone_runtime_edge:/run/elitea-runtime:ro
    networks:
      default:
        aliases:
          # The certificate's only SAN, and the host in worker-runtime.json's
          # platform_origin. The compose service name already resolves, but the
          # alias is declared so renaming the service cannot silently break
          # hostname verification.
          - elitea-platform-edge
    depends_on:
      runtime-material:
        condition: service_completed_successfully
      elitea-main:
        condition: service_healthy
    restart: unless-stopped

  # The NodeEvent producer. Go admits and projects executions but has no
  # agent-token producer of its own, so without this service an admitted run
  # streams nothing and ends in a terminal failure.
  elitea-worker:
    image: ghcr.io/eliteaai/elitea-worker-python:standalone
    build:
      # Repo root, not services/elitea-worker-python: the Containerfile copies
      # libs/proto (:17) and testdata/proto/runtime/v1 (:79). It also git-clones
      # elitea-sdk at a pinned revision behind a SHA-256 archive gate, so a local
      # elitea-sdk checkout is irrelevant to the build and a hash mismatch is a
      # build failure rather than a warning.
      context: ..
      dockerfile: services/elitea-worker-python/Containerfile
    # The only supported command shape: one JSON config, no env-var settings.
    # Capabilities are compiled in, not selected here — the Go side decides which
    # it will accept (composition.go's capabilityVersions map).
    command: ["serve", "--config", "/run/elitea/runtime.json"]
    environment:
      # TLS trust for platform_origin. The SDK routes verification through the
      # OS trust store on import (elitea_sdk/_system_ca.py injects truststore),
      # which cannot contain a CA minted on this machine minutes ago. Disabling
      # that injection restores the standard mechanisms, and then the two
      # variables below cover both HTTP stacks the SDK uses: `requests` for the
      # /api/v2 calls (REQUESTS_CA_BUNDLE) and httpx/openai for the model call
      # (SSL_CERT_FILE, honoured by ssl.create_default_context).
      #
      # A runtime-CA-only bundle is correct AND tighter than adding public
      # roots: every destination the worker dials — control, output, content,
      # platform_origin — is signed by that CA, and model traffic egresses
      # through elitea-main's /llm proxy rather than directly to a provider.
      ELITEA_DISABLE_SYSTEM_CA: "1"
      REQUESTS_CA_BUNDLE: /run/elitea-runtime/runtime-ca.crt
      SSL_CERT_FILE: /run/elitea-runtime/runtime-ca.crt
      # The one environment variable the worker itself reads. Mirrors the
      # hybrid's fail-safe snapshot: broader than the current
      # `artifact.delete_file` rule so metadata drift cannot bypass approval.
      ELITEA_SENSITIVE_TOOLS: '{"*":["delete_file"]}'
    volumes:
      - ./runtime/worker-runtime.json:/run/elitea/runtime.json:ro
      - standalone_runtime_worker:/run/elitea-runtime:ro
      # 0700 and owned by uid 10001 — the worker contract requires a private
      # spool root. A fresh named volume starts 0755 owned by root, so it is
      # prepared by the init service rather than assumed.
      - standalone_worker_spool:/var/lib/elitea-worker/output-spool
    depends_on:
      runtime-material:
        condition: service_completed_successfully
      worker-spool-init:
        condition: service_completed_successfully
      runtime-redis:
        condition: service_healthy
      runtime-bootstrap:
        condition: service_completed_successfully
      elitea-main:
        condition: service_healthy
      platform-edge:
        condition: service_started
    restart: unless-stopped

  worker-spool-init:
    image: docker.io/library/alpine:3.20
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown 10001:10001 /spool && chmod 700 /spool
    volumes:
      - standalone_worker_spool:/spool
    restart: "no"

  # ── Traefik: routes /app → elitea-web, /api → elitea-main ──────────────────
  traefik:
    image: traefik:v3.4
    ports:
      - "${STANDALONE_PORT:-8084}:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.e2e.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      elitea-main:
        condition: service_healthy
      elitea-web:
        condition: service_healthy

volumes:
  standalone_pg_data:
  standalone_rustfs_data:
  # Runtime material, split per consumer so no service holds a key it does not
  # use. Populated by runtime-material from deploy/certs/runtime.
  standalone_runtime_main:
  standalone_runtime_redis:
  standalone_runtime_worker:
  standalone_runtime_edge:
  # The worker's output spool. Private (0700, uid 10001) — prepared by
  # worker-spool-init because a fresh named volume starts 0755 root-owned.
  standalone_worker_spool:
