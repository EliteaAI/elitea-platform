# DEVELOPMENT TOPOLOGY ONLY. Credentials, published cleartext ports, and the
# service environment below are not a production security contract.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elitea
      POSTGRES_PASSWORD: elitea
      POSTGRES_DB: elitea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitea"]
      interval: 5s
      timeout: 5s
      retries: 5

  elitea-main:
    build:
      context: ..
      dockerfile: services/elitea-main/Containerfile
      target: final
    image: eliteaai/elitea-main:dev
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      AUTH_DEV_MODE: "true"
      ELITEA_DEV_BOOTSTRAP_LEGACY_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/elitea-main", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
