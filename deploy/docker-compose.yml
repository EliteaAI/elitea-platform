services:
  traefik:
    image: traefik:v3.4
    ports:
      - "8080:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - elitea-main
      - elitea-ui

  postgres:
    image: postgres:18
    shm_size: '2g'
    environment:
      POSTGRES_USER: elitea
      POSTGRES_PASSWORD: elitea
      POSTGRES_DB: elitea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitea"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible local object store (see docs/plans/storage-migration-plan.md
  # S4/S17). Not yet wired into elitea-main's environment — the factory that
  # reads STORAGE_BACKEND/S3_* and constructs an ObjectStore lands in S5, and
  # the routes that use it in S11. This service and its bucket only need to
  # exist ahead of that so `task up` has a working store to point at once
  # they do.
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: elitea
      RUSTFS_SECRET_KEY: elitea-dev-secret
    volumes:
      - rustfs_data:/data
    healthcheck:
      # Neither this image nor its dependents below ship curl — only wget —
      # and wget's exit code doesn't distinguish "reachable but responded
      # 4xx" (403 here, unauthenticated root) from "connection refused."
      # Treat a captured "server returned error" message as reachable.
      test: ["CMD-SHELL", "out=$$(wget -q -O /dev/null http://127.0.0.1:9000/ 2>&1); [ $$? -eq 0 ] || echo \"$$out\" | grep -q 'server returned error'"]
      interval: 2s
      timeout: 3s
      retries: 15

  rustfs-bucket-init:
    image: docker.io/minio/mc:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set rustfs http://rustfs:9000 elitea elitea-dev-secret &&
        mc mb --ignore-existing rustfs/elitea-artifacts
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  model-cache-init:
    profiles: ["full"]
    build:
      context: ../docker/model-cache-init
      dockerfile: Dockerfile
    volumes:
      - pylon_cache:/cache
      - ../docker/model-cache-init/manifest.json:/config/manifest.json:ro
    environment:
      CACHE_DIR: /cache
      MANIFEST_PATH: /config/manifest.json
      MAX_RETRIES: "3"
      AWS_DEFAULT_REGION: eu-north-1

  elitea-main:
    build:
      context: ..
      dockerfile: services/elitea-main/Containerfile
      target: final
    image: ghcr.io/eliteaai/elitea-main:dev
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      REDIS_URL: "redis:6379"
      SHADOW_ENABLED: "false"
      LEGACY_URL: ""
      ADMIN_UI_STATIC_DIR: "/data/admin_ui/static/dist"
      APPLICATION_SECRET_KEY: "changeme"
      SKIP_MIGRATIONS: "1"
      OIDC_ISSUER_URL: "https://oidc-mock.technicaldomain.xyz"
      OIDC_CLIENT_ID: "39818061-ddc6-40f2-89c3-18ba59b28ce9"
      OIDC_CLIENT_SECRET: "8dutMbJP9M8yuoucx31OSg"
      OIDC_REDIRECT_URI: "http://localhost:8080/forward-auth/auth_oidc/callback"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/elitea-main", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  elitea-ui:
    build:
      context: ..
      dockerfile: deploy/docker/Containerfile.elitea-ui
    image: ghcr.io/eliteaai/elitea-ui:dev
    environment:
      VITE_SERVER_URL: "/api/v2"
      VITE_BASE_URI: "/app/"
      VITE_SOCKET_SERVER: ""
      VITE_SOCKET_PATH: "/socket.io"
      VITE_PUBLIC_PROJECT_ID: "1"
      DEV: ""
    depends_on:
      - elitea-main

  pylon-indexer:
    build:
      context: ../services/pylon-indexer
      dockerfile: Containerfile
      args:
        PYLON_VERSION: "1.2.25"
    image: ghcr.io/eliteaai/pylon-indexer:dev
    environment:
      NAME: pylon-indexer
      NAME_PREFIX: elitea
      ELITEA_RELEASE: main
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: elitea
      POSTGRES_PASSWORD: elitea
      POSTGRES_DB: elitea
      INDEXER_HMAC_KEY: ""
      EVENT_HMAC_KEY: ""
      RPC_HMAC_KEY: ""
      LITELLM_MASTER_KEY: sk-elitea-litellm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - pylon_cache:/data/cache

  elitea-scheduler:
    build:
      context: ../services/elitea-scheduler
      dockerfile: Containerfile
    image: ghcr.io/eliteaai/elitea-scheduler:dev
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      REDIS_URL: "redis:6379"
      RPC_CHANNEL: "elitea_rpc"
      RPC_HMAC_KEY: ""
      HTTP_ADDR: ":8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No container healthcheck: the image is distroless (no shell/wget/curl) and the
    # binary has no -healthcheck flag. Liveness is via /healthz on :8081 — use a k8s
    # httpGet probe in production (see deploy/helm).
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pylon_cache:
  rustfs_data:
