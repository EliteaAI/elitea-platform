# DEVELOPMENT TOPOLOGY ONLY. The reviewed Go router is health-only; the broad
# path rules remain prototype wiring and must not be treated as cutover routes.
http:
  routers:
    api:
      rule: "PathPrefix(`/api/`) || PathPrefix(`/forward-auth/`) || Path(`/auth`) || PathPrefix(`/socket.io/`) || Path(`/healthz`) || PathPrefix(`/artifacts/`) || PathPrefix(`/admin/app`)"
      service: elitea-main
      entryPoints:
        - web
      middlewares:
        - strip-client-identity
    # The MCP SERVER (issue 252) shares the /app prefix with the SPA but is
    # served by elitea-main: pylon serves it from the app blueprint, and the
    # internal-toolkit URLs already written into projects hardcode
    # `.../app/{project_id}/mcp/...`, so the path is not ours to move. Without
    # this router the `app` rule below swallows it and an MCP client gets the
    # SPA's nginx 405.
    #
    # Explicit priority because traefik ranks by rule length and PathPrefix(`/app`)
    # would otherwise be able to win.
    #
    # This CARVES A HOLE in the SPA's own namespace: `/app/<numeric>/<rest>` is
    # its project-switch deep link (apps/elitea-web/src/routes/$projectId.$.tsx),
    # so a first segment of exactly `mcp` no longer reaches the app. Nothing
    # collides today (`mcps`, `mcp-auth-callback`), and
    # apps/elitea-web/src/routes/__tests__/mcpPathReservation.test.ts fails if a
    # route ever claims it — narrow this rule before deleting that test.
    mcp:
      rule: "PathRegexp(`^/app/[0-9]+/mcp(/.*)?$`)"
      priority: 100
      service: elitea-main
      entryPoints:
        - web
      middlewares:
        - strip-client-identity
    app:
      rule: "PathPrefix(`/app`)"
      service: elitea-ui
      entryPoints:
        - web
    root-redirect:
      rule: "Path(`/`)"
      service: elitea-ui
      entryPoints:
        - web
      middlewares:
        - redirect-to-app
      priority: 1

  middlewares:
    # INGRESS-ONLY header removal, and an authentication control rather than
    # hygiene (#326).
    #
    # elitea-main accepts X-Auth-Type/X-Auth-Id as a finished identity when the
    # request arrives from a trusted proxy CIDR
    # (internal/api/middleware/auth.go tryTrustedProxyHeaders +
    # isFromTrustedProxy), and deploy/runtime/auth.form.yml trusts the whole
    # compose network. This edge IS on that network, so without this middleware
    # any browser client picks its own identity by sending the header, on every
    # route that does not carry the #302 membership gate.
    #
    # Direction matters and is easy to get backwards: `customRequestHeaders`
    # rewrites the REQUEST on its way in, so an empty value deletes what the
    # CLIENT sent. It cannot delete what an authenticating edge later ADDS —
    # forwardAuth's authResponseHeaders are applied after middlewares, which is
    # why deploy/runtime/platform-edge-dynamic.yml can strip these same names
    # and still project a verified identity. This edge runs no forwardAuth at
    # all: elitea-main authenticates the session cookie itself, so nothing here
    # is ever a legitimate client input.
    #
    # Names must be enumerated — traefik has no prefix wildcard. This is every
    # X-Auth-*/X-Elitea-* name elitea-main or the LLM gateway reads as identity.
    # The X-Elitea-* set is the elitea-main → gateway projection and never a
    # browser input; it is listed so a future route through this edge cannot
    # inherit a client-chosen project/tenant. Deliberately NOT listed:
    # X-Elitea-Claim-Id / -Fence / -Source-* , which belong to the runtime
    # content server's own mTLS listener (:9445) and never traverse this edge.
    strip-client-identity:
      headers:
        customRequestHeaders:
          X-Auth-Type: ""
          X-Auth-ID: ""
          X-Auth-User-ID: ""
          X-Auth-Reference: ""
          X-Auth-Avatar: ""
          X-Auth-Avatar-State: ""
          X-Auth-Session-Id: ""
          X-Auth-Session-Name: ""
          X-Auth-Session-Endpoint: ""
          X-Elitea-Identity-Signature: ""
          X-Elitea-Project-Id: ""
          X-Elitea-User-Id: ""
          X-Elitea-Tenant-Id: ""

    redirect-to-app:
      redirectRegex:
        regex: "^(https?://[^/]*)/$"
        replacement: "${1}/app/"
        permanent: false

  services:
    elitea-main:
      loadBalancer:
        servers:
          - url: "http://elitea-main:8080"
    elitea-ui:
      loadBalancer:
        servers:
          - url: "http://elitea-ui:80"
