version: "3"

vars:
  SERVICE: services/elitea-main
  PY_SERVICE: services/pylon-indexer
  WORKER_SERVICE: services/elitea-worker-python

tasks:
  # ── Go ────────────────────────────────────────────────────────────────────────
  build:
    desc: Build elitea-main, migration, cutover, and Auth validation binaries
    dir: "{{.SERVICE}}"
    cmds:
      - go build -o bin/elitea-main ./cmd/elitea-main
      - go build -o bin/elitea-migrate ./cmd/elitea-migrate
      - go build -o bin/cutover-ctl ./cmd/cutover-ctl
      - go build -o bin/elitea-auth-validate ./cmd/elitea-auth-validate

  test:
    desc: Run all Go tests across the workspace
    cmds:
      - go test -race -count=1 ./services/...
      - go test -race -count=1 ./libs/...

  lint:
    desc: Run golangci-lint on Go code
    dir: "{{.SERVICE}}"
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet across the workspace
    cmds:
      - go vet ./services/...
      - go vet ./libs/...

  run:
    desc: Run elitea-main locally
    dir: "{{.SERVICE}}"
    cmds:
      - go run ./cmd/elitea-main

  sqlc:
    desc: Regenerate sqlc query bindings
    dir: "{{.SERVICE}}"
    cmds:
      - sqlc generate

  # ── Runtime contracts ───────────────────────────────────────────────────────────
  contract:generate:
    desc: Regenerate pinned Go and Python runtime protocol bindings
    cmds:
      - scripts/contract/generate_proto.sh

  contract:check:
    desc: Validate protocol sources and checked-in runtime-v1 vectors
    cmds:
      - buf format --diff --exit-code libs/proto
      - buf lint libs/proto
      - buf build libs/proto
      - python scripts/contract/generate_configuration_validation_fixtures.py --check
      - python scripts/contract/check_configuration_validation_contract.py
      - python3 scripts/database/check_legacy_catalog_contract.py
      - python3 scripts/security/check_auth_baseline_catalog.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_main_auth_http_baseline.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/export_main_auth_http_baseline.py --auth-root ../centry/pylon_main/plugins/auth --auth-core-root ../centry/pylon_auth/plugins/auth_core --shared-api-root ../centry/pylon_main/plugins/shared --projects-root ../centry/pylon_main/plugins/projects --pylon-root ../pylon --main-auth-config ../centry/pylon_main/configs/auth.yml --check
      - python3 scripts/security/check_main_auth_http_baseline.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_browser_auth_http_baseline.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/export_browser_auth_http_baseline.py --auth-core-root ../centry/pylon_auth/plugins/auth_core --auth-form-root ../centry/pylon_auth/plugins/auth_form --auth-idp-rpc-root ../centry/pylon_auth/plugins/auth_idp_rpc --auth-init-root ../centry/pylon_auth/plugins/auth_init --auth-mappers-root ../centry/pylon_auth/plugins/auth_mappers --main-auth-root ../centry/pylon_main/plugins/auth --admin-ui-root ../centry/pylon_main/plugins/admin_ui --centry-root ../centry --pylon-root ../pylon --ui-root ../EliteaUI --check
      - python3 scripts/security/check_browser_auth_http_baseline.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/check_form_snapshot_bridge.py --auth-form-root ../centry/pylon_auth/plugins/auth_form
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_federated_auth_baseline.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/export_federated_auth_baseline.py --check
      - python3 scripts/security/check_federated_auth_baseline.py
      - python3 scripts/security/check_legacy_rbac_drift.py

  baseline:auth:refresh:
    desc: Refresh deterministic current-baseline pylon_auth source and tracked runtime evidence
    vars:
      AUTH_BASELINE_PLUGINS_ROOT: '{{.AUTH_BASELINE_PLUGINS_ROOT | default "../centry/pylon_auth/plugins"}}'
    preconditions:
      - sh: test -d "{{.AUTH_BASELINE_PLUGINS_ROOT}}"
        msg: Set AUTH_BASELINE_PLUGINS_ROOT to the current pylon_auth/plugins directory
    cmds:
      - python3 scripts/security/export_auth_baseline_catalog.py --plugins-root "{{.AUTH_BASELINE_PLUGINS_ROOT}}" --output testdata/baseline/auth-static-catalog.json

  baseline:auth:check:
    desc: Compare sibling pylon_auth sources and validate the checked-in snapshot
    vars:
      AUTH_BASELINE_PLUGINS_ROOT: '{{.AUTH_BASELINE_PLUGINS_ROOT | default "../centry/pylon_auth/plugins"}}'
    preconditions:
      - sh: test -d "{{.AUTH_BASELINE_PLUGINS_ROOT}}"
        msg: Set AUTH_BASELINE_PLUGINS_ROOT to the current pylon_auth/plugins directory
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_export_auth_baseline_catalog.py
      - python3 scripts/security/export_auth_baseline_catalog.py --plugins-root "{{.AUTH_BASELINE_PLUGINS_ROOT}}" --output testdata/baseline/auth-static-catalog.json --check
      - python3 scripts/security/check_auth_baseline_catalog.py

  baseline:main-auth-http:refresh:
    desc: Refresh bounded current-baseline pylon_main Auth HTTP evidence
    vars:
      MAIN_AUTH_ROOT: '{{.MAIN_AUTH_ROOT | default "../centry/pylon_main/plugins/auth"}}'
      AUTH_CORE_ROOT: '{{.AUTH_CORE_ROOT | default "../centry/pylon_auth/plugins/auth_core"}}'
      SHARED_API_ROOT: '{{.SHARED_API_ROOT | default "../centry/pylon_main/plugins/shared"}}'
      PROJECTS_ROOT: '{{.PROJECTS_ROOT | default "../centry/pylon_main/plugins/projects"}}'
      PYLON_ROOT: '{{.PYLON_ROOT | default "../pylon"}}'
      MAIN_AUTH_CONFIG: '{{.MAIN_AUTH_CONFIG | default "../centry/pylon_main/configs/auth.yml"}}'
    preconditions:
      - sh: test -d "{{.MAIN_AUTH_ROOT}}"
        msg: Set MAIN_AUTH_ROOT to the current pylon_main Auth plugin directory
      - sh: test -d "{{.AUTH_CORE_ROOT}}"
        msg: Set AUTH_CORE_ROOT to the current pylon_auth Auth Core plugin directory
      - sh: test -f "{{.SHARED_API_ROOT}}/tools/api_tools.py"
        msg: Set SHARED_API_ROOT to the current pylon_main shared plugin directory
      - sh: test -f "{{.PROJECTS_ROOT}}/rpc/poc.py"
        msg: Set PROJECTS_ROOT to the current pylon_main projects plugin directory
      - sh: test -f "{{.PYLON_ROOT}}/pylon/core/tools/module/descriptor.py"
        msg: Set PYLON_ROOT to the current Pylon source directory
      - sh: test -f "{{.MAIN_AUTH_CONFIG}}"
        msg: Set MAIN_AUTH_CONFIG to the current pylon_main Auth runtime config
    cmds:
      - python3 scripts/security/export_main_auth_http_baseline.py --auth-root "{{.MAIN_AUTH_ROOT}}" --auth-core-root "{{.AUTH_CORE_ROOT}}" --shared-api-root "{{.SHARED_API_ROOT}}" --projects-root "{{.PROJECTS_ROOT}}" --pylon-root "{{.PYLON_ROOT}}" --main-auth-config "{{.MAIN_AUTH_CONFIG}}"

  baseline:main-auth-http:check:
    desc: Compare bounded pylon_main Auth HTTP sources and validate reviewed evidence
    vars:
      MAIN_AUTH_ROOT: '{{.MAIN_AUTH_ROOT | default "../centry/pylon_main/plugins/auth"}}'
      AUTH_CORE_ROOT: '{{.AUTH_CORE_ROOT | default "../centry/pylon_auth/plugins/auth_core"}}'
      SHARED_API_ROOT: '{{.SHARED_API_ROOT | default "../centry/pylon_main/plugins/shared"}}'
      PROJECTS_ROOT: '{{.PROJECTS_ROOT | default "../centry/pylon_main/plugins/projects"}}'
      PYLON_ROOT: '{{.PYLON_ROOT | default "../pylon"}}'
      MAIN_AUTH_CONFIG: '{{.MAIN_AUTH_CONFIG | default "../centry/pylon_main/configs/auth.yml"}}'
    preconditions:
      - sh: test -d "{{.MAIN_AUTH_ROOT}}"
        msg: Set MAIN_AUTH_ROOT to the current pylon_main Auth plugin directory
      - sh: test -d "{{.AUTH_CORE_ROOT}}"
        msg: Set AUTH_CORE_ROOT to the current pylon_auth Auth Core plugin directory
      - sh: test -f "{{.SHARED_API_ROOT}}/tools/api_tools.py"
        msg: Set SHARED_API_ROOT to the current pylon_main shared plugin directory
      - sh: test -f "{{.PROJECTS_ROOT}}/rpc/poc.py"
        msg: Set PROJECTS_ROOT to the current pylon_main projects plugin directory
      - sh: test -f "{{.PYLON_ROOT}}/pylon/core/tools/module/descriptor.py"
        msg: Set PYLON_ROOT to the current Pylon source directory
      - sh: test -f "{{.MAIN_AUTH_CONFIG}}"
        msg: Set MAIN_AUTH_CONFIG to the current pylon_main Auth runtime config
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_main_auth_http_baseline.py
      - python3 scripts/security/export_main_auth_http_baseline.py --auth-root "{{.MAIN_AUTH_ROOT}}" --auth-core-root "{{.AUTH_CORE_ROOT}}" --shared-api-root "{{.SHARED_API_ROOT}}" --projects-root "{{.PROJECTS_ROOT}}" --pylon-root "{{.PYLON_ROOT}}" --main-auth-config "{{.MAIN_AUTH_CONFIG}}" --check
      - python3 scripts/security/check_main_auth_http_baseline.py

  baseline:browser-auth-http:refresh:
    desc: Refresh bounded current-baseline browser and Form Auth HTTP evidence
    vars:
      AUTH_CORE_ROOT: '{{.AUTH_CORE_ROOT | default "../centry/pylon_auth/plugins/auth_core"}}'
      AUTH_FORM_ROOT: '{{.AUTH_FORM_ROOT | default "../centry/pylon_auth/plugins/auth_form"}}'
      AUTH_IDP_RPC_ROOT: '{{.AUTH_IDP_RPC_ROOT | default "../centry/pylon_auth/plugins/auth_idp_rpc"}}'
      AUTH_INIT_ROOT: '{{.AUTH_INIT_ROOT | default "../centry/pylon_auth/plugins/auth_init"}}'
      AUTH_MAPPERS_ROOT: '{{.AUTH_MAPPERS_ROOT | default "../centry/pylon_auth/plugins/auth_mappers"}}'
      MAIN_AUTH_ROOT: '{{.MAIN_AUTH_ROOT | default "../centry/pylon_main/plugins/auth"}}'
      ADMIN_UI_ROOT: '{{.ADMIN_UI_ROOT | default "../centry/pylon_main/plugins/admin_ui"}}'
      CENTRY_ROOT: '{{.CENTRY_ROOT | default "../centry"}}'
      PYLON_ROOT: '{{.PYLON_ROOT | default "../pylon"}}'
      UI_ROOT: '{{.UI_ROOT | default "../EliteaUI"}}'
    preconditions:
      - sh: test -f "{{.AUTH_CORE_ROOT}}/routes/auth.py"
        msg: Set AUTH_CORE_ROOT to the current Auth Core plugin directory
      - sh: test -f "{{.AUTH_FORM_ROOT}}/routes/form.py"
        msg: Set AUTH_FORM_ROOT to the current Form Auth plugin directory
      - sh: test -f "{{.AUTH_IDP_RPC_ROOT}}/rpc/authorize.py"
        msg: Set AUTH_IDP_RPC_ROOT to the current Auth IdP RPC plugin directory
      - sh: test -f "{{.AUTH_INIT_ROOT}}/rpc/processor.py"
        msg: Set AUTH_INIT_ROOT to the current Auth Init plugin directory
      - sh: test -f "{{.AUTH_MAPPERS_ROOT}}/rpc/noop.py"
        msg: Set AUTH_MAPPERS_ROOT to the current Auth Mappers plugin directory
      - sh: test -f "{{.MAIN_AUTH_ROOT}}/module.py"
        msg: Set MAIN_AUTH_ROOT to the current pylon_main Auth plugin directory
      - sh: test -f "{{.ADMIN_UI_ROOT}}/frontend/src/components/Layout/Sidebar.jsx"
        msg: Set ADMIN_UI_ROOT to the current pylon_main Admin UI plugin directory
      - sh: test -f "{{.CENTRY_ROOT}}/pylon_auth/pylon.yml"
        msg: Set CENTRY_ROOT to the current Centry repository
      - sh: test -f "{{.PYLON_ROOT}}/pylon/core/tools/session.py"
        msg: Set PYLON_ROOT to the current Pylon source directory
      - sh: test -f "{{.UI_ROOT}}/src/api/eliteaApi.js"
        msg: Set UI_ROOT to the current EliteaUI repository
    cmds:
      - python3 scripts/security/export_browser_auth_http_baseline.py --auth-core-root "{{.AUTH_CORE_ROOT}}" --auth-form-root "{{.AUTH_FORM_ROOT}}" --auth-idp-rpc-root "{{.AUTH_IDP_RPC_ROOT}}" --auth-init-root "{{.AUTH_INIT_ROOT}}" --auth-mappers-root "{{.AUTH_MAPPERS_ROOT}}" --main-auth-root "{{.MAIN_AUTH_ROOT}}" --admin-ui-root "{{.ADMIN_UI_ROOT}}" --centry-root "{{.CENTRY_ROOT}}" --pylon-root "{{.PYLON_ROOT}}" --ui-root "{{.UI_ROOT}}"

  baseline:browser-auth-http:check:
    desc: Compare browser/Form Auth sources and validate reviewed evidence
    vars:
      AUTH_CORE_ROOT: '{{.AUTH_CORE_ROOT | default "../centry/pylon_auth/plugins/auth_core"}}'
      AUTH_FORM_ROOT: '{{.AUTH_FORM_ROOT | default "../centry/pylon_auth/plugins/auth_form"}}'
      AUTH_IDP_RPC_ROOT: '{{.AUTH_IDP_RPC_ROOT | default "../centry/pylon_auth/plugins/auth_idp_rpc"}}'
      AUTH_INIT_ROOT: '{{.AUTH_INIT_ROOT | default "../centry/pylon_auth/plugins/auth_init"}}'
      AUTH_MAPPERS_ROOT: '{{.AUTH_MAPPERS_ROOT | default "../centry/pylon_auth/plugins/auth_mappers"}}'
      MAIN_AUTH_ROOT: '{{.MAIN_AUTH_ROOT | default "../centry/pylon_main/plugins/auth"}}'
      ADMIN_UI_ROOT: '{{.ADMIN_UI_ROOT | default "../centry/pylon_main/plugins/admin_ui"}}'
      CENTRY_ROOT: '{{.CENTRY_ROOT | default "../centry"}}'
      PYLON_ROOT: '{{.PYLON_ROOT | default "../pylon"}}'
      UI_ROOT: '{{.UI_ROOT | default "../EliteaUI"}}'
    preconditions:
      - sh: test -f "{{.AUTH_CORE_ROOT}}/routes/auth.py"
        msg: Set AUTH_CORE_ROOT to the current Auth Core plugin directory
      - sh: test -f "{{.AUTH_FORM_ROOT}}/routes/form.py"
        msg: Set AUTH_FORM_ROOT to the current Form Auth plugin directory
      - sh: test -f "{{.AUTH_IDP_RPC_ROOT}}/rpc/authorize.py"
        msg: Set AUTH_IDP_RPC_ROOT to the current Auth IdP RPC plugin directory
      - sh: test -f "{{.AUTH_INIT_ROOT}}/rpc/processor.py"
        msg: Set AUTH_INIT_ROOT to the current Auth Init plugin directory
      - sh: test -f "{{.AUTH_MAPPERS_ROOT}}/rpc/noop.py"
        msg: Set AUTH_MAPPERS_ROOT to the current Auth Mappers plugin directory
      - sh: test -f "{{.MAIN_AUTH_ROOT}}/module.py"
        msg: Set MAIN_AUTH_ROOT to the current pylon_main Auth plugin directory
      - sh: test -f "{{.ADMIN_UI_ROOT}}/frontend/src/components/Layout/Sidebar.jsx"
        msg: Set ADMIN_UI_ROOT to the current pylon_main Admin UI plugin directory
      - sh: test -f "{{.CENTRY_ROOT}}/pylon_auth/pylon.yml"
        msg: Set CENTRY_ROOT to the current Centry repository
      - sh: test -f "{{.PYLON_ROOT}}/pylon/core/tools/session.py"
        msg: Set PYLON_ROOT to the current Pylon source directory
      - sh: test -f "{{.UI_ROOT}}/src/api/eliteaApi.js"
        msg: Set UI_ROOT to the current EliteaUI repository
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/test_browser_auth_http_baseline.py
      - python3 scripts/security/export_browser_auth_http_baseline.py --auth-core-root "{{.AUTH_CORE_ROOT}}" --auth-form-root "{{.AUTH_FORM_ROOT}}" --auth-idp-rpc-root "{{.AUTH_IDP_RPC_ROOT}}" --auth-init-root "{{.AUTH_INIT_ROOT}}" --auth-mappers-root "{{.AUTH_MAPPERS_ROOT}}" --main-auth-root "{{.MAIN_AUTH_ROOT}}" --admin-ui-root "{{.ADMIN_UI_ROOT}}" --centry-root "{{.CENTRY_ROOT}}" --pylon-root "{{.PYLON_ROOT}}" --ui-root "{{.UI_ROOT}}" --check
      - python3 scripts/security/check_browser_auth_http_baseline.py
      - PYTHONDONTWRITEBYTECODE=1 python3 scripts/security/check_form_snapshot_bridge.py --auth-form-root "{{.AUTH_FORM_ROOT}}"

  baseline:browser-auth-http:trusted-gate:
    desc: Required trusted multi-repository browser Auth merge and release gate
    cmds:
      - task: baseline:browser-auth-http:check

  legacy:rbac:refresh:
    desc: Refresh deterministic legacy route/permission evidence from the Centry checkout
    vars:
      LEGACY_PLUGINS_ROOT: '{{.LEGACY_PLUGINS_ROOT | default "../centry/pylon_main/plugins"}}'
    preconditions:
      - sh: test -d "{{.LEGACY_PLUGINS_ROOT}}"
        msg: Set LEGACY_PLUGINS_ROOT to the legacy pylon_main/plugins directory
    cmds:
      - python3 scripts/security/export_legacy_rbac_catalog.py --plugins-root "{{.LEGACY_PLUGINS_ROOT}}" --output testdata/legacy/legacy-rbac-static-catalog.json

  legacy:database:evidence:check:
    desc: Verify checked-in live PostgreSQL evidence still matches coded legacy assumptions
    cmds:
      - python3 scripts/database/check_legacy_catalog_contract.py

  legacy:rbac:check:
    desc: Verify checked-in pylon_main route/permission evidence is current
    vars:
      LEGACY_PLUGINS_ROOT: '{{.LEGACY_PLUGINS_ROOT | default "../centry/pylon_main/plugins"}}'
    preconditions:
      - sh: test -d "{{.LEGACY_PLUGINS_ROOT}}"
        msg: Set LEGACY_PLUGINS_ROOT to the legacy pylon_main/plugins directory
    cmds:
      - python3 scripts/security/export_legacy_rbac_catalog.py --plugins-root "{{.LEGACY_PLUGINS_ROOT}}" --output testdata/legacy/legacy-rbac-static-catalog.json --check
      - python3 scripts/security/check_legacy_rbac_drift.py

  worker:test:
    desc: Run the standalone Python worker unit and conformance tests
    cmds:
      - python -m pytest "{{.WORKER_SERVICE}}/tests"

  worker:conformance:
    desc: Execute the Python worker against the checked-in runtime-v1 byte corpus
    cmds:
      - elitea-worker conformance --suite runtime-v1

  # ── UI ────────────────────────────────────────────────────────────────────────
  ui:build:
    desc: Build EliteaUI SPA
    cmds:
      - cd apps/elitea-ui && npm ci && npm run build

  ui:lint:
    desc: Lint EliteaUI
    cmds:
      - cd apps/elitea-ui && npm run lint

  # ── Pylon Indexer ─────────────────────────────────────────────────────────────
  pylon:validate:
    desc: Validate pylon-indexer YAML configs
    dir: "{{.PY_SERVICE}}"
    cmds:
      - python -c "import yaml, pathlib; [yaml.safe_load(f.read_text()) for f in pathlib.Path('.').rglob('*.yml')]"

  # ── Local Environment ─────────────────────────────────────────────────────────
  up:
    desc: Start full local environment (postgres, redis, all services)
    cmds:
      - git submodule update --init --recursive
      - podman compose -f deploy/docker-compose.yml up --build

  up:detach:
    desc: Start local environment in background
    cmds:
      - git submodule update --init --recursive
      - podman compose -f deploy/docker-compose.yml up --build -d

  up:full:
    desc: Start with model cache pre-download (requires S3 access)
    cmds:
      - git submodule update --init --recursive
      - podman compose -f deploy/docker-compose.yml --profile full up --build

  down:
    desc: Stop local environment
    cmds:
      - podman compose -f deploy/docker-compose.yml down

  down:clean:
    desc: Stop local environment and remove volumes
    cmds:
      - podman compose -f deploy/docker-compose.yml down -v

  logs:
    desc: Tail logs from all services
    cmds:
      - podman compose -f deploy/docker-compose.yml logs -f --tail=50

  # ── Container Images ──────────────────────────────────────────────────────────
  images:
    desc: Build all container images
    cmds:
      - task: images:go
      - task: images:ui
      - task: images:pylon
      - task: images:worker

  images:go:
    desc: Build Go service image
    cmds:
      - podman build -t ghcr.io/eliteaai/elitea-main:dev -f services/elitea-main/Containerfile .

  images:ui:
    desc: Build UI image
    cmds:
      - podman build -t ghcr.io/eliteaai/elitea-ui:dev -f deploy/docker/Containerfile.elitea-ui .

  images:pylon:
    desc: Build pylon-indexer image
    cmds:
      - podman build -t ghcr.io/eliteaai/pylon-indexer:dev -f services/pylon-indexer/Containerfile services/pylon-indexer

  images:worker:
    desc: Build the standalone Python runtime worker image
    cmds:
      - podman build -t ghcr.io/eliteaai/elitea-worker-python:dev -f services/elitea-worker-python/Containerfile .

  # ── Helm ──────────────────────────────────────────────────────────────────────
  helm:lint:
    desc: Lint all Helm charts
    cmds:
      - |
        for chart in deploy/helm/*/Chart.yaml; do
          helm lint "$(dirname "$chart")"
        done

  # ── All ───────────────────────────────────────────────────────────────────────
  all:
    desc: Run all checks (contracts + Go + Python + UI + Pylon + Helm)
    cmds:
      - task: contract:check
      - task: vet
      - task: lint
      - task: test
      - task: worker:test
      - task: worker:conformance
      - task: pylon:validate
      - task: helm:lint
