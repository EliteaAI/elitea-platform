syntax = "proto3";

package elitea.auth.v1;

option go_package = "elitea/auth/v1;authv1";

import "elitea/auth/v1/session.proto";

// AuthService provides token authorization and validation for internal
// Go-to-Go service-mesh calls. It is not exposed to the SPA.
service AuthService {
  // Authorize checks whether the bearer token (or session cookie) grants
  // access to the requested resource and returns a resolved AuthContext.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

  // ValidateToken verifies token signature and expiry without full RBAC
  // evaluation. Used by middleware for lightweight pre-checks.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // Health returns the liveness status of the auth service.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// AuthorizeRequest carries the raw credential (JWT bearer, PAT, or session
// reference) and the action + resource being requested.
message AuthorizeRequest {
  // Raw token value extracted from the Authorization header or cookie.
  string token = 1;

  // auth_type indicates the credential kind: "jwt", "pat", "session".
  string auth_type = 2;

  // project_id scopes the authorization decision to a specific tenant project.
  string project_id = 3;

  // resource is the target resource path, e.g. "/api/v2/applications/123".
  string resource = 4;

  // action is the HTTP method or permission verb, e.g. "GET", "create".
  string action = 5;
}

message AuthorizeResponse {
  // allowed is true when the credential has the required permission.
  bool allowed = 1;

  // context contains the resolved identity and role set when allowed=true.
  AuthContext context = 2;

  // denial_reason is a human-readable explanation when allowed=false.
  string denial_reason = 3;
}

// ValidateTokenRequest carries only the raw token.
message ValidateTokenRequest {
  string token = 1;
  string auth_type = 2;
}

message ValidateTokenResponse {
  bool valid = 1;

  // user_id extracted from a valid token.
  string user_id = 2;

  // expires_at is a Unix timestamp (seconds since epoch).
  int64 expires_at = 3;

  string denial_reason = 4;
}

message HealthRequest {}

message HealthResponse {
  // status is "ok" when the service is healthy.
  string status = 1;
}
