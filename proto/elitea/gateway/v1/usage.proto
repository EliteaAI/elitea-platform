syntax = "proto3";

package elitea.gateway.v1;

option go_package = "elitea/gateway/v1;gatewayv1";

// GatewayUsageRecord captures per-request LLM token consumption for
// analytics and billing. Written by elitea-gateway-python after each
// completed ChatCompletions call.
message GatewayUsageRecord {
  // record_id is a server-assigned UUID for this usage record.
  string record_id = 1;

  // request_id correlates back to the ChatCompletionsRequest.request_id.
  string request_id = 2;

  // project_id is the tenant that incurred this usage.
  string project_id = 3;

  // user_id is the platform user who triggered the request.
  string user_id = 4;

  // model is the model that served the request (post-routing, post-fallback).
  string model = 5;

  // provider is the upstream LLM provider.
  string provider = 6;

  // prompt_tokens consumed by the input messages.
  int32 prompt_tokens = 7;

  // completion_tokens generated by the model.
  int32 completion_tokens = 8;

  // total_tokens is prompt_tokens + completion_tokens.
  int32 total_tokens = 9;

  // latency_ms is the end-to-end request duration in milliseconds.
  int64 latency_ms = 10;

  // recorded_at is a Unix timestamp (seconds) when the record was written.
  int64 recorded_at = 11;

  // StatusCode classifies the request outcome.
  enum StatusCode {
    STATUS_CODE_UNSPECIFIED = 0;
    STATUS_CODE_OK = 1;
    STATUS_CODE_RATE_LIMITED = 2;
    STATUS_CODE_PROVIDER_ERROR = 3;
    STATUS_CODE_CONTEXT_LENGTH_EXCEEDED = 4;
    STATUS_CODE_CANCELLED = 5;
  }

  StatusCode status_code = 12;

  // application_id links the usage to the originating agent (if available).
  string application_id = 13;
}

// UsageLogRequest is a batch write of GatewayUsageRecords. The gateway
// buffers records in memory and flushes them periodically to elitea-main
// via this message (or directly to the database in future waves).
message UsageLogRequest {
  repeated GatewayUsageRecord records = 1;
}

// UsageLogResponse confirms how many records were accepted.
message UsageLogResponse {
  int32 accepted = 1;
}
