syntax = "proto3";

package elitea.core.v1;

option go_package = "elitea/core/v1;corev1";

// PredictRequest is the input for a single agent prediction (non-streaming
// submission path). Used by IndexerService.SubmitAgentTask.
message PredictRequest {
  // application_id identifies the agent or pipeline to run.
  string application_id = 1;

  // project_id is the tenant project owning this application.
  string project_id = 2;

  // conversation_id ties this prediction to a conversation thread.
  string conversation_id = 3;

  // message_id is the unique identifier of the triggering user message.
  string message_id = 4;

  // input is the raw user message text.
  string input = 5;

  // stream_id is an optional caller-assigned identifier used to correlate
  // server-streaming chunks back to this request.
  string stream_id = 6;

  // variables are named substitution values injected into prompt templates.
  map<string, string> variables = 7;

  // auth_context carries the forwarded user identity from the calling service.
  bytes auth_context_json = 8;
}

// StreamChunk is a single token-level or event-level chunk emitted during
// server-streaming execution of an agent task.
message StreamChunk {
  // stream_id matches the PredictRequest.stream_id.
  string stream_id = 1;

  // ChunkType classifies the kind of content in this chunk.
  enum ChunkType {
    CHUNK_TYPE_UNSPECIFIED = 0;
    CHUNK_TYPE_TOKEN = 1;       // Partial LLM output token
    CHUNK_TYPE_TOOL_CALL = 2;   // Tool invocation event
    CHUNK_TYPE_TOOL_RESULT = 3; // Tool result event
    CHUNK_TYPE_FINAL = 4;       // Final assembled message
    CHUNK_TYPE_ERROR = 5;       // Error event (terminal)
    CHUNK_TYPE_CHILD_MESSAGE = 6; // Sub-agent message (swarm)
  }

  ChunkType chunk_type = 2;

  // content holds the raw text for TOKEN and FINAL chunks.
  string content = 3;

  // metadata_json is an optional JSON blob for structured events (tool calls,
  // errors, child messages).
  string metadata_json = 4;

  // sequence_number is a monotonically increasing counter per stream_id.
  int64 sequence_number = 5;
}

// PredictTask represents the durable state of a submitted prediction task.
// Returned by GetTaskStatus and embedded in task events.
message PredictTask {
  // task_id is the server-assigned unique identifier for this task.
  string task_id = 1;

  // TaskStatus enumerates the lifecycle states of a prediction task.
  enum TaskStatus {
    TASK_STATUS_UNSPECIFIED = 0;
    TASK_STATUS_QUEUED = 1;
    TASK_STATUS_RUNNING = 2;
    TASK_STATUS_COMPLETED = 3;
    TASK_STATUS_FAILED = 4;
    TASK_STATUS_CANCELLED = 5;
  }

  TaskStatus status = 2;

  // application_id from the originating PredictRequest.
  string application_id = 3;

  // project_id from the originating PredictRequest.
  string project_id = 4;

  // created_at is a Unix timestamp (seconds) when the task was submitted.
  int64 created_at = 5;

  // updated_at is a Unix timestamp of the last status change.
  int64 updated_at = 6;

  // error_message is populated when status=FAILED.
  string error_message = 7;
}
