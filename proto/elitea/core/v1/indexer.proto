syntax = "proto3";

package elitea.core.v1;

import "elitea/core/v1/predict.proto";

option go_package = "elitea/core/v1;corev1";

// IndexerService is the gRPC interface exposed by elitea-indexer (Python).
// elitea-main (Go) is the primary caller.
//
// Agent task flow:
//   1. SubmitAgentTask  → returns task_id immediately (unary)
//   2. StreamAgentTask  → opens a server-streaming connection to receive
//                         StreamChunk events until CHUNK_TYPE_FINAL or error
//
// Index task flow:
//   1. SubmitIndexTask  → returns task_id immediately (unary)
//   2. StreamIndexTask  → streams IndexTaskEvent progress events
service IndexerService {
  // SubmitAgentTask enqueues an LLM agent execution request.
  // Returns a task_id that the caller uses to open a StreamAgentTask stream.
  rpc SubmitAgentTask(SubmitAgentTaskRequest) returns (SubmitTaskResponse);

  // SubmitIndexTask enqueues a vectorstore indexing job.
  // Returns a task_id that the caller uses to open a StreamIndexTask stream.
  rpc SubmitIndexTask(SubmitIndexTaskRequest) returns (SubmitTaskResponse);

  // StreamAgentTask opens a server-streaming connection.
  // The server emits AgentTaskEvent messages until the task completes or fails.
  rpc StreamAgentTask(StreamTaskRequest) returns (stream AgentTaskEvent);

  // StreamIndexTask opens a server-streaming connection.
  // The server emits IndexTaskEvent messages until indexing completes or fails.
  rpc StreamIndexTask(StreamTaskRequest) returns (stream IndexTaskEvent);

  // CancelTask requests cancellation of a running or queued task.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // GetTaskStatus returns the current lifecycle state of a task.
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
}

// SubmitAgentTaskRequest wraps a PredictRequest with additional task metadata.
message SubmitAgentTaskRequest {
  // predict contains the agent execution parameters.
  PredictRequest predict = 1;

  // priority is an optional scheduling hint (0 = default, higher = sooner).
  int32 priority = 2;
}

// SubmitIndexTaskRequest carries the vectorstore indexing parameters.
message SubmitIndexTaskRequest {
  // datasource_id identifies the data source to index.
  string datasource_id = 1;

  // project_id is the tenant project owning this datasource.
  string project_id = 2;

  // collection_id is the target vectorstore collection.
  string collection_id = 3;

  // IndexMode controls whether to do a full reindex or an incremental update.
  enum IndexMode {
    INDEX_MODE_UNSPECIFIED = 0;
    INDEX_MODE_FULL = 1;
    INDEX_MODE_INCREMENTAL = 2;
  }

  IndexMode mode = 4;

  // config_json carries serialized datasource configuration overrides.
  string config_json = 5;
}

// SubmitTaskResponse is returned by both SubmitAgentTask and SubmitIndexTask.
message SubmitTaskResponse {
  // task_id is the server-assigned identifier used to open a streaming
  // connection or check task status.
  string task_id = 1;

  // queued_at is a Unix timestamp (seconds) when the task entered the queue.
  int64 queued_at = 2;
}

// StreamTaskRequest is used for both StreamAgentTask and StreamIndexTask.
message StreamTaskRequest {
  // task_id from a prior SubmitAgentTask or SubmitIndexTask response.
  string task_id = 1;

  // resume_from_sequence allows a reconnecting client to request chunks
  // starting after a specific sequence_number (best-effort replay).
  int64 resume_from_sequence = 2;
}

// AgentTaskEvent is a single streaming event emitted during agent execution.
message AgentTaskEvent {
  // chunk carries the token/tool/error payload.
  StreamChunk chunk = 1;

  // task is the current task state, populated in the final event.
  PredictTask task = 2;
}

// IndexTaskEvent is emitted during a vectorstore indexing operation.
message IndexTaskEvent {
  // task_id matches the SubmitIndexTask response.
  string task_id = 1;

  // IndexEventType classifies the kind of event.
  enum IndexEventType {
    INDEX_EVENT_TYPE_UNSPECIFIED = 0;
    INDEX_EVENT_TYPE_PROGRESS = 1;
    INDEX_EVENT_TYPE_COMPLETED = 2;
    INDEX_EVENT_TYPE_FAILED = 3;
  }

  IndexEventType event_type = 2;

  // documents_indexed is the running total of indexed documents.
  int64 documents_indexed = 3;

  // documents_total is the estimated total (may be 0 if unknown).
  int64 documents_total = 4;

  // error_message is set when event_type=FAILED.
  string error_message = 5;
}

// CancelTaskRequest requests graceful cancellation of a task.
message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  // accepted is true when the cancellation was acknowledged.
  bool accepted = 1;

  // message provides context (e.g., "already completed").
  string message = 2;
}

message GetTaskStatusRequest {
  string task_id = 1;
}

message GetTaskStatusResponse {
  // task contains the full current state.
  PredictTask task = 1;
}
