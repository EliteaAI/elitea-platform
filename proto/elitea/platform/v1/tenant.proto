syntax = "proto3";

package elitea.platform.v1;

option go_package = "elitea/platform/v1;platformv1";

// TenantContext carries the multi-tenant routing information needed by any
// service that reads from or writes to a project-scoped PostgreSQL schema.
// It is propagated as gRPC metadata on internal calls.
message TenantContext {
  // project_id identifies the tenant project.
  ProjectID project_id = 1;

  // schema_name is the PostgreSQL schema for this tenant's data.
  SchemaName schema_name = 2;

  // organization_id is the parent organization if applicable.
  string organization_id = 3;
}

// ProjectID is a strongly-typed wrapper for project identifiers.
// Using a wrapper message prevents accidental mixing with other string IDs.
message ProjectID {
  // value is the UUID of the project (e.g., "a1b2c3d4-...").
  string value = 1;
}

// SchemaName is a strongly-typed wrapper for the PostgreSQL schema name
// associated with a tenant project (e.g., "alita_ws_a1b2c3d4").
// Schema names are derived deterministically from the project UUID.
message SchemaName {
  // value is the PostgreSQL-safe schema identifier.
  string value = 1;
}
