syntax = "proto3";

package elitea.platform.v1;

option go_package = "elitea/platform/v1;platformv1";

// PaginationRequest is a standard cursor/offset pagination input embedded in
// list RPCs across all services.
message PaginationRequest {
  // page_size is the maximum number of results to return.
  // Servers may enforce a lower cap (e.g., 100).
  int32 page_size = 1;

  // page_token is an opaque continuation token from a prior response.
  // Omit or leave empty for the first page.
  string page_token = 2;

  // offset is an alternative integer offset (used when page_token is absent).
  int64 offset = 3;
}

// PaginatedResponse wraps a paginated list of serialized items.
// Embed this in service-specific list response messages.
message PaginatedResponse {
  // next_page_token is the continuation token for the next page.
  // Empty string means this is the last page.
  string next_page_token = 1;

  // total_count is the total number of matching items across all pages.
  // May be -1 when an exact count is prohibitively expensive.
  int64 total_count = 2;

  // page is the 1-based page number of this result set.
  int32 page = 3;

  // page_size echoes the effective page size used by the server.
  int32 page_size = 4;
}
