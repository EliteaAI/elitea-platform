syntax = "proto3";

package elitea.platform.v1;

option go_package = "elitea/platform/v1;platformv1";

// ErrorResponse is a structured error payload returned in gRPC trailers or
// embedded in response messages when a service-level error occurs.
// gRPC status codes are set on the RPC level; this message carries the
// machine-readable detail.
message ErrorResponse {
  // code is a snake_case error identifier (e.g., "not_found",
  // "permission_denied", "validation_error").
  string code = 1;

  // message is a human-readable description of the error.
  string message = 2;

  // request_id echoes the x-request-id for trace correlation.
  string request_id = 3;

  // details holds structured sub-errors (e.g., per-field validation errors).
  repeated ValidationError details = 4;

  // http_status is an advisory HTTP status code for REST compatibility layers.
  int32 http_status = 5;
}

// ValidationError describes a single field-level validation failure.
// A list of ValidationErrors is embedded in ErrorResponse.details when
// code="validation_error".
message ValidationError {
  // field is the dot-separated path to the invalid field (e.g., "request.model").
  string field = 1;

  // message describes why the value is invalid.
  string message = 2;

  // rejected_value is the string representation of the value that failed
  // validation (may be omitted for security-sensitive fields).
  string rejected_value = 3;
}
