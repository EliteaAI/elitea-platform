name: CI — Go

on:
  pull_request:
    paths:
      - "services/elitea-main/**"
      - "services/elitea-worker-python/**"
      - "libs/go/**"
      - "libs/proto/**"
      - "libs/proto/gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-main/**"
      - "services/elitea-worker-python/**"
      - "libs/go/**"
      - "libs/proto/**"
      - "libs/proto/gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlc:
    name: Reproduce SQLC queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: "1.31.1"
      - name: Generate and vet type-safe SQL
        working-directory: services/elitea-main
        run: |
          sqlc generate
          sqlc vet
          git diff --exit-code -- internal/db/sqlcgen

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: services/elitea-main

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum

      - name: Go vet (workspace)
        run: |
          go vet ./services/...
          go vet ./libs/...

      - name: Run tests (workspace)
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./services/... ./libs/...
          python3 -m unittest discover \
            -s services/elitea-main/tests/reliability/index_5681 \
            -p 'test_*.py' -v

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  redis-integration:
    name: Real Redis control-plane integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/proto/gen/go/go.sum

      - name: Exercise the reference-only Redis Streams adapter
        env:
          ELITEA_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/transport/redisdispatch
          -run '^(TestRedisStreamServiceBackedControlPlane|TestRedisStreamServiceBackedIndexV2CutoverState)$'

  postgres-integration:
    name: Real PostgreSQL runtime integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/proto/gen/go/go.sum

      - name: Exercise migrations, cancellation, outbox, and current Activity durability
        env:
          ELITEA_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/infra/db/repos
          -run '^(TestPostgresServiceBacked|TestSharedMigration0051|TestPostgresCurrentIndexActivity)'

      - name: Exercise prompt-context current-baseline RBAC and tenant reads
        env:
          ELITEA_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
          ELITEA_REQUIRE_PROMPT_CONTEXT_POSTGRES_TEST: "true"
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/api/v2/promptcontextreads
          -run '^TestCurrentPromptContextReadsPostgresHTTPRBACAndTenantIsolation$'

      - name: Exercise current-baseline central role-name permission fallback
        env:
          ELITEA_LEGACY_RBAC_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
          ELITEA_REQUIRE_LEGACY_RBAC_POSTGRES_TEST: "true"
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/infra/legacyrbac
          -run '^TestPostgresResolverLegacyCompatibility$'

  pgvector-index-meta-integration:
    name: PgVector and pinned SDK index-meta integration
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/proto/gen/go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/elitea-worker-python/Containerfile

      - name: Install the worker-pinned SDK indexing runtime
        run: >-
          python -m pip install
          'elitea-sdk[runtime] @
          git+https://github.com/EliteaAI/elitea-sdk.git@48c51a16634a9924f6c5d5313c3bacedb0b5b56b'

      - name: Exercise Main-to-SDK index history and durable initialization convergence
        env:
          ELITEA_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
          ELITEA_TEST_SDK_PYTHON: python
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/infra/pgvector
          ./services/elitea-main/internal/infra/db/repos
          -run '^(TestCurrentIndexMetaWriterRealPgvector|TestPostgresPgvectorIndexMetaInitializationConvergence)$'

  confluence-indexing-current-characterization:
    name: Pinned current Confluence indexing characterization
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/elitea-worker-python/pyproject.toml
            services/elitea-worker-python/elitea-sdk.lock.json

      - name: Install current binary indexing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            git \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            tesseract-ocr

      - name: Check out the exact worker-locked SDK source
        env:
          SDK_REVISION: 48c51a16634a9924f6c5d5313c3bacedb0b5b56b
          SDK_ARCHIVE_SHA256: 85e8b2396dc86ea8e7d2098a41e12b228fa1995a0be8ff0143af6d3df49b6d61
        run: |
          test "$(python -c 'import json; print(json.load(open("services/elitea-worker-python/elitea-sdk.lock.json"))["source"]["revision"])')" = "${SDK_REVISION}"
          test "$(python -c 'import json; print(json.load(open("services/elitea-worker-python/elitea-sdk.lock.json"))["source"]["git_archive_sha256"])')" = "${SDK_ARCHIVE_SHA256}"
          git clone --filter=blob:none --no-checkout \
            https://github.com/EliteaAI/elitea-sdk.git \
            /tmp/elitea-sdk-current
          git -C /tmp/elitea-sdk-current checkout --detach "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current rev-parse HEAD)" = "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" = "${SDK_ARCHIVE_SHA256}"

      - name: Install the pinned current indexing runtime
        run: |
          python -m pip install \
            "elitea-sdk @ file:///tmp/elitea-sdk-current" \
            ./libs/proto \
            "./services/elitea-worker-python[indexing-current,test]"
          python -m pip check

      - name: Verify current binary-media prerequisites
        run: |
          command -v pdfinfo
          command -v pdftoppm
          command -v tesseract
          python -c "import pytesseract"

      - name: Initialize the disposable PgVector database
        env:
          DATABASE_URL: postgresql://elitea:elitea@127.0.0.1:5432/elitea
        run: |
          python -c "import os, psycopg; connection = psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); connection.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.close()"

      - name: Freeze current Confluence indexing behavior
        env:
          ELITEA_CURRENT_SDK_ROOT: /tmp/elitea-sdk-current
          ELITEA_REQUIRE_INDEX_BINARIES: "1"
          ELITEA_CONFLUENCE_PARITY_PGVECTOR_URL: postgresql+psycopg://elitea:elitea@127.0.0.1:5432/elitea
        run: >-
          python -m pytest -q -rs
          services/elitea-main/tests/parity/confluence_indexing

  postgres-auth-integration:
    name: PostgreSQL 18 current-baseline Auth integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: services/elitea-main/go.sum

      - name: Exercise current-baseline PAT, runtime identity, and provisioning persistence
        env:
          ELITEA_AUTH_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/api/v2/auth
          ./services/elitea-main/internal/infra/authsvc
          ./services/elitea-main/internal/infra/identityrepo
          -run '^TestPostgres(TokenRepositoryLifecycle|IndexRuntimeCurrentIdentityPATSelection|IdentityProvisioning(CurrentBaseline|Rollback))$'

  index-embedding-cutover:
    name: Index binding, RBAC, and coordinated-cutover integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/proto/gen/go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/elitea-worker-python/pyproject.toml
            services/elitea-worker-python/elitea-sdk.lock.json

      - name: Check out the exact worker-locked SDK source
        env:
          SDK_REVISION: 48c51a16634a9924f6c5d5313c3bacedb0b5b56b
          SDK_ARCHIVE_SHA256: 85e8b2396dc86ea8e7d2098a41e12b228fa1995a0be8ff0143af6d3df49b6d61
        run: |
          test "$(python -c 'import json; print(json.load(open("services/elitea-worker-python/elitea-sdk.lock.json"))["source"]["revision"])')" = "${SDK_REVISION}"
          test "$(python -c 'import json; print(json.load(open("services/elitea-worker-python/elitea-sdk.lock.json"))["source"]["git_archive_sha256"])')" = "${SDK_ARCHIVE_SHA256}"
          git clone --filter=blob:none --no-checkout \
            https://github.com/EliteaAI/elitea-sdk.git \
            /tmp/elitea-sdk-current
          git -C /tmp/elitea-sdk-current checkout --detach "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current rev-parse HEAD)" = "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" = "${SDK_ARCHIVE_SHA256}"

      - name: Install the pinned Go-to-Python gate runtime
        run: |
          python -m pip install \
            "elitea-sdk @ file:///tmp/elitea-sdk-current" \
            ./libs/proto \
            "./services/elitea-worker-python[test]"
          python -m pip check

      - name: Exercise real PostgreSQL, authenticated LiteLLM, and project RBAC
        env:
          ELITEA_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
        run: |
          go test -race -count=1 \
            ./services/elitea-main/internal/infra/db/repos \
            -run '^(TestCurrentEmbeddingBindingResolvesFromTenantPostgresAndLiteLLM|TestPostgresServiceBackedCurrentModelCatalogBoundsBeforeJSONProjection|TestPostgresServiceBackedIndexV2CutoverRejectsPersistedV1UntilTerminalReconciliation)$'
          go test -race -count=1 \
            ./services/elitea-main/internal/runtimecomposition \
            -run '^TestIndexRoutesPostgresRBACAndTenantMatrix$'

      - name: Exercise signed Go-to-Python capability-version gate
        env:
          ELITEA_INDEX_BINDING_CROSS_PROCESS_TEST: "1"
          ELITEA_SYSTEM_PYTHON: python
          ELITEA_SYSTEM_SDK_PATH: /tmp/elitea-sdk-current
        run: >-
          go test -race -count=1
          ./services/elitea-main/tests/system
          -run '^TestIndexEmbeddingBindingMainWorkerCrossProcess$'

  build:
    name: Build
    # CI compiles each binary and executes the final production image. The
    # release-tagged multi-arch images are still built by publish.yml.
    runs-on: ubuntu-latest
    needs: [sqlc, lint, test, redis-integration, postgres-integration, pgvector-index-meta-integration, confluence-indexing-current-characterization, postgres-auth-integration, index-embedding-cutover]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: services/elitea-main/go.sum

      - name: Build elitea-main
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/elitea-main ./cmd/elitea-main
          echo "Build OK: $(/tmp/elitea-main --version 2>&1 || true)"

      - name: Build cutover-ctl
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/cutover-ctl ./cmd/cutover-ctl

      - name: Build elitea-migrate
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/elitea-migrate ./cmd/elitea-migrate

      - name: Build elitea-auth-validate
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/elitea-auth-validate ./cmd/elitea-auth-validate

      - name: Build index-v2-preflight
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/index-v2-preflight ./cmd/index-v2-preflight

      - name: Verify packaged index-v2-preflight fails closed
        run: |
          docker build \
            --file services/elitea-main/Containerfile \
            --tag elitea-main-ci:index-v2-preflight \
            .
          usage_status=0
          docker run --rm \
            --entrypoint /index-v2-preflight \
            elitea-main-ci:index-v2-preflight || usage_status=$?
          test "${usage_status}" -eq 2
          blocked_status=0
          docker run --rm \
            --entrypoint /index-v2-preflight \
            elitea-main-ci:index-v2-preflight \
            --spool-root /not-mounted || blocked_status=$?
          test "${blocked_status}" -eq 1
