name: CI — Go

on:
  pull_request:
    paths:
      - "services/elitea-main/**"
      - "libs/go/**"
      - "libs/proto/gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-main/**"
      - "libs/go/**"
      - "libs/proto/gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: services/elitea-main

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum

      - name: Go vet (workspace)
        run: |
          go vet ./services/...
          go vet ./libs/...

      - name: Run tests (workspace)
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./services/... ./libs/...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  redis-integration:
    name: Real Redis control-plane integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/proto/gen/go/go.sum

      - name: Exercise the reference-only Redis Streams adapter
        env:
          ELITEA_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/transport/redisdispatch
          -run '^TestRedisStreamServiceBackedControlPlane$'

  postgres-integration:
    name: Real PostgreSQL runtime integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/proto/gen/go/go.sum

      - name: Exercise cancellation durability and outbox reconciliation
        env:
          ELITEA_TEST_DATABASE_URL: postgres://elitea:elitea@127.0.0.1:5432/elitea?sslmode=disable
        run: >-
          go test -race -count=1
          ./services/elitea-main/internal/infra/db/repos
          -run '^TestPostgresServiceBacked'

  build:
    name: Build
    # CI validation only — confirms the binaries compile cleanly on every PR/push.
    # Production images are built via Containerfile in publish.yml, not here.
    runs-on: ubuntu-latest
    needs: [lint, test, redis-integration, postgres-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: services/elitea-main/go.sum

      - name: Build elitea-main
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/elitea-main ./cmd/elitea-main
          echo "Build OK: $(/tmp/elitea-main --version 2>&1 || true)"

      - name: Build cutover-ctl
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/cutover-ctl ./cmd/cutover-ctl

      - name: Build elitea-migrate
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/elitea-migrate ./cmd/elitea-migrate
