name: CI — Go

on:
  pull_request:
    paths:
      - "services/elitea-main/**"
      - "libs/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-main/**"
      - "libs/go/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Vet / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/authlib/go.mod
            libs/go/eventslib/go.mod
            libs/go/rpclib/go.mod
            libs/go/observability/go.mod

      - name: Go vet
        run: |
          go vet ./services/elitea-main/...

      - name: Run tests
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./services/elitea-main/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Build binary
        run: |
          cd services/elitea-main
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/elitea-main ./cmd/elitea-main
          echo "Build OK: $(/tmp/elitea-main --version 2>&1 || true)"
