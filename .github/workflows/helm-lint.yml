name: CI — Helm

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-lint.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/helm/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint charts
        run: |
          for chart in deploy/helm/*/Chart.yaml; do
            dir=$(dirname "$chart")
            echo "Linting $dir..."
            helm lint "$dir"
          done

      - name: Template dry-run (elitea-main)
        run: |
          helm template test-release deploy/helm/elitea-main/ \
            -f deploy/helm/elitea-main/values-staging.yaml \
            --debug > /dev/null
