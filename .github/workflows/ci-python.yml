name: CI — Python

on:
  pull_request:
    paths:
      - "services/pylon-indexer/**"
      - "services/elitea-worker-python/**"
      - "libs/proto/gen/python/**"
      - "libs/proto/pyproject.toml"
      - "testdata/proto/runtime/v1/**"
      - ".github/workflows/ci-python.yml"
  push:
    branches:
      - main
    paths:
      - "services/pylon-indexer/**"
      - "services/elitea-worker-python/**"
      - "libs/proto/gen/python/**"
      - "libs/proto/pyproject.toml"
      - "testdata/proto/runtime/v1/**"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pylon-indexer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validators
        run: pip install pyyaml yamllint

      - name: YAML lint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            pylon.yml configs/

      - name: Validate YAML structure
        run: |
          python -c "
          import yaml, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.yml'):
              try:
                  yaml.safe_load(f.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All YAML configs valid.')
          "

      - name: Verify Containerfile
        run: |
          grep -q "FROM ghcr.io/eliteaai/pylon" Containerfile
          echo "Containerfile base image OK."

  runtime-worker:
    name: Runtime worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/proto/pyproject.toml
            services/elitea-worker-python/pyproject.toml

      - name: Install the pinned worker and protocol packages
        run: python -m pip install -e ./libs/proto -e './services/elitea-worker-python[test]'

      - name: Unit and byte-conformance tests
        run: |
          python -m pytest services/elitea-worker-python/tests
          elitea-worker conformance --suite runtime-v1

      - name: Compile Python sources
        run: python -m compileall -q services/elitea-worker-python/src libs/proto/gen/python

  redis-runtime-worker:
    name: Real Redis Python lifecycle integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the focused Redis lifecycle test dependencies
        run: python -m pip install 'pytest>=8.3,<10' 'redis>=5.2,<7'

      - name: Exercise atomic Python XACK and XDEL retirement
        env:
          ELITEA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          PYTHONPATH: services/elitea-worker-python/src
        run: >-
          python -m pytest -q
          services/elitea-worker-python/tests/service/test_redis_commands_service.py
