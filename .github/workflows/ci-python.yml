name: CI — Python

on:
  pull_request:
    paths:
      - "services/pylon-indexer/**"
      - "services/elitea-worker-python/**"
      - "libs/proto/gen/python/**"
      - "libs/proto/pyproject.toml"
      - "testdata/proto/runtime/v1/**"
      - ".github/workflows/ci-python.yml"
      # The "Runtime worker" job reads the files below. It compares each
      # committed projection with the SDK that the worker lock selects.
      # Start this workflow when one of these files changes. The worker lock
      # is in the services/elitea-worker-python/ directory. The entry above
      # covers the lock.
      - "scripts/contract/**"
      - "services/elitea-main/internal/runtimecomposition/current_index_types_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      - "services/elitea-main/internal/api/v2/indextypes/testdata/current_index_types_ui_response.json"
      # Issue #424. sync_current_available_sdk.py --check and
      # sync_worker_sdk_catalog.py --check now run in the "Runtime worker" job.
      # Each one compares a committed projection with the locked SDK. Add the
      # path of each projection. Without the path the gate cannot start for the
      # file that it protects — the defect that kept this workflow off the
      # branch until #448.
      - "services/elitea-main/internal/application/configurations/current_available_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_sdk_configuration_catalog_snapshot.json"
  push:
    branches:
      - main
    paths:
      - "services/pylon-indexer/**"
      - "services/elitea-worker-python/**"
      - "libs/proto/gen/python/**"
      - "libs/proto/pyproject.toml"
      - "testdata/proto/runtime/v1/**"
      - ".github/workflows/ci-python.yml"
      - "scripts/contract/**"
      - "services/elitea-main/internal/runtimecomposition/current_index_types_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      - "services/elitea-main/internal/api/v2/indextypes/testdata/current_index_types_ui_response.json"
      - "services/elitea-main/internal/application/configurations/current_available_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_sdk_configuration_catalog_snapshot.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pylon-indexer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validators
        run: pip install pyyaml yamllint

      - name: YAML lint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            pylon.yml configs/

      - name: Validate YAML structure
        run: |
          python -c "
          import yaml, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.yml'):
              try:
                  yaml.safe_load(f.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All YAML configs valid.')
          "

      - name: Verify Containerfile
        run: |
          grep -q "FROM ghcr.io/eliteaai/pylon" Containerfile
          echo "Containerfile base image OK."

  runtime-worker:
    name: Runtime worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/proto/pyproject.toml
            services/elitea-worker-python/pyproject.toml

      - name: Install current binary indexing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            tesseract-ocr

      - name: Check out the exact worker-locked SDK source
        env:
          SDK_REVISION: b5113a129329b85d23c2d5c2bf55f18e307414ec
          SDK_ARCHIVE_SHA256: df398b4a378e7b88ea3b72511e31de13a17a02159c69fbada6f0b948a0ecf2d7
          SDK_MCP_PREFLIGHT_PATCH: 5c9409779ac0a55f8bf74f6ef438977089187a14
          SDK_MCP_HARD_TIMEOUT_PATCH: 07ddc5cd67a0c747f83ca0e26421cde71bd97d9d
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/EliteaAI/elitea-sdk.git \
            /tmp/elitea-sdk-current
          git -C /tmp/elitea-sdk-current checkout --detach "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current rev-parse HEAD)" = "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" = "${SDK_ARCHIVE_SHA256}"
          git -C /tmp/elitea-sdk-current cat-file -e "${SDK_MCP_PREFLIGHT_PATCH}^{commit}"
          git -C /tmp/elitea-sdk-current cat-file -e "${SDK_MCP_HARD_TIMEOUT_PATCH}^{commit}"
          git -C /tmp/elitea-sdk-current cherry-pick --no-commit "${SDK_MCP_PREFLIGHT_PATCH}"
          git -C /tmp/elitea-sdk-current cherry-pick --no-commit "${SDK_MCP_HARD_TIMEOUT_PATCH}"

      - name: Install the pinned worker and protocol packages
        run: |
          # The SDK source is checked out at a fixed revision, but the checkout
          # path is stable across runs. Do not let pip reuse a wheel built from
          # an older revision of that same file:// URL.
          python -m pip install --no-cache-dir \
            "elitea-sdk @ file:///tmp/elitea-sdk-current" \
            ./libs/proto \
            "./services/elitea-worker-python[agent-current,indexing-current,test]"
          python -m pip check

      - name: Unit and byte-conformance tests
        env:
          ELITEA_CONFORMANCE_ROOT: ${{ github.workspace }}/testdata/proto/runtime/v1
          ELITEA_SDK_SOURCE_ROOT: /tmp/elitea-sdk-current
        run: |
          # Every test_*.py under scripts/contract/ runs. A named list stops
          # covering a file the day somebody adds one, and two files had sat
          # unrun since they were written (#424). The shell glob is the whole
          # point: it derives the list from the tree.
          contract_tests=(scripts/contract/test_*.py)
          if [ "${#contract_tests[@]}" -lt 4 ]; then
            echo "::error::found ${#contract_tests[@]} test files under scripts/contract/, expected at least 4 — the glob stopped matching, so this step would prove nothing"
            exit 1
          fi
          python -m pytest \
            /tmp/elitea-sdk-current/tests/runtime/test_mcp_discovery_hang.py \
            services/elitea-worker-python/tests \
            "${contract_tests[@]}"
          elitea-worker conformance --suite runtime-v1

      - name: Compile Python sources
        run: python -m compileall -q services/elitea-worker-python/src libs/proto/gen/python

      - name: Verify source-backed SDK projections
        env:
          # sync_current_available_sdk.py refuses to run when
          # elitea_sdk/configurations holds an uncommitted or untracked file.
          # The projections above import that package straight out of the
          # checkout, so the interpreter would drop __pycache__ directories in
          # it and the next check would report a dirty SDK source. Write no
          # bytecode instead.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Schema projection imports the complete current SDK registry. Keep
          # its build-only dependencies after the runtime tests so they cannot
          # conceal a missing dependency in the indexing worker profile.
          python -m pip install --no-cache-dir \
            "elitea-sdk[all] @ file:///tmp/elitea-sdk-current"
          python scripts/contract/sync_index_types_snapshot.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check
          python scripts/contract/sync_toolkit_schema_snapshot.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check
          # Issue #424. These two --check modes ran in no workflow. Each one
          # reads the same locked SDK source as the two calls above and
          # compares a committed projection with it. The trigger list carries
          # the path of each projection.
          python scripts/contract/sync_current_available_sdk.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check
          python scripts/contract/sync_worker_sdk_catalog.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check

  redis-runtime-worker:
    name: Real Redis Python lifecycle integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the focused Redis lifecycle test dependencies
        run: >-
          python -m pip install
          ./libs/proto
          "./services/elitea-worker-python[test]"

      - name: Exercise atomic Python XACK and XDEL retirement
        env:
          ELITEA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: >-
          python -m pytest -q
          services/elitea-worker-python/tests/service/test_redis_commands_service.py
