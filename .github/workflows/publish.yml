name: Release & Publish

on:
  push:
    branches:
      - main
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/eliteaai
  # Read by the chart job. Pinned, not "latest" — an unpinned third-party
  # download is a hard dependency of every release.
  YQ_VERSION: v4.44.6

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ── Job 1: Semantic Release — determine version, create tag & GitHub release ─
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 1b: Release parity audit ────────────────────────────────────────────
  # Lives HERE, not in a workflow_run workflow of its own, and that is the
  # whole point. A separate workflow_run audit has to check out the released
  # commit and then EXECUTE it (`go run ./tools/uictl`) in the privileged
  # default-branch context, which CodeQL flags as
  # actions/cache-poisoning/poisonable-step and which is a real shape rather
  # than a false positive. As a job here it runs in the ordinary push context
  # on a commit that is already on main, so there is no untrusted checkout to
  # reason about at all.
  #
  # It also gates better: `needs: release` reads semantic-release's OWN
  # new_release_published output instead of re-deriving whether a release
  # happened by hunting for a `v*` tag pointing at HEAD.
  #
  # What it audits: the same two commands ci-web.yml runs on every PR, re-run
  # against what was actually shipped. On a PR they gate the diff; a release is
  # cut from main, and main can carry a merge result that no single PR ever
  # validated.
  audit:
    name: Release parity audit
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    # Narrower than the workflow default (contents/packages/issues/pull-requests
    # write): this job only reads the tree.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive # apps/elitea-ui is the pinned parity baseline
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          # uictl has no external dependencies and no go.sum, so the cache
          # would hold the toolchain and little else for two commands that run
          # once per release.
          cache: false

      - name: Route + manifest parity (release-blocking)
        run: |
          echo "### Release audit — ${{ needs.release.outputs.new_release_git_tag }}" >> "$GITHUB_STEP_SUMMARY"
          go run ./tools/uictl parity-routes --baseline apps/elitea-ui
          go run ./tools/uictl parity-manifest --validate

      # `--require-must` REPORTS, it does not block. This is a decision, not
      # an omission — issue #309 asked for the choice to be made explicitly
      # and named, not left as a silent default:
      #
      #   DECISION: stay advisory. Measured on this branch, `uictl
      #   parity-manifest --require-must` exits 1 with "694 priority:must
      #   item(s) not verified". Blocking on that count would red every
      #   release on a known, tracked migration backlog, a signal nobody can
      #   act on at release time — that is how a gate turns into noise
      #   everyone learns to ignore, not a safer release.
      #
      #   OWNER: Platform Engineering, the same owner
      #   `implementation-readiness.mdx` (elitea-docs) already names for this
      #   gap register — this step reports the identical priority:must count
      #   that document tracks, so it inherits that document's owner rather
      #   than getting an invented one.
      #
      #   REVIEW BY: 2026-11-30. Re-run this decision then: if the backlog is
      #   near zero, make this step block a release; if not, move this date.
      #   An advisory with no review date is how gate 3's stale coverage
      #   exclusion (this same issue) went unnoticed for ten consumers.
      #
      # `cutover/*` in ci-web.yml already blocks on this same check and is
      # unaffected by the above — that arm is where the audit is meant to
      # bite before release policy changes.
      #
      # The step still FAILS if the audit emits no recognisable verdict at all
      # — "ran, found nothing" and "did not really run" are otherwise the same
      # log line, which is the entire subject of the gate-dormancy work.
      - name: Require-must parity (advisory — reports, does not block; owner Platform Engineering, review by 2026-11-30)
        run: |
          set -uo pipefail
          OUT="$(go run ./tools/uictl parity-manifest --require-must 2>&1)" && STATUS=0 || STATUS=$?
          echo "$OUT"
          if ! printf '%s' "$OUT" | grep -qE 'priority:must item|all priority:must items'; then
            echo "::error::parity-manifest --require-must produced no verdict line (exit $STATUS)"
            exit 1
          fi
          {
            printf '%s\n' "$OUT" | grep -E 'priority:must item|all priority:must items'
            echo ""
            echo "_Advisory, not release-blocking (issue #309). Owner: Platform Engineering. Review by: 2026-11-30._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Build each image on its native runner ────────────────────────────
  #
  # VULNERABILITY SCAN — WHERE IT RUNS, AND WHY NOT HERE (issue #433)
  #
  #   DECISION: the images below are scanned by
  #   .github/workflows/ci-image-scan.yml, not by a job inside this workflow.
  #   That workflow builds every image in the matrix below, scans it with trivy
  #   at HIGH,CRITICAL, and fails on any finding. It runs on every pull request
  #   and every push to main that touches an image input, and again every day at
  #   05:17 UTC. A release is cut from main, so the code it ships was scanned at
  #   most 24 hours earlier.
  #
  #   RESIDUAL RISK, stated rather than hidden: a CVE published between the last
  #   scan of main and this release ships. The window is bounded by the daily
  #   run. A scan job here would shrink it to the length of one release, and it
  #   would cost either a second build of all six images or a scan of images
  #   that are already pushed. Issue #501 holds that work.
  #
  #   OWNER: Platform Engineering — the same owner the release parity audit
  #   above names, because this is the same release gate register.
  #
  #   REVIEW BY: 2026-11-30. Re-read this then. If a release has shipped a
  #   finding that the daily scan reported after the fact, close #501 by
  #   building the gate here instead.
  #
  #   The image list below is not free-form. ci-image-scan.yml reads it and
  #   fails when it ships an image that no scan covers, so a seventh entry
  #   cannot arrive unscanned in silence.
  #
  # NOTE (issue #244): elitea-worker-python has a Containerfile
  # (services/elitea-worker-python/Containerfile) but deliberately has no bake
  # target and no entry in this matrix. The worker plane it belongs to
  # (worker_core / worker_client / indexer_worker / provider_worker) is marked
  # `pending` in the workspace repos.yaml — the runtime transport contract
  # (Redis Streams) and the Go/Python split aren't settled, so publishing an
  # image now would ship something the runtime work will still reshape.
  # Revisit once that plane's status moves off `pending`.
  build:
    name: Build ${{ matrix.image.name }} / ${{ matrix.platform.suffix }}
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: elitea-main
            context: .
            dockerfile: ./services/elitea-main/Containerfile
            # The Containerfile is multi-target (hybrid / e2e / final). Name the
            # shipping one instead of relying on "last stage wins", so adding a
            # stage can never silently change what is released.
            target: final
          - name: elitea-scheduler
            # Repo root, not ./services/elitea-scheduler: the Containerfile
            # COPYs libs/go/observability (issue #250's local replace target)
            # from there.
            context: .
            dockerfile: ./services/elitea-scheduler/Containerfile
          - name: elitea-ui
            context: .
            dockerfile: ./deploy/docker/Containerfile.elitea-ui
          # New UI (spec §7.3, issue #244): mirrors the elitea-web bake target
          # in docker-bake.hcl so the image bake produces actually reaches
          # ghcr.io instead of only ever being built locally/in CI.
          - name: elitea-web
            context: .
            dockerfile: ./apps/elitea-web/Containerfile
          - name: pylon-indexer
            context: ./services/pylon-indexer
            dockerfile: ./services/pylon-indexer/Containerfile
          # Standalone module on Go 1.26.4 — its Containerfile pins
          # golang:1.26.4, so no runner-image bump is required here.
          - name: elitea-llm-gateway
            context: ./services/elitea-llm-gateway
            dockerfile: ./services/elitea-llm-gateway/Containerfile
        platform:
          - runner: ubuntu-latest
            arch: linux/amd64
            suffix: linux-amd64
          # GitHub-hosted arm64 runner (free for public repos). Pinned to the
          # 24.04 image rather than a floating `-arm` alias so an image rollover
          # can't silently change the build environment under us. There is no
          # self-hosted runner fleet for this repo — do not reintroduce
          # `[self-hosted, arm64]`, the job will queue forever.
          - runner: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform-specific image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          # Empty for single-target images, which build their last stage.
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ needs.release.outputs.new_release_version }}-${{ matrix.platform.suffix }}
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.new_release_version }}
          platforms: ${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}

  # ── Job 3: Merge platform digests into a single multi-arch manifest ──────────
  manifest:
    name: Manifest ${{ matrix.image.name }}
    needs: [release, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: elitea-main
          - name: elitea-scheduler
          - name: elitea-ui
          - name: elitea-web
          - name: pylon-indexer
          - name: elitea-llm-gateway

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image.name }}"

          TAGS="--tag ${IMAGE}:${VERSION}"
          if [[ "$VERSION" != *"-"* ]]; then
            MAJOR_MINOR="${VERSION%.*}"
            TAGS="$TAGS --tag ${IMAGE}:latest --tag ${IMAGE}:${MAJOR_MINOR}"
          fi

          docker buildx imagetools create $TAGS \
            "${IMAGE}:${VERSION}-linux-amd64" \
            "${IMAGE}:${VERSION}-linux-arm64"

  # ── Job 4: Keyless cosign signing ───────────────────────────────────────────
  sign:
    name: Sign ${{ matrix.image.name }}
    needs: [release, manifest]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: elitea-main
          - name: elitea-scheduler
          - name: elitea-ui
          - name: elitea-web
          - name: pylon-indexer
          - name: elitea-llm-gateway

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign multi-arch manifest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image.name }}"

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')

          cosign sign --yes "${IMAGE}@${DIGEST}"

  # ── Job 5: Package and push the Helm charts to the GHCR OCI registry ────────
  # The images are only half of a release. Until this job existed, a consumer
  # could `docker pull ghcr.io/eliteaai/elitea-main:1.2.3` but had no way to
  # obtain the chart that deploys it other than cloning this repository at the
  # matching tag — which is not a distribution channel, it is a workaround.
  #
  # `needs: sign` on purpose, not `needs: release`. A chart whose values point
  # at an image tag that does not exist yet is a chart that cannot install, so
  # the charts go out strictly after the manifests they reference are pushed
  # and signed.
  #
  # No `latest` chart tag, unlike the image manifests above: an OCI chart
  # reference resolves by SemVer version, `helm pull --version latest` is not
  # a thing, and a non-SemVer tag in a chart repository is a foot-gun for
  # every tool that enumerates it. Consumers pin `--version`.
  chart:
    name: Chart ${{ matrix.chart }}
    needs: [release, sign]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `image:` names the image THIS workflow publishes for the chart, and
          # it is what makes the chart's default `image.tag` get stamped with
          # the release version below. Leave it empty for a chart that deploys
          # a third-party image: stamping those would replace a deliberate
          # upstream pin (NATS 2.12.0, otel-collector 0.114.0) with a version
          # number that means nothing to that image's registry.
          - chart: elitea-main
            image: elitea-main
          - chart: elitea-scheduler
            image: elitea-scheduler
          - chart: elitea-web
            image: elitea-web
          - chart: elitea-llm-gateway
            image: elitea-llm-gateway
          - chart: pylon-indexer
            image: pylon-indexer
          # Vendors the upstream nats subchart, so packaging it needs
          # `helm dependency build` and network access to the upstream repo.
          # The step below runs it for any chart that declares dependencies.
          - chart: nats
            image: ""
          - chart: nats-bootstrap
            image: ""
          - chart: otel-collector
            image: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Pinned for the same reason ci-helm pins it: an unpinned third-party
      # download is a hard dependency of every release. The runner image
      # usually ships yq already, so this normally downloads nothing.
      - name: Install yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Chart.yaml and values.yaml are BOTH edited, rather than passing
      # `helm package --version/--app-version`. Those flags exist in Helm 3 and
      # were dropped in Helm 4, so a routine bump of the pinned Helm above
      # would turn this job red — or, if a future edit ever drops the pin,
      # publish every chart at the placeholder 0.1.0. yq works on both.
      #
      # The working tree keeps the placeholder 0.1.0; only the packaged
      # artifact carries a release number.
      #
      # values.yaml matters just as much as the version: a chart published at
      # 1.2.3 whose default `image.tag` is still "latest" installs whatever a
      # node happens to have cached — the exact trap the elitea-web values.yaml
      # comment already warns operators about.
      #
      # Every edit is read back. An unstamped chart that publishes and reports
      # success is worse than a failed release, and a values.yaml that reshapes
      # its image block is the way that happens quietly.
      - name: Stamp the release version into the chart
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          CHART="deploy/helm/${{ matrix.chart }}/Chart.yaml"
          VALUES="deploy/helm/${{ matrix.chart }}/values.yaml"

          yq -i ".version = \"${VERSION}\"" "$CHART"
          got="$(yq -r '.version' "$CHART")"
          if [ "$got" != "$VERSION" ]; then
            echo "::error file=${CHART}::version is '${got}', expected '${VERSION}'"
            exit 1
          fi

          # appVersion tracks the platform release ONLY for a chart that ships
          # an image from this repository. For a chart that deploys a
          # third-party image it keeps the deliberate upstream pin already
          # written in Chart.yaml (NATS 2.12.0, otel-collector 0.114.0) — a
          # release number means nothing to those images' registries.
          if [ -n "${{ matrix.image }}" ]; then
            yq -i ".appVersion = \"${VERSION}\"" "$CHART"
            got="$(yq -r '.appVersion' "$CHART")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=${CHART}::appVersion is '${got}', expected '${VERSION}'"
              exit 1
            fi

            before="$(yq -r '.image.tag' "$VALUES")"
            if [ "$before" = "null" ]; then
              echo "::error file=${VALUES}::no .image.tag to stamp — the chart's image block moved"
              exit 1
            fi
            yq -i ".image.tag = \"${VERSION}\"" "$VALUES"
            got="$(yq -r '.image.tag' "$VALUES")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=${VALUES}::image.tag is '${got}', expected '${VERSION}'"
              exit 1
            fi

            # The image the stamped tag names must be one this workflow
            # actually pushed. A repository that drifted from the build matrix
            # produces a chart pointing at a tag that will never exist.
            repo="$(yq -r '.image.repository' "$VALUES")"
            if [ "$repo" != "${REGISTRY}/${{ matrix.image }}" ]; then
              echo "::error file=${VALUES}::image.repository is '${repo}', expected '${REGISTRY}/${{ matrix.image }}'"
              exit 1
            fi

            echo "stamped ${VALUES}: image.tag ${before} -> ${VERSION}"
          fi

          yq '{"version": .version, "appVersion": .appVersion}' "$CHART"

      - name: Build chart dependencies
        run: |
          CHART_DIR="deploy/helm/${{ matrix.chart }}"
          if [ "$(yq -r '.dependencies // [] | length' "${CHART_DIR}/Chart.yaml")" -gt 0 ]; then
            helm dependency build "$CHART_DIR"
          else
            echo "no dependencies declared"
          fi

      - name: Package chart
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          helm package "deploy/helm/${{ matrix.chart }}" --destination /tmp/charts
          ls -l "/tmp/charts/${{ matrix.chart }}-${VERSION}.tgz"

      - name: Push chart and sign it
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          TGZ="/tmp/charts/${{ matrix.chart }}-${VERSION}.tgz"

          # `helm push` prints the pushed digest on stderr. Capture it here
          # rather than re-resolving the tag afterwards, so the signature is
          # bound to the artifact this job pushed and not to whatever the tag
          # points at by the time the next step runs.
          # `bash -e` — the default shell here — takes the exit status of the
          # LAST command in a pipeline, so `helm push | tee` would report
          # success for a push that failed. pipefail for the push itself, then
          # off again so the digest grep below reaches its own error message
          # instead of aborting the step silently.
          set -o pipefail
          helm push "$TGZ" "oci://${REGISTRY}/charts" 2>&1 | tee /tmp/push.log
          set +o pipefail

          DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | head -1)"
          if [ -z "$DIGEST" ]; then
            echo "::error::helm push printed no digest — refusing to sign an unknown artifact"
            exit 1
          fi

          cosign sign --yes "${REGISTRY}/charts/${{ matrix.chart }}@${DIGEST}"

      # A push that reported success and a chart a consumer can actually pull
      # are different claims. This asserts the second one, from the registry.
      - name: The published chart is pullable
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          helm show chart "oci://${REGISTRY}/charts/${{ matrix.chart }}" --version "$VERSION"

  # ── Job 6: Rollback — delete release, tag, and images on failure ────────────
  rollback:
    name: Rollback
    needs: [release, build, manifest, sign, chart]
    if: failure() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.new_release_git_tag }}"
          REPO="${{ github.repository }}"

          echo "Deleting release for tag ${TAG}..."
          RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE "repos/${REPO}/releases/${RELEASE_ID}"
            echo "Release deleted."
          fi

          echo "Deleting tag ${TAG}..."
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG#v}" 2>/dev/null || \
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" 2>/dev/null || true
          echo "Tag deleted."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete pushed images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          IMAGES=("elitea-main" "elitea-scheduler" "elitea-ui" "elitea-web" "pylon-indexer" "elitea-llm-gateway")
          SUFFIXES=("linux-amd64" "linux-arm64")
          ORG="eliteaai"

          for img in "${IMAGES[@]}"; do
            # Delete platform-specific tags
            for suffix in "${SUFFIXES[@]}"; do
              TAG="${VERSION}-${suffix}"
              echo "Deleting ${img}:${TAG}..."
              # Get version ID by tag and delete
              VERSION_ID=$(gh api "orgs/${ORG}/packages/container/${img}/versions" \
                --jq ".[] | select(.metadata.container.tags[] == \"${TAG}\") | .id" 2>/dev/null || true)
              if [ -n "$VERSION_ID" ]; then
                gh api -X DELETE "orgs/${ORG}/packages/container/${img}/versions/${VERSION_ID}" 2>/dev/null || true
              fi
            done

            # Delete multi-arch manifest tag
            echo "Deleting ${img}:${VERSION} manifest..."
            VERSION_ID=$(gh api "orgs/${ORG}/packages/container/${img}/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"${VERSION}\") | .id" 2>/dev/null || true)
            if [ -n "$VERSION_ID" ]; then
              gh api -X DELETE "orgs/${ORG}/packages/container/${img}/versions/${VERSION_ID}" 2>/dev/null || true
            fi
          done

          echo "Image rollback complete."

      # The charts are pushed under a `charts/` path prefix, so their GHCR
      # package names are `charts/<chart>` and the API path segment must be
      # URL-encoded (`charts%2F<chart>`). Without this the release would roll
      # back its images and leave a chart published at a version whose images
      # no longer exist — a chart that installs into a permanent ImagePullBackOff.
      - name: Delete pushed charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          CHARTS=("elitea-main" "elitea-scheduler" "elitea-web" "elitea-llm-gateway" "pylon-indexer" "nats" "nats-bootstrap" "otel-collector")
          ORG="eliteaai"

          for chart in "${CHARTS[@]}"; do
            echo "Deleting chart ${chart}:${VERSION}..."
            VERSION_ID=$(gh api "orgs/${ORG}/packages/container/charts%2F${chart}/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"${VERSION}\") | .id" 2>/dev/null || true)
            if [ -n "$VERSION_ID" ]; then
              gh api -X DELETE "orgs/${ORG}/packages/container/charts%2F${chart}/versions/${VERSION_ID}" 2>/dev/null || true
            fi
          done

          echo "Rollback complete."
