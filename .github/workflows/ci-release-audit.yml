name: CI — Release Audit

# Gate 2 of issue #309, armed.
#
# ── WHAT WAS BROKEN ─────────────────────────────────────────────────────────
# The release-readiness parity audit was written as a tag gate: `push: tags:
# v*` triggers in three workflows, and a `startsWith(github.ref,
# 'refs/tags/v')` arm on the `--require-must` step in ci-web.yml. None of it
# could ever fire. This repository does not cut releases by pushing a tag by
# hand: publish.yml runs semantic-release on every push to `main`/`next`, and
# semantic-release creates the tag and the GitHub release with
# `secrets.GITHUB_TOKEN`. GitHub deliberately starts no workflow run for a ref
# created by that token (its loop-prevention rule). Measured: zero workflow
# runs exist on any `v1.*` ref, for any workflow. The dead triggers were
# removed in the first half of #309; this file is the second half — the audit
# now runs on the event that a release actually produces.
#
# ── WHAT ACTUALLY FIRES ─────────────────────────────────────────────────────
# `workflow_run` on "Release & Publish". That is the mechanism #309 itself
# names, and it is not subject to the GITHUB_TOKEN rule: the triggering event
# is a human push to main, and workflow_run observes the run, not the tag.
#
# Two consequences a reader should know:
#   • workflow_run only fires for the copy of this file on the DEFAULT BRANCH,
#     and defaults to checking out the default branch. Both are handled: the
#     checkout below pins `github.event.workflow_run.head_sha`, i.e. the exact
#     commit that was released. It also means this workflow cannot be observed
#     firing until it is merged to main — see the PR body.
#   • A publish run does not always cut a release. semantic-release publishes
#     nothing when no commit since the last tag is releasable. The job below
#     therefore establishes whether a tag exists AT the released commit before
#     it claims to have audited a release, and says so either way in the Step
#     Summary. "No release was cut" is a real outcome, not a pass.
#
# ── ANTI-DORMANCY ───────────────────────────────────────────────────────────
# The way this trigger could go quiet is the same way check-playwright-image-
# tag.mjs went quiet in #157: it names another workflow by a string ("Release
# & Publish"), and renaming that workflow would leave this one matching
# nothing, forever, with no error anywhere. scripts/check-ci-dormancy.mjs now
# carries rule 3 (`workflow-run-target-missing`), which fails the build when a
# `workflow_run.workflows:` entry does not match the `name:` of a workflow
# that exists in this repository.

on:
  workflow_run:
    workflows: ["Release & Publish"]
    types: [completed]
  # Repeatable by hand — #309's acceptance criterion asks for a dispatch path
  # so the audit can be re-run against a release without cutting another one.
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit, tag or branch to audit. Defaults to the branch this is
          dispatched on. Use a release tag (e.g. v1.16.0) to re-audit a past
          release.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Release parity audit
    runs-on: ubuntu-latest
    # A failed publish run released nothing; there is no release to audit.
    # Dispatch always proceeds, because the operator asked for it explicitly.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch unless told otherwise.
          # Auditing main instead of the released commit would make this gate
          # a different check than it claims to be.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          submodules: recursive # apps/elitea-ui is the pinned parity baseline

      - name: Identify the release under audit
        id: release
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          SHA="$(git rev-parse HEAD)"
          TAG="$(git tag --points-at "$SHA" --list 'v*' | head -n1)"
          if [ -z "$TAG" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No \`v*\` tag points at \`$SHA\` — the triggering publish run cut no release" \
              "(semantic-release publishes nothing when no commit since the last tag is releasable)." \
              "Nothing to audit." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No release tag at $SHA; skipping the audit."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "### Release audit — \`$TAG\` (\`$SHA\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Auditing release $TAG at $SHA"
          fi

      - uses: actions/setup-go@v6
        if: steps.release.outputs.released == 'true'
        with:
          go-version: "1.25"
          # uictl has no external deps (no go.sum); key on the workspace sum.
          cache-dependency-path: go.work.sum

      # ── BLOCKING ────────────────────────────────────────────────────────
      # The same two commands ci-web.yml runs on every PR, re-run against the
      # released commit. On a PR they gate the diff; here they gate what was
      # actually shipped, which is not the same thing — a release is cut from
      # main, and main can carry a merge result that no single PR ever
      # validated. Both pass today, so this arm is a live gate from its first
      # release rather than a known-red one.
      - name: Route + manifest parity (release-blocking)
        if: steps.release.outputs.released == 'true'
        run: |
          go run ./tools/uictl parity-routes --baseline apps/elitea-ui
          go run ./tools/uictl parity-manifest --validate

      # ── ADVISORY ────────────────────────────────────────────────────────
      # `--require-must` is REPORTED here, not enforced, and that is a
      # deliberate, visible decision rather than an omission.
      #
      # Measured on this branch: `uictl parity-manifest --require-must` exits 1
      # with "694 priority:must item(s) not verified". Enforcing it today would
      # turn every single release red on a known, tracked migration backlog —
      # a red square that means "the migration is not finished", which nobody
      # can act on at release time and which everybody would learn to ignore.
      # That is how a gate becomes noise. Whether a release should block on the
      # parity register is a release-policy call for a human, and it is raised
      # in the PR body rather than taken here.
      #
      # This follows the precedent ci-web-mutation.yml sets for its own
      # advisory job: run it, publish the number, name what it would take to
      # make it blocking. The blocking arm on `cutover/*` in ci-web.yml is
      # unchanged and still bites where the audit is meant to bite.
      #
      # The step nevertheless FAILS if the audit produces no count at all.
      # "Ran, found nothing, exited 0" and "did not really run" are the same
      # log line otherwise, and that indistinguishability is the entire subject
      # of #309 — see also check-playwright-image-tag.mjs's own note about its
      # "nothing found → OK" branch.
      - name: Require-must parity (advisory — reports, does not block)
        if: steps.release.outputs.released == 'true'
        run: |
          set -uo pipefail
          OUT="$(go run ./tools/uictl parity-manifest --require-must 2>&1)" && STATUS=0 || STATUS=$?
          # The two verdict lines uictl can emit (tools/uictl/main.go:109,112):
          #   "...--require-must: N priority:must item(s) not verified"  (exit 1)
          #   "...--require-must: OK (every must item verified)"          (exit 0)
          SUMMARY="$(printf '%s\n' "$OUT" | grep -E 'priority:must item\(s\) not verified|require-must: OK' | tail -n1 || true)"
          if [ -z "$SUMMARY" ]; then
            printf '%s\n' "$OUT"
            echo "::error::parity-manifest --require-must produced no recognisable verdict line (exit $STATUS)."
            echo "An advisory step that cannot tell 'audited, all clear' from 'did not run' is not advisory, it is dormant."
            exit 1
          fi
          {
            echo ""
            echo "**Priority:must parity register (advisory):** \`$SUMMARY\`"
            echo ""
            if [ "$STATUS" -ne 0 ]; then
              echo "Not release-blocking. See the note in \`.github/workflows/ci-release-audit.yml\`" \
                   "— enforcing this today reds every release on the open migration backlog," \
                   "which is a release-policy decision, not a CI one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$SUMMARY (advisory, exit $STATUS)"
