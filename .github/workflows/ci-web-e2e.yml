name: CI — Web E2E

# The heavy, containerised half of apps/elitea-web's CI, split out of
# ci-web.yml (issue #157).
#
# These two jobs share a runtime surface that nothing in ci-web.yml has: they
# build two container images from source, stand up the seven-service compose
# stack in deploy/docker-compose.e2e-standalone.yml (postgres, redis, rustfs,
# an OIDC mock, traefik, elitea-main, elitea-web) and drive real browsers at
# it. Six-to-seven minutes per E2E leg, and a failure mode set that has nothing
# in common with a lint error. Keeping them here means:
#   • `gh workflow run ci-web-e2e.yml` exercises the stack without dragging the
#     25 node-only gate jobs along with it (and vice versa);
#   • either half can be re-run on its own;
#   • a red square in the checks list says which half broke.
#
# WHEN THEY FIRE:
#   e2e     — every PR matching the paths below, pushes to main, `v*` tags,
#             and workflow_dispatch. No job-level `if:` (issue #158).
#   visual  — the same set, and for the same reason (issue #159). It used to
#             carry `if: startsWith(github.ref, 'refs/tags/v')`, which — with
#             no `v*` tag ever cut — meant it had never run at all. Its very
#             first execution failed on a real defect, so "dormant but
#             presumed correct" was never true.
#
# The mutation spot-check is NOT here. It lives in its own
# .github/workflows/ci-web-mutation.yml, which is the canonical copy (see the
# decision recorded in that file).

on:
  # Same trigger set as ci-web.yml, deliberately: the E2E stack builds and runs
  # elitea-main alongside elitea-web, so a change to the BACKEND or to the
  # compose/build definitions can break a journey while touching nothing under
  # apps/elitea-web. The `on:` block must also remain a superset of what the
  # per-job `if:` guards admit (`refs/tags/v`), or those jobs become
  # unreachable — the exact mistake that made the E2E job unrunnable before
  # (PR #82 validation, blocker 4).
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: >-
          Regenerate the @visual baselines inside the pinned Playwright
          container and upload them as the `visual-baselines` artifact, instead
          of comparing against the committed ones. A run in this mode PASSES BY
          CONSTRUCTION and is never evidence that the UI is unchanged — it is a
          way to produce a reviewable baseline that was rasterised by the
          pinned container rather than by somebody's laptop. Download the
          artifact, look at the PNGs, commit the ones you meant to change.
        type: boolean
        default: false
      full_visual_refresh:
        description: >-
          Rewrite EVERY @visual baseline (--update-snapshots=all) instead of
          only the ones that fail. Requires update_visual_baselines. Use this to
          find drift that the maxDiffPixels budget has been absorbing: a
          snapshot that passes is never rewritten, so a baseline that moved less
          than the budget stays wrong indefinitely and a green run cannot tell
          you. Issue #238 is the worked example — a dropdown arrow moved 11 px
          in the light scheme against a 20 px budget, so 7 baselines went on
          matching an image with no arrow in it, and no regeneration touched
          them until they were deleted. The run prints a pixel-level comparison
          (scripts/compare-visual-baselines.mjs) so the artifact is reviewable:
          a full rewrite re-encodes all of them, and a byte diff calls every
          file changed.
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/elitea-web/**"
      - "tools/uictl/**"
      - "services/elitea-main/**"
      - "deploy/**"
      - "docker-bake.hcl"
      - ".github/workflows/ci-web-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "apps/elitea-web/**"
      - "tools/uictl/**"
      - "services/elitea-main/**"
      - "deploy/**"
      - "docker-bake.hcl"
      - ".github/workflows/ci-web-e2e.yml"
    # NO `tags: v*` — issue #309, Gate 2; see the identical note in ci-web.yml.
    # A GITHUB_TOKEN-created tag starts no workflow run, so this arm has never
    # fired. Both jobs below reach every PR, every push to main and
    # workflow_dispatch on their own, which is what has actually been running
    # them; removing the dead arm changes no execution, only the claim.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

# Load-bearing: every `run:` below assumes apps/elitea-web as cwd, except the
# image-build step, which overrides it with `working-directory: ${{ github.workspace }}`.
defaults:
  run:
    working-directory: apps/elitea-web

jobs:
  e2e:
    name: E2E (${{ matrix.engine }})
    # Runs on pull requests (issue #158). It previously carried
    #   if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # which skipped it on every PR — confirmed on runs 31335173296 and
    # 31331494389. A 30-journey suite that only executes on a release tag
    # cannot block the regression it exists to catch, and the tag build is
    # the worst possible place to first learn a journey broke. ~6-7 min per
    # engine leg is affordable on every PR; both legs stay in the matrix
    # below so chromium and webkit are each still validated (§6.6/§7.6).
    runs-on: ubuntu-latest
    strategy:
      # Both engines are validated independently. Issue #60 requires chromium AND
      # webkit; the job used to run whatever `npm run e2e` defaulted to, so half
      # the acceptance was never checked. `fail-fast: false` keeps a webkit-only
      # regression from hiding chromium's result (and vice versa).
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    # E2E needs Docker + docker-compose for the stack.
    # GitHub-hosted ubuntu-latest has Docker and docker compose (v2 plugin) pre-installed.
    steps:
      - uses: actions/checkout@v7
        with:
          # elitea-web's Containerfile copies from apps/elitea-web/ using repo-root context,
          # so a full checkout (not shallow) is needed to build the image.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Build elitea-main:e2e and elitea-web:e2e from source
        # docker-compose.e2e-standalone.yml references elitea-main:e2e and
        # elitea-web:e2e. Build both here so the stack never needs a published
        # `:e2e` tag — a tag that has never existed outside a developer laptop,
        # and whose absence is what killed every dispatch of this job (#154).
        #
        # Two plain `docker build`s, deliberately: they are the same two commands
        # a developer runs locally (with podman), and `docker build` loads its
        # result into the image store that compose then reads. The previous
        # revision built elitea-web with `docker buildx bake` and no `--load`,
        # which leaves the result in the BUILDER's cache only — `docker images`
        # never saw the tag, compose fell through to a registry PULL, and run
        # 31324533092 got `denied`. elitea-main, built with `docker build` on the
        # same runner, was found; that asymmetry is the whole bug, and it is why
        # only elitea-web appeared in the pull list.
        #
        # No buildx/gha layer cache here on purpose: correctness of this job must
        # not depend on a cache, and a byte-identical cached rebuild that is
        # believed to carry a fix it does not carry has already misled this
        # effort once.
        #
        # elitea-main uses the `e2e` target, which builds the admin SPA from
        # apps/elitea-web/src/entries/admin — the same bundle the shipping
        # `final` stage carries, since `final` derives from `e2e`.
        #
        # The pinned Playwright image is pulled HERE, in the background, rather
        # than in a step of its own. The two builds are CPU-bound and the pull
        # is network-bound, so the ~27s pull (measured, run 31775604015's visual
        # job) hides completely inside the ~160s build and the test step below
        # starts against a warm local image.
        working-directory: ${{ github.workspace }}
        run: |
          # Bounded and NON-FATAL, both deliberately. `docker run` in the test
          # step pulls the image itself if it is missing, so a failed or slow
          # pull here costs the overlap, never the run — and `timeout` stops a
          # stalled pull from hanging this step and getting mis-blamed on the
          # build, which is what the naive `docker pull &` would have done.
          (
            timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.0-noble \
              || echo "::warning::background pull of the pinned Playwright image failed or timed out; the test step will pull it inline"
          ) &
          pw_pull=$!
          docker build \
            --file services/elitea-main/Containerfile \
            --target e2e \
            --tag ghcr.io/eliteaai/elitea-main:e2e \
            --platform linux/amd64 \
            .
          docker build \
            --file apps/elitea-web/Containerfile \
            --tag ghcr.io/eliteaai/elitea-web:e2e \
            --platform linux/amd64 \
            .
          # The subshell above swallows its own failure, so this only joins the
          # background job — it cannot fail the step.
          wait "$pw_pull"
      - name: Both images are present in the local image store
        # Without this, a build that silently fails to load looks like a working
        # job right up until compose quietly tries the registry. Assert the end
        # state instead of trusting the build step's exit code, and print the
        # digests so a run's provenance is legible from its log.
        run: |
          for img in ghcr.io/eliteaai/elitea-main:e2e ghcr.io/eliteaai/elitea-web:e2e; do
            id=$(docker image inspect --format '{{.Id}}' "$img" 2>/dev/null || true)
            if [ -z "$id" ]; then
              echo "::error::$img was not loaded into the local image store."
              echo "compose would now try to PULL it from ghcr and fail with 'denied' (issue #154)."
              exit 1
            fi
            echo "  ✓ $img $id"
          done
      - name: Bring up E2E stack
        # e2e-stack.sh uses deploy/docker-compose.e2e-standalone.yml which references
        # elitea-main:e2e and elitea-web:e2e (both built and asserted above).
        # The script auto-detects `docker compose` (CI) vs `podman compose` (local).
        # E2E_PORT=8080 is free on ubuntu-latest (no centry stack); 8082 is the local default.
        env:
          COMPOSE_BIN: docker compose
          E2E_PORT: "8080"
        run: |
          test -d e2e || { echo "release tag without an e2e suite (unit V1) — refusing"; exit 1; }
          bash scripts/e2e-stack.sh up
      - name: Seed E2E users
        env:
          COMPOSE_BIN: docker compose
          E2E_PORT: "8080"
        run: bash scripts/e2e-stack.sh seed
      - name: Playwright against the real stack (pinned container, host network)
        # No `npx playwright install --with-deps` step. That step cost 57s on the
        # chromium leg and 82s on the webkit leg, and the browser downloads were
        # only ~14s of it — the other ~67s was apt fetching 114 MB of system
        # libraries onto a runner that then throws them away. Caching
        # ~/.cache/ms-playwright, the usual advice, would have recovered the 14s
        # and left the 67s untouched.
        #
        # `mcr.microsoft.com/playwright:v1.62.0-noble` ships both browsers AND
        # those system libraries pre-installed, so the whole install disappears;
        # what remains is the image pull, already paid for in the background of
        # the build step above. This is the same mechanism the `visual` job below
        # uses, for a different reason (font-stack determinism) — here it is
        # purely about not rebuilding a browser environment that exists as a
        # published image.
        #
        # The image tag is kept honest by scripts/check-playwright-image-tag.mjs,
        # which scans EVERY workflow and asserts each
        # `mcr.microsoft.com/playwright:vX.Y.Z-noble` matches the pinned
        # @playwright/test — so this second reference is gated automatically.
        #
        # `--network host`, not a job `container:`: the stack was brought up on
        # the HOST by e2e-stack.sh, and GitHub job containers do not share the
        # runner's network namespace, so localhost:8080 would not reach it (the
        # same constraint documented on the visual job).
        #
        # E2E_REUSE_STACK=1, not the `!CI` default: the stack is already up from
        # the steps above, and with CI set `reuseExistingServer` would be false —
        # Playwright would try to start it a second time, from inside a container
        # that has no container runtime.
        #
        # `--project` is explicit rather than `npm run e2e` so that (a) each
        # matrix leg reports one engine's result, and (b) the `visual` project
        # stays out of this job — its snapshots are the `visual` job's business.
        #
        # E2E_TZ pins the browser's timezone, and the seed step above anchors its
        # calendar-day fixtures in the SAME zone (issue #214). UTC on both sides
        # by default, so this line changes nothing today. It is here so that
        # setting E2E_TZ on the job cannot move the seed's day boundary while
        # leaving the browser on the runner's, which is the disagreement that
        # made journey 29 fail after midnight.
        run: |
          docker run --rm --network host \
            -v "$PWD":/work -w /work \
            -e CI=true \
            -e E2E_REUSE_STACK=1 \
            -e E2E_PORT=8080 \
            -e PLAYWRIGHT_BASE_URL=http://localhost:8080 \
            -e E2E_TZ="${E2E_TZ:-UTC}" \
            mcr.microsoft.com/playwright:v1.62.0-noble \
            npx playwright test --project=${{ matrix.engine }}
      - name: Give the report back to the runner user
        # The container runs as root, so playwright-results/ and
        # playwright-report/ come back root-owned. upload-artifact can still READ
        # them (0644), but a root-owned tree in the workspace is a trap for any
        # later step that wants to write there, and the failure would be a
        # baffling EACCES far from its cause.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per-engine name: upload-artifact v7 rejects a duplicate name, so a
          # shared one would fail the second matrix leg to finish.
          name: playwright-report-${{ matrix.engine }}
          # BOTH paths, and the second one is the point.
          #
          # `playwright-results/` is the raw output directory: per-test folders
          # of `*-actual.png`, `*-diff.png`, videos and traces. Uploading only
          # that is what this step used to do, and it left a reviewer with a
          # heap of loose PNGs whose file names encode the test id and nothing
          # else — enough to prove a failure happened, not enough to review it.
          #
          # `playwright-report/` is the HTML reporter's output (configured in
          # playwright.config.ts, `['html', { open: 'never' }]`). It is written
          # on every CI run and, until now, thrown away with the runner: it is
          # the report that renders expected/actual/diff side by side with a
          # slider, embeds the trace viewer, and links each attachment to the
          # test that produced it. Costing nothing to keep and being the only
          # artifact anyone can actually read, it is now kept.
          path: |
            apps/elitea-web/playwright-results/
            apps/elitea-web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failed test video recordings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failed-videos-${{ matrix.engine }}
          path: apps/elitea-web/playwright-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down E2E stack
        if: always()
        env:
          COMPOSE_BIN: docker compose
        run: bash scripts/e2e-stack.sh down

  chat-stream:
    name: Chat definition-of-done journey (#284)
    # The product core loop, end to end through the UI: send → SSE stream →
    # rendered answer → persisted after a reload. It runs on PRs for the same
    # reason the journeys do — the 2026-08-12 audit found Send silently no-op
    # with every unit suite green, and this is the only job that can catch that
    # class of regression.
    #
    # A separate job from `e2e` because it needs a DIFFERENT stack: the full
    # standalone compose (runtime plane + agent worker + mock LLM). The E2E
    # stack cannot run an agent turn at all, so this journey would fail there
    # for a reason that has nothing to do with the change under test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The web and worker images build from repo-root context.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Pre-pull the pinned Playwright container
        # No `npx playwright install --with-deps chromium` step — that spent
        # ~57s, most of it apt fetching system libraries the runner then throws
        # away (see the `e2e` job's fuller version of this note). The journey
        # runs inside the pinned Playwright image instead, which ships the
        # browsers AND those libraries; the journey itself stays on Desktop
        # Chrome (the script's --project selects it), so nothing about coverage
        # changes. Bounded and NON-FATAL: the script's `docker run` pulls the
        # image itself if this fails, so a stalled pull costs the overlap,
        # never the run.
        run: |
          timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.0-noble \
            || echo "::warning::pull of the pinned Playwright image failed or timed out; the journey step will pull it inline"
      - name: Run the journey against a fresh standalone stack
        # The script owns the whole lifecycle: runtime PKI, compose up, the
        # three seed steps, then Playwright. It uses its own compose project so
        # it can never disturb another stack, and tears down on exit.
        #
        # COMPOSE_BIN is docker on the runner; the script auto-detects podman
        # locally. MOCK_LLM_CHUNK_DELAY_MS makes the partial-render assertion
        # deterministic rather than a race against a one-paint reply.
        #
        # PLAYWRIGHT_CONTAINER_IMAGE makes the script run `npx playwright test`
        # inside the pinned container (--network host) instead of on the host.
        # The tag is written HERE and not in the script on purpose:
        # scripts/check-playwright-image-tag.mjs only scans .github/workflows/
        # when it asserts every container tag matches the pinned
        # @playwright/test, so this reference is gated automatically and one
        # inside the script would not be.
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          CHAT_STREAM_PROJECT: elitea-chatstream-ci
          CHAT_STREAM_PORT: "8084"
          MOCK_LLM_CHUNK_DELAY_MS: "120"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble
        run: bash apps/elitea-web/scripts/chat-stream-e2e.sh
      - name: Give the report back to the runner user
        # The container runs as root, so playwright-report/ comes back
        # root-owned — same trap and same fix as the `e2e` job's copy of this
        # step.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chat-stream
          path: apps/elitea-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  index-stream:
    name: Index definition-of-done journey (#93)
    # Issue #485. `apps/elitea-web/scripts/index-stream-e2e.sh` ran in no
    # workflow, and neither did `deploy/scripts/embedding-path-check.sh`, which
    # it calls. That second script is the reference honest validator in this
    # repository — it counts its assertions and exits non-zero when fewer than
    # 13 run — and no continuous-integration job could reach it. Its only two
    # callers were `standalone-stack.sh check` and this journey, and neither
    # ran anywhere.
    #
    # A separate job from `chat-stream` for the reason `chat-stream` is separate
    # from `e2e`: it needs its own compose project on its own runner. Only one
    # standalone stack can be up per host, because oidc-mock's port 9400 cannot
    # be remapped (the issuer comes from the Host header).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The web and worker images build from repo-root context.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Pre-pull the pinned Playwright container
        # Replaces `npx playwright install --with-deps chromium` — see the
        # `chat-stream` job's copy of this step for the reasoning. Bounded and
        # non-fatal: the script's `docker run` pulls inline if this fails.
        run: |
          timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.0-noble \
            || echo "::warning::pull of the pinned Playwright image failed or timed out; the journey step will pull it inline"
      - name: Run the journey against a fresh standalone stack
        # The script owns the whole lifecycle: runtime PKI, build, compose up,
        # four seed steps, the embedding-path assertions, then Playwright. It
        # uses its own compose project and tears down on exit.
        #
        # PLAYWRIGHT_CONTAINER_IMAGE containerises the test run; the tag lives
        # HERE so scripts/check-playwright-image-tag.mjs (which only scans
        # .github/workflows/) keeps gating it — see the `chat-stream` job.
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          INDEX_STREAM_PROJECT: elitea-indexstream-ci
          INDEX_STREAM_PORT: "8087"
          INDEX_STREAM_MOCK_PORT: "8091"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble
        run: bash apps/elitea-web/scripts/index-stream-e2e.sh
      - name: Give the report back to the runner user
        # Same root-owned-report trap and fix as the `e2e` and `chat-stream`
        # jobs.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-index-stream
          path: apps/elitea-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual regression
    # Release tags, pull requests, and manual dispatch.
    #
    # It used to be `startsWith(github.ref, 'refs/tags/v')` alone, and the `on:`
    # block admits no `v*` tag that has ever been cut — so from the day it was
    # written until run 31345403013 this job had never executed a single test
    # (issue #159). It was not dormant-but-correct: the first run found a
    # committed baseline that was a photograph of a loading spinner, and a
    # second, independent unmasked-wall-clock defect on the same screen. A job
    # nobody has watched run is a job whose correctness is unknown, and the
    # tag build is the worst place to find out.
    #
    # So the job-level guard is gone, exactly as #158 removed the identical one
    # from `e2e`: this job now runs wherever the `on:` block fires — every
    # matching PR, pushes to main, `v*` tags, and manual dispatch. ~4 min, one
    # engine, no matrix; cheaper than either E2E leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci

      # The tag below is asserted against package.json's pinned
      # @playwright/test, so a version bump cannot silently leave baselines
      # being compared against a different browser build (issue #61, item 4).
      - name: Playwright container tag matches the pinned library
        run: node scripts/check-playwright-image-tag.mjs

      # The stack comes up on the HOST: scripts/e2e-stack.sh needs a container
      # runtime, and a job `container:` would be docker-in-docker AND would not
      # share the runner's network namespace, so BASE_URL=localhost:8082 could
      # not reach it (issue #61, item 2).
      # The pinned Playwright image is pulled in the background here for the same
      # reason the `e2e` job pulls it during its build step: `up` spends ~160s
      # building the stack's two images from the compose `build:` stanzas, which
      # is CPU-bound, while the ~27s pull is network-bound. Overlapping them
      # takes the pull off the critical path of the snapshot step below.
      - name: Bring up the E2E stack (host)
        env:
          COMPOSE_BIN: docker compose
        run: |
          # Bounded and non-fatal for the reason given on the `e2e` job's copy:
          # the snapshot step's `docker run` pulls the image itself if this
          # fails, so the optimisation can never cost the run.
          (
            timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.0-noble \
              || echo "::warning::background pull of the pinned Playwright image failed or timed out; the snapshot step will pull it inline"
          ) &
          pw_pull=$!
          # ONE COMMAND PER LINE, and not `up && seed` (issue #422).
          #
          # GitHub runs this block with `bash -e`. `errexit` does not act on a
          # command that is a non-final member of an AND list, so a failed `up`
          # did not stop the step: `seed` was skipped and the step took its
          # status from the last command instead. That last command is
          # `wait "$pw_pull"`, and the background job is a subshell that ends in
          # `|| echo`, so it always exits 0. The step therefore reported success
          # on a stack that never came up and was never seeded, and the failure
          # first appeared in the snapshot step as an unreachable base URL.
          #
          # Written as two simple commands, `errexit` acts on each one.
          ./scripts/e2e-stack.sh up
          ./scripts/e2e-stack.sh seed
          # Only joins the background pull; the subshell swallows its own
          # failure, so this cannot fail the step and must not be the last word
          # on whether the stack came up.
          wait "$pw_pull"

      # Only the TEST RUN is containerised, in the image pinned to the same
      # Playwright version, because baselines are only comparable when one fixed
      # font stack rasterises them. A bare `npx playwright test` on the runner's
      # own OS is what this issue calls "the main thing that will make this suite
      # useless if skipped" (issue #61, item 1).
      #
      # E2E_REUSE_STACK=1 stops Playwright trying to start the stack a second
      # time from inside a container that has no container runtime — see
      # playwright.config.ts's webServer.reuseExistingServer comment.
      #
      # No explicit `docker build` here, unlike the `e2e` job above. Measured,
      # not assumed (run 31345403013): compose tries the registry first, logs
      #   elitea-web  Warning Head "https://ghcr.io/v2/…/elitea-web/manifests/e2e": denied
      #   elitea-main Warning Head "https://ghcr.io/v2/…/elitea-main/manifests/e2e": unauthorized
      # and then BUILDS both from the `build:` stanzas that #154 added to
      # deploy/docker-compose.e2e-standalone.yml, which is why the whole stack
      # came up healthy and seven tests ran. `e2e`'s two explicit builds are
      # belt-and-braces for a job with a matrix; this one does not need them.
      # Keep the committed baselines aside BEFORE the suite overwrites them in
      # place. Without this copy there is nothing left to compare the
      # regenerated tree against, because the regeneration writes over the very
      # files that were the reference.
      - name: Keep the committed baselines for comparison
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true }}
        working-directory: apps/elitea-web
        run: cp -r e2e/snapshots /tmp/committed-snapshots

      - name: Snapshot suite (pinned container, host network)
        env:
          # Baseline-regeneration mode. Manual dispatch only — `inputs` is null
          # on every other event, so a tag build or a PR can never take this
          # branch. See the `on:` input's description for why that matters.
          UPDATE_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true }}
          FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_visual_refresh == true }}
        run: |
          test -d e2e/visual || { echo "release tag without a visual suite (unit V2) — refusing"; exit 1; }
          if [ "$UPDATE_BASELINES" = "true" ]; then
            echo "::warning::Baseline-regeneration mode — this run CANNOT fail on a snapshot diff."
            if [ "$FULL_REFRESH" = "true" ]; then
              # `all`, not `changed`: a snapshot that PASSES is never rewritten,
              # so `changed` cannot refresh a baseline that drifted under the
              # maxDiffPixels budget. That drift is exactly what this mode is
              # for, and it is invisible to every green run until someone looks.
              echo "::warning::FULL refresh — every baseline is rewritten, including ones that pass."
              update_arg="--update-snapshots=all"
            else
              update_arg="--update-snapshots=changed"
            fi
          else
            update_arg=""
            if [ "$FULL_REFRESH" = "true" ]; then
              echo "full_visual_refresh needs update_visual_baselines; it does nothing on its own" >&2
              exit 1
            fi
          fi
          # -e E2E_TZ: the browser must run in the same zone the seed anchored
          # its calendar-day fixtures in (issue #214). UTC on both sides by
          # default; see the `e2e` job's copy of this note.
          docker run --rm --network host \
            -v "$PWD":/work -w /work \
            -e CI=1 -e E2E_REUSE_STACK=1 \
            -e E2E_TZ="${E2E_TZ:-UTC}" \
            mcr.microsoft.com/playwright:v1.62.0-noble \
            npx playwright test --grep @visual $update_arg

      # What actually moved, by PIXELS. A regeneration re-encodes every PNG, so
      # `git status` and any byte comparison call all of them changed — measured
      # on #238, 37 files reported for 18 real movements, with admin pages and
      # the collapsed rail among the false ones. A reviewer handed that list
      # cannot find the real change in it.
      #
      # It runs on the HOST rather than in the container: the comparison only
      # reads PNGs and reuses playwright-core's own comparator, so it needs no
      # browser, and the count it prints is the count the gate would compute.
      #
      # `|| true` because the script exits non-zero whenever anything differs,
      # which in this mode is the normal and expected outcome, not a failure.
      - name: Report what the regeneration changed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true }}
        working-directory: apps/elitea-web
        run: node scripts/compare-visual-baselines.mjs e2e/snapshots /tmp/committed-snapshots || true

      # A snapshot diff is unreviewable as prose: "183 pixels (ratio 0.01) are
      # different" tells a reviewer that something moved, never what. The only
      # way to decide whether a diff is a regression or an intended change is to
      # look at the three images, so the run has to hand them over.
      #
      # Both paths, for the reason spelled out on the E2E job's copy of this
      # step: `playwright-results/` holds the raw `-actual`/`-expected`/`-diff`
      # PNGs, and `playwright-report/` is the HTML report that puts them
      # side by side with a slider. The report was being generated and
      # discarded.
      #
      # `warn`, not `ignore`: a visual job that fails while producing NO
      # evidence at all is a different and more alarming failure than a
      # snapshot diff — the stack never came up, or the container wrote
      # nowhere — and silently uploading nothing is how that gets mistaken for
      # the ordinary case. `warn` surfaces it in the log without failing the
      # job a second time for the same reason.
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            apps/elitea-web/playwright-results/
            apps/elitea-web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # The ONLY sanctioned way to produce a baseline. A PNG rendered by a
      # laptop's font stack and committed here makes every future comparison
      # meaningless, so the regenerated files come back out of the pinned
      # container as an artifact for a human to download, eyeball and commit —
      # they are never written to the repo by CI.
      - name: Upload regenerated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: apps/elitea-web/e2e/snapshots/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down E2E stack
        if: always()
        env:
          COMPOSE_BIN: docker compose
        run: ./scripts/e2e-stack.sh down
