# Cross-Origin-Opener-Policy for elitea-web.
#
# Kept apart from `security-headers.conf` because two locations in spa.conf must
# NOT send it: `/app/auth-callback` and `/app/mcp-auth-callback`. Read on before
# you fold this line back into that file.
#
# WHAT COOP DOES TO AN OAUTH POPUP. Each callback route is the landing page of a
# popup. That popup goes to another origin first: the identity provider, or the
# MCP server's own consent pages. Then it comes back here. The browser compares
# the COOP of each document it loads in that window with the COOP of the
# document before it. A cross-origin provider page sends none. So a callback
# page that sends one lands in a NEW browsing context group, and the browser
# severs the opener link.
#
# MEASURED, Playwright 1.62, chromium and webkit, three hops (app -> foreign
# origin -> callback):
#
#   app page COOP            callback COOP            window.opener   opener sees popup.closed
#   same-origin              same-origin              null            true (while the popup is open)
#   same-origin              (absent)                 null            true
#   same-origin-allow-popups same-origin-allow-popups null            —
#   same-origin-allow-popups (absent)                 present         false
#
# Both engines agree on every row. The consequences of a severed opener are not
# cosmetic:
#
#   * `routes/auth-callback.tsx` closes the popup only when `window.opener` is
#     present, so the popup stays on screen after a successful login.
#   * `shared/api/auth/popup.ts` polls `popupWindow.closed`. A severed handle
#     reads `true`, so the controller reports `popup_closed` and FAILS a
#     re-authentication the user in fact completed.
#   * `opener.postMessage` — the first of the three result channels in
#     `shared/api/auth/callback.ts` — cannot deliver.
#
# So the value is `same-origin-allow-popups`, and the two callback locations
# send nothing. That still stops a cross-origin document that opens THIS app
# from reaching its window, which is the protection COOP is here for.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
