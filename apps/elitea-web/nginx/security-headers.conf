# Response hardening for every elitea-web location.
#
# WHY A SEPARATE FILE. nginx `add_header` does not merge across levels: a
# `location` that declares one `add_header` of its own drops EVERY inherited
# `add_header` from the enclosing `server`. All five locations in spa.conf set a
# Cache-Control header, so a server-level block would reach none of them. This
# file is included by each location instead, so the set cannot drift apart.
#
# WHAT THIS FIXES. The SPA shell held the session cookie and ran all of the
# application JavaScript with no security headers at all, while the login pages
# that elitea-main serves carried a full Content-Security-Policy. Measured on a
# live deployment: `curl -I https://<host>/app/` returned only accept-ranges,
# cache-control, content-type, date, etag, last-modified and server.
#
# WHY THE POLICY STOPS WHERE IT DOES. `vite_server_url` and
# `vite_socket_server` come from the environment at container start
# (docker-entrypoint.sh), so a deployment may point the SPA at a different
# origin for the API or the socket. A `connect-src`, `script-src` or `img-src`
# directive written here cannot know that origin and would break exactly those
# deployments. The four directives below constrain no resource this application
# loads, so they are safe on every deployment:
#
#   default-src 'none'  is NOT used, for the same reason.
#   base-uri 'self'     stops an injected <base> from re-pointing every
#                       relative asset and API path at an attacker origin.
#   object-src 'none'   removes the <object>/<embed> plugin surface; the SPA
#                       uses neither.
#   frame-ancestors     blocks clickjacking of an authenticated session.
#   form-action 'self'  keeps a form POST on this origin.
#
# Extend this file with script-src and connect-src once the runtime API origin
# is rendered into the config (the same place docker-entrypoint.sh writes
# config.js), not before.
#
# CROSS-ORIGIN-OPENER-POLICY IS NOT HERE. It lives in `opener-isolation.conf`,
# because the two OAuth popup landing pages must not carry it. That file
# records the measurement.
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

# X-Frame-Options repeats frame-ancestors for user agents that do not implement
# CSP level 2. The two never disagree.
add_header X-Frame-Options "DENY" always;

# The SPA serves user-supplied artifact names and brand assets. nosniff stops a
# response typed text/plain from being executed as script.
add_header X-Content-Type-Options "nosniff" always;

# Application URLs carry conversation, project and toolkit identifiers in the
# query string. no-referrer keeps them out of third-party logs. The login pages
# elitea-main serves already set this value.
add_header Referrer-Policy "no-referrer" always;

# The voice features need the microphone, so microphone is deliberately absent
# from this list. The application asks for none of the capabilities below.
add_header Permissions-Policy "geolocation=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
