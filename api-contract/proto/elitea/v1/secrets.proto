syntax = "proto3";

package elitea.v1.secrets;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/eliteaai/elitea-main/gen/elitea/v1/secrets;secretsv1";

// ── Request / Response messages ───────────────────────────────────────────────

// ListSecretsRequest identifies the project whose secrets should be listed.
message ListSecretsRequest {
  // project_id maps to the {projectId} path parameter.
  string project_id = 1;
}

// ListSecretsResponse wraps the array of secret objects returned by the API.
// The exact shape of each element is defined by the upstream service, so each
// item is represented as a google.protobuf.Struct.
message ListSecretsResponse {
  repeated google.protobuf.Struct secrets = 1;
}

// AddSecretRequest carries the required fields to create a new secret.
message AddSecretRequest {
  // project_id maps to the {projectId} path parameter.
  string project_id = 1;
  // name is the unique identifier for the secret within the project.
  string name = 2;
  // value is the secret payload.
  string value = 3;
}

// AddSecretResponse wraps the newly created secret object returned by the API.
message AddSecretResponse {
  google.protobuf.Struct secret = 1;
}

// EditSecretRequest carries the fields needed to update an existing secret.
message EditSecretRequest {
  // project_id maps to the {projectId} path parameter.
  string project_id = 1;
  // name maps to the {name} path parameter and identifies the secret.
  string name = 2;
  // value is the new secret payload. Optional — omit to leave the value
  // unchanged while still triggering any update side-effects.
  optional string value = 3;
}

// EditSecretResponse wraps the updated secret object returned by the API.
message EditSecretResponse {
  google.protobuf.Struct secret = 1;
}

// DeleteSecretRequest identifies the secret to be removed.
message DeleteSecretRequest {
  // project_id maps to the {projectId} path parameter.
  string project_id = 1;
  // name maps to the {name} path parameter.
  string name = 2;
}

// DeleteSecretResponse wraps the result object returned by the API after
// a successful deletion.
message DeleteSecretResponse {
  google.protobuf.Struct result = 1;
}

// ShowSecretRequest identifies the secret whose plaintext value should be
// revealed.
message ShowSecretRequest {
  // project_id maps to the {projectId} path parameter.
  string project_id = 1;
  // name maps to the {name} path parameter.
  string name = 2;
}

// ShowSecretResponse wraps the secret object with its value exposed.
message ShowSecretResponse {
  google.protobuf.Struct secret = 1;
}

// HideSecretRequest carries the fields needed to conceal a secret's value.
// An optional value may be supplied to atomically update the secret before
// hiding it.
message HideSecretRequest {
  // project_id maps to the {projectId} path parameter.
  string project_id = 1;
  // name maps to the {name} path parameter.
  string name = 2;
  // value is the new secret payload to store before hiding. Optional.
  optional string value = 3;
}

// HideSecretResponse wraps the updated secret object with the value concealed.
message HideSecretResponse {
  google.protobuf.Struct secret = 1;
}

// ── Service ───────────────────────────────────────────────────────────────────

// SecretsService manages project-scoped secrets in the Elitea platform.
// All operations are namespaced under the "default" scope in the URL path.
service SecretsService {
  // ListSecrets returns all secrets belonging to the given project.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {
      get: "/api/v2/secrets/secrets/default/{project_id}"
    };
  }

  // AddSecret creates a new secret in the given project.
  rpc AddSecret(AddSecretRequest) returns (AddSecretResponse) {
    option (google.api.http) = {
      post: "/api/v2/secrets/secrets/default/{project_id}"
      body: "*"
    };
  }

  // EditSecret updates the value of an existing secret identified by name.
  rpc EditSecret(EditSecretRequest) returns (EditSecretResponse) {
    option (google.api.http) = {
      put: "/api/v2/secrets/secret/default/{project_id}/{name}"
      body: "*"
    };
  }

  // DeleteSecret removes the named secret from the given project.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {
      delete: "/api/v2/secrets/secret/default/{project_id}/{name}"
    };
  }

  // ShowSecret reveals the plaintext value of the named secret.
  rpc ShowSecret(ShowSecretRequest) returns (ShowSecretResponse) {
    option (google.api.http) = {
      get: "/api/v2/secrets/secret/default/{project_id}/{name}"
    };
  }

  // HideSecret conceals the value of the named secret, optionally updating it
  // first if a new value is provided in the request body.
  rpc HideSecret(HideSecretRequest) returns (HideSecretResponse) {
    option (google.api.http) = {
      post: "/api/v2/secrets/hide/default/{project_id}/{name}"
      body: "*"
    };
  }
}
