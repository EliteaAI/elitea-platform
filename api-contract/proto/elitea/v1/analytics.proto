syntax = "proto3";

package elitea.v1.analytics;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/eliteaai/elitea-main/gen/go/elitea/v1/analytics;analyticsv1";

// AnalyticsService handles all analytics endpoints for the Elitea prompt library.
service AnalyticsService {
  // GetProjectAnalytics returns aggregated analytics for a project's prompt library.
  rpc GetProjectAnalytics(GetProjectAnalyticsRequest) returns (GetProjectAnalyticsResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics/prompt_lib/{project_id}"
    };
  }

  // ListAnalyticsUsers returns paginated user analytics for a project's prompt library.
  rpc ListAnalyticsUsers(ListAnalyticsUsersRequest) returns (ListAnalyticsUsersResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics_users/prompt_lib/{project_id}"
    };
  }

  // GetAnalyticsUserDetail returns detailed analytics for a specific user within a project.
  rpc GetAnalyticsUserDetail(GetAnalyticsUserDetailRequest) returns (GetAnalyticsUserDetailResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics_user_detail/prompt_lib/{project_id}"
    };
  }

  // ListAnalyticsTools returns paginated tool analytics for a project's prompt library.
  rpc ListAnalyticsTools(ListAnalyticsToolsRequest) returns (ListAnalyticsToolsResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics_tools/prompt_lib/{project_id}"
    };
  }

  // GetAnalyticsToolDetail returns detailed analytics for a specific tool within a project.
  rpc GetAnalyticsToolDetail(GetAnalyticsToolDetailRequest) returns (GetAnalyticsToolDetailResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics_tool_detail/prompt_lib/{project_id}"
    };
  }

  // ListAnalyticsAgents returns paginated agent analytics for a project's prompt library.
  rpc ListAnalyticsAgents(ListAnalyticsAgentsRequest) returns (ListAnalyticsAgentsResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics_agents/prompt_lib/{project_id}"
    };
  }

  // GetAnalyticsAgentDetail returns detailed analytics for a specific agent within a project.
  rpc GetAnalyticsAgentDetail(GetAnalyticsAgentDetailRequest) returns (GetAnalyticsAgentDetailResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/analytics_agent_detail/prompt_lib/{project_id}"
    };
  }
}

// -----------------------------------------------------------------------------
// GetProjectAnalytics
// GET /api/v2/elitea_core/analytics/prompt_lib/{projectId}
// -----------------------------------------------------------------------------

// GetProjectAnalyticsRequest is the request message for the GetProjectAnalytics RPC.
message GetProjectAnalyticsRequest {
  // project_id is the path parameter identifying the target project.
  string project_id = 1;

  // date_from is the inclusive start of the date range filter (ISO 8601 string, e.g. "2024-01-01").
  string date_from = 2;

  // date_to is the inclusive end of the date range filter (ISO 8601 string, e.g. "2024-12-31").
  string date_to = 3;
}

// GetProjectAnalyticsResponse wraps the dynamic analytics object returned by the server.
// The shape of the payload varies by project configuration, so it is represented as a
// google.protobuf.Struct to preserve full fidelity of the JSON response.
message GetProjectAnalyticsResponse {
  // data holds the dynamic analytics payload.
  google.protobuf.Struct data = 1;
}

// -----------------------------------------------------------------------------
// ListAnalyticsUsers
// GET /api/v2/elitea_core/analytics_users/prompt_lib/{projectId}
// -----------------------------------------------------------------------------

// ListAnalyticsUsersRequest is the request message for the ListAnalyticsUsers RPC.
message ListAnalyticsUsersRequest {
  // project_id is the path parameter identifying the target project.
  string project_id = 1;

  // date_from is the inclusive start of the date range filter (ISO 8601 string).
  string date_from = 2;

  // date_to is the inclusive end of the date range filter (ISO 8601 string).
  string date_to = 3;

  // limit is the maximum number of rows to return (pagination page size).
  int32 limit = 4;

  // offset is the zero-based number of rows to skip before returning results.
  int32 offset = 5;

  // search is an optional free-text search term applied server-side.
  string search = 6;

  // sort_by specifies the field name to sort results by.
  string sort_by = 7;

  // sort_order specifies the sort direction; expected values are "asc" or "desc".
  string sort_order = 8;
}

// ListAnalyticsUsersResponse is the paginated response for the ListAnalyticsUsers RPC.
message ListAnalyticsUsersResponse {
  // rows contains the page of user analytics records.
  // Each element is a dynamic object whose schema is defined by the server.
  repeated google.protobuf.Struct rows = 1;

  // total is the total count of matching records across all pages.
  int32 total = 2;
}

// -----------------------------------------------------------------------------
// GetAnalyticsUserDetail
// GET /api/v2/elitea_core/analytics_user_detail/prompt_lib/{projectId}
// -----------------------------------------------------------------------------

// GetAnalyticsUserDetailRequest is the request message for the GetAnalyticsUserDetail RPC.
message GetAnalyticsUserDetailRequest {
  // project_id is the path parameter identifying the target project.
  string project_id = 1;

  // user_id identifies the user whose detail is requested.
  // The API accepts either a string username/email or a numeric identifier,
  // so a oneof is used to capture both forms at the proto layer.
  oneof user_id {
    // user_id_string is used when the caller supplies a string identifier.
    string user_id_string = 2;

    // user_id_int is used when the caller supplies a numeric identifier.
    int64 user_id_int = 3;
  }

  // date_from is the inclusive start of the date range filter (ISO 8601 string).
  string date_from = 4;

  // date_to is the inclusive end of the date range filter (ISO 8601 string).
  string date_to = 5;
}

// GetAnalyticsUserDetailResponse wraps the dynamic user detail analytics payload.
message GetAnalyticsUserDetailResponse {
  // data holds the dynamic user detail analytics payload.
  google.protobuf.Struct data = 1;
}

