syntax = "proto3";

package elitea.v1.skills;

option go_package = "github.com/EliteaAI/elitea-platform/services/elitea-main/pkg/proto/skills;skillspb";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// ---------------------------------------------------------------------------
// Shared / reusable messages
// ---------------------------------------------------------------------------

// Paginated list response wrapper reused by skillList and getSkillIcons.
// The rows field carries opaque JSON objects because skill/icon schemas are
// dynamic; callers decode them independently.
message PaginatedResponse {
  repeated google.protobuf.Struct rows = 1;
  int32 total                          = 2;
  bool is_load_more                    = 3;
}

// A minimal ID-only response used by create operations that return just the
// newly-created resource identifier.
message IdResponse {
  string id = 1;
}

// Generic empty-body success response for operations that return no payload
// (DELETE, PATCH, PUT with no meaningful response body).
message EmptyResponse {}

// ---------------------------------------------------------------------------
// Generate Skill Draft
// POST /api/v2/elitea_core/generate_skill_draft/prompt_lib/{project_id}
// ---------------------------------------------------------------------------

message GenerateSkillDraftRequest {
  string                project_id = 1;
  google.protobuf.Struct body      = 2;
}

message GenerateSkillDraftResponse {
  google.protobuf.Struct result = 1;
}

// ---------------------------------------------------------------------------
// Skill List
// GET /api/v2/elitea_core/skills/prompt_lib/{project_id}
// ---------------------------------------------------------------------------

message SkillListRequest {
  string project_id  = 1;
  string sort_by     = 2;
  string sort_order  = 3;
  int32  limit       = 4;
  int32  offset      = 5;
}

// Response reuses PaginatedResponse.

// ---------------------------------------------------------------------------
// Total Skills (reuses SkillListRequest with limit/offset only)
// GET /api/v2/elitea_core/skills/prompt_lib/{project_id}
// ---------------------------------------------------------------------------

message TotalSkillsRequest {
  string project_id = 1;
  int32  limit      = 2;
  int32  offset     = 3;
}

message TotalSkillsResponse {
  int32 total = 1;
}

// ---------------------------------------------------------------------------
// Skill Create
// POST /api/v2/elitea_core/skills/prompt_lib/{project_id}
// ---------------------------------------------------------------------------

message SkillCreateRequest {
  string                        project_id   = 1;
  string                        name         = 2;
  string                        description  = 3;
  repeated google.protobuf.Struct versions   = 4;
  string                        instructions = 5;
}

// Response reuses IdResponse.

// ---------------------------------------------------------------------------
// Skill Details
// GET /api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}/{version_id}
// ---------------------------------------------------------------------------

message SkillDetailsRequest {
  string project_id = 1;
  string skill_id   = 2;
  string version_id = 3;
}

message SkillDetailsResponse {
  string                 id              = 1;
  google.protobuf.Struct version_details = 2;
}

// ---------------------------------------------------------------------------
// Skill Create Version
// POST /api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}
// ---------------------------------------------------------------------------

message SkillCreateVersionRequest {
  string                        project_id   = 1;
  string                        skill_id     = 2;
  string                        name         = 3;
  string                        instructions = 4;
  repeated string               tags         = 5;
  google.protobuf.Struct        meta         = 6;
}

// Response reuses IdResponse.

// ---------------------------------------------------------------------------
// Skill Update
// PUT /api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}/{version_id}
// ---------------------------------------------------------------------------

message SkillUpdateRequest {
  string                 project_id = 1;
  string                 skill_id   = 2;
  string                 version_id = 3;
  google.protobuf.Struct body       = 4;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Delete Skill
// DELETE /api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}/{version_id}
// ---------------------------------------------------------------------------

message DeleteSkillRequest {
  string project_id = 1;
  string skill_id   = 2;
  string version_id = 3;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Set Skill Default Version
// PATCH /api/v2/elitea_core/skill_default_version/prompt_lib/{project_id}/{skill_id}
// ---------------------------------------------------------------------------

message SetSkillDefaultVersionRequest {
  string project_id  = 1;
  string skill_id    = 2;
  string version_id  = 3;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Skill Export Markdown (server-side streaming download)
// GET /api/v2/elitea_core/skill_export/prompt_lib/{project_id}/{skill_id}/{version_id}
// ---------------------------------------------------------------------------

message SkillExportMdRequest {
  string project_id = 1;
  string skill_id   = 2;
  string version_id = 3;
}

// Each streamed chunk carries a piece of the file body plus optional metadata
// on the first message.
message SkillExportMdChunk {
  bytes  blob         = 1;
  string filename     = 2;
  string content_type = 3;
}

// ---------------------------------------------------------------------------
// Skill Import
// POST /api/v2/elitea_core/skill_import/prompt_lib/{project_id}
// ---------------------------------------------------------------------------

// The import endpoint accepts either a raw file upload or inline text content.
// grpc-gateway handles multipart/form-data via HttpBody; the oneof here
// captures the two logical alternatives at the proto-contract level.
message SkillImportRequest {
  string project_id = 1;
  string filename   = 2;

  oneof source {
    // Raw file bytes when uploading a file.
    bytes  file    = 3;
    // Inline markdown/text content.
    string content = 4;
  }
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Update Skill Relation
// PATCH /api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}
// ---------------------------------------------------------------------------

message UpdateSkillRelationRequest {
  string project_id        = 1;
  string skill_id          = 2;
  bool   has_relation      = 3;
  string entity_version_id = 4;
  string skill_version_id  = 5;
  string entity_type       = 6;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Get Application Skills
// GET /api/v2/elitea_core/application_skills/prompt_lib/{project_id}/{app_version_id}
// ---------------------------------------------------------------------------

message GetApplicationSkillsRequest {
  string project_id     = 1;
  string app_version_id = 2;
}

message GetApplicationSkillsResponse {
  repeated google.protobuf.Struct items = 1;
}

// ---------------------------------------------------------------------------
// Get Skill Icons
// GET /api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}
// ---------------------------------------------------------------------------

message GetSkillIconsRequest {
  string project_id = 1;
  int32  limit      = 2;
  int32  skip       = 3;
}

// Response reuses PaginatedResponse.

// ---------------------------------------------------------------------------
// Upload Skill Icon
// POST /api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}/{version_id}
// ---------------------------------------------------------------------------

message UploadSkillIconRequest {
  string project_id = 1;
  string version_id = 2;
  // Raw bytes of one or more icon files (multipart flattened to bytes).
  repeated bytes file = 3;
  int32  width        = 4;
  int32  height       = 5;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Replace Skill Icon
// PUT /api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}/{version_id}
// ---------------------------------------------------------------------------

message ReplaceSkillIconRequest {
  string                 project_id = 1;
  string                 version_id = 2;
  google.protobuf.Struct body       = 3;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Delete Skill Icon
// DELETE /api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}/{name}
// ---------------------------------------------------------------------------

message DeleteSkillIconRequest {
  string project_id = 1;
  string name       = 2;
}

// Response reuses EmptyResponse.

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service SkillsService {

  // Generate an AI-assisted draft for a new skill.
  rpc GenerateSkillDraft(GenerateSkillDraftRequest) returns (GenerateSkillDraftResponse) {
    option (google.api.http) = {
      post: "/api/v2/elitea_core/generate_skill_draft/prompt_lib/{project_id}"
      body: "body"
    };
  }

  // List skills for a project with sorting and pagination.
  rpc SkillList(SkillListRequest) returns (PaginatedResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/skills/prompt_lib/{project_id}"
    };
  }

  // Return only the total count of skills (lightweight version of SkillList).
  rpc TotalSkills(TotalSkillsRequest) returns (TotalSkillsResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/skills/prompt_lib/{project_id}/total"
    };
  }

  // Create a new skill.
  rpc SkillCreate(SkillCreateRequest) returns (IdResponse) {
    option (google.api.http) = {
      post: "/api/v2/elitea_core/skills/prompt_lib/{project_id}"
      body: "*"
    };
  }

  // Retrieve a specific skill version.
  rpc SkillDetails(SkillDetailsRequest) returns (SkillDetailsResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}/{version_id}"
    };
  }

  // Create a new version of an existing skill.
  rpc SkillCreateVersion(SkillCreateVersionRequest) returns (IdResponse) {
    option (google.api.http) = {
      post: "/api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}"
      body: "*"
    };
  }

  // Update a skill version.
  rpc SkillUpdate(SkillUpdateRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      put: "/api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}/{version_id}"
      body: "body"
    };
  }

  // Delete a skill version.
  rpc DeleteSkill(DeleteSkillRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      delete: "/api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}/{version_id}"
    };
  }

  // Set the default version for a skill.
  rpc SetSkillDefaultVersion(SetSkillDefaultVersionRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      patch: "/api/v2/elitea_core/skill_default_version/prompt_lib/{project_id}/{skill_id}"
      body: "*"
    };
  }

  // Export a skill version as a Markdown file (server-side streaming).
  rpc SkillExportMd(SkillExportMdRequest) returns (stream SkillExportMdChunk) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/skill_export/prompt_lib/{project_id}/{skill_id}/{version_id}"
    };
  }

  // Import a skill from a file or inline content.
  rpc SkillImport(SkillImportRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      post: "/api/v2/elitea_core/skill_import/prompt_lib/{project_id}"
      body: "*"
    };
  }

  // Add or remove a relation between a skill and another entity.
  rpc UpdateSkillRelation(UpdateSkillRelationRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      patch: "/api/v2/elitea_core/skill/prompt_lib/{project_id}/{skill_id}"
      body: "*"
    };
  }

  // Retrieve all skills attached to a specific application version.
  rpc GetApplicationSkills(GetApplicationSkillsRequest) returns (GetApplicationSkillsResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/application_skills/prompt_lib/{project_id}/{app_version_id}"
    };
  }

  // List uploaded skill icons for a project.
  rpc GetSkillIcons(GetSkillIconsRequest) returns (PaginatedResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}"
    };
  }

  // Upload one or more skill icon images.
  rpc UploadSkillIcon(UploadSkillIconRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      post: "/api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}/{version_id}"
      body: "*"
    };
  }

  // Replace an existing skill icon.
  rpc ReplaceSkillIcon(ReplaceSkillIconRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      put: "/api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}/{version_id}"
      body: "body"
    };
  }

  // Delete a skill icon by name.
  rpc DeleteSkillIcon(DeleteSkillIconRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      delete: "/api/v2/elitea_core/upload_skill_icon/prompt_lib/{project_id}/{name}"
    };
  }
}
