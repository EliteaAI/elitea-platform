syntax = "proto3";

package elitea.v1.artifacts;

option go_package = "github.com/eliteaai/elitea/gen/go/elitea/v1/artifacts;artifactsv1";
option java_multiple_files = true;
option java_outer_classname = "ArtifactsProto";
option java_package = "ai.elitea.v1.artifacts";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ============================================================
// Domain models
// ============================================================

// Bucket is a named storage container within a project.
message Bucket {
  // Opaque server-assigned identifier.
  string id = 1;

  string name = 2;

  // When true, the bucket is displayed prominently in the UI.
  bool is_pinned = 3;

  // UID of the storage integration backing this bucket.
  string integration_uid = 4;

  string description = 5;

  string project_id = 6;

  string owner = 7;

  google.protobuf.Timestamp created_at = 8;

  google.protobuf.Timestamp updated_at = 9;

  // Provider-specific metadata returned by the storage backend.
  google.protobuf.Struct extra = 10;
}

// Artifact is a single file stored inside a bucket.
message Artifact {
  // File name (may be URL-encoded when used as a query parameter).
  string name = 1;

  // File size in bytes.
  int64 size = 2;

  // MIME type of the file.
  string content_type = 3;

  // Name of the bucket that contains this artifact.
  string bucket = 4;

  // Pre-signed or direct download URL.
  string url = 5;

  // True when the artifact is stored in a local (non-cloud) location.
  bool is_local = 6;

  // Integration ID that manages the underlying storage.
  string integration_id = 7;

  google.protobuf.Timestamp last_modified = 8;

  // Provider-specific metadata.
  google.protobuf.Struct extra = 9;
}

// ============================================================
// Bucket messages
// ============================================================

// ----- BucketList -----

// BucketListRequest maps to GET /artifacts/s3/
message BucketListRequest {
  // Owning project's ID (query parameter).
  string project_id = 1;

  // Response format. Fixed value "json" in practice (query parameter).
  string format = 2;
}

message BucketListResponse {
  repeated Bucket items = 1;
}

// ----- BucketConfig (shared by CreateBucket and EditBucket) -----

// BucketConfig carries the mutable fields for bucket creation and update.
message BucketConfig {
  string name = 1;

  // UID of the storage integration to use.
  string integration_uid = 2;

  string description = 3;

  // Free-form provider-specific settings.
  google.protobuf.Struct settings = 4;
}

// ----- CreateBucket -----

// CreateBucketRequest maps to POST /api/v2/artifacts/buckets/default/{project_id}
message CreateBucketRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Bucket configuration (request body, spread as top-level JSON object).
  BucketConfig body = 2;
}

message CreateBucketResponse {
  Bucket bucket = 1;
}

// ----- EditBucket -----

// EditBucketRequest maps to PUT /api/v2/artifacts/buckets/default/{project_id}
message EditBucketRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Replacement bucket configuration (request body).
  BucketConfig body = 2;
}

message EditBucketResponse {
  Bucket bucket = 1;
}

// ----- UpdateBucketPin -----

// UpdateBucketPinBody carries only the fields sent in the PATCH body.
// Kept separate so that `name` remains a query parameter.
message UpdateBucketPinBody {
  bool is_pinned = 1;
}

// UpdateBucketPinRequest maps to PATCH /api/v2/artifacts/buckets/default/{project_id}
message UpdateBucketPinRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Bucket name (query parameter ?name=...).
  string name = 2;

  // Pin toggle (request body).
  UpdateBucketPinBody body = 3;
}

message UpdateBucketPinResponse {
  Bucket bucket = 1;
}

// ----- DeleteBucket -----

// DeleteBucketRequest maps to DELETE /api/v2/artifacts/buckets/default/{project_id}
message DeleteBucketRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Name of the bucket to delete (query parameter ?name=...).
  string name = 2;
}

message DeleteBucketResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================
// Artifact messages
// ============================================================

// ----- ArtifactList -----

// ArtifactListRequest maps to GET /artifacts/s3/{bucket}
message ArtifactListRequest {
  // Bucket name (path parameter).
  string bucket = 1;

  // Owning project's ID (query parameter).
  string project_id = 2;

  // Response format. Fixed value "json" in practice (query parameter).
  string format = 3;
}

message ArtifactListResponse {
  repeated Artifact items = 1;
}

// ----- CreateArtifact -----

// CreateArtifactRequest maps to POST /api/v2/artifacts/artifacts/default/{project_id}/{bucket}
//
// The HTTP layer must deliver this as multipart/form-data.
// grpc-gateway maps the binary "file" form-field to the `file` bytes field.
// The `filename` field carries the original file name reported by the client
// (sourced from the Content-Disposition header of the multipart part).
message CreateArtifactRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Bucket name (path parameter).
  string bucket = 2;

  // Raw file bytes (multipart/form-data "file" field).
  bytes file = 3;

  // Original file name to use when storing the artifact.
  string filename = 4;

  // When set to a non-zero value, existing attachments with the same name
  // are overwritten. Optional — omit to keep the default (no overwrite).
  optional int32 overwrite_attachments = 5;
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

// ----- DeleteArtifact -----

// DeleteArtifactRequest maps to DELETE /api/v2/artifacts/artifact/default/{project_id}/{bucket}
message DeleteArtifactRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Bucket name (path parameter).
  string bucket = 2;

  // Integration ID that owns the artifact (query parameter).
  string integration_id = 3;

  // True when the artifact lives in a local (non-cloud) storage location
  // (query parameter).
  bool is_local = 4;

  // URL-encoded name of the artifact to delete (query parameter).
  string filename = 5;
}

message DeleteArtifactResponse {
  bool success = 1;
  string message = 2;
}

// ----- DeleteArtifacts -----

// DeleteArtifactsRequest maps to DELETE /api/v2/artifacts/artifacts/default/{project_id}/{bucket}
//
// Filenames are passed as repeated query parameters.
// Legacy clients send them with the array notation fname[]=...; modern
// clients may omit the brackets: fname=file1&fname=file2.
// grpc-gateway maps both forms to the repeated `fnames` field.
message DeleteArtifactsRequest {
  // Project ID (path parameter).
  string project_id = 1;

  // Bucket name (path parameter).
  string bucket = 2;

  // URL-encoded filenames to delete (repeated query parameter "fname[]").
  repeated string fnames = 3;
}

message DeleteArtifactsResponse {
  bool success = 1;
  string message = 2;

  // Number of artifacts that were actually removed.
  int32 deleted_count = 3;
}

// ============================================================
// Service
// ============================================================

service ArtifactsService {

  // BucketList returns all storage buckets visible to the given project.
  //
  // GET /artifacts/s3/
  rpc BucketList(BucketListRequest) returns (BucketListResponse) {
    option (google.api.http) = {
      get: "/artifacts/s3"
    };
  }

  // CreateBucket creates a new storage bucket for the specified project.
  //
  // POST /api/v2/artifacts/buckets/default/{project_id}
  rpc CreateBucket(CreateBucketRequest) returns (CreateBucketResponse) {
    option (google.api.http) = {
      post: "/api/v2/artifacts/buckets/default/{project_id}"
      body: "body"
    };
  }

  // EditBucket fully replaces the configuration of an existing bucket.
  //
  // PUT /api/v2/artifacts/buckets/default/{project_id}
  rpc EditBucket(EditBucketRequest) returns (EditBucketResponse) {
    option (google.api.http) = {
      put: "/api/v2/artifacts/buckets/default/{project_id}"
      body: "body"
    };
  }

  // UpdateBucketPin toggles the pinned state of a named bucket.
  // The bucket name is identified via the ?name= query parameter; only
  // the `is_pinned` field is sent in the request body.
  //
  // PATCH /api/v2/artifacts/buckets/default/{project_id}
  rpc UpdateBucketPin(UpdateBucketPinRequest) returns (UpdateBucketPinResponse) {
    option (google.api.http) = {
      patch: "/api/v2/artifacts/buckets/default/{project_id}"
      body:  "body"
    };
  }

  // DeleteBucket removes a bucket and all of its contents from the project.
  // The bucket to delete is identified by the ?name= query parameter.
  //
  // DELETE /api/v2/artifacts/buckets/default/{project_id}
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse) {
    option (google.api.http) = {
      delete: "/api/v2/artifacts/buckets/default/{project_id}"
    };
  }

  // ArtifactList returns all artifacts stored in the specified bucket.
  //
  // GET /artifacts/s3/{bucket}
  rpc ArtifactList(ArtifactListRequest) returns (ArtifactListResponse) {
    option (google.api.http) = {
      get: "/artifacts/s3/{bucket}"
    };
  }

  // CreateArtifact uploads a file to the specified bucket.
  // The caller must send the request as multipart/form-data with the file
  // in a part named "file".
  //
  // POST /api/v2/artifacts/artifacts/default/{project_id}/{bucket}
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse) {
    option (google.api.http) = {
      post: "/api/v2/artifacts/artifacts/default/{project_id}/{bucket}"
      body: "*"
    };
  }

  // DeleteArtifact removes a single named artifact from a bucket.
  // The artifact is identified by its URL-encoded filename passed as the
  // ?filename= query parameter.
  //
  // DELETE /api/v2/artifacts/artifact/default/{project_id}/{bucket}
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse) {
    option (google.api.http) = {
      delete: "/api/v2/artifacts/artifact/default/{project_id}/{bucket}"
    };
  }

  // DeleteArtifacts removes multiple artifacts from a bucket in one request.
  // Each filename is passed as a separate ?fname= (or ?fname[]=) query parameter.
  //
  // DELETE /api/v2/artifacts/artifacts/default/{project_id}/{bucket}
  rpc DeleteArtifacts(DeleteArtifactsRequest) returns (DeleteArtifactsResponse) {
    option (google.api.http) = {
      delete: "/api/v2/artifacts/artifacts/default/{project_id}/{bucket}"
    };
  }
}
