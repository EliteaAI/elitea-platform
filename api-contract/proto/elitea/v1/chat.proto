// -----------------------------------------------------------------------------
// ListFolders — merges foldersList + folderConversations + dateGroupConversations
// -----------------------------------------------------------------------------

// All three GET /folder/{project_id} call variants map to this single RPC.
// The handler selects behaviour based on which optional fields are populated:
//   - neither folder_id nor date_group:  return flat folder list (foldersList)
//   - folder_id set:                     return paginated conversations in folder
//   - date_group set:                    return paginated conversations in date bucket
message ListFoldersRequest {
  int32  project_id = 1;
  // When true, the server groups results; mirrors the `grouped` query param.
  bool   grouped    = 2;
  // Set to retrieve conversations within a specific folder.
  string folder_id  = 3;
  // Set to retrieve conversations in a named date bucket (e.g. "today", "last_week").
  string date_group = 4;
  // Pagination.
  int32  limit      = 5;
  int32  offset     = 6;
  // Sorting.
  string sort_by    = 7;
  string sort_order = 8; // "asc" | "desc"
  // Full-text search (foldersList only).
  string search     = 9;
}

// ListFoldersResponse is a superset that covers all three response shapes.
// When returning folder objects, rows contains folders and total is the folder count.
// When returning paginated conversations, rows contains conversations.
message ListFoldersResponse {
  repeated google.protobuf.Struct rows  = 1;
  int32                           total = 2;
}

