// -----------------------------------------------------------------------------
// UploadAttachments
// -----------------------------------------------------------------------------

// FileUpload represents a single file in a multipart upload.
// The REST endpoint uses multipart/form-data; the gRPC equivalent carries each
// file's raw bytes inline.  Large files should be split across streaming calls
// or handled via a pre-signed URL obtained out-of-band.
message FileUpload {
  string filename     = 1;
  string content_type = 2;
  bytes  data         = 3;
}

message UploadAttachmentsRequest {
  int32               project_id            = 1;
  string              conversation_id       = 2;
  repeated FileUpload files                 = 3;
  // 0 = keep existing attachments, 1 = overwrite attachments with the same name.
  int32               overwrite_attachments = 4;
}

message UploadAttachmentsResponse {
  google.protobuf.Struct result = 1;
}

// -----------------------------------------------------------------------------
// RemoveAttachments
// -----------------------------------------------------------------------------

message RemoveAttachmentsRequest {
  int32  project_id      = 1;
  string conversation_id = 2;
  // Optional: filename to remove.  When omitted, all attachments are removed.
  string filename        = 3;
  // 0 = delete from underlying storage, 1 = keep in storage (detach only).
  int32  keep_in_storage = 4;
}

message RemoveAttachmentsResponse {
  google.protobuf.Struct result = 1;
}

