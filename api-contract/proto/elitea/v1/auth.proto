// ---------------------------------------------------------------------------
// Permission messages
// ---------------------------------------------------------------------------

// PermissionEntry represents a single permission record for a project member.
message PermissionEntry {
  // Dot-separated permission string, e.g. "models.applications.export_import.export".
  string permission = 1;
  // Human-readable label for the permission.
  string label      = 2;
  // Section (top-level dot prefix), e.g. "models".
  string section    = 3;
  // Whether this permission is currently granted to the caller.
  bool   granted    = 4;
}

message PermissionListRequest {
  // Project identifier (path parameter).
  int32 project_id = 1;
}

message PublicPermissionListRequest {
  // Public project identifier (path parameter).
  // Uses a distinct field name to match the publicProjectId URL parameter.
  int32 public_project_id = 1;
}

// PermissionListResponse is shared by PermissionList and PublicPermissionList.
message PermissionListResponse {
  repeated PermissionEntry permissions = 1;
}

// CheckPermissionListRequest — caller supplies a list of permission strings
// to probe; the server returns which ones are granted.
message CheckPermissionListRequest {
  // Project identifier (path parameter).
  int32            project_id   = 1;
  // Permission strings to check; if empty, all permissions are returned.
  repeated string  permissions  = 2;
}

message CheckPermissionListResponse {
  // Mirrored input permissions annotated with granted=true/false.
  repeated PermissionEntry permissions = 1;
  // Convenience flag: true if ALL requested permissions are granted.
  bool                     all_granted = 2;
}

// ---------------------------------------------------------------------------
// Token (PAT) messages
// ---------------------------------------------------------------------------

// Token represents a personal access token record (never includes the raw secret
// after initial creation — use TokenCreateResponse for the one-time secret).
message Token {
  // UUID of the token (used for revocation).
  string uuid       = 1;
  // Human-readable name assigned by the user.
  string name       = 2;
  // ISO-8601 creation timestamp.
  string created_at = 3;
  // ISO-8601 expiry timestamp; empty if the token never expires.
  string expires_at = 4;
  // Last-used ISO-8601 timestamp; empty if never used.
  string last_used  = 5;
}

message TokenListRequest {}

message TokenListResponse {
  repeated Token tokens = 1;
  int32          total  = 2;
}

// TokenCreateRequest accepts an arbitrary JSON body (via google.protobuf.Struct)
// because the token creation schema is flexible and may evolve independently
// of the proto contract.  The handler validates required fields (name, expiry).
message TokenCreateRequest {
  google.protobuf.Struct body = 1;
}

// TokenCreateResponse includes the one-time plaintext token value.
// The raw_token field is populated only on creation and is never returned again.
message TokenCreateResponse {
  Token  token     = 1;
  // Plaintext token value — show to the user once and discard.
  string raw_token = 2;
}

message TokenDeleteRequest {
  // UUID of the token to revoke (path parameter).
  string uuid = 1;
}

message TokenDeleteResponse {
  // Confirmation of revocation.
  string uuid    = 1;
  string message = 2;
}

