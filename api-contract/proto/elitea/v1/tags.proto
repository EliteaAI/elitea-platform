syntax = "proto3";

package elitea.v1.tags;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/EliteaAI/elitea-platform/gen/go/elitea/v1/tags;tagsv1";

// ---------------------------------------------------------------------------
// Shared entity
// ---------------------------------------------------------------------------

// Tag represents a tag entity in the prompt library.
// The `meta` field captures any additional dynamic properties returned by the
// backend that do not map to a fixed schema.
message Tag {
  int32  id         = 1;
  string name       = 2;
  string color      = 3;
  int32  project_id = 4;
  google.protobuf.Struct meta = 5;
}

// ---------------------------------------------------------------------------
// tagList
// GET /api/v2/elitea_core/tags/prompt_lib/{project_id}
// Used by the general prompt-library tag browser.
// ---------------------------------------------------------------------------

message TagListRequest {
  // Path parameter — project scope.
  int32 project_id = 1;

  // Pagination.
  int32 offset = 2;
  int32 limit  = 3;

  // Filters specific to this use case.
  string collection_phrase = 4;
  string query             = 5;
}

message TagListResponse {
  repeated Tag rows     = 1;
  int32        total    = 2;
  bool         is_load_more = 3;
  // When true the caller should skip counting total rows (performance hint).
  bool         skip_total   = 4;
}

// ---------------------------------------------------------------------------
// chatApplicationTagList
// GET /api/v2/elitea_core/tags/prompt_lib/{project_id}
//
// NOTE — URL conflict with TagList:
//   Both TagList and ChatApplicationTagList resolve to the same HTTP method
//   and URL template.  grpc-gateway cannot route two distinct RPCs bound to
//   the same method+path pair; the last registration would silently win.
//
//   Recommended production strategy: merge the two into a single TagList RPC
//   whose request message is the union of all query parameters, and let the
//   service layer dispatch on whichever fields are populated.  The separate
//   messages below preserve the full contract documentation as specified and
//   make the distinction explicit for reviewers.
//
//   Until the merge decision is made the ChatApplicationTagList RPC should be
//   reached through middleware that inspects query parameters before dispatching.
// ---------------------------------------------------------------------------

message ChatApplicationTagListRequest {
  // Path parameter — project scope.
  int32 project_id = 1;

  // Pagination.
  int32 offset = 2;
  int32 limit  = 3;

  // Filters specific to this use case.
  string entity_coverage = 4;
  string search          = 5;
}

message ChatApplicationTagListResponse {
  repeated Tag rows         = 1;
  int32        total        = 2;
  bool         is_load_more = 3;
}

// ---------------------------------------------------------------------------
// chatPublicApplicationTagList
// GET /api/v2/elitea_core/tags/prompt_lib/{public_project_id}
//
// NOTE — URL conflict with TagList and ChatApplicationTagList:
//   The path template is structurally identical to the two endpoints above;
//   `public_project_id` is a semantic distinction made by the frontend spec,
//   not a different URL shape.  The same merge/middleware guidance from
//   ChatApplicationTagList applies here.
//
//   The key differentiator at the HTTP layer is the `statuses` query param,
//   which is absent from the other two requests and indicates a public/
//   unauthenticated browsing context where filtering by publication status
//   is meaningful.
// ---------------------------------------------------------------------------

message ChatPublicApplicationTagListRequest {
  // Path parameter — public project identifier (semantically distinct from
  // the authenticated project_id used by the other two endpoints).
  int32 public_project_id = 1;

  // Pagination.
  int32 offset = 2;
  int32 limit  = 3;

  // Filters specific to this use case.
  string entity_coverage = 4;
  // Comma-separated list of publication statuses to include, e.g. "published".
  string statuses = 5;
  string search   = 6;
}

message ChatPublicApplicationTagListResponse {
  repeated Tag rows         = 1;
  int32        total        = 2;
  bool         is_load_more = 3;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// TagsService exposes tag-related read operations for the prompt library.
//
// All three RPCs share the same underlying URL template:
//   /api/v2/elitea_core/tags/prompt_lib/{id}
//
// See the per-RPC NOTE comments above for the grpc-gateway routing constraint
// and the recommended merge strategy.
service TagsService {
  // TagList returns a paginated list of tags for a project, filtered by an
  // optional phrase or full-text query.  Used by the general tag browser.
  rpc TagList(TagListRequest) returns (TagListResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/tags/prompt_lib/{project_id}"
    };
  }

  // ChatApplicationTagList returns tags scoped to chat applications within a
  // project.  Filtered by entity_coverage and a search term.
  rpc ChatApplicationTagList(ChatApplicationTagListRequest) returns (ChatApplicationTagListResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/tags/prompt_lib/{project_id}/chat_applications"
    };
  }

  // ChatPublicApplicationTagList returns tags for publicly accessible chat
  // applications.  The `statuses` param restricts results to specific
  // publication states; this RPC is callable without project membership.
  //
  // HTTP binding is structurally identical to the two RPCs above — see NOTE.
  rpc ChatPublicApplicationTagList(ChatPublicApplicationTagListRequest) returns (ChatPublicApplicationTagListResponse) {
    option (google.api.http) = {
      get: "/api/v2/elitea_core/tags/prompt_lib/{public_project_id}"
    };
  }
}
