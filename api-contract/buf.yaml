version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # All service proto files intentionally share the same elitea/v1 directory
    # while using sub-packages (elitea.v1.admin, elitea.v1.applications, etc.)
    # This is an architectural choice — not a defect.
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    # Sub-packages like elitea.v1.admin intentionally omit a version suffix
    # because the parent version (v1) is already established.
    - PACKAGE_VERSION_SUFFIX
    # Many RPCs intentionally share generic response types (GenericResponse,
    # EmptyResponse, PaginatedResponse) for consistency across the API surface.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
deps:
  - buf.build/googleapis/googleapis
