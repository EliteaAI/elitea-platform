[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "elitea-deepwiki"
version = "0.1.0"
description = "ELITEA DeepWiki provider service (ADR-0022 port of deepwiki_plugin)"
requires-python = ">=3.12,<3.13"

# The SPI shell only. The analysis engine's closure (torch, faiss,
# tree-sitter grammars, LangGraph) arrives with the engine itself, in its own
# optional-dependency group, so this service can be built, tested and imaged
# without it while the port is in flight.
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  # The artifact upload after composition (legacy_runner._upload) goes through
  # engine/artifacts_platform_client, which speaks `requests`. That used to be
  # an engine-extra dependency, so the base image — the SPI shell every runner
  # shares — completed a generation and then failed to land a single page
  # (ModuleNotFoundError, in band, on the standalone stack).
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# The PostgreSQL backend (ADR-0022 decision 3). Required in production once
# the engine lands; optional today so the SPI shell image stays small.
storage-postgres = [
  "psycopg[binary]>=3.2,<4",
]
# The verbatim legacy storage modules and their closure. This is the
# *reference* implementation the PostgreSQL backend is measured against, not a
# production dependency — ADR-0022 retires it.
storage-legacy = [
  "langchain-community>=0.3,<1",
  "langchain-core>=0.3,<2",
  "networkx>=3.0,<4",
  "sqlite-vec>=0.1.6,<1",
]
# The analysis engine's dependency closure, pinned exactly as the legacy
# plugin's requirements.txt pinned it at ce679f11. Installing this is what
# ELITEA_DEEPWIKI_RUNNER=legacy needs.
#
# It is optional, and the default image does not carry it. torch, transformers,
# faiss-cpu and the tree-sitter grammars make it multi-GB — ADR-0022 keeps that
# image out of the default bake group for exactly this reason. Keeping the
# closure behind an extra means the SPI shell, the storage backends and every
# test above can be built and run without it.
engine = [
  "langchain-core==1.6.1",
  "langchain==1.3.18",
  "langchain-classic==1.0.8",
  "langchain-community==0.4.2",
  "langchain-text-splitters==1.1.2",
  "langchain-openai==1.6.0",
  "langchain-anthropic==1.7.0",
  "langsmith==0.11.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint==4.2.0",
  "langgraph-prebuilt==1.1.0",
  "langgraph-sdk==0.4.4",
  "openai==2.24.0",
  "anthropic==1.2.0",
  "kubernetes==35.0.0",
  "requests-oauthlib==2.0.0",
  "oauthlib==3.3.1",
  "durationpy==0.11",
  "python-dateutil==2.9.0.post0",
  "faiss-cpu==1.15.0",
  "sentence-transformers==5.2.3",
  "rank-bm25==0.2.2",
  "tiktoken==0.14.0",
  "python-igraph==1.0.0",
  "leidenalg==0.12.0",
  "sqlite-vec==0.1.9",
  "pysqlite3==0.6.0",
  "pygithub==2.10.0",
  "tree-sitter-language-pack==0.13.0",
  "tree-sitter==0.26.0",
  "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-embedded-template==0.25.0",
  "tree-sitter-yaml==0.7.2",
  "deepagents==0.7.11",
  "wcmatch==11.0.1",
  "bracex==2.6",
  "filetype==1.2.0",
  "docstring-parser==0.18.0",
  "dataclasses-json==0.6.7",
  "marshmallow==3.26.2",
  "typing-inspect==0.9.0",
  "typing-extensions==4.16.0",
  "mypy-extensions==1.1.0",
  "jsonpatch==1.33",
  "jsonpointer==3.1.1",
  "tenacity==9.1.4",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.3",
  "requests-toolbelt==1.0.0",
  "orjson==3.12.0",
  "ormsgpack==1.12.2",
  "uuid-utils==0.17.0",
  "xxhash==4.0.1",
  "zstandard==0.25.0",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "anyio==4.14.2",
  "sniffio==1.3.1",
  "httpx-sse==0.4.3",
  "aiohttp==3.14.3",
  "aiohappyeyeballs==2.7.1",
  "aiosignal==1.4.0",
  "frozenlist==1.8.0",
  "websockets==16.0",
  "torch==2.13.0",
