  "jiter==0.16.0",
  "rich==14.3.3",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "shellingham==1.5.4",
  "typer==0.27.2",
  "typer-slim==0.24.0",
  "annotated-doc==0.0.5",
  "google-auth==2.57.0",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  # tests/engine/test_artifact_routes_are_served.py reads elitea-main's
  # OpenAPI document and monkeypatches `requests`. Both belong to the ENGINE's
  # closure in production, and that closure is multi-GB — so they are declared
  # here, where the gate that needs them runs, rather than promoting the whole
  # engine extra into the test job.
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
]

[project.scripts]
elitea-deepwiki = "elitea_deepwiki.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elitea_deepwiki"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
