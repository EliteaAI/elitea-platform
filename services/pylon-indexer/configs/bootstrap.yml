debug: false

plugin_repo:
  - type: elitea_github
    release: ${ELITEA_RELEASE:-main}
    add_source_data: true
    add_head_data: true

# `runtime_engine_litellm` was here, and it is deliberately gone (issue #323).
#
# That plugin starts a LiteLLM proxy inside this container on 127.0.0.1:8081.
# It was a SECOND LLM data plane: it applies no budget, bills nothing, and its
# model registry is written by `runtime_interface_litellm`, which ran in
# pylon_main. This platform has no pylon_main, so nothing writes that registry
# and the proxy answers every call from an empty model set.
#
# The LLM data plane is elitea-llm-gateway, reached through elitea-main at
# `{deployment}/llm/v1`. The SDK client already goes there for chat, embeddings
# and images. The gateway now also serves `/llm/v1/audio/speech` and
# `/llm/v1/audio/transcriptions`, which are the only two endpoints this
# container used the local proxy for.
#
# DEPLOY ORDERING. Land indexer_worker#88 BEFORE this file reaches an image, and
# set `audio_llm_base_url` on the deployment.
#
# `indexer_asr_whisper.py`, `indexer_tts.py` and `indexer_asr_realtime.py` hold
# the absolute URL `http://127.0.0.1:8081/v1/...`. indexer_worker#88 replaces it
# with a configurable base, and that change is in a DIFFERENT repository, so it
# is not carried by this commit.
#
# Removing the engine here changes the audio FAILURE MODE, and on one stack it
# changes the outcome:
#
#   * On this platform the calls already failed. The registry is empty, so the
#     proxy answered a decodable 400/404 naming the model; now the connection is
#     refused instead, which reads as an infrastructure fault rather than a
#     configuration one. Worse to diagnose, not newly broken.
#   * On a centry-hybrid stack, audio WORKS today: pylon_main still serves the
#     `litellm_resolve_model` RPC and still fills the registry. Removing the
#     engine there breaks a working path outright. Do not upgrade a hybrid stack
#     onto this image until #88 has landed and the base URL is set.
preordered_plugins:
  - shared
  - auth
  - worker_core
  - sdk_plugin
  - indexer_worker
  - provider_worker
  - tracing
