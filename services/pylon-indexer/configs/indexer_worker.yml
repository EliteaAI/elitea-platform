event_node:
  type: RedisEventNode
  host: ${REDIS_HOST:-redis}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  event_queue: ${NAME_PREFIX:-elitea}_indexer
  hmac_key: ${INDEXER_HMAC_KEY:-}
  hmac_digest: sha512
  callback_workers: null
  mute_first_failed_connections: 10
  use_ssl: ${REDIS_SSL:-false}
  log_errors: true

tasknode_tmp: /data/cache/tasknode
task_queue_debug: false

result_transport: redis
agents_result_transport: redis

preloaded_models_enabled: false
preloaded_models: []

external_models_enabled: false
indexer_tasks_enabled: true
nltk_data: /data/cache/nltk

agent_memory_config:
  type: postgres
  connection_string: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/agentstate
  connection_kwargs:
    autocommit: true

# `litellm` was in db_names, and it is gone with the LiteLLM engine (issue
# #323): no process in this container reads or writes that database now. See
# configs/bootstrap.yml. `agentstate` stays — it holds the LangGraph
# checkpoints agent_memory_config points at, above.
autocreate_dbs:
  enabled: true
  db_url: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-app}
  db_names: ["agentstate"]
