# Settings for the pylon `shared` plugin.
#
# TWO RULES APPLY TO EVERY SUBSTITUTION BELOW. Both come from pylon's own
# expander, pylon/core/tools/config.py `env_vars_expansion`, which runs on the
# raw bytes of this file before the YAML parse.
#
# 1. The default separator is a single ":". It is NOT the shell's ":-".
#    Pylon's pattern is ${VAR:default}, so "${REDIS_HOST:-redis}" keeps the "-"
#    and resolves to "-redis" when REDIS_HOST is unset.
# 2. Quote every substituted scalar. An empty default leaves a bare "-" or an
#    empty value on the line, and YAML reads the first as a sequence entry.
#    That parse error does not stop pylon. Pylon logs it and DROPS THIS WHOLE
#    FILE (pylon/core/tools/module/descriptor.py `_load_yaml_data` returns {}),
#    so every setting here reverts to a built-in default.
#
# Rule 2 is why the file is quoted throughout, and it is a vault correctness
# rule as much as a style one: a dropped file takes `secrets_master_key` with
# it, pylon then writes UNWRAPPED centry.secrets_key rows, and elitea-main in
# the same stack keeps writing WRAPPED ones. See issue #418.
settings:
  app_ip: localhost
  app_host: http://localhost:3000
  app_scheme: http
  arbiter_runtime: redis
  redis_host: "${REDIS_HOST:redis}"
  redis_port: "${REDIS_PORT:6379}"
  redis_password: "${REDIS_PASSWORD:}"
  redis_use_ssl: "${REDIS_SSL:false}"
  force_inject_db: true
  database_vendor: postgres
  database_engine_options:
    pool_pre_ping: true
    pool_size: 5
    max_overflow: 10
    pool_recycle: 3600
  postgres_host: "${POSTGRES_HOST:postgres}"
  postgres_port: "${POSTGRES_PORT:5432}"
  postgres_user: "${POSTGRES_USER:elitea}"
  postgres_password: "${POSTGRES_PASSWORD:elitea}"
  postgres_db: "${POSTGRES_DB:elitea}"
  secrets_engine: database
  # ONE key source, and no default. This is the same variable elitea-main
  # (internal/api/v2/secrets) and elitea-llm-gateway (internal/account) read,
  # so all three services in a stack wrap and unwrap centry.secrets_key rows
  # with the same key.
  #
  # A default here would be a SECOND key source. The previous default was also
  # a committed 44-character Fernet key, which issue #418 treats as exposed.
  #
  # The deployment must set this variable. entrypoint.sh refuses to start the
  # container when it is missing or malformed, for the reason
  # services/elitea-llm-gateway/internal/account/vault.go:56 gives: a key this
  # process cannot use is a deployment fault, and it must surface at startup
  # rather than at the first vault read.
  secrets_master_key: "${SECRETS_MASTER_KEY}"
