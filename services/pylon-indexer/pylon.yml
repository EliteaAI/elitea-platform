server:
  name: ${NAME}
  path: /
  proxy:
    x_for: 1
    x_proto: 1
    x_host: 1
  host: "0.0.0.0"
  port: 8080
  health:
    healthz: true
    livez: true
    readyz: true

log:
  level: info

pylon_db:
  engine_url: sqlite:////data/pylon.db

modules:
  plugins:
    provider:
      type: folder
      path: /data/plugins
  requirements:
    mode: relaxed
    activation: bulk
    extra_index_url: https://download.pytorch.org/whl/cpu
    cache: /data/cache/pip
    provider:
      type: folder
      path: /data/requirements
  config:
    provider:
      type: folder
      path: /data/configs
  preload:
    bootstrap:
      provider:
        type: git
        delete_git_dir: false
        depth: null
      source: https://github.com/EliteaAI/bootstrap.git
      branch: ${ELITEA_RELEASE:-main}

sessions:
  redis:
    host: ${REDIS_HOST:-redis}
    port: ${REDIS_PORT:-6379}
    password: ${REDIS_PASSWORD:-}
    use_ssl: ${REDIS_SSL:-false}
  prefix: elitea_indexer_session_

events:
  redis:
    host: ${REDIS_HOST:-redis}
    port: ${REDIS_PORT:-6379}
    password: ${REDIS_PASSWORD:-}
    use_ssl: ${REDIS_SSL:-false}
    queue: ${NAME_PREFIX:-elitea}_events
    hmac_key: ${EVENT_HMAC_KEY:-}
    hmac_digest: sha512
    callback_workers: null

rpc:
  redis:
    host: ${REDIS_HOST:-redis}
    port: ${REDIS_PORT:-6379}
    password: ${REDIS_PASSWORD:-}
    use_ssl: ${REDIS_SSL:-false}
    queue: ${NAME_PREFIX:-elitea}_rpc
    hmac_key: ${RPC_HMAC_KEY:-}
    hmac_digest: sha512
    callback_workers: null
  id_prefix: elitea_indexer_rpc_

environment:
  ANONYMIZED_TELEMETRY: "False"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: /data/cache
  NLTK_DATA: /data/cache/nltk
  TRANSFORMERS_CACHE: /data/cache/transformers
  TIKTOKEN_CACHE_DIR: /data/cache/tiktoken
  AZURE_DEVOPS_CACHE_DIR: /data/cache/ado
