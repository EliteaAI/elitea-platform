<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Continue to identity provider</title>
  </head>
  <body>
    <form id="oidc-authorization" action="{{.Endpoint}}" method="post" enctype="application/x-www-form-urlencoded" accept-charset="UTF-8">
      <input type="hidden" name="response_type" value="{{.ResponseType}}">
      <input type="hidden" name="client_id" value="{{.ClientID}}">
      <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
      <input type="hidden" name="scope" value="{{.Scope}}">
      <input type="hidden" name="state" value="{{.State}}">
      <input type="hidden" name="nonce" value="{{.Nonce}}">
      <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
      <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
      <noscript>
        <p>Continue to the identity provider.</p>
        <button type="submit">Continue</button>
      </noscript>
    </form>
    <script>document.getElementById("oidc-authorization").submit();</script>
  </body>
</html>
