        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: Unlike failed (pylon-era ok:false envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialActionErrorResponse'

  /social/pin/prompt_lib/{project_id}/{entity_type}/{entity_id}:
    parameters:
