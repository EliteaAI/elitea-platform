    # ---- Artifacts ---------------------------------------------------------------
    # docs/plans/storage-migration-plan.md S7. Replaces the retired
    # legacy/pseudo-S3 surface (ADR-0016 §7) — no data migration, no wire
    # compatibility with the shapes this block used to document.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - NotFound
                - AlreadyExists
                - AccessDenied
                - InvalidArgument
                - InvalidKey
                - TooLarge
                - QuotaExceeded
                - PreconditionFailed
                - NotImplemented
                - Internal
                - DigestMismatch
                - MediaTypeMismatch
            message: { type: string }
            details:
              type: object
              properties:
                cleanup_error:
                  type: string
                  description: >-
                    The only diagnostic key any artifact handler emits. Set
                    solely by rejectCommit
                    (internal/api/v2/artifacts/grants.go:333-343), when a
                    commitTransferGrant verification failure (TooLarge /
                    MediaTypeMismatch / DigestMismatch / QuotaExceeded — its
                    five call sites at grants.go:438, 450, 462, 468, 504) is
                    followed by a FAILED cleanup delete of the just-uploaded
                    object; the value is that delete's error string. Every
                    other error response goes through writeError
                    (internal/api/v2/artifacts/handler.go:100-104), which
                    emits code+message only and no details member at all.
              description: >
                Closed set — one optional key. Not an open map: `details` is
                populated at exactly one site in the service
                (internal/api/v2/artifacts/grants.go:339), so it is typed
                here rather than carrying an x-elitea-passthrough marker.
                Widen this schema, do not re-open it, if a future handler
                adds a second diagnostic key.
      description: >
        The artifact API's error envelope. Distinct from the legacy
        ErrorResponse ({"error": "message"} — a plain string) used by every
        other operation in this spec; this is a deliberately richer, typed
        shape scoped to the new artifact operations only.

    Bucket:
      type: object
      required:
        - name
        - type
        - is_pinned
        - tags
        - retention_days
        - expires_at
        - size_bytes
        - object_count
        - created_at
        - updated_at
      properties:
        name: { type: string }
        type:
          type: string
          enum: [system, autogenerated, local]
          description: Wire name for the elitea_storage.buckets.bucket_type column.
        is_pinned: { type: boolean }
        tags:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): caller-owned opaque JSON, round-tripped verbatim. The
            handler never parses it: Bucket.Tags is json.RawMessage, not a
            typed struct (internal/api/v2/artifacts/handler.go:31), and
            bucketFromRow copies row.Tags straight through, substituting `{}`
            only when the column is empty
            (internal/api/v2/artifacts/handler.go:124-140). The repository is
            equally opaque — BucketRow.Tags is json.RawMessage
            (internal/infra/db/repos/artifact_buckets.go:30) filled by a
            direct cast off the sqlc row
            (internal/infra/db/repos/artifact_buckets.go:46) — and the column
            is a bare JSONB with no shape constraint
            (migrations/shared/0057_artifact_storage.sql:10). No key in this
            map is read by any Go code, so there is no closed set to
            enumerate; the shape is whatever the client last wrote.
        retention_days:
          type: integer
          nullable: true
          description: Null means no expiry.
        expires_at:
          type: string
          format: date-time
          nullable: true
        size_bytes:
          type: integer
          format: int64
          description: Sum of its objects' byte lengths (S6 SumBucketBytes).
        object_count:
          type: integer
          format: int64
