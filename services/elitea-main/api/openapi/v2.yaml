  # ==========================================================================
  # ARTIFACTS — buckets, objects, transfer grants
  # docs/plans/storage-migration-plan.md S7. Replaces the retired legacy
  # surface (ADR-0016 §7) outright — no data migration, no old-shape
  # compatibility. All 13 operations below live under the default /api/v2
  # server (no per-path override): unlike the old /artifacts/s3 surface this
  # replaces, none of this is root-mounted.
  # ==========================================================================
  /artifacts/buckets/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listBuckets
      summary: List every non-deleted bucket in a project
      tags: [artifacts]
      responses:
        '200':
          description: Bucket listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createBucket
      summary: Create a new bucket
      description: >
        The bucket name is validated against ^[a-z][a-z0-9-]{1,62}$ and
        rejected, never normalised, when it does not already match (S8).
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '200':
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid bucket name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409':
          description: A bucket with this name already exists in the project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/buckets/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getBucket
      summary: Get one bucket
      tags: [artifacts]
      responses:
        '200':
          description: The bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    patch:
      operationId: updateBucket
      summary: Update a bucket's pin state, retention, and/or tags
      description: >
        is_pinned, retention_days, and tags are all optional and
        independently settable (S8). A retention_days above the project's
        policy ceiling (project_storage_policy.retention_max_days, not
        retention_default_days) is rejected with 403 QuotaExceeded.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        '200':
          description: Updated bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            Forbidden, or requested retention_days exceeds the project's
            policy ceiling (code QuotaExceeded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: deleteBucket
      summary: Delete a bucket and every object in it
      description: >
        Deletes objects via ObjectStore.DeleteBatch over a prefix listing,
        then soft-deletes the bucket metadata row (S8).
      tags: [artifacts]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/objects/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: listObjects
      summary: List objects in a bucket
      tags: [artifacts]
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
        - name: delimiter
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Object listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObjectsResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    post:
      operationId: uploadObject
      summary: Stream-upload one object
      description: >
        Streaming multipart upload, field `file` (S9). The server derives
        the storage key from the bucket and the supplied display name — a
        caller never supplies a storage path directly.
      tags: [artifacts]
      parameters:
        - name: overwrite
          in: query
          schema: { type: boolean, default: false }
          description: >
            A collision with overwrite=false (the default) returns 409
            AlreadyExists.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Key already exists and overwrite=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Object exceeds the project's max_object_bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/objects/{projectID}/{bucket}:batchDelete:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: batchDeleteObjects
      summary: Delete a batch of objects by key in one request
      description: >
        A JSON body, not repeated query parameters (S9). An empty `keys`
        array is 400 InvalidArgument — it never means "delete the bucket".
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteObjectsRequest'
      responses:
        '200':
          description: Per-key results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteObjectsResponse'
        '400':
          description: Empty keys array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/objects/{projectID}/{bucket}/{key}:
    # The router registers the three operations below on a trailing chi `/*`
    # wildcard, not a single-segment {key} param — chi v5.1.0 has no
    # multi-segment named-param syntax, and S1's own key grammar allows `/`
    # inside a key (S7/S9). segmentsMatch treats a trailing `*` in the router
    # pattern as matching any spec path remainder unconditionally, so this
    # still resolves against the wildcard registration.
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: May itself contain `/` characters.

    get:
      operationId: downloadObject
      summary: Download an object, with optional byte-range support
      tags: [artifacts]
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Full object
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    head:
      operationId: statObject
      summary: Fetch object metadata as headers only, no body
      tags: [artifacts]
      responses:
        '200':
          description: Metadata headers (Content-Length, Content-Type, ETag, Last-Modified)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: deleteObject
      summary: Delete a single object
      tags: [artifacts]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/grants/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: createTransferGrant
      summary: Create a short-lived presigned transfer grant
      description: >
        S15. Falls back to the streaming facade URL, not an error, when
        Capabilities().Presign is false for the configured backend.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferGrantRequest'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferGrantResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/grants/{projectID}/{grantID}:commit:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: commitTransferGrant
      summary: Verify and commit a presigned upload, making it listable
      description: >
        Verifies size, digest, and media type against the grant row (S15).
        Media type verification is mandatory — ContentType is not part of
        the signed presigned-PUT payload. A digest or media-type mismatch
        deletes the uploaded object and returns 409; an object that exceeds
        the grant's max_bytes, or a commit that would push the project past
        its storage quota, deletes the uploaded object and returns 413.
      tags: [artifacts]
      responses:
        '200':
          description: Committed — the object is now listable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Digest or media-type mismatch, or the grant was already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >
            Uploaded object exceeds the grant's max_bytes, or committing it
            would exceed the project's storage quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}/parts/{partNumber}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }
      - name: partNumber
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1, maximum: 10000 }

    post:
      operationId: presignUploadPart
      summary: Presign one part of a native multipart upload
      description: >
        S16. grantID must be a grant CreateTransferGrant started as native
        multipart (its response carried upload_id, not url) — a single-shot
        grant, a GET grant, or a grant belonging to a different project
        cannot be used here.
      tags: [artifacts]
      responses:
        '200':
          description: A presigned PUT URL for this part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadPartResponse'
        '400':
          description: Invalid part number, or grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: The grant was already committed or aborted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:completeMultipart:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: completeMultipartUpload
      summary: Finish a native multipart upload, making it listable
      description: >
        S16. Applies the identical size/digest/media-type/quota
        verification commitTransferGrant does — completing via multipart is
        not a lesser-verified path. See commitTransferGrant's own
        description for what each response code means; they are shared.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMultipartRequest'
      responses:
        '200':
          description: Completed — the object is now listable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '400':
          description: Invalid request, or grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Digest or media-type mismatch, or the grant was already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >
            The completed object exceeds the grant's max_bytes, or
            completing it would exceed the project's storage quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:abortMultipart:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: abortMultipartUpload
      summary: Cancel a native multipart upload
      description: >
        S16. Unlike presignUploadPart/completeMultipartUpload, an expired
        grant may still be aborted — cleaning up an abandoned upload session
        is not itself subject to the grant's own TTL.
      tags: [artifacts]
      responses:
        '204':
          description: Aborted
        '400':
          description: grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: The grant was already committed or aborted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

