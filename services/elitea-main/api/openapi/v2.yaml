    # ---- Skills / tags / toolkits ---------------------------------------------
    SkillVersion:
      type: object
      required: [name, instructions, tags]
      properties:
        id: { type: string }
        name: { type: string, description: 'The platform ships a single implicit "base" version today (issue #37); real multi-version support is a tracked fast-follow.' }
        instructions: { type: string }
        tags:
          type: array
          items: { type: string }
      description: >
        A skill's content: the instructions an agent follows plus its topical
        tags. Persisted in skill_versions/skill_version_tag_association
        (repos/skills.go upsertBaseSkillVersion).

    Skill:
      type: object
      required: [id, project_id, name, type, is_default, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        config:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `Config map[string]any` on the Skill struct
            (internal/api/v2/skills/handler.go:36) — an untyped map that is
            NEVER populated by the wired Pg repository, so it has no
            observable shape to type. The SELECT list shared by Get/List
            reads id/name/description/owner_id/created_at plus the joined
            base version and its tags, and does not project the skills
            table's `meta` column at all
            (internal/infra/db/repos/skills.go:29-32); the INSERT persists
            only name/description and hardcodes meta '{}'
            (internal/infra/db/repos/skills.go:169-172). The column itself is
            an unconstrained JSONB
            (internal/infra/db/migrations/001_initial.sql:128-137, `meta
            JSONB DEFAULT '{}'` at :136). Config is therefore always its zero
            value and, being `json:"config,omitempty"`, is omitted from every
            response body. Kept as a declared passthrough rather than typed
            because there is no closed key set to enumerate — nothing writes
            it; kept rather than deleted because the struct field and wire
            slot are real. Type it (or drop it) if #37's multi-version work
            gives `meta` a real projection.
        is_default: { type: boolean }
        instructions:
          type: string
          description: The base version's instructions (also available at version_details.instructions).
        tags:
          type: array
          items: { type: string }
          description: The base version's tags (also available at version_details.tags).
        versions:
          type: array
          items: { $ref: '#/components/schemas/SkillVersion' }
          description: Always the single base version today — see SkillVersion.name.
        version_details:
          allOf: [{ $ref: '#/components/schemas/SkillVersion' }]
          description: Convenience alias for versions[0].
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: >
        NOTE(W2): `config` is never populated in responses, `is_default` is
        always false, `type` is always the literal "skill", and `updated_at`
        is always the zero sentinel "0001-01-01T00:00:00Z" — the skills
        table itself has no updated_at/is_default columns
        (migrations/001_initial.sql). instructions/tags/versions/
        version_details, in contrast, DO round-trip: they're read from a
        joined skill_versions + skill_version_tag_association row
        (repos/skills.go Get/List), not discarded.

    SkillsList:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
      description: >
        Returned whole by List (internal/api/v2/skills/handler.go). Pagination
        comes from ?page/?page_size; ?query does an ILIKE search over
        name/description, and ?sort_by (name|created_at)/?sort_order
        (asc|desc) drive ORDER BY (repos/skills.go List — sort_by is
        whitelisted, never interpolated raw).

    SkillCreateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        type:
          type: string
          description: Accepted but NOT persisted (repos/skills.go).
        config:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): accepted on the wire and then dropped on the floor —
            it has no server-side shape to type. Both Create and Update
            decode the body into `createRequest`
            (internal/api/v2/skills/handler.go:163-164 and 181-182), and
            that struct declares only name/description/instructions/tags/
            versions — it has NO config field
            (internal/api/v2/skills/handler.go:57-63), so encoding/json
            discards this member at decode time. Nothing downstream could
            persist it either: the INSERT writes name/description and
            hardcodes meta '{}'
            (internal/infra/db/repos/skills.go:169-172). Declared as a
            passthrough (not removed) because the frontend still sends the
            member and OpenAPI-level rejection would be a breaking change;
            see Skill.config for the read side.
        is_default:
          type: boolean
          description: Accepted but NOT persisted (repos/skills.go).
        instructions:
          type: string
          description: Flat shape (as sent by updateSkill()); ignored if versions[0].instructions is present.
        tags:
