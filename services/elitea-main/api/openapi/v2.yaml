openapi: "3.0.3"
info:
  title: Elitea Platform API
  version: "2.0.0"
  description: |
    External REST API for the Elitea Platform (elitea-main Go service).
    Wire-compatible drop-in replacement for pylon_main (Python/Flask).

    ## Response shape conventions
    - **Single resource**: returned directly at top level — `{"id": 42, "name": "..."}`
    - **General errors (4xx/5xx)**: `{"error": "message"}` (pkg/apierr/apierr.go:47-59
      and the handlers' inline `map[string]any{"error": ...}` writes). One
      documented shape deviates: the five social/handler.go 500 sites (Like
      :268, Unlike :301, Pin :321, Unpin :341, CreateFeedback :419) emit the
      pylon-era `{"ok": false, "error": ...}` envelope instead, modeled as
      the named `SocialActionErrorResponse` schema and referenced only on
      those specific operations. Five more UNDOCUMENTED sites of the same
      envelope remain on toolkits/handler.go (:286, 312, 324, 350, 362) —
      scope that shape there when those domains are spec'd.
    - **Rate limit (429)**: intentionally NOT documented. The Go RateLimit
      middleware is a pass-through stub (internal/api/middleware/ratelimit.go:9-14)
      and no elitea-main code emits a 429 body — documenting one would be contract
      fiction. Re-add per-operation 429 responses (pylon shape:
      `{"error": {"message", "type": "rate_limit_error", "code":
      "rate_limit_exceeded"}}`) when rate limiting becomes real.
    - Field names are **snake_case** unless the Go handler observably marshals
      otherwise (e.g. `lastModified` in the S3 listing, `DisplayName`/`ID` in the
      S3 owner block).

    ## NOTE(W2) — field-level enrichment conventions
    Every schema below is derived from the Go handler that actually marshals the
    response (UI reimplementation spec §5.1 / §9.3 unit W2). Evidence is recorded
    per schema in `NOTE(W2)` comments/descriptions with file:line references.
    Where a handler genuinely passes through arbitrary JSON (DB `jsonb` columns,
    echoed request bodies), the schema carries an
    `x-elitea-passthrough: "NOTE(W2): ..."` marker justifying the permissive
    `additionalProperties`. A permissive object WITHOUT that marker is a defect —
    `apps/elitea-web/scripts/check-contract-coverage.mjs` fails it, wired as the
    "Contract coverage (§5.1)" step of ci-web.yml's `gates` job.

servers:
  - url: /api/v2/elitea_core
    description: Core platform API server (prompt_lib scope)
  - url: /api/v2
    description: Admin and auxiliary APIs

security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - SessionCookie: []

tags:
  - name: admin
    description: User, role, and moderation management
  - name: analytics
    description: Usage analytics for prompts, tools, and agents
  - name: applications
    description: Application (agent/pipeline/skill) lifecycle management
  - name: artifacts
    description: Bucket and artifact (file) storage
  - name: auth
    description: Permissions
  - name: budgets
    description: Project and per-member LLM spend limits, and usage reporting
  - name: chat
    description: Conversational / webchat endpoints
  - name: configurations
    description: Runtime configuration management
  - name: notifications
    description: User notifications
  - name: resources
    description: Shared resources
  - name: search
    description: Search and filter options
  - name: secrets
    description: Secret / credential management
  - name: settings
    description: Entity and platform settings
  - name: skills
    description: Skill management
  - name: social
    description: Social features (likes, follows)
  - name: tags
    description: Tag management
  - name: toolkits
    description: Toolkit (integration) management

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SessionCookie:
      type: apiKey
      in: cookie
      name: elitea_session

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Project identifier (extracted from URL path)
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 1000
      description: Maximum number of items to return
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip before starting to collect results
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Free-text search filter
    SortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
      description: Field name to sort results by
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start of date range (inclusive)
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End of date range (inclusive)

  schemas:
    # NOTE(W2): the former `Struct` / `GenericResponse` / `PaginatedResponse` /
    # `AdminPaginatedResponse` / `ArrayResponse` generic shells and the
    # `Application`/`User`/`Role`/`Bucket`/`ApplicationVersion`/`Artifact`
    # allOf-Struct aliases were REMOVED (spec preflight fact P4). Every schema
    # below is field-level, sourced from the Go handler that marshals it.

    # ---- Error responses ---------------------------------------------------
    BudgetPeriodWindow:
      type: object
      description: |
        The calendar month a budget accrues over. Derived exactly as the LLM
        gateway derives it (first instant of the current month, UTC) — the
        accumulator's key includes the period start, so a period computed any
        other way would look up a row that does not exist and report zero spend
        against a real limit.
      required: [period, period_start, period_end, resets_at]
      properties:
        period:
          type: string
          description: The period tag, YYYYMM.
          example: "202608"
        period_start:
          type: string
          description: First day of the period, YYYY-MM-DD.
          example: "2026-08-01"
        period_end:
          type: string
          description: Last day of the period, YYYY-MM-DD.
          example: "2026-08-31"
        resets_at:
          type: string
          format: date-time
          description: When the accumulator rolls over to a new period row.

    BudgetState:
      allOf:
        - $ref: '#/components/schemas/BudgetPeriodWindow'
        - type: object
          required:
            - monthly_limit
            - effective_limit
            - limit_source
            - currency
            - enabled
            - warning_pct
            - spend
            - remaining
            - percent_used
            - spend_available
          properties:
            monthly_limit:
              type: number
              nullable: true
              description: The AUTHORED ceiling in USD. Null means none was set.
            effective_limit:
              type: number
              nullable: true
              description: |
                The ENFORCED ceiling. Null when the scope is unlimited — which
                includes a scope that has a monthly_limit but is disabled.
            limit_source:
              type: string
              enum: [explicit, unlimited]
              description: |
                Where the enforced limit came from. The reference had a third
                value, `default`, for a platform-wide fallback; this platform
                has none.
            currency:
              type: string
              enum: [USD]
              description: |
                Always USD. The gateway compares limits against a nano-USD
                counter and nothing converts, so the write path rejects any
                other value rather than storing a label enforcement ignores.
            enabled:
              type: boolean
              description: |
                False marks the scope deliberately exempt: it stays unlimited
                whatever monthly_limit says. Stored separately from the
                enforcement flag so `enabled with no ceiling yet` and
                `deliberately exempt` do not read back as the same thing.
            warning_pct:
              type: integer
              description: Percent-of-limit at which this scope warns.
            spend:
              type: number
              description: USD accrued this period. Zero when nothing is recorded.
            remaining:
              type: number
              nullable: true
              description: Null when the scope is unlimited. Never negative.
            percent_used:
              type: number
              nullable: true
              description: Null when the scope is unlimited or the limit is zero.
            spend_available:
              type: boolean
              description: |
                Whether an accumulator row exists for this period at all, which
                is what separates "nothing billed yet" from "no usage data".

    ProjectBudget:
      allOf:
        - type: object
          required: [project_id, budget_period]
          properties:
            project_id:
              type: integer
            budget_period:
              type: string
              enum: [monthly]
              description: |
                Reported, not settable. The gateway derives the period from the
                calendar month unconditionally, so any other value would be one
                nothing honours.
        - $ref: '#/components/schemas/BudgetState'

    MemberBudget:
      allOf:
        - type: object
          required: [project_id, user_id, enforced]
          properties:
            project_id:
              type: integer
            user_id:
              type: integer
            enforced:
              type: boolean
              description: |
                FALSE for as long as the gateway admits and bills by project
                scope alone. A per-member limit is stored and read back
                faithfully, but nothing blocks a call on it — render it as
                authored-but-inactive rather than as a live ceiling.
        - $ref: '#/components/schemas/BudgetState'

    BudgetWrite:
      type: object
      description: The write payload shared by the project and member budget PUTs.
      properties:
        monthly_limit:
          type: number
          nullable: true
          minimum: 0
          description: Ceiling in USD. Null, or absent, means no ceiling.
        enabled:
          type: boolean
          default: true
          description: |
            False marks the scope deliberately exempt, so it stays unlimited
            whatever monthly_limit says.
        currency:
          type: string
          enum: [USD]
          default: USD
          description: Anything other than USD is rejected with a 400.
        soft_alert_pct:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Percent-of-limit at which this scope warns. Omitted leaves the
            stored threshold untouched.

    ProjectBudgetRow:
      allOf:
        - type: object
          required: [project_id, name, display_name, owner_name, owner_email, is_personal]
          properties:
            project_id:
              type: integer
            name:
              type: string
            display_name:
              type: string
              description: |
                The owner's identity for a personal project, the project name
                otherwise — `project_user_<n>` is not a name anyone searches for.
            owner_name:
              type: string
            owner_email:
              type: string
            is_personal:
              type: boolean
        - $ref: '#/components/schemas/BudgetState'

    ProjectBudgetListing:
      type: object
      required: [rows, total, counts]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBudgetRow'
        total:
          type: integer
          description: The FILTERED total, which is what the pagination describes.
        counts:
          type: object
          description: |
            Unfiltered per-type counts, for the tab labels. Deliberately not
            narrowed by the filters: a tab whose count moved with the search box
            would be reporting how many rows the other tab currently shows.
          additionalProperties:
            type: integer

    MemberBudgetRow:
      allOf:
        - type: object
          required: [project_id, user_id, name, email, roles, enforced]
          properties:
            project_id:
              type: integer
            user_id:
              type: integer
            name:
              type: string
            email:
              type: string
            roles:
              type: array
              items:
                type: string
            enforced:
              type: boolean
              description: See MemberBudget.enforced — always false today.
        - $ref: '#/components/schemas/BudgetState'

    MemberBudgetListing:
      type: object
      required: [rows, total, warning_pct]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MemberBudgetRow'
        total:
          type: integer
        warning_pct:
          type: integer
          description: |
            The PROJECT's threshold, which labels the table. Each row carries
            its own.

    UsageReport:
      allOf:
        - type: object
          required: [project_id, user_id, scope, can_see_amounts]
          properties:
            project_id:
              type: integer
            user_id:
              type: integer
              nullable: true
              description: Null for scope=project.
            scope:
              type: string
              enum: [project, user]
            can_see_amounts:
              type: boolean
              description: |
                False means the cost fields — monthly_limit, effective_limit,
                spend, remaining, currency — were REMOVED from this payload.
                Percentages, the warning threshold and the period remain.
            enforced:
              type: boolean
              description: Present for scope=user only. See MemberBudget.enforced.
            budget_period:
              type: string
              enum: [monthly]
              description: Present for scope=project only.
        - $ref: '#/components/schemas/BudgetState'

    ProjectQuota:
      type: object
      description: |
        centry.project_quota. `-1` is the unlimited sentinel; a null column was
        never configured. The vcu_* and storage_* triples are the only ones the
        PUT writes.
      required: [id, project_id]
      properties:
        id: { type: integer }
        project_id: { type: integer }
        data_retention_limit: { type: integer, nullable: true }
        test_duration_limit: { type: integer, nullable: true }
        cpu_limit: { type: integer, nullable: true }
        memory_limit: { type: integer, nullable: true }
        last_update_time:
          type: string
          nullable: true
          description: Start of the current 30-day quota window, UTC.
        dast_scans: { type: integer, nullable: true }
        sast_scans: { type: integer, nullable: true }
        vcu_hard_limit: { type: integer, nullable: true }
        vcu_soft_limit: { type: integer, nullable: true }
        vcu_limit_total_block: { type: boolean }
        storage_hard_limit:
          type: integer
          nullable: true
          description: Gigabytes.
        storage_soft_limit:
          type: integer
          nullable: true
          description: Gigabytes.
        storage_limit_total_block: { type: boolean }

    ProjectQuotaUpdate:
      type: object
      description: |
        Only the triple matching `usage_type` is read. An omitted field CLEARS
        its column.
      properties:
        vcu_hard_limit: { type: integer, nullable: true }
        vcu_soft_limit: { type: integer, nullable: true }
        vcu_limit_total_block: { type: boolean, default: false }
        storage_hard_limit: { type: integer, nullable: true }
        storage_soft_limit: { type: integer, nullable: true }
        storage_limit_total_block: { type: boolean, default: false }

    StatisticEntry:
      type: object
      required: [current, quota]
      properties:
        current:
          type: integer
          format: int64
        quota:
          type: integer
          format: int64
          nullable: true
          description: |
            Null where the quota table has no column for this metric, or where
            it holds the -1 unlimited sentinel.

    ProjectStatistics:
      type: object
      description: |
        One entry per metric. `storage_space` is in BYTES on both sides;
        `data_retention_limit` reports a current of 0, as the reference does,
        because nothing measures retention — only configures it.
      properties:
        performance_test_runs: { $ref: '#/components/schemas/StatisticEntry' }
        ui_performance_test_runs: { $ref: '#/components/schemas/StatisticEntry' }
        sast_scans: { $ref: '#/components/schemas/StatisticEntry' }
        dast_scans: { $ref: '#/components/schemas/StatisticEntry' }
        tasks_executions: { $ref: '#/components/schemas/StatisticEntry' }
        storage_space: { $ref: '#/components/schemas/StatisticEntry' }
        data_retention_limit: { $ref: '#/components/schemas/StatisticEntry' }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
      description: >
        NOTE(W2): wire truth from pkg/apierr/apierr.go:47-59 (apierr.Write
        encodes `{"error": message}`) and the handlers' inline
        `map[string]any{"error": ...}` writes. No operation documented in this
        spec emits the pylon `ok` field via THIS schema; the five
        social/handler.go 500 sites (:268, 301, 321, 341, 419) use the named
        `SocialActionErrorResponse` schema instead (see there), and five more
        UNDOCUMENTED sites remain on toolkits/handler.go (:286, 312, 324, 350,
        362).

    ValidationFieldError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items: { type: string }
          description: Field path, e.g. ["body", "version_name"]
        msg:
          type: string
        type:
          type: string
          description: pydantic-style error code, e.g. value_error.missing
      description: >
        NOTE(W2): pydantic-parity field error emitted by Publish/PublishValidate
        for a missing or malformed version_name
        (internal/api/v2/eliteacore/handler.go:455-474, 1202-1219).

    PublishBadRequestResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ValidationFieldError'
          description: >
            Either a plain message (e.g. "llm_not_shared",
            "pipeline_not_publishable") or a pydantic-style field error list.
        msg:
          type: string
          description: Present only alongside error="pipeline_not_publishable".
      description: >
        NOTE(W2): union of the 400 bodies written by Publish
        (internal/api/v2/eliteacore/handler.go:452, 456-461, 467-473, 486, 547,
        585) and PublishValidate (1197, 1203-1218).

    ValidationIssue:
      type: object
      properties:
        rule: { type: string }
        field: { type: string }
        issue: { type: string }
        source: { type: string }
        context:
          type: string
          nullable: true
          description: >
            Emitted as explicit JSON null in the cycle/depth FAIL issues
            (handler.go:985, 1003).
        message: { type: string }
        fix:
          type: string
          description: >
            Remediation text carried by the cycle/depth FAIL critical issues
            (handler.go:986, 1004).
        suggestion:
          type: string
          description: >
            The ONLY human-readable text on recommendation issues — they have
            no issue/message key (handler.go:1043).
      description: >
        NOTE(W2): issue maps assembled in runPublishValidation
        (internal/api/v2/eliteacore/handler.go:876, 885, 891, 981-1005 cycle/
        depth FAILs with fix + explicit-null context, 1043 recommendations
        with suggestion, 1107-1121, 1146-1151) and re-shaped in Publish's 422
        path (556-565: {rule, message}). Key set varies per rule; all keys
        optional by construction.

    PublishValidationResult:
      type: object
      properties:
        status:
          type: string
          enum: [PASS, WARN, FAIL]
        critical_issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        summary:
          type: string
        counts:
          type: object
          properties:
            critical: { type: integer }
            warnings: { type: integer }
            suggestions: { type: integer }
        ai_validation_available:
          type: boolean
        validation_token:
          type: string
          nullable: true
          description: >
            Hex token generated for non-FAIL results; null on FAIL
            (handler.go:1164-1169). Pass it to publishApplication to skip
            re-validation.
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
          description: >
            Present only in publishApplication's 422 body (handler.go:556-565)
            and in the deterministic short-circuit 422s (500-509, 518-527,
            610-618), where it may be the ONLY key.
      description: >
        NOTE(W2): built by runPublishValidation
        (internal/api/v2/eliteacore/handler.go:1155-1182). validateForPublish's
        own 200/422 always carries status..validation_token; the
        publishApplication 422 short-circuits carry only `issues`. No field is
        therefore marked required.

    PublishValidationFailedResponse:
      type: object
      required: [error, validation_result]
      properties:
        error:
          type: string
          enum: [validation_failed]
        validation_result:
          $ref: '#/components/schemas/PublishValidationResult'
      description: >
        NOTE(W2): 422 envelope written by Publish
        (internal/api/v2/eliteacore/handler.go:500-509, 518-527, 566-570,
        610-618).

    # NOTE(W2): the former RateLimitErrorDetail / RateLimitErrorResponse
    # schemas and every per-operation 429 response were REMOVED. The Go
    # RateLimit middleware is a pass-through stub
    # (internal/api/middleware/ratelimit.go:9-14) and nothing in elitea-main
    # emits a 429 body, so documenting one violated the wire-truth invariant.
    # Re-add them when rate limiting becomes real.

    # ---- Shared primitives ---------------------------------------------------
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      description: >
        NOTE(W2): `{"ok": true}` acknowledgements — SetDefaultVersion
        (internal/api/v2/applications/handler.go:981), BatchReplaceVersion
        (:994), UpdateAttachmentStorage
        (internal/api/v2/eliteacore/handler.go:1783), UpdateIcon (:1860),
        BatchUpdateEntitySettings
        (internal/api/v2/conversations/handler.go:675), and social/handler.go's
        UpdateAuthor (:133, 166), Like (:271, plus the no-op shortcuts at
        :253, 258), Unlike (:304, plus :288, 293), Pin (:324, plus :315), and
        Unpin (:344, plus :335).

    Author:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
      description: >
        NOTE(W2): internal/domain/applications/types.go:5-9 (no omitempty on
        any field) and the inline author maps in
        internal/api/v2/applications/handler.go:451, 600, 790.

    # ---- DB-jsonb passthrough shells (each individually justified) ----------
    LlmSettings:
      type: object
      properties:
        model_name: { type: string }
        model_project_id:
          oneOf:
            - type: string
            - type: integer
          description: >
            Stored as string or number depending on writer; ExportImportGet
            normalizes float64 to a numeric string
            (internal/api/v2/eliteacore/handler.go:2590-2597).
        temperature: { type: number }
        max_tokens: { type: integer }
        top_p: { type: number }
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb column `application_versions.llm_settings` is
        decoded and re-emitted verbatim
        (internal/api/v2/applications/handler.go:215-220, 851-855, 906-917);
        the platform only ever inspects model_name/model_project_id/
        temperature/max_tokens/top_p
        (internal/api/v2/conversations/handler.go:653-660,
        internal/api/v2/eliteacore/handler.go:544-551). Remaining keys are
        client-owned. Channel-B fixture recommended (M1).

    VersionMeta:
      type: object
      properties:
        step_limit:
          type: integer
          nullable: true
        icon_meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): stored verbatim from the UpdateIcon request body
            (internal/api/v2/eliteacore/handler.go:1849-1858); known keys
            url/width/height come from UploadIcon (:1828-1836).
        category: { type: string }
        source_version_id: { type: string }
        parent_entity_id: { type: string }
        parent_project_id: { type: string }
        parent_author_id: { type: string }
        variables:
          type: array
          items: { $ref: '#/components/schemas/VersionVariable' }
          description: >
            Written into meta on create when the request carries variables
            (applications/handler.go:430, 747-752).
        attachment_storage:
          type: object
          properties:
            toolkit_id: { type: string }
          description: >
            Written by UpdateAttachmentStorage as {"toolkit_id": "..."}
            (eliteacore/handler.go:1777-1781).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb column `application_versions.meta` round-trips
        through the handlers untyped
        (internal/api/v2/applications/handler.go:215-220;
        internal/api/v2/eliteacore/handler.go:592-607 overlays
        source_version_id/category; fork overlays parent_* keys, :2330-2349;
        Go-authored keys variables/attachment_storage typed above). A
        `trigger` key is deliberately NOT declared here: pipelines/handler.go
        writes the trigger blob to a DIFFERENT column,
        `application_versions.settings` (jsonb_set at :180-182, not `meta`),
        and no code path in elitea-main ever writes meta.trigger —
        scheduling/handler.go:44's own comment calls the meta->'trigger' read
        speculative ("may be stored ... on some deployments"). The real
        settings-backed trigger blob is documented on PipelineTrigger,
        surfaced by getPipelineTrigger/updatePipelineTrigger. Channel-B
        fixture recommended (M1).

    ConversationStarters:
      type: array
      items:
        x-elitea-passthrough: >-
          NOTE(W2): DB jsonb array `application_versions.conversation_starters`
