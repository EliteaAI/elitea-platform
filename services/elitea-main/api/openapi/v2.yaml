        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # ADMIN — users
  # NOTE(W2): the router wires GET/POST/PUT/DELETE all onto eliteacore
  # Users (internal/api/router.go:282-285), which ignores the HTTP method and
  # any request body — every method returns the same {rows,total} listing.
  # Wire truth documented bug-for-bug (§7.1); the mutations are live no-ops.
  # ==========================================================================
  /admin/users/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: userList
      summary: List users for a project
      description: |
        UserList returns a paginated list of users for a project.
        NOTE(W2): response from internal/api/v2/eliteacore/handler.go:190-263.
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: userCreate
      summary: Create a user inside a project (live no-op)
      description: |
        NOTE(W2): the Go handler ignores the method and body and returns the
        user listing (eliteacore/handler.go:190-263) — user creation is not
        implemented on the Go router.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IgnoredRequestBody'
      responses:
        '200':
          description: User listing (echo — creation not performed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    put:
      operationId: userUpdate
      summary: Replace an existing user record (live no-op)
      description: |
        NOTE(W2): same handler as userList; body ignored
        (eliteacore/handler.go:190-263).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IgnoredRequestBody'
      responses:
        '200':
          description: User listing (echo — update not performed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: userDelete
      summary: Remove one or more users from a project (live no-op)
      description: |
        NOTE(W2): the old SPA sends ?id[]=N (repeated); the Go handler ignores
        the query entirely and returns the listing
        (eliteacore/handler.go:190-263) — deletion is not implemented on the
        Go router.
      tags: [admin]
      parameters:
        - name: id[]
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: >
            IDs of the users to delete. The old SPA sends ONE occurrence with
            the ids comma-joined — `?id[]=1,2,3`
            (apps/elitea-ui/src/api/admin.js:120), hence explode:false.
            Ignored by the Go handler either way (router.go:285 →
            eliteacore/handler.go:190-263 never reads the query).
      responses:
        '200':
          description: User listing (echo — deletion not performed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

