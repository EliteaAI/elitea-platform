            handler.go:314)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: Pin failed (pylon-era ok:false envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialActionErrorResponse'

    delete:
      operationId: unpinEntity
