      - name: public_project_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listProjects
      summary: List projects accessible to the caller
      description: |
        NOTE(W2): PLAIN ARRAY of Project,
        internal/api/v2/projects/handler.go:47-102; check_public_role is
        accepted but not read.
      tags: [applications]
      parameters:
        - name: check_public_role
          in: query
          schema: { type: boolean }
          description: Old-SPA parameter; accepted but not read.
      responses:
        '200':
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401': { $ref: '#/components/responses/401' }

  /projects/groups/prompt_lib:
    get:
      operationId: listGroups
      summary: List all prompt-lib groups
      description: |
        NOTE(W2): {items, total} envelope (NOT a bare array),
        internal/api/v2/projects/handler.go:109-130.
      tags: [applications]
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsListResponse'
        '401': { $ref: '#/components/responses/401' }

  /projects/group/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: addProjectGroup
      summary: Create a group if needed and attach it to a project
      description: |
        Creates the `centry.project_group` row when the name is new and attaches
        it to the project, in one transaction — so a rejected create cannot
        leave a group row behind with nothing attached to it. An existing name
        is REUSED rather than duplicated: the column is unique, and two projects
        in the same group is the point.

        `no_group` is rejected: it is the sentinel the listing uses for a
        project with no group at all.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupCreate'
      responses:
        '201':
          description: The project, with its groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithGroups'
        '400':
          description: Unvalidatable body, reserved name, or unknown project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /projects/group/prompt_lib/{project_id}/{group_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: group_id
        in: path
        required: true
        schema: { type: integer }

    delete:
      operationId: removeProjectGroup
      summary: Detach a group from a project
      description: |
        Removes the ASSOCIATION. The group row survives — it may be attached to
        other projects, and it belongs to the deployment rather than to the
        project detaching from it.

        A group that is not attached to this project is a 404. The reference
        answers 204, having swallowed the error its list removal raises, so
        "detached" and "nothing happened" were indistinguishable.
      tags: [applications]
      responses:
        '204':
          description: Detached.
        '400':
          description: Unknown project or unknown group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: The group is not attached to this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /projects/groups/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    put:
      operationId: putProjectGroups
      summary: Replace a project's group membership
      description: |
        REPLACES the project's groups with the named ones, creating any that do
        not exist yet; a group left out of the list is detached. An empty list
        detaches everything and deletes no group rows. Both statements run in
        one transaction, so an interrupted save cannot leave the project with no
        groups at all.

        Until issue 255 this handler decoded the body and echoed it back as the
        200 response without touching a table, so every group edit reported
        success and changed nothing.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupsUpdate'
      responses:
        '200':
          description: The project, with its groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithGroups'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  # ---------------------------------------------------------------------------
  # PROJECT QUOTA & STATISTICS (issue #246)
  #
  # legacy/plugins/projects/api/v2/{quota,statistics}.py. Neither carries a
  # `{mode}` segment — both are plain flask_restful Resources with
  # `url_params = ['<int:project_id>']`.
  # ---------------------------------------------------------------------------
  /projects/quota/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectQuota
      summary: A project's resource quota, or one quota check
      description: |
        Without `quota`, answers the project's whole quota row. With it, answers
        the bare JSON boolean "is this project still under that ceiling?".

        `-1` is the quota tables' unlimited sentinel.

        The `quota` form also ROLLS THE WINDOW OVER when it is due: after 30
        days it advances `last_update_time` by one window and zeroes the
        per-window counters. That is a write on a read, and it is the reference's
        behaviour — it is the only thing that ever resets those counters, so
        without it a project that hit its ceiling would be denied forever.
      tags: [applications]
      parameters:
        - name: quota
          in: query
          required: false
          schema: { type: string, enum: [dast_scans, sast_scans] }
          description: |
            Check one ceiling instead of returning the row. Only metrics that
            exist in BOTH the quota table and the counter table are checkable;
            the reference raises KeyError on anything else.
      responses:
        '200':
          description: The quota row, or the bare boolean result of one check
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProjectQuota'
                  - type: boolean
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such project, or the project has no quota row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: setProjectQuota
      summary: Update a project's VCU or storage limits
      description: |
        `usage_type` selects which triple of columns the body writes; the other
        triple is untouched. An omitted field CLEARS its column rather than
        leaving it alone, matching the reference's `update_*_limits` — the form
        always sends all three, and treating omission as "leave alone" would
        make a limit impossible to clear.

        The reference answers 500 for a missing `usage_type` (it calls `.lower()`
        on None) and a bodiless 200 for an unknown one; both are 400 here.
      tags: [applications]
      parameters:
        - name: usage_type
          in: query
          required: true
          schema: { type: string, enum: [vcu, storage] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectQuotaUpdate'
      responses:
        '200':
          description: The quota row after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectQuota'
        '400':
          description: Missing or unknown usage_type, or an unvalidatable body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: The project has no quota row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /projects/statistics/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectStatistics
      summary: A project's usage counters against its quota
      description: |
        One `{current, quota}` pair per metric.

        `quota` is NULL where the quota table has no column for that metric.
        The reference indexes the quota row with every counter's name and raises
        KeyError on the first one that is missing, so this endpoint cannot run
        there at all; reporting null is the deliberate replacement.

        `tasks_count` is NOT reported. The reference resolves it through a
        `tasks_count` RPC that no plugin registers, and nothing in this platform
        counts tasks.

        `storage_space` is measured live from the artifact store, in BYTES on
        both sides. The reference reported megabytes on the current side and
        paired them with a gigabyte quota column that does not exist.
      tags: [applications]
      responses:
        '200':
          description: Counters and their ceilings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatistics'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  # APPLICATIONS — project context
  /elitea_core/project_context/prompt_lib/{project_id}/project-context:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectContext
      summary: Retrieve the shared context blob for a project
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go:110-134.
      tags: [applications]
      responses:
        '200':
          description: Project context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContext'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    put:
      operationId: updateProjectContext
      summary: Replace the shared context blob for a project
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go:136-165 — typed
        decode {content, enabled}; the same pair is echoed back.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectContextUpdateRequest'
      responses:
        '200':
          description: Stored project context (echo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContext'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # ==========================================================================
  # ARTIFACTS — buckets, objects, transfer grants
  # docs/plans/storage-migration-plan.md S7. Replaces the retired legacy
  # surface (ADR-0016 §7) outright — no data migration, no old-shape
  # compatibility. All 13 operations below live under the default /api/v2
  # server (no per-path override): unlike the old /artifacts/s3 surface this
  # replaces, none of this is root-mounted.
  # ==========================================================================
  /artifacts/buckets/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listBuckets
      summary: List every non-deleted bucket in a project
      tags: [artifacts]
      responses:
        '200':
          description: Bucket listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createBucket
      summary: Create a new bucket
      description: >
        The bucket name is validated against ^[a-z][a-z0-9-]{1,62}$ and
        rejected, never normalised, when it does not already match (S8).
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '200':
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid bucket name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409':
          description: A bucket with this name already exists in the project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/buckets/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getBucket
      summary: Get one bucket
      tags: [artifacts]
      responses:
        '200':
          description: The bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    patch:
      operationId: updateBucket
      summary: Update a bucket's pin state, retention, and/or tags
      description: >
        is_pinned, retention_days, and tags are all optional and
        independently settable (S8). A retention_days above the project's
        policy ceiling (project_storage_policy.retention_max_days, not
        retention_default_days) is rejected with 403 QuotaExceeded.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        '200':
          description: Updated bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            Forbidden, or requested retention_days exceeds the project's
            policy ceiling (code QuotaExceeded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: deleteBucket
      summary: Delete a bucket and every object in it
      description: >
        Deletes objects via ObjectStore.DeleteBatch over a prefix listing,
        then soft-deletes the bucket metadata row (S8).
      tags: [artifacts]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/objects/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: listObjects
      summary: List objects in a bucket
      tags: [artifacts]
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
        - name: delimiter
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Object listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObjectsResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    post:
      operationId: uploadObject
      summary: Stream-upload one object
      description: >
        Streaming multipart upload, field `file` (S9). The server derives
        the storage key from the bucket and the supplied display name — a
        caller never supplies a storage path directly.
      tags: [artifacts]
      parameters:
        - name: overwrite
          in: query
          schema: { type: boolean, default: false }
          description: >
            A collision with overwrite=false (the default) returns 409
            AlreadyExists.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Key already exists and overwrite=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Object exceeds the project's max_object_bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/objects/{projectID}/{bucket}:batchDelete:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: batchDeleteObjects
      summary: Delete a batch of objects by key in one request
      description: >
        A JSON body, not repeated query parameters (S9). An empty `keys`
        array is 400 InvalidArgument — it never means "delete the bucket".
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteObjectsRequest'
      responses:
        '200':
          description: Per-key results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteObjectsResponse'
        '400':
          description: Empty keys array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/objects/{projectID}/{bucket}/{key}:
    # The router registers the three operations below on a trailing chi `/*`
    # wildcard, not a single-segment {key} param — chi v5.1.0 has no
    # multi-segment named-param syntax, and S1's own key grammar allows `/`
    # inside a key (S7/S9). segmentsMatch treats a trailing `*` in the router
    # pattern as matching any spec path remainder unconditionally, so this
    # still resolves against the wildcard registration.
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: May itself contain `/` characters.

    get:
      operationId: downloadObject
      summary: Download an object, with optional byte-range support
      tags: [artifacts]
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Full object
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    head:
      operationId: statObject
      summary: Fetch object metadata as headers only, no body
      tags: [artifacts]
      responses:
        '200':
          description: Metadata headers (Content-Length, Content-Type, ETag, Last-Modified)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: deleteObject
      summary: Delete a single object
      tags: [artifacts]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/grants/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: createTransferGrant
      summary: Create a short-lived presigned transfer grant
      description: >
        S15. Falls back to the streaming facade URL, not an error, when
        Capabilities().Presign is false for the configured backend.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferGrantRequest'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferGrantResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /artifacts/grants/{projectID}/{grantID}:commit:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: commitTransferGrant
      summary: Verify and commit a presigned upload, making it listable
      description: >
        Verifies size, digest, and media type against the grant row (S15).
        Media type verification is mandatory — ContentType is not part of
        the signed presigned-PUT payload. A digest or media-type mismatch
        deletes the uploaded object and returns 409; an object that exceeds
        the grant's max_bytes, or a commit that would push the project past
        its storage quota, deletes the uploaded object and returns 413.
      tags: [artifacts]
      responses:
        '200':
          description: Committed — the object is now listable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Digest or media-type mismatch, or the grant was already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >
            Uploaded object exceeds the grant's max_bytes, or committing it
            would exceed the project's storage quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}/parts/{partNumber}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }
      - name: partNumber
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1, maximum: 10000 }

    post:
      operationId: presignUploadPart
      summary: Presign one part of a native multipart upload
      description: >
        S16. grantID must be a grant CreateTransferGrant started as native
        multipart (its response carried upload_id, not url) — a single-shot
        grant, a GET grant, or a grant belonging to a different project
        cannot be used here.
      tags: [artifacts]
      responses:
        '200':
          description: A presigned PUT URL for this part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadPartResponse'
        '400':
          description: Invalid part number, or grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: The grant was already committed or aborted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:completeMultipart:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: completeMultipartUpload
      summary: Finish a native multipart upload, making it listable
      description: >
        S16. Applies the identical size/digest/media-type/quota
        verification commitTransferGrant does — completing via multipart is
        not a lesser-verified path. See commitTransferGrant's own
        description for what each response code means; they are shared.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMultipartRequest'
      responses:
        '200':
          description: Completed — the object is now listable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '400':
          description: Invalid request, or grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Digest or media-type mismatch, or the grant was already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >
            The completed object exceeds the grant's max_bytes, or
            completing it would exceed the project's storage quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:abortMultipart:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: abortMultipartUpload
      summary: Cancel a native multipart upload
      description: >
        S16. Unlike presignUploadPart/completeMultipartUpload, an expired
        grant may still be aborted — cleaning up an abandoned upload session
        is not itself subject to the grant's own TTL.
      tags: [artifacts]
      responses:
        '204':
          description: Aborted
        '400':
          description: grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: The grant was already committed or aborted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==========================================================================
  # AUTH — permissions
  # ==========================================================================
  /auth/permissions/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: permissionList
      summary: List permissions for a project (authenticated)
      description: |
        NOTE(W2): PLAIN ARRAY of {name, enabled} — static defaults today,
        internal/api/v2/eliteacore/handler.go:2993-3018; [] when the request
        carries no user identity.
      tags: [auth]
      responses:
        '200':
          description: Permission array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # NOTE(W1): the former /auth/permissions/prompt_lib/public/{public_project_id}
  # entry (publicPermissionList) was spec-only drift — no such /public/ segment
  # exists in the router, and the UI requests the public project's permissions
  # through the plain path above with the public project id
  # (src/api/auth.js:19: '/permissions/prompt_lib/' + PUBLIC_PROJECT_ID).

  # ==========================================================================
  # CHAT
  # ==========================================================================
  # NOTE(#126): webchatSync (POST
  # /elitea_core/webchat/prompt_lib/{project_id}/{version_id}) was removed. It
  # was gated on RouterConfig.Predictor — the prototype indexer transport — and
  # 404'd in every deployment. See #93 for the chat dispatch migration.

  # NOTE(#126/#194): getChatConfig (GET
  # /elitea_core/chat_config/prompt_lib/{project_id}) was removed here when the
  # prototype eliteacore registration — which sat inside the never-assigned
  # ChatService gate and so answered 404 in every deployment — was deleted.
  #
  # The path IS served again as of #194, but by the CURRENT implementation
  # (internal/api/v2/promptcontextreads, vault-backed, with its own auth and
  # models.chat.conversation.details permission resolution), returning the
  # five-key {chat_max_upload_count, chat_max_upload_size_mb,
  # chat_max_file_upload_size_mb, chat_max_image_upload_count,
  # chat_max_image_upload_size_mb} object — NOT the prototype's
  # {models, default_model}. The operation is deliberately still absent from
  # this document: its only client is the hand-written
  # apps/elitea-web/src/features/artifacts/api/chatConfigApi.ts, and declaring
  # it here would have orval generate a second, competing hook for the same
  # path. Re-add it here only together with removing that hand-written client.

