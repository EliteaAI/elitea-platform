    # ---- Artifacts ---------------------------------------------------------------
    # docs/plans/storage-migration-plan.md S7. Replaces the retired
    # legacy/pseudo-S3 surface (ADR-0016 §7) — no data migration, no wire
    # compatibility with the shapes this block used to document.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - NotFound
                - AlreadyExists
                - AccessDenied
                - InvalidArgument
                - InvalidKey
                - TooLarge
                - QuotaExceeded
                - PreconditionFailed
                - NotImplemented
                - Internal
                - DigestMismatch
                - MediaTypeMismatch
            message: { type: string }
            details:
              type: object
              properties:
                cleanup_error:
                  type: string
                  description: >-
                    The only diagnostic key any artifact handler emits. Set
                    solely by rejectCommit
                    (internal/api/v2/artifacts/grants.go:333-343), when a
                    commitTransferGrant verification failure (TooLarge /
                    MediaTypeMismatch / DigestMismatch / QuotaExceeded — its
                    five call sites at grants.go:438, 450, 462, 468, 504) is
                    followed by a FAILED cleanup delete of the just-uploaded
                    object; the value is that delete's error string. Every
                    other error response goes through writeError
                    (internal/api/v2/artifacts/handler.go:100-104), which
                    emits code+message only and no details member at all.
              description: >
                Closed set — one optional key. Not an open map: `details` is
                populated at exactly one site in the service
                (internal/api/v2/artifacts/grants.go:339), so it is typed
                here rather than carrying an x-elitea-passthrough marker.
                Widen this schema, do not re-open it, if a future handler
                adds a second diagnostic key.
      description: >
        The artifact API's error envelope. Distinct from the legacy
        ErrorResponse ({"error": "message"} — a plain string) used by every
        other operation in this spec; this is a deliberately richer, typed
        shape scoped to the new artifact operations only.

    Bucket:
      type: object
      required:
        - name
        - type
        - is_pinned
        - tags
        - retention_days
        - expires_at
        - size_bytes
        - object_count
        - created_at
        - updated_at
      properties:
        name: { type: string }
        type:
          type: string
          enum: [system, autogenerated, local]
          description: Wire name for the elitea_storage.buckets.bucket_type column.
        is_pinned: { type: boolean }
        tags:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): caller-owned opaque JSON, round-tripped verbatim. The
            handler never parses it: Bucket.Tags is json.RawMessage, not a
            typed struct (internal/api/v2/artifacts/handler.go:31), and
            bucketFromRow copies row.Tags straight through, substituting `{}`
            only when the column is empty
            (internal/api/v2/artifacts/handler.go:124-140). The repository is
            equally opaque — BucketRow.Tags is json.RawMessage
            (internal/infra/db/repos/artifact_buckets.go:30) filled by a
            direct cast off the sqlc row
            (internal/infra/db/repos/artifact_buckets.go:46) — and the column
            is a bare JSONB with no shape constraint
            (migrations/shared/0057_artifact_storage.sql:10). No key in this
            map is read by any Go code, so there is no closed set to
            enumerate; the shape is whatever the client last wrote.
        retention_days:
          type: integer
          nullable: true
          description: Null means no expiry.
        expires_at:
          type: string
          format: date-time
          nullable: true
        size_bytes:
          type: integer
          format: int64
          description: Sum of its objects' byte lengths (S6 SumBucketBytes).
        object_count:
          type: integer
          format: int64
          description: S6 CountBucketObjects.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BucketListResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'

    CreateBucketRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
          description: >
            Rejected, never normalised, when it does not already match this
            pattern — see S8.
        retention_days:
          type: integer
          nullable: true

    UpdateBucketRequest:
      type: object
      properties:
        is_pinned: { type: boolean }
        retention_days:
          type: integer
          nullable: true
        tags:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): write side of the same opaque blob as Bucket.tags. The
            update handler decodes the body into map[string]json.RawMessage
            and, on `tags` being present at all, hands the raw bytes to the
            repository without unmarshalling or validating them
            (internal/api/v2/artifacts/handler.go:291-292 and 320-321); the
            repository
            takes json.RawMessage and writes it wholesale, defaulting only an
            empty value to `{}`
            (internal/infra/db/repos/artifact_buckets.go:207-224). Storage is
            an unconstrained JSONB column
            (migrations/shared/0057_artifact_storage.sql:10). Semantics are
            replace-whole-map, not merge. No key is interpreted server-side,
            so there is no closed set to type.
      description: >
        Every field is optional and independently settable — a caller may
        send any subset (S8).

    ObjectSummary:
      type: object
      required: [key, size_bytes, media_type, etag, modified_at]
      properties:
        key: { type: string }
        size_bytes: { type: integer, format: int64 }
        media_type: { type: string }
        etag: { type: string }
        modified_at: { type: string, format: date-time }

    ListObjectsResponse:
      type: object
      required: [objects, common_prefixes]
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectSummary'
        common_prefixes:
          type: array
          items: { type: string }
        next_cursor:
          type: string
          description: Omitted when the listing is exhausted (S9).

    UploadObjectResponse:
      type: object
      required: [key, size_bytes, media_type, etag, created_at]
      properties:
        key: { type: string }
        size_bytes: { type: integer, format: int64 }
        media_type: { type: string }
        etag: { type: string }
        created_at: { type: string, format: date-time }

    BatchDeleteObjectsRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }
          minItems: 1
          description: >
            An empty array is 400 InvalidArgument — it never means "delete
            the bucket" (S9).

    BatchDeleteObjectsResponse:
      type: object
      required: [deleted, failed]
      properties:
        deleted:
          type: array
          items: { type: string }
        failed:
          type: array
          items:
            type: object
            required: [key, code, message]
            properties:
              key: { type: string }
              code:
                type: string
                enum:
                  - NotFound
                  - AlreadyExists
                  - AccessDenied
                  - InvalidArgument
                  - InvalidKey
                  - TooLarge
                  - QuotaExceeded
                  - PreconditionFailed
                  - NotImplemented
                  - Internal
              message: { type: string }

    CreateTransferGrantRequest:
      type: object
      required: [method, content_type, max_bytes]
      properties:
        method:
          type: string
          enum: [GET, PUT]
        display_name:
          type: string
          description: >
            The server derives the storage key; the caller never supplies
            one directly (S9/S15).
        content_type: { type: string }
        max_bytes: { type: integer, format: int64 }
        digest_alg:
          type: string
          description: >
            Required alongside digest for media types where integrity
            matters; commit cannot verify a digest that was never declared
            at grant time (S15).
        digest:
          type: string
          description: Hex-encoded digest, algorithm named by digest_alg.
      description: >
        PUT grants are single-use. Default TTL 15 minutes, maximum 60 (S15).
        A PUT request above 64 MiB on a backend whose Capabilities() reports
        NativeMultipart starts a native multipart upload instead of a
        single-shot grant (S16) — see TransferGrantResponse.upload_id.

    TransferGrantResponse:
      type: object
      required: [grant_id, method, expires_at, content_type, max_bytes]
      properties:
        grant_id: { type: string }
        url:
          type: string
          description: >
            Never the physical bucket, backend URL, or a credential — a
            complete, ready-to-use presigned (or facade) URL (S15). Absent
            when upload_id is present (S16) — a native multipart upload has
            no single URL for the whole object, only per-part ones obtained
            via POST .../grants/{projectID}/{grantID}/parts/{partNumber}.
        method:
          type: string
          enum: [GET, PUT]
        expires_at: { type: string, format: date-time }
        content_type: { type: string }
        max_bytes: { type: integer, format: int64 }
        upload_id:
          type: string
          description: >
            Present only for a native multipart upload (S16) — mutually
            exclusive with url. Exchange it for part-level presigned URLs,
            then finish with :completeMultipart or cancel with
            :abortMultipart.

    PresignUploadPartResponse:
      type: object
      required: [part_number, url, expires_at]
      description: >
        Response for POST .../grants/{projectID}/{grantID}/parts/{partNumber}
        (S16).
      properties:
        part_number: { type: integer, format: int32 }
        url:
          type: string
          description: A presigned PUT URL for this part only.
        expires_at:
          type: string
          format: date-time
          description: >
            Never later than the parent grant's own expires_at — a part URL
            cannot outlive the upload session it belongs to.

    CompletedPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number: { type: integer, format: int32 }
        etag:
          type: string
          description: The ETag the backend returned for this part's upload.

    CompleteMultipartRequest:
      type: object
      required: [parts]
      description: >
        Body for POST .../grants/{projectID}/{grantID}:completeMultipart
        (S16).
      properties:
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompletedPart'

