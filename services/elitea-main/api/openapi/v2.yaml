            what the DELETE takes back apart.
        user_id: { type: integer }
        user_email: { type: string }
        user_name: { type: string }
        mode:
          type: string
          description: >
            The pylon mode the role belongs to — `administration`, `developer`,
            `default`, … Reported for every mode that has roles; only non-default
            modes are writable here.
        role: { type: string }

