        NOTE(W2)).
      tags: [social]
      responses:
        '200':
          description: >
            Unpinned (also returned as a silent no-op when the request
            reached the handler with no auth context, or when the pool is
            unset — handler.go:334)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: Unpin failed (pylon-era ok:false envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialActionErrorResponse'

  /social/feedbacks/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listFeedbacks
      summary: List feedback entries for a project
      description: |
        NOTE(W2): internal/api/v2/social/handler.go:347-379 (ListFeedbacks).
        Queries p_{project_id}.social_feedbacks, matching the migration
        (internal/infra/db/migrations/001_initial.sql:337-347). {items,
        total} envelope where total is simply len(items) (no real COUNT(*),
        no offset — hardcoded LIMIT 50, :359); a query error is swallowed to
        items: [] / total: 0 when no feedback exists. Database failures are
        returned as safe 500 errors.
      tags: [social]
      responses:
        '200':
          description: Feedback listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: createFeedback
      summary: Submit feedback for an entity
      description: |
        NOTE(W2): internal/api/v2/social/handler.go:381-423 (CreateFeedback).
        INSERTs into p_{project_id}.social_feedbacks RETURNING id; responds
        201 on success (:422). See CreateFeedbackResponse's schema
        description for the unreachable-in-production 200 degraded shortcut.
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreateRequest'
      responses:
        '201':
          description: Feedback created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFeedbackResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: Feedback creation failed (pylon-era ok:false envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialActionErrorResponse'

