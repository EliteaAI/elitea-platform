    # ---- Toolkit instances ------------------------------------------------
    ToolkitCreateRequest:
      type: object
      required: [type]
      description: >
        NOTE(1c): the handler decodes into `map[string]any` and the repository
        reads exactly `name`, `type`, `description` and `settings`
        (internal/api/v2/toolkits/handler.go:891-900). There is no Go struct
        to mirror, so this schema DEFINES the contract rather than reflecting
        one — keep it in step with pgRepo.CreateToolkit if that changes.
        `author_id` is deliberately absent: the handler overwrites it from the
        authenticated principal.

        Only `type` is required. `name` is NOT enforced by the backend —
        `validateToolkitCreate` checks settings for `type: github` and nothing
        else, and the repository stores whatever `name` it is given, including
        an empty one. Marking `name` required here would make the generated
        client stricter than the server and reject requests the API accepts.
      properties:
        name: { type: string, minLength: 1 }
        type:
          type: string
          description: >
            Toolkit type key, e.g. `github`, `slack`, `sql`. The set is
            open — `toolkit_types` is served by a separate handler that this
            spec does not yet cover.
        description: { type: string }
        settings:
          type: object
          additionalProperties: true
          description: >
            Type-specific configuration, stored verbatim into
            `p_{project_id}.elitea_tools.settings`. Modelled open because the
            backend only validates it for `type: github`, which requires
            `repository` (non-empty) and `github_configuration`.
          x-elitea-passthrough: >-
            NOTE(W2): genuinely open, not an unfinished schema. The toolkit type
            set is open-ended and each type defines its own settings shape;
            `validateToolkitCreate` switches on `type` and constrains settings
            for `github` alone — every other type is accepted verbatim and
            written straight to the `settings` jsonb column
            (toolkits/handler.go:565-583). Closing this would make the generated
            client reject requests the server accepts.

    ToolkitUpdateRequest:
      type: object
      description: >
        NOTE(1c): all fields optional — `pgRepo.UpdateToolkit` applies only
        the keys present. Must NOT contain `has_relation`: that key makes the
        handler dispatch to a different operation entirely (tool↔entity
        relation, see the `updateToolkit` description and issue #38).
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string }
        description: { type: string }
        settings:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): same open contract as `ToolkitCreateRequest.settings` —
            `pgRepo.UpdateToolkit` applies whatever keys are present and the
            per-type validation that exists only covers `github`
            (toolkits/handler.go:565-583).

    ToolkitInstance:
      type: object
      required: [id, type, name, description, settings, meta, created_at, author_id]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        settings:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `p_{project_id}.elitea_tools.settings` jsonb, decoded
            decoded from `p_{project_id}.elitea_tools.settings` and redacted
            before response. Keys whose names contain secret, token, password,
            credential, api_key, or apikey are removed recursively
            (toolkits/handler.go:847-888).
        meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `p_{project_id}.elitea_tools.meta` jsonb, decoded and
            re-emitted verbatim (internal/api/v2/toolkits/handler.go:836,
            845). Channel-B fixture recommended (M1).
        created_at:
          type: string
          format: date-time
        author_id: { type: integer }
      description: >
        NOTE(W2): ListToolkits row (internal/api/v2/toolkits/handler.go:811-860).
        id/type/name are `elitea_tools` columns
        (internal/infra/db/migrations/001_initial.sql:177-179); description
        is COALESCE'd to `''` (never null, handler.go:822). created_at and
        author_id match the migration's `created_at TIMESTAMP NOT NULL` /
        `author_id INTEGER NOT NULL` (migration :182-183). The listing query
        intentionally selects only those migrated columns.

    ToolkitInstanceListResponse:
      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/ToolkitInstance' }
        total: { type: integer }
      description: >
        NOTE(W2): `{rows, total}` envelope
        (internal/api/v2/toolkits/handler.go:526-534). Repository failures are
        returned as a safe 500 error rather than an indistinguishable empty
        successful listing.

    # ---- MCP (issue 252) ---------------------------------------------------

    McpToolCallRequest:
      type: object
      required: [server, tool_call_id, params]
      description: >
        NOTE(W2): the body pylon's `McpToolCallPostBody` accepts
        (legacy/plugins/elitea_core/models/mcp.py). Documented for completeness;
        internal/api/v2/mcp/registry.go:96 does not read it, because the
        endpoint refuses unconditionally and a 400 for a malformed body would
        imply a well-formed one would be dispatched.
      properties:
        server:
          type: string
          description: Name of the registered MCP server to dispatch to.
        tool_call_id: { type: string }
        tool_timeout_sec: { type: integer }
        params:
          type: object
          additionalProperties: true
          description: Arguments forwarded verbatim to the tool.
          x-elitea-passthrough: >-
            NOTE(W2): genuinely open. These are the arguments of a tool defined
            by whichever MCP server the calling client registered, so their
            shape is not knowable to this service at all — pylon forwards the
            dict unchanged down the socket. The endpoint does not read the body
            (internal/api/v2/mcp/registry.go:96).

    InternalMcpPatStatus:
      type: object
      required: [internal, state]
      description: >
        NOTE(W2): internal/api/v2/mcp/patstatus.go:74 — the exact two-field
        object both branches write.
      properties:
        internal:
          type: boolean
          description: >
            True when the toolkit type is an internal Elitea MCP endpoint, i.e.
            the project holds a toolkit of that type whose settings URL points
            at `/app/<project id>/mcp/...` on this platform, with the project id
            either templated or resolved.
        state:
          type: string
          description: >
            One of VALID, EXPIRED or MISSING, about the CALLER's own personal
            access tokens. VALID when at least one token has not expired (a
            token with no expiry never expires); EXPIRED when tokens exist and
            all have passed their expiry; MISSING when the caller has none. A
            non-internal type always reports VALID, because there is no token
            requirement to report on. Not modelled as an enum: the value is
            produced by three constants in patstatus.go:58-62, and an enum
            whose members collide with an existing one makes the Go generator
            rename both constant sets.

    # ---- Admin & tenancy parity (issue 255) --------------------------------

