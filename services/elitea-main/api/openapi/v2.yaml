    # ---- Artifacts ---------------------------------------------------------------
    # docs/plans/storage-migration-plan.md S7. Replaces the retired
    # legacy/pseudo-S3 surface (ADR-0016 §7) — no data migration, no wire
    # compatibility with the shapes this block used to document.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - NotFound
                - AlreadyExists
                - AccessDenied
                - InvalidArgument
                - InvalidKey
                - TooLarge
                - QuotaExceeded
                - PreconditionFailed
                - NotImplemented
                - Internal
                - DigestMismatch
                - MediaTypeMismatch
            message: { type: string }
            details:
              type: object
              additionalProperties: true
      description: >
        The artifact API's error envelope. Distinct from the legacy
        ErrorResponse ({"error": "message"} — a plain string) used by every
        other operation in this spec; this is a deliberately richer, typed
        shape scoped to the new artifact operations only.

    Bucket:
      type: object
      required:
        - name
        - type
        - is_pinned
        - tags
        - retention_days
        - expires_at
        - size_bytes
        - object_count
        - created_at
        - updated_at
      properties:
        name: { type: string }
        type:
          type: string
          enum: [system, autogenerated, local]
          description: Wire name for the elitea_storage.buckets.bucket_type column.
        is_pinned: { type: boolean }
        tags:
          type: object
          additionalProperties: true
        retention_days:
          type: integer
          nullable: true
          description: Null means no expiry.
        expires_at:
          type: string
          format: date-time
          nullable: true
        size_bytes:
          type: integer
          format: int64
          description: Sum of its objects' byte lengths (S6 SumBucketBytes).
        object_count:
          type: integer
          format: int64
          description: S6 CountBucketObjects.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BucketListResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'

    CreateBucketRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
          description: >
            Rejected, never normalised, when it does not already match this
            pattern — see S8.
        retention_days:
          type: integer
          nullable: true

    UpdateBucketRequest:
      type: object
      properties:
        is_pinned: { type: boolean }
        retention_days:
          type: integer
          nullable: true
        tags:
          type: object
          additionalProperties: true
      description: >
        Every field is optional and independently settable — a caller may
        send any subset (S8).

    ObjectSummary:
      type: object
      required: [key, size_bytes, media_type, etag, modified_at]
      properties:
        key: { type: string }
        size_bytes: { type: integer, format: int64 }
        media_type: { type: string }
        etag: { type: string }
        modified_at: { type: string, format: date-time }

    ListObjectsResponse:
      type: object
      required: [objects, common_prefixes]
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectSummary'
        common_prefixes:
          type: array
          items: { type: string }
        next_cursor:
          type: string
          description: Omitted when the listing is exhausted (S9).

    UploadObjectResponse:
      type: object
      required: [key, size_bytes, media_type, etag, created_at]
      properties:
        key: { type: string }
        size_bytes: { type: integer, format: int64 }
        media_type: { type: string }
        etag: { type: string }
        created_at: { type: string, format: date-time }

    BatchDeleteObjectsRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }
          minItems: 1
          description: >
            An empty array is 400 InvalidArgument — it never means "delete
            the bucket" (S9).

    BatchDeleteObjectsResponse:
      type: object
      required: [deleted, failed]
      properties:
        deleted:
          type: array
          items: { type: string }
        failed:
          type: array
          items:
            type: object
            required: [key, code, message]
            properties:
              key: { type: string }
              code:
                type: string
                enum:
                  - NotFound
                  - AlreadyExists
                  - AccessDenied
                  - InvalidArgument
                  - InvalidKey
                  - TooLarge
                  - QuotaExceeded
                  - PreconditionFailed
                  - NotImplemented
                  - Internal
              message: { type: string }

    CreateTransferGrantRequest:
      type: object
      required: [method, content_type, max_bytes]
      properties:
        method:
          type: string
          enum: [GET, PUT]
        display_name:
          type: string
          description: >
            The server derives the storage key; the caller never supplies
            one directly (S9/S15).
        content_type: { type: string }
        max_bytes: { type: integer, format: int64 }
        digest_alg:
          type: string
          description: >
            Required alongside digest for media types where integrity
            matters; commit cannot verify a digest that was never declared
            at grant time (S15).
        digest:
          type: string
          description: Hex-encoded digest, algorithm named by digest_alg.
      description: >
        PUT grants are single-use. Default TTL 15 minutes, maximum 60 (S15).

    TransferGrantResponse:
      type: object
      required: [grant_id, url, method, expires_at, content_type, max_bytes]
      properties:
        grant_id: { type: string }
        url:
          type: string
          description: >
            Never the physical bucket, backend URL, or a credential — a
            complete, ready-to-use presigned (or facade) URL (S15).
        method:
          type: string
          enum: [GET, PUT]
        expires_at: { type: string, format: date-time }
        content_type: { type: string }
        max_bytes: { type: integer, format: int64 }

