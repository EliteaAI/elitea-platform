        the first version.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreatedResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/public_applications/prompt_lib:
    get:
      operationId: listPublicApplications
      summary: List published applications visible without project membership
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go:1251-1317 — {rows,
        total}; limit/offset are accepted but not read (hard LIMIT 50); the
        handler reads ?category=.
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema: { type: string }
          description: Marketplace category filter (read at handler.go:1270-1280).
      responses:
        '200':
          description: Published applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApplicationList'

  # APPLICATIONS — single resource CRUD
  /elitea_core/application/prompt_lib/{project_id}/{application_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: application_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: getApplication
      summary: Retrieve full application details
      description: |
        NOTE(W2): internal/api/v2/applications/handler.go:110-139.
      tags: [applications]
      responses:
        '200':
          description: Application details with version summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: deleteApplication
      summary: Remove an application and all associated versions
      description: |
        NOTE(W2): internal/api/v2/applications/handler.go:625-668 — 204 with
        no body on success (also when already gone); 400 {"error": ...} when
        a published/embedded version exists (:639-644).
      tags: [applications]
      responses:
        '204':
          description: Deleted (no content); also returned when already absent
        '400': { $ref: '#/components/responses/400' }
