  # ==========================================================================
  # SETTINGS
  # ==========================================================================
  /elitea_core/entity_settings/prompt_lib/{project_id}/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_id
        in: path
        required: true
        schema: { type: integer }

    # NOTE(W1): a PUT (replaceEntitySettings) on this 2-segment path was
    # spec-only drift — the router serves PATCH here and PUT only on the
    # 3-segment {participant_id} path; the UI (chat.api.js) matches the router.
    patch:
      operationId: patchEntitySettings
      summary: Batch update of per-participant settings
      description: |
        NOTE(W2): BatchUpdateEntitySettings,
        internal/api/v2/conversations/handler.go:663-676 — the body is a
        JSON ARRAY of settings maps; responds {"ok": true}.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchEntitySettingsRequest'
      responses:
        '200':
          description: Settings stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/entity_settings/prompt_lib/{project_id}/{conversation_id}/{participant_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_id
        in: path
        required: true
        schema: { type: integer }
      - name: participant_id
        in: path
        required: true
        schema: { type: integer }

    put:
      operationId: replaceParticipantSettings
      summary: Replace settings for a specific participant
      description: |
        NOTE(W2): UpdateEntitySettings,
        internal/api/v2/conversations/handler.go:585-625 — arbitrary settings
        map; llm_settings may be validated/stripped for non-published agents
        (:596-618); responds {"entity_settings": <stored body>}.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantSettingsRequest'
      responses:
        '200':
          description: Stored settings echo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySettingsUpdateResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    # NOTE(W1): a PATCH (patchParticipantSettings) on this 3-segment path was
    # spec-only drift — the router serves PUT here and PATCH only on the
    # 2-segment conversation path; the UI (chat.api.js) matches the router.

  # NOTE: /elitea_core/platform_settings/prompt_lib is defined above under ADMIN.
  # The settings domain aliases to the same path (tagged [settings] in the UI).

  # ==========================================================================
  # SKILLS
  # ==========================================================================
  /elitea_core/application_skills/prompt_lib/{project_id}/{app_version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: app_version_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listApplicationSkills
      summary: List skills attached to an agent version
      description: |
        NOTE(W2): the router points this at the skills List handler
        (internal/api/router.go:360 → skills/handler.go:61-78) — the
        app_version_id segment is not read; the response is the project
        skills list envelope.
      tags: [skills]
      responses:
        '200':
          description: Skills list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/skills/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listSkills
      summary: Paginated list of skills for a project
      description: |
        NOTE(W2): internal/api/v2/skills/handler.go:61-78 — {items, total,
        page, page_size, total_pages}; pagination via ?page/?page_size
        (limit/offset accepted but not read).
      tags: [skills]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: Pagination parameter the handler actually reads.
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
          description: Pagination parameter the handler actually reads.
      responses:
        '200':
          description: Skills list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createSkill
      summary: Create a skill
      description: |
        NOTE(W2): internal/api/v2/skills/handler.go:92-107 — responds 201
        with the created Skill record.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
      responses:
        '201':
          description: Created skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # NOTE(W1): the former 2-segment /elitea_core/skills/prompt_lib entry
  # (listPublicSkills/createPublicSkill) was spec-only drift — the router only
  # serves /skills/{mode}/{projectID} (3 segments; chi will not match a
  # 2-segment path to it) and the UI has no call site for the 2-segment shape.

  # ==========================================================================
  # SKILLS — publishing (#249)
  # internal/api/v2/skillpublish, registered in internal/api/router.go beside
  # the application publish block. The publish/unpublish/validate trio mirrors
  # the application-level one; the catalog reads serve the PUBLIC project's
  # schema (PUBLIC_PROJECT_ID, default 1) and expose published versions only.
  # ==========================================================================
  /elitea_core/publish_skill/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: publishSkill
      summary: Publish a skill version to the public skill catalog
      description: |
        Snapshots the version into a new source version named `version_name`
        and copies it into the public project as a twin skill's published
        version. Publishing from the public project itself publishes in place.
        Requires the version to pass pre-publish validation; call
        /publish_skill_validate first to receive a `validation_token` that
        skips re-validation.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_name]
              properties:
                version_name:
                  type: string
                  pattern: '^[a-zA-Z0-9._-]{1,50}$'
                validation_token:
                  type: string
                  description: Token issued by /publish_skill_validate for this exact content.
                category:
                  type: string
                  description: One of /skill_categories; an omitted category falls back to "Other".
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
                  public_skill_id: { type: integer }
                  public_version_id: { type: integer }
                  version_name: { type: string }
                  source_version_id: { type: integer }
        '400':
          description: |
            Bad request. `error` is one of `invalid_category`,
            `version_name_exists`, `version_name_conflict`, `limit_reached`, or
            `validation_token_invalid` — the last carrying `validation_result`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          $ref: '#/components/schemas/SkillFieldError'
                    description: >-
                      A refusal code, or the pydantic-style field-error list
                      the version_name checks emit
                      (internal/api/v2/skillpublish/publish.go:66-80).
                  msg: { type: string }
                  validation_result:
                    $ref: '#/components/schemas/SkillValidationResult'
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Publishing is blocked for this project by platform policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  msg: { type: string }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/unpublish_skill/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: unpublishSkill
      summary: Remove a published skill version from the public catalog
      description: |
        Deletes the catalog copy and reverts the source version to draft. A
        twin skill left with no published versions is removed with it; an
        in-place original keeps its drafts.
      tags: [skills]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Unpublished
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
                  status: { type: string }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/publish_skill_validate/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: validateSkillForPublish
      summary: Validate a skill version before publishing
      description: |
        Runs the deterministic pre-publish checks. 200 on PASS/WARN (with a
        `validation_token`), 422 on FAIL. `ai_validation_available` is always
        false in this stack — the AI half of the reference's gate has no
        transport here (issues 126 and 194).
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version_name: { type: string }
                category: { type: string }
      responses:
        '200':
          description: Validation PASS or WARN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillValidationResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '422':
          description: Validation FAIL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillValidationResult'

  /elitea_core/public_skills/prompt_lib:
    get:
      operationId: listPublicSkills
      summary: List published skills in the public catalog
      description: |
        Reads the public project's schema; only skills with a published
        version appear. `my_liked` and the trend window are not implemented
        (they depend on the social like store).
      tags: [skills]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: query
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: tags
          in: query
          description: Comma-separated tag ids; a skill must carry ALL of them.
          schema: { type: string }
        - name: sort_by
          in: query
          description: created_at (default) or name.
          schema: { type: string }
        - name: sort_order
          in: query
          description: asc or desc (default).
          schema: { type: string }
      responses:
        '200':
          description: Published skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicSkillListItem'

  /elitea_core/public_skill/prompt_lib/{skill_id}:
    parameters:
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: getPublicSkill
      summary: Retrieve one public catalog skill and its newest published version
      tags: [skills]
      responses:
        '200':
          description: Public skill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSkillDetail'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/public_skill/prompt_lib/{skill_id}/{version_name}:
    parameters:
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_name
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getPublicSkillVersion
      summary: Retrieve one public catalog skill pinned to a published version name
      tags: [skills]
      responses:
        '200':
          description: Public skill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSkillDetail'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/attach_public_skill/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: attachPublicSkill
      summary: Fork a published skill into a project and attach it to agent versions
      description: |
        Forks the published (skill, version) into this project once, reusing an
        existing local copy when one exists, then writes one
        entity_skill_mapping row per agent version. Partial success is carried
        per agent in `results`, not in the HTTP status.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_skill_id, public_version_id, agent_version_ids]
              properties:
                public_skill_id: { type: integer }
                public_version_id: { type: integer }
                agent_version_ids:
                  type: array
                  items: { type: integer }
                entity_type:
                  type: string
                  default: agent
                  description: >-
                    Only "agent" is accepted; pylon's SkillEntityTypes enum has
                    no other member
                    (internal/api/v2/skillpublish/attach.go:66-72).
      responses:
        '200':
          description: Per-agent attach outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_version_id: { type: integer }
                        ok: { type: boolean }
                        http_status: { type: integer }
                        error: { type: string }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/skill_categories/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listSkillCategories
      summary: List the predefined skill categories available for publishing
      description: |
        The nine predefined categories, "Other" last. Admin-added extras
        (the reference's `skill_publishing_guardrail.skill_categories`) are not
        served: this platform's admin config schema has no such field.
      tags: [skills]
      responses:
        '200':
          description: Skill categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        is_default: { type: boolean }
        '400': { $ref: '#/components/responses/400' }

  /elitea_core/skill_export_fork/prompt_lib/{project_id}/{skill_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: exportSkillFork
      summary: Build the JSON fork payload for a skill's default version
      description: |
        Distinct from /skill_export, which downloads Markdown. The copied
        version is always emitted as the target's single 'base' version.
      tags: [skills]
      responses:
        '200':
          description: Fork payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillForkPayload'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/skill_export_fork/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: exportSkillVersionFork
      summary: Build the JSON fork payload for a specific skill version
      tags: [skills]
      responses:
        '200':
          description: Fork payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillForkPayload'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/agents_with_skill/prompt_lib/{project_id}/{skill_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          description: The PUBLIC catalog skill id, not a local one.

    get:
      operationId: listAgentsWithSkill
      summary: List agent versions in this project that use a public skill
      description: |
        Reverse lookup through the fork lineage: every local copy of the public
        skill (`parent_project_id` + `parent_entity_id` in the version meta),
        then every agent version mapped to one.
      tags: [skills]
      responses:
        '200':
          description: Agent versions using the skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id: { type: integer }
                        name: { type: string }
                        entity_version_id: { type: integer }
                        icon_meta:
                          type: object
                          nullable: true
                          additionalProperties: true
                          x-elitea-passthrough: >-
                            NOTE(W2): applications.meta->'icon_meta', forwarded
                            as stored
                            (internal/api/v2/skillpublish/attach.go:281-287) —
                            the icon payload's shape is owned by the writer, not
                            by this route.
        '400': { $ref: '#/components/responses/400' }

  # ==========================================================================
  # SOCIAL
  # NOTE(W2): internal/api/v2/social/handler.go, mounted at router.go:606
  # `r.Mount("/social", v2social.NewHandler(cfg.Pool).Routes())`. CORRECTION
  # to a prior assumption that this sits under /elitea_core/social/...: by
  # indentation, `r.Mount("/social", ...)` (router.go:606, 3 tabs) is a
  # SIBLING of `r.Route("/elitea_core", ...)` (router.go:327, also 3 tabs,
  # whose own body is one tab deeper starting :328) — both are direct
  # children of the outer `r.Route("/api/v2", ...)` (router.go:235), NOT
  # nested inside each other. Every /social/* path below is therefore
  # `/api/v2/social/...`, NOT `/api/v2/elitea_core/social/...`. This is the
  # same sibling-mount pattern this file's own pre-existing
  # `/artifacts/buckets/...` paths already reflect (router.go:609
  # `r.Route("/artifacts", ...)` is the very next sibling after /social, and
  # those paths correctly carry no /elitea_core prefix either) — confirmed,
  # not assumed, by reading router.go's actual brace nesting rather than
  # its comments. The router also registers a trailing-slash duplicate
  # (`/author/`) onto the identical GET/PUT handlers; documented once here,
  # per this file's `/support_assistant/config` precedent for the same
  # pattern.
  # ==========================================================================
  /social/author:
    get:
      operationId: getCurrentAuthor
      summary: Get the authenticated user's own social/author profile
      description: |
        NOTE(W2): internal/api/v2/social/handler.go:51-123 (GetAuthor). Reads
        centry.social_users joined to auth_core__user; on no matching row or
        any query error, falls back to a defaulted response built from the
        auth context (:98-107) — still 200, never surfaced as an error.
      tags: [social]
      responses:
        '200':
          description: Author profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthorProfile'
        '401': { $ref: '#/components/responses/401' }

    put:
      operationId: updateCurrentAuthor
