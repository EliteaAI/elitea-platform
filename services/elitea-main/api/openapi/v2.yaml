        NOTE(W2): internal/api/v2/eliteacore/handler.go:2714-2718. With
        ?as_file=true the same JSON is sent with a Content-Disposition
        attachment header (:2720-2726). The handler also has a test-only
        degraded return: when h.pool == nil it writes {"ok": true} with no
        applications/toolkits keys (:2481-2484) — unreachable in production
        (cmd/elitea-main/main.go:54-58 exits when the pool cannot be built;
        internal/api/router.go:236 always passes it).

    ExportConverterResponse:
      type: object
      required: [ok, converted]
      properties:
        ok: { type: boolean }
        converted:
          nullable: true
          x-elitea-passthrough: >-
            NOTE(W2): echo of the request body, whatever it was
            (internal/api/v2/eliteacore/handler.go:2726-2730); null when the
            body was absent/malformed.
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2726-2730 — the
        "converter" is currently an echo stub.

    ExportConverterRequest:
      type: object
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): arbitrary legacy payload; decoded into map[string]any and
        echoed back unchanged (internal/api/v2/eliteacore/handler.go:2726-2730).

    ImportEntity:
      type: object
      properties:
        entity:
          type: string
          description: '"toolkits" routes to toolkit import; anything else is an agent.'
        import_uuid: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        settings:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): toolkit settings persisted verbatim after import_uuid
            resolution (internal/api/v2/eliteacore/handler.go:2110-2146).
        versions:
          type: array
          items: { $ref: '#/components/schemas/VersionWriteRequest' }
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): entities are handled as map[string]any; the import reads
        entity/import_uuid/name/description/type/settings/versions, each
        version's import_version_uuid (:2043-2046, load-bearing — resolves
        toolkit settings.application_version_id at :2120-2123), tools'
        import_uuid + selected_tools (:2192-2196, persisted to
        entity_tool_mapping), and toolkit settings.import_uuid /
        settings.import_version_uuid (:2115, :2120); the rest is ignored
        (internal/api/v2/eliteacore/handler.go:1928-2148). The versions
        items ref VersionWriteRequest, whose additionalProperties admits the
        round-trip keys (import_version_uuid, tools) that its named
        properties do not declare.

    ImportWizardRequest:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/ImportEntity' }
        - type: object
          required: [applications]
          properties:
            applications:
              type: array
              items: { $ref: '#/components/schemas/ImportEntity' }
      description: >
        NOTE(W2): the handler accepts a bare entity array (import_wizard) or a
        {"applications": [...]} envelope
        (internal/api/v2/eliteacore/handler.go:1887-1898).

    ImportError:
      type: object
      required: [index, name, msg]
      properties:
        index:
          type: integer
          description: Position of the failed entity in the request array.
        name: { type: string }
        msg: { type: string }
      description: >
        NOTE(W2): all six emit sites include index —
        internal/api/v2/eliteacore/handler.go:1966, 1974, 1986, 2125-2129,
        2152, 2218-2222.

    ImportedAgent:
      type: object
      required: [id, name, description, owner_id, versions, version_details]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner_id:
          type: string
          description: Target project id (quirk — not a user id).
        versions:
          type: array
          items:
            type: object
            required: [id, application_id, name, status]
            properties:
              id: { type: string }
              application_id: { type: string }
              name: { type: string }
              status: { type: string }
        version_details:
          allOf: [{ $ref: '#/components/schemas/ApplicationVersionDetail' }]
          nullable: true
          description: >
            Key ALWAYS present in the marshaled map — null only when every
            version insert failed (versionDetails stays nil, :1997).
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2085-2093 —
        version_details unconditionally present (hence required+nullable).

    ImportedToolkit:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2148-2150.

    ImportWizardResponse:
      type: object
      required: [result, errors]
      properties:
        result:
          type: object
          required: [agents]
          properties:
            agents:
              type: array
              items: { $ref: '#/components/schemas/ImportedAgent' }
            toolkits:
              type: array
              items: { $ref: '#/components/schemas/ImportedToolkit' }
        errors:
          type: object
          required: [agents]
          properties:
            agents:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
            toolkits:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2238-2241 (the
        writeJSON of the {result, errors} envelope); empty-input fast path at
        :1900-1906 omits the toolkits keys. Status is 201 when all entities
        imported, 207 on partial failure, 400 when all failed (:2226-2237).

    Permission:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
      description: >
        NOTE(W2): defaultPermissions(),
        internal/api/v2/eliteacore/handler.go:3003-3018 — static list, enabled
        always true; empty array when the request carries no user identity.

    SearchOptions:
      type: object
      required: [tags, collections]
      properties:
        tags:
          type: array
          items: { type: string }
        collections:
          type: array
          items: { type: object }
          description: Always empty today (handler.go:187).
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:167-188.

  responses:
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # ADMIN — users
  # NOTE(W2): the router wires GET/POST/PUT/DELETE all onto eliteacore
  # Users (internal/api/router.go:282-285), which ignores the HTTP method and
  # any request body — every method returns the same {rows,total} listing.
  # Wire truth documented bug-for-bug (§7.1); the mutations are live no-ops.
  # ==========================================================================
  /admin/users/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: userList
      summary: List users for a project
      description: |
        UserList returns a paginated list of users for a project.
        NOTE(W2): response from internal/api/v2/eliteacore/handler.go:190-263.
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: userCreate
      summary: Create a user inside a project (live no-op)
      description: |
        NOTE(W2): the Go handler ignores the method and body and returns the
        user listing (eliteacore/handler.go:190-263) — user creation is not
        implemented on the Go router.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IgnoredRequestBody'
      responses:
        '200':
          description: User listing (echo — creation not performed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    put:
      operationId: userUpdate
      summary: Replace an existing user record (live no-op)
      description: |
        NOTE(W2): same handler as userList; body ignored
        (eliteacore/handler.go:190-263).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IgnoredRequestBody'
      responses:
        '200':
          description: User listing (echo — update not performed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: userDelete
      summary: Remove one or more users from a project (live no-op)
      description: |
        NOTE(W2): the old SPA sends ?id[]=N (repeated); the Go handler ignores
        the query entirely and returns the listing
        (eliteacore/handler.go:190-263) — deletion is not implemented on the
        Go router.
      tags: [admin]
      parameters:
        - name: id[]
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: >
            IDs of the users to delete. The old SPA sends ONE occurrence with
            the ids comma-joined — `?id[]=1,2,3`
            (apps/elitea-ui/src/api/admin.js:120), hence explode:false.
            Ignored by the Go handler either way (router.go:285 →
            eliteacore/handler.go:190-263 never reads the query).
      responses:
        '200':
          description: User listing (echo — deletion not performed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  # ==========================================================================
  # ADMIN — roles
  # ==========================================================================
  /admin/roles/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: roleList
