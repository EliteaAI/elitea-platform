openapi: "3.0.3"
info:
  title: Elitea Platform API
  version: "2.0.0"
  description: |
    External REST API for the Elitea Platform (elitea-main Go service).
    Wire-compatible drop-in replacement for pylon_main (Python/Flask).

    ## Response shape conventions
    - **Single resource**: returned directly at top level — `{"id": 42, "name": "..."}`
    - **Paginated lists**: `{"total": N, "rows": [...]}`
    - **Admin paginated lists**: `{"items": [...], "total": N, "page": N, "page_size": N}`
    - **General errors (4xx)**: `{"ok": false, "error": "message"}`
    - **Rate limit (429)**: `{"error": {"message": "...", "type": "rate_limit_error", "code": "rate_limit_exceeded"}}`
    - All field names are **snake_case**; no envelope wrappers.

servers:
  - url: /api/v2/elitea_core
    description: Core platform API server (prompt_lib scope)
  - url: /api/v2
    description: Admin and auxiliary APIs

tags:
  - name: admin
    description: User, role, and moderation management
  - name: analytics
    description: Usage analytics for prompts, tools, and agents
  - name: applications
    description: Application (agent/pipeline/skill) lifecycle management
  - name: artifacts
    description: Bucket and artifact (file) storage
  - name: auth
    description: Permissions
  - name: chat
    description: Conversational / webchat endpoints
  - name: configurations
    description: Runtime configuration management
  - name: notifications
    description: User notifications
  - name: resources
    description: Shared resources
  - name: search
    description: Search and filter options
  - name: secrets
    description: Secret / credential management
  - name: settings
    description: Entity and platform settings
  - name: skills
    description: Skill management
  - name: social
    description: Social features (likes, follows)
  - name: tags
    description: Tag management
  - name: toolkits
    description: Toolkit (integration) management

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Project identifier (extracted from URL path)
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 1000
      description: Maximum number of items to return
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip before starting to collect results
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Free-text search filter
    SortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
      description: Field name to sort results by
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start of date range (inclusive)
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End of date range (inclusive)

  schemas:
    # ---- Generic / utility ------------------------------------------------
    Struct:
      type: object
      additionalProperties: {}
      description: >
        Arbitrary JSON object. Used for request/response bodies that are not
        yet strongly typed (mirrors google.protobuf.Struct semantics).

    GenericResponse:
      type: object
      additionalProperties: {}
      description: >
        Generic success response. Shape varies by endpoint; see individual
        endpoint descriptions. No envelope wrapper.

    # ---- Paginated responses -----------------------------------------------
    PaginatedResponse:
      type: object
      required: [total, rows]
      properties:
        total:
          type: integer
          description: Total number of matching records across all pages
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Struct'
          description: Items for the current page

    AdminPaginatedResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Struct'
          description: Items for the current page
        total:
          type: integer
          description: Total number of matching records
        page:
          type: integer
          description: Current page number (1-based)
        page_size:
          type: integer
          description: Number of items per page

    ArrayResponse:
      type: array
      items:
        $ref: '#/components/schemas/Struct'
      description: Unpagianted array result

    # ---- Error responses ---------------------------------------------------
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error message

    RateLimitErrorDetail:
      type: object
      required: [message, type, code]
      properties:
        message:
          type: string
        type:
          type: string
          enum: [rate_limit_error]
        code:
          type: string
          enum: [rate_limit_exceeded]

    RateLimitErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/RateLimitErrorDetail'

    # ---- Domain schemas (generic shells — to be refined per endpoint) ------
    User:
      allOf:
        - $ref: '#/components/schemas/Struct'
      description: User record

    Role:
      allOf:
        - $ref: '#/components/schemas/Struct'
      description: Role record

    Application:
      allOf:
        - $ref: '#/components/schemas/Struct'
      description: Application (agent / pipeline / skill) record

    ApplicationVersion:
      allOf:
        - $ref: '#/components/schemas/Struct'
      description: Application version record

    Bucket:
      allOf:
        - $ref: '#/components/schemas/Struct'
      description: Storage bucket record

    Artifact:
      allOf:
        - $ref: '#/components/schemas/Struct'
      description: Stored artifact (file) record

  responses:
    Generic200:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'

    Paginated200:
      description: Paginated list of results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedResponse'

    AdminPaginated200:
      description: Admin-style paginated list of results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminPaginatedResponse'

    Array200:
      description: Array of results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArrayResponse'

    Object200:
      description: Single resource object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Struct'

    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    429:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'

    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # ADMIN — users
  # ==========================================================================
  /admin/users/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: userList
      summary: List users for a project
      description: UserList returns a paginated list of users for a project.
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/AdminPaginated200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

    post:
      operationId: userCreate
      summary: Create a user inside a project
      description: UserCreate creates a new user inside a project.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Struct'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

    put:
      operationId: userUpdate
      summary: Replace an existing user record
      description: UserUpdate replaces an existing user record inside a project.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Struct'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

    delete:
      operationId: userDelete
      summary: Remove one or more users from a project
      description: UserDelete removes one or more users from a project.
      tags: [admin]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the user to delete
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  # ==========================================================================
  # ADMIN — roles
  # ==========================================================================
  /admin/roles/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: roleList
      summary: List roles for a project
      description: RoleList returns a paginated list of roles for a project.
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/AdminPaginated200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  # ==========================================================================
  # ADMIN — moderation
  # ==========================================================================
  /admin/moderation_status/default/{project_id}/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: entity_id
        in: path
        required: true
        schema:
          type: integer

    get:
      operationId: moderationStatus
      summary: Get moderation status for an entity
      description: ModerationStatus retrieves the current moderation status for an entity.
      tags: [admin]
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

    post:
      operationId: createModerationRequest
      summary: Submit a moderation request for an entity
      description: CreateModerationRequest submits a new moderation request for an entity.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Struct'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  # ==========================================================================
  # ADMIN — platform settings & support assistant
  # ==========================================================================
  /elitea_core/platform_settings/prompt_lib:
    get:
      operationId: getPlatformSettings
      summary: Retrieve platform-wide settings for the prompt library
      description: GetPlatformSettings retrieves platform-wide settings for the prompt library.
      tags: [admin]
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

  /support_assistant/config:
    get:
      operationId: getSupportAssistantConfig
      summary: Retrieve support assistant configuration
      description: GetSupportAssistantConfig retrieves the configuration for the support assistant.
      tags: [admin]
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

  # ==========================================================================
  # ANALYTICS
  # ==========================================================================
  /elitea_core/analytics/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectAnalytics
      summary: Aggregated analytics for a project's prompt library
      description: GetProjectAnalytics returns aggregated analytics for a project's prompt library.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/analytics_users/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAnalyticsUsers
      summary: Paginated user analytics for a project's prompt library
      description: ListAnalyticsUsers returns paginated user analytics for a project's prompt library.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          $ref: '#/components/responses/Paginated200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/analytics_user_detail/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAnalyticsUserDetail
      summary: Detailed analytics for a specific user within a project
      description: GetAnalyticsUserDetail returns detailed analytics for a specific user within a project.
      tags: [analytics]
      parameters:
        - name: user_id_string
          in: query
          schema: { type: string }
        - name: user_id_int
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/analytics_tools/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAnalyticsTools
      summary: Paginated tool analytics for a project's prompt library
      description: ListAnalyticsTools returns paginated tool analytics for a project's prompt library.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          $ref: '#/components/responses/Paginated200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/analytics_tool_detail/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAnalyticsToolDetail
      summary: Detailed analytics for a specific tool within a project
      description: GetAnalyticsToolDetail returns detailed analytics for a specific tool within a project.
      tags: [analytics]
      parameters:
        - name: tool_name
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/analytics_agents/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAnalyticsAgents
      summary: Paginated agent analytics for a project's prompt library
      description: ListAnalyticsAgents returns paginated agent analytics for a project's prompt library.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          $ref: '#/components/responses/Paginated200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/analytics_agent_detail/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAnalyticsAgentDetail
      summary: Detailed analytics for a specific agent within a project
      description: GetAnalyticsAgentDetail returns detailed analytics for a specific agent within a project.
      tags: [analytics]
      parameters:
        - name: entity_id_string
          in: query
          schema: { type: string }
        - name: entity_id_int
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  # ==========================================================================
  # APPLICATIONS — list / create
  # ==========================================================================
  /elitea_core/applications/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listApplications
      summary: List applications for a project
      description: ListApplications returns a paginated list of applications for a project.
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Paginated200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

    post:
      operationId: createApplication
      summary: Create a new application shell
      description: CreateApplication creates a new application (agent / pipeline / skill) shell.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Struct'
      responses:
        '200':
          $ref: '#/components/responses/Object200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/public_applications/prompt_lib:
    get:
      operationId: listPublicApplications
      summary: List published applications visible without project membership
      description: ListPublicApplications returns published applications visible without project membership.
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Paginated200'
        '429': { $ref: '#/components/responses/429' }

  # APPLICATIONS — single resource CRUD
  /elitea_core/application/prompt_lib/{project_id}/{application_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: application_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: getApplication
      summary: Retrieve full application details
      description: GetApplication retrieves full application details.
      tags: [applications]
      responses:
        '200':
          $ref: '#/components/responses/Object200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

    delete:
      operationId: deleteApplication
      summary: Remove an application and all associated versions
      description: DeleteApplication removes an application and all associated versions.
      tags: [applications]
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  /elitea_core/application/prompt_lib/{project_id}/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: id
        in: path
        required: true
        schema: { type: integer }

    put:
      operationId: editApplication
      summary: Update top-level application metadata
      description: EditApplication updates top-level application metadata in-place.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Struct'
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  # APPLICATIONS — tool delete
  /elitea_core/tool/prompt_lib/{project_id}/{tool_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: tool_id
        in: path
        required: true
        schema: { type: integer }

    delete:
      operationId: deleteApplicationTool
      summary: Remove a tool (skill entity)
      description: DeleteApplicationTool removes a tool (skill entity).
      tags: [applications]
      responses:
        '200':
          $ref: '#/components/responses/Generic200'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  # APPLICATIONS — public access
  /elitea_core/public_application/prompt_lib/{application_id}/{version_name}:
    parameters:
      - name: application_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_name
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getPublicApplication
      summary: Retrieve a published application by public name and version label
      description: GetPublicApplication retrieves a published application by its public name and version label.
      tags: [applications]
      responses:
        '200':
          $ref: '#/components/responses/Object200'
        '404': { $ref: '#/components/responses/404' }
