      properties:
        ok: { type: boolean }
        removed:
          type: integer
          description: Assignments deleted. Never 0 — an id that matched none is a 404.

    GlobalUserInviteRequest:
      type: object
      required: [user_name, user_email]
      description: >
        NOTE(W2): internal/api/v2/admin/user_invite.go:62-65. Distinct from
        UserInviteRequest, which is the PROJECT invite (emails + roles).
      properties:
        user_name: { type: string }
        user_email: { type: string }

    GlobalUserInviteResult:
      type: object
      required: [ok, id, email, name, created, invitation_delivered, invitation_delivery]
      description: >
        NOTE(W2): internal/api/v2/admin/user_invite.go:112-120.
      properties:
        ok: { type: boolean }
        id:
          type: integer
          description: The platform user id, whether it was created now or already existed.
        email:
          type: string
          description: The address, lower-cased and trimmed.
        name: { type: string }
        created:
          type: boolean
          description: >
            False when the address already had an account. The existing
            account is never renamed.
        invitation_delivered:
          type: boolean
          description: >
            Always false. Sending an invitation is an external
            identity-provider call with no equivalent in this service, and a
            bare `{"ok": true}` would be rendered as "invitation sent".
        invitation_delivery:
          type: string
          description: Why nothing was delivered, in full.

    UserProjectRoleMap:
      type: object
      description: >
        NOTE(W2): internal/api/v2/admin/user_project_permissions.go:99-110 —
        role name → its sorted permission names, for the first personal project.
      additionalProperties:
        type: array
        items: { type: string }

    PermissionMatrixRow:
      type: object
      required: [name]
      description: >
        NOTE(W2): internal/api/v2/admin/roles.go:139-147 — one permission and
        one boolean column per role.
      properties:
        name:
          type: string
          description: The permission name.
      additionalProperties:
        type: boolean

    PermissionMatrix:
      type: object
      required: [total, rows]
      description: >
        NOTE(W2): internal/api/v2/admin/roles.go:148-152. `total` counts the
        permission CATALOGUE; this endpoint is never paginated.
      properties:
        total: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PermissionMatrixRow' }

    UserProjectPermissionsUpdate:
      description: >
        NOTE(W2): internal/api/v2/admin/user_project_permissions.go:373-420 —
        both shapes the reference accepts: the role map, or the matrix rows the
        GET returns with ?old_format.
      oneOf:
        - $ref: '#/components/schemas/UserProjectRoleMap'
        - type: array
          items: { $ref: '#/components/schemas/PermissionMatrixRow' }

    UserProjectPermissionsResult:
      type: object
      required: [role_map, projects, roles_created, granted, revoked, roles_assigned]
      description: >
        NOTE(W2): internal/api/v2/admin/user_project_permissions.go:180-187.
        `role_map` is the reference's own response field; the counters are what
        make a no-op distinguishable from a save.
      properties:
        role_map: { $ref: '#/components/schemas/UserProjectRoleMap' }
        projects:
          type: integer
          description: How many projects the save was applied to.
        roles_created: { type: integer }
        granted: { type: integer }
        revoked: { type: integer }
        roles_assigned:
          type: integer
          description: Role assignments added to existing members by ?append_user_role.

    ProjectGroup:
      type: object
      required: [id, name]
      description: >
        NOTE(W2): internal/api/v2/projects/handler.go — the Group struct.
      properties:
        id: { type: integer }
        name: { type: string }

    ProjectWithGroups:
      type: object
      required: [id, name, owner_id, plugins, keycloak_groups, create_success, suspended, groups]
      description: >
        NOTE(W2): internal/api/v2/projects/groups.go:295-330 — the body all
        three group writes return, mirroring the reference's ProjectListModel,
        so a client re-renders the group chips without re-fetching.
      properties:
        id: { type: integer }
        name: { type: string }
        owner_id: { type: integer }
        plugins:
          type: array
          items: { type: string }
        keycloak_groups:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): internal/api/v2/projects/groups.go:310 — the column is
            copied out as raw JSON and never interpreted by this service; its
            shape belongs to the Keycloak integration.
        create_success: { type: boolean }
        suspended: { type: boolean }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ProjectGroup' }

    ProjectGroupCreate:
      type: object
      required: [name]
      description: >
        NOTE(W2): internal/api/v2/projects/groups.go:57-59. `no_group` is
        rejected: it is the sentinel the listing uses for "no group at all".
      properties:
        name: { type: string }

    PublishedAgentVersion:
      type: object
      required: [version_id, version_name, published_at, published_by]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:40-45.
      properties:
        version_id: { type: integer }
        version_name: { type: string }
        published_at:
          type: string
          nullable: true
          description: The version's creation timestamp, `YYYY-MM-DDTHH:MM:SS`.
        published_by:
          nullable: true
          description: >
            `meta.published_by` of the version, verbatim. Unconstrained because
            it is whatever the publishing path stored there.
          x-elitea-passthrough: >-
            NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:44 —
            copied straight out of the version's meta JSON.

    PublishedAgentAdoption:
      type: object
      required: [conversation_count, project_count]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:47-54.
        Both counters are NULL when the agent's `meta.adoption` is absent —
        nothing in this stack writes that key. The reference defaults them to
        0, which renders as "nobody uses this" rather than "this platform does
        not measure that".
      properties:
        conversation_count:
          type: integer
          nullable: true
        project_count:
          type: integer
          nullable: true

    PublishedAgent:
      type: object
      required:
        [public_agent_id, name, description, author_project_id, published_versions,
         total_published_versions, adoption, created_at]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:56-65.
      properties:
        public_agent_id: { type: integer }
        name: { type: string }
        description: { type: string }
        author_project_id:
          type: integer
          nullable: true
          description: >
            `applications.shared_owner_id` — the project the agent was published
            FROM. Null for a row published without one.
        published_versions:
          type: array
          items: { $ref: '#/components/schemas/PublishedAgentVersion' }
        total_published_versions: { type: integer }
        adoption: { $ref: '#/components/schemas/PublishedAgentAdoption' }
        created_at:
          type: string
          nullable: true

    PublishedAgentsListing:
      type: object
      required: [items, total, page, page_size]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:110-115.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublishedAgent' }
        total:
          type: integer
          description: Published agents in the public project, before paging.
        page: { type: integer }
        page_size: { type: integer }

    # ---- Author detail (eliteacore) ---------------------------------------
    AuthorDetail:
      type: object
      properties:
        id:
          type: integer
          description: >
            `strconv.Atoi` of the `{author_id}` path parameter
            (handler.go:428); silently 0 if the path segment isn't numeric
            (the parse error is ignored).
        name: { type: string }
        email: { type: string }
        avatar: { type: string }
        title:
          type: string
          description: Always "" — hardcoded (handler.go:431).
        description: { type: string }
        total_conversations:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:432).
        public_conversations:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:432).
        public_applications:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:433).
        total_applications:
          type: integer
          description: >
            Real `COUNT(*)` of non-pipeline applications owned by this
            author, summed across every project schema the author belongs to
            (handler.go:397-421, query at :414).
        public_pipelines:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:434).
        total_pipelines:
          type: integer
          description: Real COUNT(*) of pipeline-type applications (handler.go:417).
        total_toolkits:
          type: integer
          description: Real COUNT(*) of elitea_tools rows authored (handler.go:420).
        public_collections:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:435).
        total_collections:
          type: integer
          description: Real COUNT(*) of prompt_collections rows authored (handler.go:423).
        rewards:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:436).
      description: >
        NOTE(W2): eliteacore.Author
        (internal/api/v2/eliteacore/handler.go:380-438, fields at :429-437) —
        NOT internal/api/v2/social's ListAuthors/GetAuthor, a different
        handler/package despite the similar name. BUG-FOR-BUG: on
        no-matching-author or any DB error, the handler writes a bare `{}`
        with 200 (:392-395) instead of a 404 — every property above is
        therefore genuinely optional (no `required` list); a real author
        response always includes all of them.

    # ---- Secrets (v2/secrets) ---------------------------------------------
    SecretListItem:
      type: object
      description: >
        NOTE(issue 151): internal/api/v2/secrets/handler.go's SecretListItem —
        the list element AND the body returned by create and update. It
        NEVER carries a value; the plaintext is reachable only through the
        single-secret GET.
      properties:
        name:
          type: string
          description: The secret's canonical name (the vault map key).
        secret_name:
          type: string
          description: The `{{secret.<name>}}` placeholder, for display.
        is_default:
          type: boolean
          description: >
            BUG-FOR-BUG: always false from the Go handler. pylon sets it
            from elitea_core's `default_secret_keys` config
            (legacy/plugins/secrets/api/v2/secrets.py), which elitea-main
            does not read.
      required: [name, secret_name, is_default]

    SecretDetail:
      type: object
      description: >
        The single-secret GET response — the ONLY endpoint in this domain
        that returns plaintext.
      properties:
        name: { type: string }
        secret_name: { type: string }
        is_default: { type: boolean }
        is_hidden:
          type: boolean
          description: True when the secret was found in `hidden_secrets`.
        value:
          type: string
          description: The plaintext secret value.
      required: [name, secret_name, is_default, is_hidden, value]

    SecretCreateRequest:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
      required: [name, value]

    SecretUpdateRequest:
      type: object
      description: >
        `name` is the NEW name — sending a different one renames the secret
        addressed by the `{name}` path parameter. Omitting it (or sending
        "") keeps the path name (handler.go's Update).
      properties:
        name: { type: string }
        value: { type: string }
      required: [value]

  responses:
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # ADMIN — users
  # NOTE(#130): the router used to wire GET/POST/PUT/DELETE all onto eliteacore
  # Users, which does no method branching — every verb returned the same
  # {rows,total} listing, so Invite / Edit role / Remove reported success and
  # wrote nothing. The three write verbs now reach real handlers
  # (internal/api/v2/eliteacore/users_write.go) that speak pylon's contract
  # (legacy/plugins/admin/api/v2/users.py) and are each gated on the matching
  # `configuration.users.users.*` permission.
  #
  # This path template pins mode=default. `administration` mode addresses the
  # global scope, not a project membership, and answers 501.
  # ==========================================================================
  /admin/users/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: userList
      summary: List users for a project
      description: |
        UserList returns a paginated list of users for a project.
        NOTE(W2): response from internal/api/v2/eliteacore/handler.go:190-263.
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: userCreate
      summary: Invite users into a project by email
      description: |
        Adds each address to the project with the given role names, creating an
        auth_core__user row for an address that has no account yet (that is what
        makes an invite an invite; the OIDC provisioning path links the provider
        on first login). An address that is already a member is reported as an
        error element and makes the whole response 400.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
      responses:
        '200':
          description: Every address was added.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserInviteResult' }
        '400':
          description: >
            Malformed request, an unknown role name, or at least one address
            that could not be added (already a member / invalid). Carries the
            per-address results when the failure was per-address.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/UserInviteResult' }
                  - $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    put:
      operationId: userUpdate
      summary: Replace the project roles of one or more users
      description: |
        REPLACES the users' project role set with `roles` — unchecked boxes in
        the Edit-roles dialog have to mean something. An empty `roles` array is
        rejected rather than treated as "remove from project"; DELETE is the
        verb for that.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesUpdateRequest'
      responses:
        '200':
          description: Roles updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: userDelete
      summary: Remove one or more users from a project
      description: |
        Clears the users' rows in auth_core__project_user_role for this project.
        The auth_core__user account survives — the person may be a member of
        other projects, and "remove from project" is not "delete the account"
        (parity with pylon's remove_users_from_project).
      tags: [admin]
      parameters:
        - name: id[]
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: >
            IDs of the users to delete. The old SPA sends ONE occurrence with
            the ids comma-joined — `?id[]=1,2,3`
            (apps/elitea-ui/src/api/admin.js:120), hence explode:false. The new
            client does the same (getUserDeleteUrl stringifies the array), and
            the handler splits on commas as well as accepting repeated keys.
      responses:
        '200':
          description: Users removed from the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  # ==========================================================================
  # ADMIN — roles
  # ==========================================================================
  # ==========================================================================
  # ADMIN & TENANCY PARITY (issue 255)
  #
  # `administration` is a STATIC segment on all three, not a {mode} parameter:
  # each pylon original registers `mode_handlers = {'administration': AdminAPI}`
  # and nothing else, so another mode has no handler to reach. A {mode} route
  # would have to answer something plausible for a mode that does not exist.
  # ==========================================================================
  /admin/modes/administration:
    get:
      operationId: listUserModeRoles
      summary: List every central role assignment, across all modes
      description: |
        Which user holds which CENTRAL role in which pylon mode — the registry
        behind the admin console's Modes table. Each row carries the composite
        `<user_id>:<mode>:<role>` id the DELETE below consumes.

        The reference walks its runtime mode registry and asks for every
        (user, mode) pair over RPC; this is one join over the assignment table,
        so the modes reported are the modes that have roles.
      tags: [admin]
      responses:
        '200':
          description: Every central assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeRoleListing'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: assignUserModeRole
      summary: Assign a user to a role in a mode
      description: |
        SINGLE-ROLE-PER-MODE: every assignment the user holds in that mode is
        dropped before the new one is written, in one transaction — the rule
        auth_core's assign_user_to_role enforces. A role the deployment does
        not define in that mode is a 400 and leaves the user's current role
        alone, rather than revoking it and granting nothing.

        Granting or revoking `super_admin` additionally requires the caller to
        hold `admin.auth.users.super_admin`: this endpoint writes the same
        table /admin/auth_users does, so without the guard it would be a
        second, unguarded route to the platform's highest role.

        `default` mode is refused. Default-mode roles are project membership,
        which has no meaning without a project id.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeRoleAssignRequest'
      responses:
        '200':
          description: The assignment now exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeRoleAssignResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            The caller lacks `modes.users`, or is assigning/revoking
            `super_admin` without `admin.auth.users.super_admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      operationId: removeUserModeRole
      summary: Remove a user from a role in a mode
      description: |
        Takes the composite id the listing produces. The reference's handler is
        a `# TODO` that answers `{"ok": true}` having deleted nothing; this one
        deletes, and answers 404 when the triple names no assignment rather
        than reporting a removal that did not happen.
      tags: [admin]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: '`<user_id>:<mode>:<role>`, as returned by the listing.'
      responses:
        '200':
          description: The assignment was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeRoleRemoveResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such assignment — nothing was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /admin/user_invite/administration:
    post:
      operationId: inviteUserGlobally
      summary: Create a platform user record for an address
      description: |
        The platform-level counterpart of the project invite
        (`POST /admin/users/{mode}/{project_id}`): it creates an
        `auth_core__user` row for an address that has never logged in, with no
        project and no role, so the console can then place them. The address is
        resolved by email on first login.

        NO INVITATION IS DELIVERED. The reference calls an external identity
        service to create and mail an invitation token; that integration has no
        equivalent here, so `invitation_delivered` is false and
        `invitation_delivery` says why. Answering a bare `{"ok": true}` would
        be rendered by a console as "invitation sent".

        Inviting an address that already has an account is not an error and is
        not a rename: `created` is false and the stored name is untouched.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalUserInviteRequest'
      responses:
        '200':
          description: The platform user record exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalUserInviteResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /admin/user_project_permissions/administration:
    get:
      operationId: getUserProjectPermissions
      summary: Read the permission matrix personal projects grant
      description: |
        The default every ordinary project gets, as opposed to the named scopes
        `/admin/permissions/{scope}/{mode}` edits. Read from the FIRST personal
        project (`project_user_<id>`); with no personal project at all the
        answer is 400, as it is in the reference.

        Default body is role → sorted permission names. `?old_format` returns
        the matrix rows instead — one row per permission in the catalogue, one
        boolean column per role — which is also the shape the PUT accepts back.
        Either body can be PUT back unchanged; both include the `system` role,
        which the PUT ignores rather than rejects.

        The grants reported are the project's OWN overrides, falling back to the
        central `default` matrix only when it has none. The reference reports
        the central matrix either way, so a project with overrides reads back
        as something its members do not have.
      tags: [admin]
      parameters:
        - name: old_format
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: Presence (not value) switches to the matrix-row shape.
      responses:
        '200':
          description: >
            The personal-project matrix. The schema shown is the DEFAULT body;
            with `?old_format` the body is a PermissionMatrix instead — the two
            are not modelled as a `oneOf` because the generated mock for a
            map-shaped `oneOf` branch does not type-check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectRoleMap'
        '400':
          description: This deployment has no personal projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: updateUserProjectPermissions
      summary: Apply a permission matrix across every personal or team project
      description: |
        REPLACES each named role's permission set — the submitted set is the
        whole set, so a permission left out is revoked — across every personal
        project, or with `?team_projects` across every project that is neither
        personal nor the public one.

        Everything runs in ONE transaction. The reference walks projects on
        autocommitting sessions and deletes a role's permissions before
        re-inserting them, so an interruption leaves part of the estate on the
        old matrix and can leave a role granting nothing at all.

        Revocation is bounded by the body's shape. The role map IS the role's
        whole permission set, so anything absent from it is revoked. The MATRIX
        shape revokes only within the permission rows it carries, so a filtered
        or paged view of the matrix cannot silently revoke what it never showed
        — the same rule the /admin/permissions PUT applies to the identical
        body.

        A role name that any target project does not define is a 400 unless
        `?create_role_if_not_exist` asks for it to be created; the reference
        silently skips it FOR THAT PROJECT and reports success for the whole
        estate. An unknown permission name is always a 400. The `system` role is
        neither written nor rejected: it appears in every body the GET produces,
        so rejecting it would make that body unsavable.
      tags: [admin]
      parameters:
        - name: team_projects
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: >
            Presence targets every SHARED project (excluding the public one)
            instead of the personal ones.
        - name: create_role_if_not_exist
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: Presence creates roles the target projects do not define.
        - name: append_user_role
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: >
            Presence also grants each named role to every existing member of the
            target projects who does not already hold it. It only ever adds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProjectPermissionsUpdate'
      responses:
        '200':
