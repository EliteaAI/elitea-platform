        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: exportApplication
      summary: Export an application (with toolkits) as JSON
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2480-2727. The
        handler reads only ?fork= (keep last version + provenance keys) and
        ?as_file= (attachment Content-Disposition). follow_version_ids and
        format are accepted for old-SPA parity but not read — markdown export
        is NOT implemented on the Go router.
      tags: [applications]
      parameters:
        - name: fork
          in: query
          schema: { type: boolean }
        - name: as_file
          in: query
          schema: { type: boolean }
          description: Serve as attachment (read at handler.go:2720).
        - name: follow_version_ids
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
          description: Old-SPA parameter; accepted but not read.
        - name: format
          in: query
          schema:
            type: string
            enum: [json, md]
          description: >
            Old-SPA parameter; accepted but NOT read — the handler always
            emits JSON (eliteacore/handler.go:2682, 2716 read only fork and
            as_file). The enum records what the SPA actually sends:
            `md`, not `markdown` (apps/elitea-ui/src/api/applications.js:592).
