  /support_assistant/config:
    get:
      operationId: getSupportAssistantConfig
      summary: Retrieve support assistant configuration
      description: |
        NOTE(W2): static stub {"enabled": false},
        internal/api/v2/eliteacore/handler.go:2944-2946.
      tags: [admin]
      responses:
        '200':
          description: Support assistant configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAssistantConfig'
        '401': { $ref: '#/components/responses/401' }

  /branding/bootstrap.js:
    # NOTE(W3): served under /api/v2 (not the elitea_core scope) and OUTSIDE
    # the auth group — the SPA shell loads this script before a session
    # exists (UI reimplementation spec §4.3 delivery channel C, §9.3 W3;
    # route registered at internal/api/router.go, root level).
    servers:
      - url: /api/v2
        description: Admin and auxiliary APIs
    get:
      operationId: getBrandingBootstrap
      summary: Branding bootstrap script (window.elitea_brand)
      description: |
        GetBrandingBootstrap serves the deployment-level brand pack as an
        executable script of the form `window.elitea_brand = {...};` where
        `{...}` is a JSON brand pack conforming to
        https://elitea.ai/schemas/brand-pack/1.json (spec §4.2). The endpoint
        never fails: a missing or invalid pack file degrades to the built-in
        default pack. Unauthenticated by design.

        Caching (spec §4.3 channel C): the response carries a strong `ETag`
        (content hash). Without `?v=` the body is served with
        `Cache-Control: no-cache` (revalidate via `If-None-Match` → 304).
        With `?v=` equal to the current unquoted ETag value the body is
        served with `Cache-Control: public, max-age=31536000, immutable`.
        A stale `?v=` mismatch answers `302 Found` to the current-version
        URL so an immutable content-addressed URL never serves stale bytes.
      responses:
        '200':
          description: Bootstrap script assigning window.elitea_brand.
          headers:
            ETag:
              description: Strong entity tag (quoted SHA-256 hex of the body).
              schema: { type: string }
            Cache-Control:
              description: >-
                `no-cache` on the bare URL; `public, max-age=31536000,
                immutable` when `?v=` matches the current ETag value.
              schema: { type: string }
          content:
            application/javascript:
              schema:
                type: string
                description: JavaScript statement `window.elitea_brand = {...};`
                example: 'window.elitea_brand = {"$schema":"https://elitea.ai/schemas/brand-pack/1.json","id":"default","version":"1.0.0"};'
        '302':
          description: >-
            The `?v=` token does not match the current ETag value; Location
            points at the current-version URL.
          headers:
            Location:
              schema: { type: string }
        '304':
          description: If-None-Match matched the current strong ETag.
          headers:
            ETag:
              schema: { type: string }
    parameters:
      - name: v
        in: query
        required: false
        schema: { type: string }
        description: >-
          Content version token — the current ETag value without quotes.
          Matching requests are cached as immutable; mismatches are
          redirected to the current version.

  # ==========================================================================
  # ANALYTICS
  # NOTE(W2): all seven ops are served by internal/api/v2/analytics/handler.go.
  # The *_detail routes hit the same handlers as their list siblings; the
  # handler switches to the detail envelope only when the id query param it
  # actually reads (user_id / tool_id|toolkit_id / application_id|agent_id) is
  # present. Old-SPA alignment differs per route
  # (apps/elitea-ui/src/[fsd]/features/analytics/api/analyticsApi.js):
  #   user detail  — SPA sends user_id (:56)    → MATCHES → detail envelope
  #   tool detail  — SPA sends tool_name (:95)  → no match → list shape
  #   agent detail — SPA sends entity_id (:134) → no match → list shape
  # The two mismatches are live parity defects, recorded not fixed (N2).
  # ==========================================================================
  /elitea_core/analytics/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectAnalytics
      summary: Aggregated analytics for a project's prompt library
      description: |
        NOTE(W2): internal/api/v2/analytics/handler.go:37-63. Also accepts
        start_date/end_date/period (parseParams :142-157).
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Project usage analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAnalytics'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/analytics_users/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAnalyticsUsers
      summary: User analytics for a project's prompt library
      description: |
        NOTE(W2): {items: [...]} — internal/api/v2/analytics/handler.go:117-139.
        limit/offset/search/sort_* are accepted for old-SPA parity but not
        read by the handler.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: User activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsUsersList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/analytics_user_detail/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAnalyticsUserDetail
      summary: Detailed analytics for a specific user within a project
      description: |
        NOTE(W2): same handler as listAnalyticsUsers
        (internal/api/router.go:543-544 → analytics/handler.go:117-139). The
        detail envelope is returned when ?user_id= is present (:125-137),
        which is exactly what the old SPA sends
        (apps/elitea-ui/src/[fsd]/features/analytics/api/analyticsApi.js:56,
        `params.set('user_id', String(userId))`) — so the SPA's detail calls
        DO receive the detail envelope. Without user_id the handler falls
        through to the {items} list shape.
      tags: [analytics]
      parameters:
        - name: user_id
          in: query
          schema: { type: string }
          description: >
            Dispatch parameter — read by the handler (analytics/handler.go:125)
            and sent by the old SPA (analyticsApi.js:56). Absent it, the
            response is the list shape.
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: >
            Detail envelope when user_id is present (the SPA's normal call);
            the list shape when it is omitted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AnalyticsDetailEnvelope'
                  - $ref: '#/components/schemas/AnalyticsUsersList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/analytics_tools/prompt_lib/{project_id}:
