  # NOTE(W2): "tools" (plural), NOT "toolkits" — a different, real, mounted
  # route (internal/api/router.go:369 `r.Get("/tools/prompt_lib/{projectID}",
  # toolkitHandler.List)`), sitting in the same toolkitHandler mount as the
  # already-spec'd /elitea_core/tool/prompt_lib/{project_id}/{tool_id}
  # (deleteApplicationTool, above) — same singular/plural prefix convention,
  # just the plural segment. Do not confuse this with listToolkits above,
  # which is ListTypeSchemas (a type-name → JSON-Schema map, not an instance
