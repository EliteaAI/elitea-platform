[package]
name = "elitea-worker-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
prost = "=0.14.3"
ring = "=0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
subtle = "=2.6.1"
tonic = { version = "=0.14.2", features = ["tls-ring"] }
tonic-prost = "=0.14.2"

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
