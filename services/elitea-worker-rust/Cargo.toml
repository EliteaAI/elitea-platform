[package]
name = "elitea-worker-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
adk-rust = { version = "=2.0.0", default-features = false, features = ["agents", "runner", "sessions", "models", "graph", "tools"] }
async-trait = "=0.1.92"
base64 = "=0.22.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
percent-encoding = "=2.3.2"
prost = "=0.14.3"
ring = "=0.17.14"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono"] }
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.2", features = ["tls-ring"] }
tonic-prost = "=0.14.2"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
zeroize = "=1.9.0"

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.2"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
